  notes: "Based on the Hugging Face dataset card only; the card names a paper (NarrativeShield: Adversarial Intake Against Narrative Anchoring for Equitable Clinical Diagnosis) but gives no link, and I did not look for it. The card has an eacl-2025 tag and a 2026 record year, so the release year is uncertain. Personas were generated with gemini-3.1-flash-lite and checked by automated fact-preservation tests, not by clinicians as far as the card says. The persona voices are the card's own descriptions; builder and lead institution are not stated."
