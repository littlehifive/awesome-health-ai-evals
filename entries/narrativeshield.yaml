card:
  task: Choose one of four answers to a diagnosis or treatment question presented in a patient vignette rewritten
    in one of three sociolinguistic voices.
  items_built: Of 11,451 MedQA-USMLE-4-options questions, 2,921 passed six filters, and 1,000 were randomly sampled
    with stratification by answer letter and exam step. gemini-3.1-flash-lite generated three rewrites per question;
    all 3,000 passed automated fact-preservation checks, and two independent annotators rated 150 randomly sampled
    triples for fact preservation and narrative realism.
