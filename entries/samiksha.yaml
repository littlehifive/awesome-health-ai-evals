  notes: Authors at Microsoft Research India, Karya, and the Collective Intelligence Project. Query creators were native-speaking data workers, not clinicians; rubrics came from five CSO interviews. Four rating dimensions (clarity/fluency, helpfulness/relevance, accuracy/completeness, conciseness) plus pairwise comparison. Human raters were Karya workers. No release link for the dataset found, so open_data is unknown. The localization subset was drawn from deployed-chatbot logs. Health areas are broad themes, mapped loosely.
