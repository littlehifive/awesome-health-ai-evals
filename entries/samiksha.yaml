card:
  task: Answer health queries in Hindi, Kannada, or Malayalam with useful, understandable, and contextually appropriate
    information.
  items_built: Native-speaking data workers created 810 queries from scratch and localized 780 queries drawn from
    CSO chatbot logs, using healthcare topics informed by interviews with five civil-society organizations. Workers
    were instructed to write realistic questions they would ask doctors, nurses, or pharmacists, include relevant
    context, and exclude personal information.
  example: ''
  scoring: Human and LLM judges independently rated each answer on four dimensions using Yes, Somewhat, or No, with
    mean scores averaged across items, criteria, and languages. They also compared all three pairs of model answers
    per question, choosing A, B, or Not sure; these judgments were aggregated into pairwise win rates and per-model
    win shares.
  judge: GPT-4o, Sarvam-M, and 23 native-speaking data workers recruited by Karya assigned ratings.
  scale: Yes, Somewhat, or No per criterion, aggregated as mean scores; A, B, or Not sure for comparisons, aggregated
    as win rates and win shares.
  validation: Pearson correlations over item-level mean scores were approximately 0.40 between GPT-4o and Sarvam-M
    and approximately 0.13 between each LLM judge and human annotators.
  results: Qwen3-235B-A22B generally had the highest standalone mean and was preferred overall by humans in pairwise
    comparisons, but numerical scores were not provided in the excerpts. GPT-4o preferred Sarvam-M in pairwise comparisons,
    while Sarvam-M as judge preferred Qwen3.
  limitations: The authors report that example queries biased workers' submissions, while LLM judges showed ceiling
    effects, missed completeness and subtle factual problems, and were less sensitive than humans to language-specific
    weaknesses.
