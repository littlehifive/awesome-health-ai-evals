  notes: "Test conversations, patient prompts, scoring examples and transcripts are withheld on purpose (protected benchmark following the AEF-1 standard); only the method, tested configurations and scores are public, so open_data is closed. A GPT-4o judge reached 94.2% exact agreement with clinician consensus. Synthetic patient turns were compared with a 50-conversation real-user corpus. Authors are mostly at UK institutions (Roehampton, Kivira Health, Hertfordshire, Surrey, Bedfordshire, Tavistock Relationships); rater countries are not stated. No public leaderboard URL was found in the text read."
