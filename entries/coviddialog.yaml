card:
  task: Generate the next doctor's response from the preceding patient and doctor utterances in a consultation about
    COVID-19 or related pneumonia.
  items_built: The authors crawled 603 English consultations from iCliniq, HealthCareMagic, and HealthTap and 1,088
    Chinese consultations from haodf.com, removing duplicate and incomplete Chinese dialogues. They paired each
    doctor response with all preceding utterances and split each language's dialogues into training, validation,
    and test sets in an 8:1:1 ratio.
  example: '"I have all the symptoms except fever"'
  scoring: Automatic evaluation compares generated responses with recorded doctor responses using NIST-4, BLEU-2,
    BLEU-4, and METEOR, and separately reports perplexity and lexical diversity through Entropy-4, Dist-1, and Dist-2.
    Human raters score anonymous generated and recorded doctor responses for relevance, informativeness, and doctor-like
    language, with ratings averaged across raters; evaluation covers the English test examples and 100 randomly
    sampled Chinese test examples.
  judge: Automatic metrics and five undergraduate and graduate student raters assign the scores.
  scale: Human ratings run from 1 to 5 per criterion and are averaged across raters; lower perplexity and higher
    other automatic scores are better.
  validation: ''
  score_meaning: Relevance measures how well a response fits the conversation history, informativeness measures
    how much medical information and advice it contains, and doctor-like measures how much it sounds like a real
    doctor. The paper interprets BART's relevance score above 3 as a good level of relevance to the conversation
    history.
  annotation_process: ''
  results: ''
  limitations: The authors identify small datasets with a high risk of overfitting, incomplete reliability of automatic
    metrics, and noise in the Chinese dialogues, including incorrect grammar, abbreviations, and semantic ambiguity.
  sources:
  - https://arxiv.org/abs/2005.05442
