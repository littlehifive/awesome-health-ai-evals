summary: Two COVID-19 doctor-patient dialogue datasets, 603 English consultations (from iCliniq, HealthCareMagic, HealthTap) and 1,088 Chinese consultations (from haodf.com), used to train and evaluate dialogue generation with automatic and human evaluation.
