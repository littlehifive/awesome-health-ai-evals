  notes: "UC San Diego (Pengtao Xie's group) with CMU and UC Davis co-authors; the arXiv version (2005.05442) was read, the record is the medRxiv version. The paper says data and code are at github.com/UCSD-AI4H/COVID-Dialogue, but that URL returned 404 when checked, so open_data is unknown and no license was seen. Metrics are perplexity, NIST, BLEU, and other automatic scores plus human ratings on a test sample. Training-oriented: the datasets are small and the paper's main use is fine-tuning Transformer, GPT, and BERT-GPT models."
