summary: A normalized, area-based score (Proportional Index of Medical Evaluation for LLMs) that rewards balanced accuracy across five stages of stepwise clinical reasoning (differential diagnosis, diagnostic testing, final diagnosis, management, miscellaneous), applied to 21 LLMs on 29 MSD Manual clinical vignettes.
