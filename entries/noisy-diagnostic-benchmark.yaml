  notes: "Symptom sets come from a public symptom-based disease labelling dataset (SDPD); narratives were generated with an LLM (the repo README names Llama3.1:8b). The repo has data/ CSVs (Train_data.csv, Train_data_with_noise2.csv) but no license file or statement was found. The paper evaluates fine-tuned BERT and T5 models on diagnostic classification, so scoring is label accuracy rather than generative chatbot answers; the repo README reports 24 disease categories, which the paper text read did not confirm. The paper's title mentions speech, but items are text."
