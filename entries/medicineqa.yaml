  notes: "Read the benchmark-creation and evaluation sections. Five board-certified physicians filtered crawled consultation records (1,028,090 records) for the 200 most-mentioned medicines, wrote one question per record, GPT-4 expanded each into a multi-round dialogue, and physicians revised them. Scoring is retrieval hit rate (HR@k, document and attribute level) plus an Elo rating with GPT-4 as referee over free-text answers. I found no release link, license, or repository in the paper, so open_data is unknown. The paper also proposes the RagPULSE model, which is not part of this entry. item_provenance labels the source records as real_user_queries, which is my reading of 'online consultation records between users and medical experts'."
