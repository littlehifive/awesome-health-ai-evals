card:
  task: Answer a medication question using the preceding dialogue history and evidence retrieved from a medicine
    database.
  items_built: Five board-certified physicians selected and summarized questions about the 200 most-mentioned medicines
    from 1,028,090 online consultation records containing 6.24 million dialogue pairs. GPT-4 expanded the questions
    into dialogues, which the physicians revised for logical progression and non-repetition, yielding 300 items
    with document-level and attribute-level retrieval ground truths.
  example: ''
  scoring: Retrieval hit rate is the proportion of items whose retrieved candidates contain the annotated medicine
    document or specific attribute, calculated separately at each level. GPT-4 compares free-text answers from competing
    models, and these pairwise outcomes update each model's Elo rating based on expected versus actual outcomes.
  judge: Retrieval is checked against annotated ground truths, and GPT-4 judges answer comparisons.
  scale: Retrieval hit or miss per item, aggregated as HR@num; pairwise answer outcomes combined into model Elo
    ratings.
  validation: ''
  score_meaning: In HR@num, "num" is the number of retrieved candidates considered, so HR@1 measures retrieval success
    using only the first candidate. Higher Elo ratings indicate better relative performance in medication-consultation
    answers against the competing models.
  annotation_process: Baseline models were prompted to summarize the preceding dialogue into search queries before
    retrieval was evaluated. For final-answer evaluation, baseline models were given the corresponding medicine
    information supplied with the benchmark as context, while RagPULSE generated answers using its retrieved evidence.
  results: RagPULSE (20B) achieved a document retrieval HR@1 of 65.67%, compared with ChatGPT's 63.67%.
  limitations: ''
