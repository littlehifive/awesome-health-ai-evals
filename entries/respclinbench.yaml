  notes: "Three attending respiratory physicians revised cases, reference answers, and atomic action points; one senior specialist adjudicated. Final score is the mean of atomic-action recall and rubric LLM-judge score; 7 LLMs, 4,361 responses. Only the AECOPD-PIM part is clearly in scope; PNBIM pairs chest CT images with structured data (imaging component is out of scope for this catalogue). The paper says the dataset is publicly available on the MedBench platform; whether registration is needed was not checked."
