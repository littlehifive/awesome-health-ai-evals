  notes: "Data are CSV files in the GitHub repo (paper's data availability statement); the repo shows no license. Open-ended tasks use BERTScore; one set tests bias injection and mitigation prompts (seven bias categories); another uses GPT-4o paraphrasing to limit memorization. The README says eight LLMs were evaluated while the paper's table shows five. Exact per-task sizes beyond the first four tasks were not read. Same group as MedAraBench."
