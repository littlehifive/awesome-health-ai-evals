  notes: "The text available in paperclip is an earlier version titled MentraSuite with the benchmark named MentraBench; the current arXiv title names it MiraMind, so details (task families, dataset count of 13) may differ slightly. Outcome metrics are micro-F1 or recall of annotated scoring points; reasoning chains are rated on conciseness, logical coherence, hallucination avoidance, task understanding, and internal consistency. Some items were checked by an expert counselor. The GitHub repo (Wuhan University, no license) mainly documents the Mindora models; no benchmark download link was confirmed. Authors from Wuhan University and the University of Manchester."
