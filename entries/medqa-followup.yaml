  notes: "The paper describes 1,273 MedQA test questions; the Hub card and GitHub README say the released set has 1,050 after removing 223 questions that Med-Gemini's expert annotations flagged as unanswerable without images or missing information. r_da2e24eb30 is the companion GitHub repo (evaluation code and cached runs) and is merged here. Venue: the card says NeurIPS 2025 GenAI for Health workshop, so it is coded as preprint. Dynamo AI is an industry builder; lead country USA is not stated in the paper text read (only that the work was done at Dynamo AI and Intercom). The paper's single-turn baselines reproduce BiasMedQA and KGGD, which are not part of this entry."
