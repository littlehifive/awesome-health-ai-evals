  notes: "Obafemi Awolowo University (Nigeria). Answers come from the EMDEX drug monographs and the Nigerian Essential Medicines list; English answers were validated by certified pharmacists and the Yoruba translations were made by native speakers with the Spitch translation model and checked by Yoruba language experts. Scored with BERTScore and an LLM judge, and retrieval with hit rate at K against gold evidence. The pharmacists' and language experts' countries are not stated. The paper gives no release link or license. Published at LoResLM 2026."
