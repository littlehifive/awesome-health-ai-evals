card:
  task: Read a rare clinical case and give one best free-text answer identifying the next appropriate diagnostic
    test, treatment, or other clinical step.
  items_built: From 1,500 sampled recent, low-citation PubMed Central case reports, GPT-5.2 extracted question-answer
    pairs and Claude 4 Opus modified the questions while preserving the answers. Eight internal medicine or pediatrics
    physicians assessed medical validity and expertise requirements on a 1-to-5 scale, retaining 639 pairs rated
    4 or 5.
  example: ''
  scoring: GPT-5.2 compares each response with the reference answer and labels it equivalent only when the main
    recommended clinical procedure matches, rejecting vague recommendations or answers that mention but do not prioritize
    the reference procedure. The reported accuracy is the percentage of answers labeled equivalent.
  judge: GPT-5.2 assigns the equivalence labels.
  scale: Equivalent or mismatch per answer; overall accuracy is the percentage equivalent.
  validation: Internal medicine physicians checked GPT-5.2 judgments on 100 randomly selected baseline results spread
    evenly across models and setups, with 93% agreement.
  score_meaning: 'For dataset screening, physicians used a 1-5 scale: 1 meant the question-answer pair was unrealistic
    under any circumstances, and 5 meant the question was realistic and the answer correctly addressed it; only
    pairs rated 4 or 5 were retained. Recall@1 measures how often the top retrieved document is the source case
    report, so a value below 50% means retrieval misses that report more than half the time.'
  annotation_process: Eight physicians in internal medicine or pediatrics checked whether question-answer pairs
    were medically aligned and required specialist rather than general public knowledge. The equivalence judge received
    a few-shot example in its prompt. For error analysis in the oracle setting, GPT-5.1 assigned each error one
    primary and at most one secondary failure mode.
  results: GPT-5.2 was the best baseline, answering 56% correctly without retrieval and reaching 82% with retrieved
    medical articles.
  limitations: The authors note that low citation counts can reflect low visibility rather than persistent clinical
    rarity.
