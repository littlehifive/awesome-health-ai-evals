card:
  task: Answer a medical question about young adult mental health or prenatal care.
  items_built: Clinicians created the questions, and the dataset contains 540 question-response pairs with outputs
    from llama2, llama3, gemma2, olmo2 and biollm, annotated by clinical subject-matter experts. MedExpert-All adds
    32 double-annotated examples for inter-annotator agreement, bringing its total to 572.
  example: '"Is it okay to skip the 20-week anatomy scan if everything has been normal so far?"'
  scoring: Clinical experts mark sentences or phrases as factually correct or incorrect, record the most severe
    factual error, identify missing medical information and its severity, and rate whether the response provides
    enough certainty and information to act. The card gives no rule for combining these annotations into an overall
    score.
  judge: Clinical subject-matter experts identified as Annotator000 through Annotator007 assign the annotations.
  scale: 'Factuality: true or false; highest factual severity: No Error, Mild, Moderate, Severe or Life-threatening;
    omission severity: Mild through Life-threatening; certainty: Low, Moderate or High; no final metric specified.'
