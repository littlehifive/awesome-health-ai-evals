  notes: "Hugging Face card read in full (card describes clinician-created questions and expert annotations); the card cites a paper (Yarmohammadi et al., MedExpert, ML4H 2025) that could not be located, so venue is taken from the card citation. The card gives no authors' affiliations or question origin. Annotation was done through the John Snow Labs interface by annotators identified only as Annotator000-007. The dataset is annotated model outputs plus questions; no automatic scorer is given, so it is mainly a resource for judging or training factuality and omission detectors."
