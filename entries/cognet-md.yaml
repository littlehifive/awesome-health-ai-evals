  notes: "Questions were written with medical experts and carry difficulty levels; scoring gives 0.5 for at least one correct choice, a further 0.5 for the full correct set, and minus 0.5 per wrong choice. Evaluation use cases are Specialty, Beta (50 percent per specialty), and Production (full set). Dermatology, endocrinology, psychiatry and pulmonology are listed as specialties alongside dentistry; dermatology, endocrinology and pulmonology are coded as other_specialty. The Hugging Face user name is spelled differently in the paper (Panagoulas) than on the working dataset URL (Panagoulias)."
