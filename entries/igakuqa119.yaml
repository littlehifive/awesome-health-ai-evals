card:
  task: Answer Japanese medical licensing examination questions using the supplied text, answer choices and images
    where present.
  items_built: The author of the original nmle-rta repository processed all 400 questions, including text, choices
    and images, from official examination PDFs using OCR, with permission for use and publication. Correct answers
    and excluded-question handling were based on official Ministry of Health, Labour and Welfare information.
  example: ''
  scoring: The grading script checks model answers against correct answers based on official ministry information
    and sums points under the official exam scheme. Questions in blocks A, C, D and F earn 1 point each; in blocks
    B and E, questions 26 to 50 earn 3 points each and the rest earn 1 point each, with accuracy and separate results
    for the 297 questions without images also reported.
  judge: The grade.py script grades answers using correct answers and excluded-question handling based on official
    ministry information.
  scale: Each question is worth 1 or 3 points; total score out of 500 and accuracy out of 400, with percentages.
  validation: ''
  results: Gemini-2.5-Pro leads the supplied leaderboard with 485/500 points (97.00%) and 389/400 correct answers
    (97.25%).
