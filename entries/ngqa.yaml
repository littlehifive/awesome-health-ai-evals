  notes: "Framed as knowledge-graph question answering (Graph-RAG baselines such as ToG and KAPING plus LLM backbones). Match or contradict labels come from a rule-based tagging scheme (WHO, FSA, EU claims thresholds), sanity-checked by an LLM and reviewed by three human annotators. The README gives a Google Drive download for the benchmark file and no license; the paper covers four conditions only. Rater countries are not stated. Co-authors include IBM Research."
