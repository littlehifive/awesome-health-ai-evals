  notes: "Dataset card only, no paper. A deliberately hard 25-task subset of a 100-task redistributable pool (a third track on MIMIC-IV reports is withheld for licensing). Tasks are described as expert-authored; 6 of 25 were audited by practicing clinicians. Rubric tiers G1 to G4 (domain, persona, occupation, task). Difficulty metadata comes from two LLM graders. Only 25 tasks, so it is borderline against the 50-item floor; kept because the card reports 152 graded sub-questions. Releasing organization Centific AI Research; its country is not stated on the card."
