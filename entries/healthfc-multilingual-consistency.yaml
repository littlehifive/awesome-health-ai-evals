  notes: "ECIR 2025 paper. HealthFC's 750 claims were filtered to 508 with disease entities (HunFlair2), then kept only ICD-10 categories with 20 or more samples. Native Turkish and Chinese speakers reviewed 50 random translations each (84% of Turkish and 98% of Chinese judged satisfactory). Scoring is a GPT-4o parse-and-compare workflow (consistent, partially consistent, contradict, irrelevant) validated against 50 human-annotated samples per language (kappa 0.66 Turkish, 0.71 Chinese); it does not assess factual accuracy. The README says the dataset extras are on a Google Drive folder and the original HealthFC data must be fetched separately; no license is stated for the extension. The GitHub repo has no license and its README was read but not the Drive contents."
