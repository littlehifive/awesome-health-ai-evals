id: ranking-over-scoring
name: Ranking Over Scoring
kind: eval_framework
year: 2024
summary: An automated evaluation method for LLM-generated medical explanatory arguments that ranks arguments by how much they help a trained evaluator solve proxy tasks (medical MCQA, misinformation detection, NLI), validated against rankings by two clinicians.
