  notes: "Inputs are food photos plus text prompts (image input, not medical imaging); the schema has no image modality value, so modality lists text. Advisory labels (Normal, Controlled, Avoid intake) are derived from macronutrient weights in MM-Food-100K using numeric thresholds, not clinician-rated. Scoring: classification accuracy, ingredient match rate, and MAPE. The GitHub repo has no recognized license and its images were removed (a script downloads them from MM-Food-100K), so open_data is unknown. Authors are at Northeastern University at Qinhuangdao, HKUST (Guangzhou), and MBZUAI."
