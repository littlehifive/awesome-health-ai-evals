card:
  task: Interview a simulated psychiatric patient and then report the patient's profile, history, and behavior by
    answering questions about each assessed element.
  items_built: The framework sequentially generates a patient profile, history, and behavior for a user-selected
    mental disorder, then uses GPT-4o to simulate that patient. Ten board-certified psychiatrists who were not involved
    in development checked the clinical appropriateness of simulations across seven disorders, and a board-certified
    psychiatrist also reviewed patient utterances qualitatively.
  example: '"What is the patient''s Mood?"'
  scoring: The reported patient elements are compared with the corresponding values in the simulated patient's construct
    using binary correctness, element-specific partial-credit rubrics, or GPT-based G-Eval for open-ended answers.
    Scores are summed with weights of 5 for impulsivity, 2 for behavior, and 1 for subjective elements; underestimating
    self-mutilation or homicide risk receives zero.
  judge: Rubric-based comparisons and GPT-based G-Eval assign scores; the GPT grader version is not specified.
  scale: Binary 0 or 1 for some elements and element-specific partial credit for others; weighted sum reported as
    PSYCHE SCORE.
  validation: Across 20 interviews, PSYCHE SCORE correlated with scores from a blinded psychiatrist at r = 0.8486
    (p < 0.0001) and with the same psychiatrist's PIQSCA ratings at r = 0.6367 (p = 0.0025). Correlations with expert
    scores remained at least r = 0.7802 across the tested weight configurations.
  score_meaning: A higher PSYCHE SCORE indicates that the chatbot more accurately identifies the simulated patient's
    psychiatric characteristics, with emphasis on patient safety and clinical priorities. For mood, irritable and
    euphoric answers are treated as equivalent, while answers more than one point from the reference value receive
    zero.
  annotation_process: The chatbot's post-interview report is automatically compared with the correct values in the
    simulated patient's construct. For validation, each of four chatbot types completed five interviews with a simulated
    patient with major depressive disorder. One psychiatrist, K. L., scored all 20 interview records and reports
    using a detailed rubric while blinded to the chatbot type, and also rated them using PIQSCA.
  results: ''
  limitations: 'The simulated patients did not consistently reproduce some clinical features: all psychiatrists
    judged bipolar-disorder homicide risk non-conforming, and only half judged obsessive-compulsive-disorder insight
    conforming.'
