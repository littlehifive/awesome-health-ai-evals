year: 2025
summary: A patient-simulation framework that generates a multi-faceted psychiatric construct for a target disorder, drives a simulated patient from it, and scores psychiatric assessment chatbots with a weighted rubric (PSYCHE SCORE), validated on seven disorders by ten psychiatrists.
