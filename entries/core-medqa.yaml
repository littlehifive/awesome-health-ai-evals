card:
  task: Answer medical multiple-choice questions with added medically related context that does not change the correct
    answer.
  items_built: The dataset uses 1,273 MedQA-USMLE test questions and 2,450 MedXpertQA-Text test questions. Medical
    entities are extracted from each question, and an LLM rewrites the top two co-occurring entity triplets from
    a PPMI matrix built from 11,493 ICHI/ICD-11 entities and 12,820 PubMed papers into factual context sentences
    for insertion.
