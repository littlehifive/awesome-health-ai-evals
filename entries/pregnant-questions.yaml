  notes: "Twenty health experts recruited on Upwork (OB/GYNs, nurses, lactation consultants, public health experts) wrote answers and identified assumptions and implications; their countries are not stated. The repository README only says it holds resources for the paper; the top level shows annotation and experiments folders and no explicit data file or license, so open_data is unknown. The paper's QA-pipeline experiments judge answer completeness; the exact scoring protocol was not read in detail. The ROSIE system is a maternal-health QA service from an earlier paper."
