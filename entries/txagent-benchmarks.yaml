summary: Five drug-reasoning benchmarks built from FDA drug documentation - DrugPC (3,168 questions over 11 tasks), BrandPC, GenericPC, and DescriptionPC variants, and TreatmentPC (456 patient-specific treatment-selection scenarios) - in multiple-choice and open-ended forms.
