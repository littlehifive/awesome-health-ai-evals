  notes: "Harvard Medical School (Zitnik lab). The paper is mainly about the TxAgent agent and the ToolUniverse tool set; the benchmarks are used to test it. The paper's data and code availability statement lists the GitHub repos and a Hugging Face collection (models, papers, a crowdsourcing eval space), but no benchmark dataset was found in the repo (its data folder has only new_tool.json) or the collection, so open_data is unknown. The MIT license is on the code. Question generation by LLM from FDA label sections is inferred from the construction description and was not confirmed in detail. Includes a drug-label QA scope that is partly pharmacology reference rather than chatbot interaction."
