  notes: "Read the repo README and VALIDATION.md; the manuscript PDF (paper/main.pdf, not peer reviewed as far as seen) and Zenodo record were not opened. Only 30 items, kept because the repo ships a manuscript and a guideline-checked rubric set; a human may want to apply the 50-item bar. The README says the project is part of Periospot; the owner's country and institution are not stated, so lead country and builder type are unknown. Scoring: an LLM judge counts must_include criteria and flags must_avoid violations, with a second-vendor judge for agreement, N repeats for consistency, and latency. The README calls the rubrics clinician-reviewed and guideline-verified (v0.1.2), with final clinician sign-off noted in VALIDATION.md. Section choice is borderline (open-ended answers scored by rubric); open_ended may fit better."
