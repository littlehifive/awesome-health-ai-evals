  notes: "Full dataset is released only after a signed user agreement emailed to the authors (GitHub README); only a small sample is public. License not stated. Metrics: precision/recall/F1 for helping-skill classification, accuracy for spatiotemporal processing, NLG metrics for responses, plus a GHSC helping-skill benchmark. Dialogue data is also used for fine-tuning, so it is partly a training resource. Quality audit by two senior psychologists on 1,000 dialogues."
