id: medgemma-guardrail-robustness
name: MedGemma-4B guardrail red-teaming benchmark
kind: benchmark
year: 2026
summary: A factorial red-teaming set of 250 templated unsafe medical requests (dosage, diagnosis, treatment, drug interaction, emergency deferral) crossed with 6 lay-accessible prompt reframings, scored refuse, hedge or comply by LLM, regex and NLI judges.
