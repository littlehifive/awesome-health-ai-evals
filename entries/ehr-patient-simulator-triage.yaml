id: ehr-patient-simulator-triage
name: EHR-Derived Patient Simulator for Conversational Triage
kind: eval_framework
year: 2025
summary: An evaluation framework in which an LLM patient simulator, seeded with vignettes from 519 de-identified US EHR encounters, converses with a symptom-checking triage agent and clinicians rate the dialogue, diagnosis, and triage recommendation with a 14-question questionnaire.
