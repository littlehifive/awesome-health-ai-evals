summary: 50 simulated single-turn Iraqi Arabic breast cancer scenarios (emergencies, chemotherapy adverse effects, drug-herb interactions, lifestyle) with structured reference standards, scored on four 1-5 domains and three safety flags by GPT-5.1 evaluator prompts validated against two adjudicated oncology experts.
