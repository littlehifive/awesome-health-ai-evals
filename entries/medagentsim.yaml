  notes: "Primarily a simulation framework with self-improving agents; the benchmark component is the converted case sets. The license is from the Hugging Face card; the card lists 107 MedQA rows while the paper says 106. Code link is from the HF card; the paper text I scanned has no URL. The paper includes a bias analysis of patient cognitive biases. MIMIC-IV based cases may carry PhysioNet terms that the MIT label on the card does not address."
