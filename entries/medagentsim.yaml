year: 2025
summary: Open-source simulated clinic where a doctor agent interviews a simulated patient over several turns and requests exams and images, evaluated on 107 to 214 OSCE-style MedQA cases, 15 to 120 NEJM cases, and 288 MIMIC-IV cases for diagnostic accuracy.
