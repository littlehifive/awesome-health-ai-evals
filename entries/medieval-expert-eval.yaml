  notes: "r_d5c80a97eb is the Figshare software deposit (code for processing responses, running the rating web system, and analysis). The reference list also cites two Figshare datasets (expert evaluations; responses of seven models); I did not open them and saw no license or data-availability statement in the text, so open_data is unknown. Rater and item countries are from the Shenzhen-based authors and the 'local hospital' wording; the paper does not state them in those words, and the hospital's country is therefore a mild inference. 'Real and simulated' cases are real local cases plus OSCE questions. This candidate group was merged by name with the unrelated MediEval benchmark (medieval-ehr-statements). Pass 2 should capture the Dreyfus scale levels and the fabrication-incidence measure."
