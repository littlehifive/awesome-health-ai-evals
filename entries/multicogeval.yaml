id: multicogeval
name: MultiCogEval
kind: benchmark
year: 2025
summary: Medical evaluation at three cognitive levels built from MedQA, MedMCQA, and MIMIC-IV, from multiple-choice recall (3,611 questions) to reformulated knowledge-application tasks (21,666) to scenario-based diagnosis from patient records (2,176), scored by accuracy and a full-path diagnosis metric.
