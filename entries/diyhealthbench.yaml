card:
  task: Answer each home-care question using the supplied text, image or physiological signal, either by generating
    a free-text response or selecting an answer in the closed-QA format.
  items_built: The authors used Claude 3 Haiku to generate QA pairs from private datasets from three organizations
    and 20 public sources, including Kaggle, PhysioNet and Figshare, with multiple rounds of independent expert
    review for home-care suitability, semantic validity and medical consistency. They selected 12,167 test examples
    by randomly sampling 1% per task, with a minimum of 1,000 for small datasets, balancing task categories, input
    modalities and disease categories and separating users between training and testing.
  example: ''
  scoring: Closed-QA predictions are compared with reference answers using accuracy and Matthews correlation coefficient;
    open-QA responses are compared with ground-truth answers using F1-RadGraph, F1-BioBERT, BLEU and ROUGE-L. Clinical
    experts also rate 500 randomly sampled open-QA answers for conciseness, correctness and relevance; the excerpt
    does not specify how these ratings are combined.
  judge: Automated reference-based metrics and clinical experts assign scores; additional GPT-5 evaluations are
    reported in the appendix.
  scale: 'Closed-QA: accuracy and MCC; open-QA: F1-RadGraph, F1-BioBERT, BLEU and ROUGE-L; expert ratings: 1 to
    6, with 1 best.'
  validation: ''
  score_meaning: For expert ratings, conciseness means giving direct, succinct answers for non-expert readers without
    unnecessary detail; correctness means factual accuracy; and relevance means avoiding irrelevant content. A rating
    of 6 is the worst.
  annotation_process: ''
  results: DIYHealthGPT performed best across all tasks, with reported average improvements of 22.7% in closed-QA
    accuracy and 16.7% in open-QA F1-BioBERT over baselines. It was also the clinical experts' first preference.
  limitations: ''
