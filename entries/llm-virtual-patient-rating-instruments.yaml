  notes: "Borderline entry: the main contribution is a proof of concept for LLM-powered virtual patients for clinician training; the reusable part is the three validated rating instruments (items listed in Table 1; case prompts and narratives in Multimedia Appendix 1). Reproducibility of ratings was only fair to slight (ICC 0.17-0.40), and zero-shot GPT ratings were judged suboptimal. Merged the JMIR Preprints version (r_9d0560146c). Mayo Clinic lead; other authors at Utah and New Mexico. No dataset license seen; open_data set to described_only because only instruments and example prompts are in the paper."
