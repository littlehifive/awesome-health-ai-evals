id: llm-glycemic-control-value-judgments
name: LLM glycemic control value-judgment framework
kind: eval_framework
year: 2025
summary: "A framework that has LLMs make pairwise comparisons of continuous-glucose-monitoring summaries for simulated type 1 diabetes profiles, then measures alignment with time in range and the clinician-derived Glycemia Risk Index, plus perturbation tests of hypo- versus hyperglycemia weighting."
