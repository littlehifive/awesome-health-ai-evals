  notes: "Two scores: HPI-versus-guideline match (weighted and unweighted, LLM organizer and comparer) and disease-diagnosis accuracy by a separate diagnostician agent. Experiments were mainly in Korean; the paper states this and compares Korean and English dialogues for Qwen 2.5 only. The GitHub repo has a data folder but no license file was found, and the paper does not state a license or the rater countries. Authors are at AITRICS, KAIST, Yonsei and Catholic University of Korea (from the author block)."
