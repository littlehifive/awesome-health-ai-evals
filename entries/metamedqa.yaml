  notes: "Tests metacognition: models give an answer and a 1 to 5 confidence, and must recognize missing correct options and unanswerable questions. License and the HF dataset ID are from the Hugging Face card (the card describes the same 1,373-question set); the paper text read did not contain a data-availability statement with the link, and the HF dataset creation date (June 2024) gives the year. Twelve models were evaluated."
