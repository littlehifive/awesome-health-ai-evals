id: metamedqa
name: MetaMedQA
kind: benchmark
year: 2024
summary: 1,373 six-option USMLE-style questions adapted from MedQA, with fictional-organ questions, malformed questions, and a "none of the above" and "I don't know" option, scored on accuracy, confidence-weighted accuracy, missing-answer recall, and unknown recall.
