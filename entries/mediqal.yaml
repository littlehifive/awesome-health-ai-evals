  notes: "Questions were collected from public websites and forums where faculty and students share preparation questions for the French national medical exam. MCQU is scored by accuracy, MCQM by exact match ratio and Hamming score, OEQ by ROUGE-1, BLEU-4, BERTScore, and an LLM judge (1 to 10). Train, validation, and test splits exist for MCQ subsets; OEQ is test only. Data is also on Zenodo (10.5281/zenodo.18220039)."
