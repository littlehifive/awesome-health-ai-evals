  notes: "Read the PMC full text (University of Queensland authors). The framework covers study design and outcome measures for health chatbot trials, mostly pre-LLM conversational agents, and is borderline between an evaluation framework and a scoping review; the categories include functionality, safety and information quality, user experience, clinical outcomes, costs, usage, and user characteristics. Article license not seen in the PMC page."
