  notes: "Read the full paper and the repository README. Each question is labeled for dependence on age, sex, and location, with labels verified by public health and gender studies researchers. Bias is measured by comparing model answers with and without demographic context (sentence similarity plus human judgment of alignment; sex-based answers rated by Prolific healthcare annotators, age and location by the authors). The repository license is MIT; the questions are quoted from public websites. Rater countries are not stated. The record has no arXiv ID; arXiv 2403.04858 is taken from the repository's citation block."
