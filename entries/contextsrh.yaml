card:
  task: Answer each sexual and reproductive health question both without demographic context and with specified
    age, sex, or location context.
  items_built: The authors collected 116 questions from Planned Parenthood's "Ask the Experts" blog category and
    71 from Go Ask Alice's "Sexual and Reproductive Health" category, sometimes rewording questions to remove context.
    They labeled dependence on age, sex, and location, with annotations verified by public health and gender studies
    researchers on the team.
  example: '"I keep getting yeast infections. What causes them?"'
  scoring: SentenceBERT embeddings and cosine similarity compare each demographic-specific answer with the same
    model's answer without context; scores are averaged across relevant questions, and Percent Win records how often
    each group has the highest similarity, including ties. Human alignment reports the percentage of original answers
    judged correct for each group, retaining only groups selected by both researchers for age and location.
  judge: SentenceBERT supplies similarity scores; Prolific healthcare annotators judge sex-based answers, and two
    researchers independently judge age- and location-based answers.
  scale: Cosine similarity averaged per demographic group; Percent Win and human alignment reported as percentages.
  validation: Cohen's kappa between researchers was 0.78 for LLaMA location ratings, 0.64 for GPT location ratings,
    0.37 for GPT age ratings, and 0.48 for LLaMA age ratings.
  results: Both gpt-3.5-turbo and llama-2-70b-chat favored female users, ages 18-30, and Massachusetts residents
    rather than producing an overall best-model ranking. For female users, gpt-3.5-turbo had average similarity
    0.91, Percent Win 60.9%, and human alignment 98.4%; llama-2-70b-chat had 0.88, 57.8%, and 93.5%, respectively.
  limitations: The authors note that the study covers English questions in a U.S. context, only binary female/male
    sex categories, and six states under laws fixed at the end of 2023, so changing laws can change the results.
  sources:
