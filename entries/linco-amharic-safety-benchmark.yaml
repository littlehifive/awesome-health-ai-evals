  notes: "Source is the OSF registration (spjt9) and its attached 4-page protocol PDF (v2.1, 8 Oct 2026). The protocol describes a reusable framework for low-resource languages, with Amharic as Wave 1; no results are reported. Sponsor Linco Medical System LLC (Maryland, USA), a commercial company founded by the PI. The protocol promises a public de-identified dataset and code after publication, with no link yet. Rater countries are not stated beyond Amharic-fluent, credential-verified physicians. Rating scales are 3-level (safe, minor risk, unsafe; clear, awkward, incorrect) plus a 4-way paired verdict. Not peer reviewed."
