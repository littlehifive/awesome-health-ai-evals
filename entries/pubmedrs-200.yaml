  notes: "Introduced in the Clinfo.ai paper (an open-source retrieval-augmented system); the paper says the dataset is publicly available, but I did not find a separate download link or dataset license (the Clinfo.AI repo is MIT, which is the code license). Scoring uses source-augmented metrics (UniEval, COMET, CTC) and reference-based ones (BERTScore, ROUGE-L, and others), so the benchmark is for literature-grounded answers by systems and not for patients. Two reviewers extracted the answers by hand from review abstracts."
