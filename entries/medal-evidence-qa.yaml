  notes: "Published in Patterns; also arXiv 2509.10843. The Hugging Face card lists license 'other', recorded here as custom. Questions and labels were mostly LLM-generated with manual spot checks, which the authors list as a limitation. Scoring is label match (yes/no/no evidence, plus evidence-quality and discrepancy labels), not multiple choice proper. Benchmark also stresses retrieval-augmented conditions. Zenodo record 10.5281/zenodo.18363150 and the HF dataset are merged here (Zenodo lists CC-BY-4.0 and open access; the HF card says other). Authors at Johns Hopkins (email domain and funding statement); the full affiliation list was not read."
