  notes: "Downloaded and inspected the OSF release zip (README, case bank, answer key, prompts, parsed outputs, adjudication). Cases are constructed vignettes in domains such as renal dosing, each with hazard, expected action, severity, and control type in the answer key; outcome is adjudicated serious hazardous confirmation. The README names a manuscript ('Authority-Cue Confirmation Failures in Medication Safety Review by Large Language Models') that was not found or linked. OSF license is CC-By Attribution 4.0 with copyright holder Goktug Ozkan; the author's institution and country are not stated. Who wrote the vignettes (clinician versus LLM-assisted) is not stated, so item_provenance is set to unknown; adjudication by the author is described but the rater background is unknown."
