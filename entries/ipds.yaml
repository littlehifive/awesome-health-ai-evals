  notes: "Research Square preprint. The paper gives the data as a PhysioNet credentialed-access release (account, CITI training, data use agreement); I did not find a PhysioNet page for it (the URL I tried returned 404), so access is from the paper's statement. The paper's CC BY 4.0 is the preprint license, not a dataset license, so license is null. MIMIC rules barred sending the data to external APIs, so GPT-4 and similar were not evaluated. Three clinicians from tertiary hospitals gave reference diagnoses on 100 cases. The paper also proposes the MAIDS multi-agent framework, which is a method and not part of the benchmark. Lead country is Hong Kong (Chinese University of Hong Kong). Record r_c033f3987a is the later arXiv version and npj Health Systems article (doi 10.1038/s44401-026-00085-0, titled MAP: Evaluation and Multi-Agent Enhancement of Large Language Models for Inpatient Pathways); its evaluation code is at github.com/franciszchen/MAP. In that version, 1,000 IPDS cases are held out for evaluation and the rest are for training."
