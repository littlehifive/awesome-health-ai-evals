  notes: "Four scenarios: Standard-RAG, Sufficiency, Integration, Robustness, with noise levels p_sig from 0 to 100. Supplementary documents and sub-QA pairs were generated with GPT-4o. Sub-question answers are scored by exact match and a GPT-based score. The dataset card cites the AAAI 2026 AI4Research workshop; the arXiv paper dates from 2024. The card counts 3,680 instances while the paper text says 3,480."
