summary: 3,680 medical QA instances built from five MIRAGE datasets (BioASQ, PubMedQA, MedQA, MMLU-Med, MedLFQA) with added signal, noise, sub-question, and counterfactual documents to test RAG sufficiency, integration, and robustness.
