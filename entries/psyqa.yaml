  notes: "Tsinghua University (CoAI). Full data needs a signed user agreement emailed to the authors (the README offers only a small sample file), hence gated; the license is the bespoke user agreement. Tasks are strategy identification and answer generation with fine-tuned GPT-2; the abstract reports fluency and helpfulness gains, and human-rating details were not checked. The Hugging Face dataset lsy641/PsyQA is a re-split by another team and is not listed in links. Nine help-seeker topics (for example emotion, love, family, career)."
