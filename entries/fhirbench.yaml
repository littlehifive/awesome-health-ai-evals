  notes: "Scope is borderline: it compares how structured EHR data is formatted for LLM input rather than testing health answers, and the tasks are generated from synthetic records. A human should decide whether to keep it. MIT license is stated in the paper for code, benchmark data and results (Zenodo 10.5281/zenodo.21223883). Single author at The Hong Kong Polytechnic University. item_provenance llm_generated is an approximation: tasks are produced by generators over Synthea records. The preprint itself is CC BY 4.0."
