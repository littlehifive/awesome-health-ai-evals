  notes: "Only the DataCite/ScienceDB description was read; the data files, license, and the associated paper were not reached (the ScienceDB page needs JavaScript). Case language is probably Chinese but is not stated. The dataset bundles model predictions with the cases, so it is partly model output; it is kept because the description presents it as a resource for evaluating LLM syndrome recognition. Authors are at Zhejiang Chinese Medical University, China Jiliang University, and Xiyuan Hospital. Human check advised."
