  notes: 'Added by hand on 2026-11-25 from the Global Health AI Benchmarks site, an initiative of The Agency Fund
    and Endless Health, so it has no screening record. Facts come from the benchmark''s page on that site and the
    team''s report PDF. The site says the complete datasets stay with each organisation. The report (version 1.2,
    5 November 2026) says the dataset went live on Hugging Face (eHealthAfrica/voices-of-care-hausa, CC BY 4.0)
    on 9 August 2026 and was then made private at the programme''s request, pending a comparison of frontier models;
    it says public access will be restored afterwards and reviewers can ask for access. The dataset page returned
    401 and the code repository (github.com/eHealthAfrica/voices-of-care, Apache-2.0) 404 on 2026-11-25, so open_data
    is closed and neither is listed as a link. The technical partner is Data Science Nigeria / EqualyzAI. Scope:
    this tests speech recognition and intent recognition, not the quality of health answers.'
