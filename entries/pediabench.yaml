card:
  task: Answer Chinese pediatric questions by judging statements, selecting options, matching sentence gaps to options,
    explaining concepts, or analyzing clinical cases.
  items_built: The authors collected 3,576 multiple-choice questions from CNMLE banks, extracted 258 true/false,
    167 essay and 67 case-analysis questions from university exam PDFs, curated 1,398 essays from pediatric standards
    and guidelines, and manually built 283 pairing questions from multiple-choice items. They removed duplicates
    and manually checked and corrected disease-group labels suggested by GLM-4 using ICD-11.
  example: ''
  scoring: True/false and multiple-choice answers are checked for correctness and weighted by difficulty derived
    from the proportion of tested models answering correctly; pairing answers receive 3, 1 or 0 points for fully,
    partly or entirely incorrect matches. GPT-4o grades essays and case analyses with weights of 5 and 10 respectively,
    and scores are summed within question types and combined in proportions of 10:40:10:30:10 for true/false, multiple
    choice, pairing, essay and case analysis.
  judge: Objective answers are checked against correct answers, and GPT-4o grades subjective responses.
  scale: 'Pairing: 0, 1 or 3 points; essay weight: 5; case-analysis weight: 10; difficulty-weighted objective scores
    and a weighted integrated score.'
  validation: Human and GPT-4o case-analysis scores had Spearman/Kendall correlations of 0.7508/0.6430 for BianQue-7B,
    0.7328/0.6325 for ChatGLM3-6B, 0.8079/0.7149 for Qwen1.5-72B and 0.7732/0.6511 for GPT3.5-turbo.
  results: ''
  limitations: The authors state that coverage omits many pediatric diseases and treatments, is limited to pediatrics,
    and may be affected by GPT-4o's preference for particular answer styles.
