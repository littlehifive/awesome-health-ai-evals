  notes: "The paper says all sources are public and gives no repository, dataset link, or license, so release status is unknown. Subjective questions are graded with GPT-4o as referee. 3,576 multiple-choice items come from CNMLE banks (3,383 from the Pediatric Doctor In-Charge qualification exam); 258 true/false, 167 essay, and 67 case-analysis items come from university final exams; 283 pairing questions were built by hand. 20 LLMs were evaluated. Published in Frontiers of Computer Science."
