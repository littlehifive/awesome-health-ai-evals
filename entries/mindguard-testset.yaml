  notes: "The abstract calls the conversations real-world, but the paper says licensed psychologists simulated patient archetypes with a clinician language model, so items are not from real users. Labels are by majority vote of three psychologists (94.4% unanimous, Krippendorff alpha 0.57). Scored as a classification task (e.g., AUROC, false positive rate at high recall), not by judging chatbot replies; the paper also reports a red-teaming evaluation of guarded chatbots. The Hugging Face dataset is gated (auto approval) and its card could not be read without login; license is from the dataset tags. Lead institution is Sword Health (Portugal) with Instituto de Telecomunicações."
