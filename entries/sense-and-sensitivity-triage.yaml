  notes: "Companion repo abinithago/Sen2Med (MIT license, dataset.csv with 6,233 rows x 71 columns) merged in from candidate r1-c1243. Ten physicians (7 from the US, 3 not) annotated via Centaur Labs; gold labels are majority of three. Task is three binary decisions: self-manage, visit, resource. Perturbations are applied to existing datasets so localization is adapted. The repo README did not confirm whether source-dataset licenses limit the MIT grant."
