card:
  task: Conduct a multi-turn conversation with a simulated patient to give medication advice or gather a medical
    history and provide a diagnosis.
  items_built: The authors constructed 500 Chinese and 500 English knowledge-graph subgraphs per task, using CMeKG
    for Chinese and PrimeKG for English, extended with triples from expert-annotated datasets. They removed medically
    inconsistent triples and prioritized distinctive symptoms before generating simulated consultations.
  example: '"I have high blood pressure,can I still take this?"'
  scoring: The Judge Agent uses the dialogue history and reference medical knowledge to rate each medication response
    for correctness and comprehensiveness, and diagnostic conversations for history-taking and agreement with the
    reference disease. Reported task scores are normalized to 0-1; the excerpt does not specify how scores across
    turns and cases are combined.
  judge: QwQ-32B is the Judge Agent selected for its agreement with expert human raters.
  scale: 'Medication correctness, comprehensiveness and history-taking: 0-2; diagnostic correctness: 0-3; reported
    scores normalized to 0-1.'
  validation: The authors compared QwQ-32B, Qwen3-32B and DeepSeek-R1-32B ratings with expert human ratings using
    mean absolute error; QwQ-32B had the highest agreement, but numerical errors and the number of raters are not
    provided in the excerpt.
  score_meaning: Medication correctness scores of 0, 1 and 2 mean all key facts are wrong, some are wrong, and all
    are accurate; comprehensiveness scores mean no relevant information, partial coverage missing meaningful points,
    and full coverage; history-taking scores mean irrelevant information, partial core information missing distinguishing
    features, and structured inquiry covering key disease-specific features. Diagnostic correctness scores of 0,
    1, 2 and 3 mean an unrelated diagnosis, a clinically similar but categorically unrelated diagnosis, a related
    disease category or mechanism, and an exact match or clinical synonym, respectively.
  annotation_process: ''
  results: DeepSeek-R1-671B led medication consultation with correctness scores of 0.8858 in Chinese and 0.8763
    in English, and comprehensiveness scores of 0.7581 and 0.8351. It also led Chinese disease diagnosis in correctness
    and history-taking.
