card:
  task: Draft a reply to a patient's follow-up question after an online gynaecology consultation, from the consultation
    details and the chat so far, for the doctor to edit and send.
  items_built: 996 copilot replies to real follow-up questions were sampled from the Pinky Promise app between mid-April
    and mid-June 2026, in groups built from language, patient age group and medical issue. Where possible only one
    reply per patient was kept (832 patients), and the sample was spread across doctors. The copilot writes 3 candidate
    replies; the one scored is the reply the doctor chose, or the first where the doctor chose none.
  example: I started the tablets you prescribed 3 days back and I have been feeling nauseous since. I am quite worried
    about it. Should I stop them? Also my period still has not come, when should I do the test again? (A made-up
    chat from the site's worked example, not a patient's message.)
  scoring: Each reply is scored yes or no on relevance, clinical accuracy, safety, completeness, empathy, colloquial
    tone and exhaustiveness, with clinical accuracy all or nothing, plus a label for how much the doctor edited
    the draft (none, minor or major). The seven yes-or-no metrics are combined into a weighted average, with weights
    from 7 for safety and 6 for clinical accuracy down to 1 for empathy.
  judge: Two gynaecologists scored 582 replies between them on relevance, clinical accuracy, safety and completeness.
    GPT-5.4-mini, with a separate set of instructions for each metric, scored all 996 replies on all 8 metrics and
    gives a sentence or two of reasoning when it marks a reply down.
  scale: Yes or no, with 'not applicable' for clinical accuracy and completeness and 'not needed' for empathy on
    the doctors' scale; none, minor or major for type of edits.
  validation: Both doctors scored 49 replies and agreed 97.96% of the time on safety, 87.76% on relevance, 73.47%
    on clinical accuracy and 65.31% on completeness. The judge agreed with the doctors 96.56% on safety, 95.35%
    on relevance, 81.93% on clinical accuracy and 61.62% on completeness. On empathy (97.10%) and colloquial tone
    (52.17%) the check rests on the first 10 replies each doctor scored.
  score_meaning: A yes on clinical accuracy means the whole reply was accurate; a partly correct reply scores nothing.
    Completeness asks whether what the copilot did answer was complete, and exhaustiveness asks whether every question
    the patient raised was answered at all. No edits and minor edits both count as a good reply; a major edit means
    the doctor changed the medical content or wrote something else.
  annotation_process: Doctor 1 scored 293 replies, Doctor 2 scored 338, and 49 were scored by both. They worked
    from written guidelines and wrote down the reason for a low score unless it was obvious, which was later used
    to align the judge.
  results: The final weighted average was 83.35%. Doctors marked 97% of drafts safe, 96% relevant, 92% clinically
    accurate and 73% complete. The judge marked 58% exhaustive and 55% colloquial, and the team says it is too harsh
    on the second. Doctors sent 40% of drafts untouched or with only minor edits.
  limitations: Doctor scoring is slow, so the team needs a better way to choose which replies doctors see. Doctors
    and the judge both mix up completeness and exhaustiveness. Only 1 of the copilot's 3 candidate replies was scored,
    and doctors often look only at the first.
