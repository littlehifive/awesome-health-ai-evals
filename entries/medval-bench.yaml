  notes: "Outputs were generated by LMs under random perturbation at four risk levels and annotated by 12 physicians (internal medicine and radiology). Half the tasks are clinical documentation or radiology report tasks, so scope is partial. gymmbky/MedVAL-Bench is a copy of the same dataset (same tags and arXiv ID), recorded here only as a mirror and not linked. Round 2 added the npj Digital Medicine journal version r_98a0e8ea41 (DOI 10.1038/s41746-026-03084-5); it may now count as peer reviewed."
