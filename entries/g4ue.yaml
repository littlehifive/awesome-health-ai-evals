  notes: "A SIGIR 2024 resource-track paper. The released material is GPT-4 explanations with error-type annotations, plus SemRep concepts, aimed at studying LLM errors and an error-type classification task; it is closer to an error-analysis resource than a standard benchmark, so a human may want to confirm it belongs. MedQA itself is not a contribution. License is the GitHub repo's. Lead countries are from the first author (IIT Kharagpur, India) and second author (L3S, Germany); last author's affiliation was not checked."
