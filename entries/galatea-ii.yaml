  notes: "Single-author Zenodo preprint (Hospital AGEL Komarno; Slovakia inferred from the town name). Only the Zenodo record metadata and abstract were read; the PDF and README could not be fetched. The record lists data.zip, scripts.zip, examples.zip, tables.zip and a data dictionary under CC-BY-4.0, but it is unclear whether the released data are model outputs and judge verdicts only or reusable case prompts; a human should check whether the cases can be reused as test items. Metrics named in the abstract include a GQI score, sycophancy and capitulation rates, and inter-judge kappa. The record is also referenced by four earlier Zenodo versions of the GALATEA work."
