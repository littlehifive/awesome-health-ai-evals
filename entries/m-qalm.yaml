id: m-qalm
name: M-QALM
kind: benchmark
year: 2024
summary: A collection of 22 existing English clinical and biomedical QA datasets (16 multiple-choice, 6 abstractive; about 200,000 train and 12,000 test multiple-choice questions) with a standard protocol for testing medical knowledge recall and reading comprehension.
