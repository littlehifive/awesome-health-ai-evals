  notes: "Built at ASUS Intelligent Cloud Services (Singapore) with NUS and the University of Manchester. The paper says the datasets, code, and protocol are public on GitHub (anand-subu/m-qalm); the repository README was empty and no license was stated, so license is null and open_data comes from the paper's statement. Constituent datasets keep their own licenses. Abstractive QA is scored with similarity metrics (the paper discusses ROUGE and BERTScore-style measures; exact metric list not checked)."
