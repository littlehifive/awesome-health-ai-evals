  notes: "Data availability statement points to a Figshare link (https://figshare.com/s/b0459f2266eeb5af288d), a private-share style link; no license seen. CVD is semantic similarity divided by token count, plus keyword relevance, a three-level safety score from two licensed pharmacists, and a conciseness bonus. Authors are at UAE University and the University of Jordan. Who wrote the scenarios is not stated explicitly (pharmacist co-authors contributed data curation); rater countries inferred from affiliations, so check."
