  notes: "Part of the Green Shielding paper (Berkeley, UCSF, and others), whose main contribution is an agenda for characterizing how benign prompt variation shifts model behavior; HCM-Dx is the released benchmark. It was filtered by an LLM judge from the first 20K of HealthCareMagic-100K. Reference sets were built by a three-LLM ensemble (GPT-5.2, Gemini-3-Pro, Claude-4.5-Opus); clinicians validated them only in a preliminary check, and the paper reports expert disagreement. Metrics use LLM parsers and matchers for diagnosis extraction. No license is stated on the dataset card; the card lists the 2,697 rows as a test split. The Hugging Face ID name (HCM-Dx-3K) differs from the 2,697 count."
