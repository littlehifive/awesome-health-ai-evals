  notes: "Questions are made with an AI-human workflow and screened by 239 physicians; the paper compares models with Chief and Attending Physicians. Many items include medical images, so some models are evaluated as vision-language models; modality is listed as text because the schema has no image value. Venue is ICLR 2026 per the dataset card. Authors from CUHK-Shenzhen and Ant Group, with Zhejiang University and Ohio State. Further half-year releases are planned (2025_H2 folder is a placeholder)."
