  notes: The paper says BiasMedQA is released as an open-source dataset, but the text read gives no URL; the only repository found by search (ai-idt/reasoning_bias) belongs to a later paper, so no code or dataset link is listed and the license is not stated. Record r_b3a8e8b941 is the arXiv version. Seven biases are self-diagnosis, recency, confirmation, frequency, cultural, status quo, and false consensus. Also evaluates three mitigation prompts. Lead country USA is an assumption from the author list and was not checked.
