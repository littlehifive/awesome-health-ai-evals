  notes: "AAAI-26 paper (r_7392c3a900) and its Underline record (r_6f40fb4995). OncoCoT, the larger training-oriented CoT dataset, is the paper's main contribution; OncoEval is the evaluation subset and is the part catalogued here. Language is inferred from the Chinese source reports and the Chinese medical reasoning baselines; the paper does not state it outright. The paper says datasets are at the GitHub repo, but the repo seen holds only a README and LICENSE (Apache-2.0), so open_data is unknown and the benchmark size was not found. Questions and reference answers are LLM-generated from case timelines; evaluator LLMs extract and compare items."
