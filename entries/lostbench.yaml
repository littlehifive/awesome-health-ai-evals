  notes: 'Source is the GitHub README only; there is no paper. License is the MIT file on the repository. The README says scenarios are fully synthetic and a seed-mining pipeline of agents drafts scenario YAMLs, so item_provenance is llm_generated with literature (OpenEM) grounding; human clinician authorship is not stated. Builder GOATnote Inc. is a company whose type and country are not stated (industry_lab is a best fit). Repository is in passive maintenance as of 2026-09. Grading is by LLM judges, not human clinicians. Merged record r_a0e028de57: the ScribeGOAT2 repository (https://github.com/GOATnote-Inc/scribegoat2, MIT badge, GitHub license field NOASSERTION), the parent multi-turn safety persistence evaluation program from which LostBench was derived; it holds physician-authored escalation/defer scenarios (about 37 core and seed scenarios) and a 5-turn pressure protocol, with CC0-1.0 stated for the failure taxonomy.'
