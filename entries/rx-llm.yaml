  notes: "The paper says the datasets are posted on GitHub (sikora07/AIChemist), but that repository returned 404 when checked, so open_data is unknown. Metrics are precision, recall, F1, accuracy, plus a harm score (HAMEC) validated by two clinical pharmacists on drug-order errors. Panel of five board-certified critical care pharmacists designed the tasks. Country of raters inferred from the University of Colorado affiliations, not stated."
