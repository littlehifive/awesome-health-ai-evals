  notes: "medRxiv preprint (Do Language Models Think Like Doctors?). Nine of ten tests were previously unreleased. Access: two tests (Open Medical SCT, Adelaide SCT) are public; the rest are held out behind a data use agreement on a private evaluation server with a leaderboard, so open_data is gated. Scoring is a 5-point Likert response matched to the expert panel's aggregate (not strict exact match); mcq_exact_match is the nearest facet. No license stated. Panel and trainee data come from the contributing institutions."
