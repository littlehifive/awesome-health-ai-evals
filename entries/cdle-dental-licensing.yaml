  notes: "Questions are taken from a commercially published preparation book (Liaoning University Press, 2024), so redistribution rights are unclear. Apache-2.0 is the license on the GitHub repository that holds the xlsx question files and model predictions (datafiles/ and results/); the repo name in the paper (Chinese_professional_dental_licensing_examinations) returns 404, the live repo is lowercase chinese_dental_licensing_examinations and was found via the author's account. The Research Square preprint is not peer reviewed. Lead institution country (CHN) is assumed from the funder and exam context, not from an affiliation line I read."
