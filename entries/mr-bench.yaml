  notes: "MR-Bench is a secondary contribution of a survey of medical reasoning with LLMs; the arXiv preprint and the journal version (r_9d86c672f5, a Wiley journal; peer-reviewed status inferred from the DOI) are the same work. The MIT license is the repository's license (code), not a stated data license. The repo holds scripts (src_bench/mimiciv_drug.py, mimiciv_pro.py) to build items from MIMIC-IV, which requires PhysioNet credentialed access; no downloadable item file was seen, so open_data is unknown. Case-based MIMIC-IV items overlap with EHR-derived tasks; included because the tasks are clinician decision questions for LLMs, but a human may prefer to treat it as borderline scope."
