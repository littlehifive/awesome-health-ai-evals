card:
  task: Answer adversarial palliative-care questions and paired counterfactual scenarios that probe bias related
    to ethnicity, age, and diagnosis.
  items_built: PCAD contains 100 adversarial questions and 84 paired counterfactual scenarios targeting access to
    care, pain management, advance care planning, and place of death preferences across ethnicity, age, and diagnosis.
  example: ''
  scoring: Three palliative care experts evaluated responses using validated bias rubrics, and results were reported
    as pooled bias rates.
  judge: Three palliative care experts in Canada and the United Kingdom assigned the ratings.
  scale: Pooled bias rate with 95% confidence intervals.
  validation: ''
  results: 'GPT-4o had a pooled bias rate of 0.33 (95% CI: 0.26, 0.40) on adversarial questions and 0.26 (95% CI:
    0.20, 0.32) on counterfactual scenarios.'
