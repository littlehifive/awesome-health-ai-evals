  extracted: 2026-10-26
  read_full_text: true
  confidence: high
  notes: "LREC-COLING 2024 paper, first posted on arXiv in 2023. Veracity labels and explanations were written by the portal's medical team (Cochrane Austria); two of the authors annotated evidence sentences (Cohen's kappa 0.72 on 50 documents). 423 of 750 claims are not enough information. License is CC BY-NC-ND 4.0 per the GitHub README; the GitHub API reports no license for the repo itself. Rater country is the portal's, assumed from Cochrane Austria. A fact-checking dataset that predates LLM chatbot evaluation; included because it is used for health-claim verification by LLMs."
