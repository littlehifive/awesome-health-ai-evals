  notes: "Attributes (scenario counts) are protocol focus 3, fairness 6, risk aversion 8, continuing care 12, moral desert 12, utilitarianism 21. Labels were assigned by the scenario author and reviewed by at least one other researcher; scenario authors are not described as clinicians, so item_provenance clinician_written is approximate. The data is a JSON file in the repo (data/); the Apache-2.0 license is the repo's. Authors are at Kitware, Raytheon BBN, and Kairos Research (a DARPA-style defense triage context is implied, not stated). Evaluates decision alignment rather than medical knowledge, hence the safety section."
