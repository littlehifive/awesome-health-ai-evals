  notes: "Read the arXiv HTML text (paperclip not used). The paper says the benchmark harness is released under Apache-2.0 at an anonymized 4open.science link; the Apache-2.0 license is stated for the skill registry and benchmark harness, and I did not see a data download or a license for the question set itself, so open_data is unknown. Gold answers are machine-extracted from database records and question text was written by Claude Opus 4.7; there was no pharmacist re-annotation. The paper also evaluates on drug-related subsets of MedQA and PubMedQA, which are not part of DrugAudit. Intended users are inferred from the paper's clinician framing. Lead institution is University of Florida (first author); second affiliation is University of Macau."
