id: drugaudit
name: DrugAudit
kind: benchmark
year: 2026
summary: 3,772 drug-information questions built from nine drug and pharmacovigilance databases (ChEMBL, DrugCentral, FAERS, Orange Book, openFDA Label, LiverTox, PharmGKB, SIDER, multi-source), scored by answer correctness, source authority match, snippet overlap, and citation faithfulness with two LLM judges.
