id: five-axis-mental-health-ai-eval
name: Five-axis mental health AI evaluation framework
kind: eval_framework
year: 2026
summary: A framework with five axes (protocol fidelity, hallucination risk, behavioral consistency, crisis safety, demographic robustness) for judging LLM therapy agents, demonstrated on 250 Prolonged Exposure scenarios and 146 CBT exercises with a three-judge LLM panel.
