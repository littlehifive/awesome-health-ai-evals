  notes: "BioNLP 2026 paper. The dataset is mainly built to fine-tune the IndicMedLM model; the benchmark use is diagnostic accuracy (a GPT judge maps free-text outputs to the 12 disease labels) plus medical-expert review. The paper says the dataset is released on GitHub, but the repository URL returned 404 when checked, so open_data is unknown and no license is recorded. Record r_5c37e8eaa4 has the wrong title (a NeoBERT dementia paper) but carries the IndicMedDialog abstract. Lead countries: UAE (University of Birmingham Dubai) and India."
