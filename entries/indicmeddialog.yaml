card:
  task: Conduct a multi-turn patient consultation, ask follow-up questions to collect symptoms, and provide a final
    disease diagnosis.
  items_built: The authors augmented the template-based MDDial corpus with 1,101 consultations generated by Llama-3.3-70B-Versatile,
    producing 2,980 English dialogues covering 12 diseases and 118 symptoms. TranslateGemma translated these into
    nine Indic languages, yielding 29,800 instances; script-aware corrections and independent review of sampled
    translations by two native speakers per language checked linguistic quality and clinical safety.
  example: ''
  scoring: ChatGPT 5.3 maps each free-text diagnosis to one of 12 canonical disease labels or NULL, and diagnostic
    accuracy is the percentage matching the gold labels, with NULL counted as incorrect. Medical practitioners independently
    rate sampled generated dialogues, reporting mean quality ratings and the medical safety pass rate.
  judge: ChatGPT 5.3 maps diagnoses to labels, and three MBBS-qualified medical practitioners currently in postgraduate
    training rate dialogue quality and safety.
  scale: Diagnosis correct or incorrect, reported as percentage accuracy; expert criteria rated 1-5 and averaged,
    with safety reported as a binary pass rate.
  validation: Medical experts' ratings had an average Krippendorff's alpha of 0.81.
  score_meaning: For expert quality ratings, 1 means Very Poor and 5 means Excellent, so higher averages indicate
    better-rated dialogues. Translation Quality measures linguistic accuracy and fluency relative to the English
    source, while Clinical Safety checks medical appropriateness and freedom from harmful or culturally insensitive
    content.
  annotation_process: Two native speakers per language independently rated a sampled subset of translated and post-processed
    dialogues on Translation Quality and Clinical Safety using a 10-point scale, resolving disagreements through
    discussion. The medical experts reviewed a randomly sampled subset of system-generated dialogues.
  results: IndicMedLM achieved the best post-processed diagnostic accuracy in 7 of 10 languages, including 80.85%
    in English, 72.76% in Hindi, 68.51% in Marathi, and 58.72% in Bengali. Its medical safety pass rate was 95.3%.
  limitations: The authors state that the synthetic-to-real dialogue gap remains unquantified, coverage is restricted
    to 12 diseases without multi-label cases, and training for only 300 steps with a 128-token output limit may
    constrain performance.
  sources:
  - https://arxiv.org/abs/2605.13292
