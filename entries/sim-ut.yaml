  notes: Authors at UserTrace, Cliniva, hearX Foundation, University of Pretoria, Respira Health and Turn.io; the first and last author's country is not stated, so lead_institution_countries is UNKNOWN. The paper says SIM-UT and its test and benchmark datasets will be released as open source in future work, so nothing is released yet. Main finding is de-escalation sycophancy. Personas and rubrics were built per deployment with the deployments' clinical leads. Hindi was typed in Latin script by many users.
