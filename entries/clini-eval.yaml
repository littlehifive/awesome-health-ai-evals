year: 2025
summary: An LLM-based evaluation method for simulated clinical interview dialogues, with a metric system (history mastery with 16 sub-metrics, interviewing technique with 8 more, customized inquiry) and a two-phase Demo2Eval procedure, part of the CliniChat framework.
