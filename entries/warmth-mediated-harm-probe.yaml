id: warmth-mediated-harm-probe
name: Warmth-Mediated Harm Probe for Speech-Enabled LLMs
kind: benchmark
year: 2026
summary: A 7-turn scripted mental-health disclosure probe grounded in WHO guidelines across nine presenting conditions (38 scripts), run in audio and text to score warmth, parasocial commitment and role claims in speech-enabled models, plus acoustic prosody analysis.
