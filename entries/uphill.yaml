  notes: "Read the paper PDF and the project README. Queries are generated from claims by templates and an LLM at five presupposition levels (neutral to writing demand); factual accuracy and consistency are judged with an entailment model validated against crowd annotations (600 claim-response pairs, 3 annotators each). Data is on a Google Drive folder linked from the README; the repo shows no license. item_provenance values are approximate: claims come from fact-checking websites via PubHealth and Monant (recorded as web_forum for lack of a closer value), queries are generated. Evaluated InstructGPT, ChatGPT, GPT-4 and Bing Copilot."
