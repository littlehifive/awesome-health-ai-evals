  notes: "Imperial College London (Kotonya and Toni). A claim-verification dataset rather than a chatbot benchmark; included as health-misinformation evaluation. Scoring is classification accuracy and F1 plus ROUGE for explanations, with human evaluation of explanation coherence by five annotators. Items are filtered to biomedical claims. MIT is the license on the Hugging Face card and GitHub repo. Not the same as PubHealthBench (a separate entry)."
