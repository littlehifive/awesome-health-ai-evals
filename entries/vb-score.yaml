summary: "A component-wise metric for medical question answering that weights entity F1 (30%), semantic similarity (30%), factual consistency (25%) and structured overlap (15%) against authoritative references, demonstrated on 59 public-health QA pairs from CDC, WHO, NHS and Mayo Clinic pages."
