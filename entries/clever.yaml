id: clever
name: CLEVER
kind: eval_framework
year: 2025
summary: A blind, randomized, preference-based method in which practicing physicians compare model outputs on factuality, clinical relevance, and conciseness, demonstrated on 500 newly written cases across clinical summarization, information extraction, biomedical research QA, and open-ended medical QA.
