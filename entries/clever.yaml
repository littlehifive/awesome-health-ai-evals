  notes: "From John Snow Labs; the paper compares GPT-4o against the company's two healthcare-specific models, so the authors have a commercial interest. The three records are the JMIR AI paper (r_5e303d0180), its JMIR preprint (r_6f388ee5df), and a Research Square preprint (r_fb9a2f9642). No release of the 500 cases was found in the paper; it points to a John Snow Labs marketplace page for CLEVER, so open_data is unknown. GPT-4o was also used as a ranking judge in a side comparison with the physicians. Rater countries are not stated."
