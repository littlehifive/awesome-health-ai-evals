id: medical-ai-security-framework
name: Practical Framework for Evaluating Medical AI Security
kind: eval_framework
year: 2025
summary: A proposed low-cost framework for testing medical LLMs against jailbreaks (role-play, authority impersonation, multi-turn manipulation) and privacy extraction across specialties ranked by clinical risk, using synthetic patient records and attack-success-rate scoring.
