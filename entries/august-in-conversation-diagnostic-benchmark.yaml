id: august-in-conversation-diagnostic-benchmark
name: August In-Conversation Differential Diagnosis Benchmark
kind: eval_framework
year: 2024
summary: A benchmarking method that turns 400 clinical vignettes (from Hammoud et al.) into LLM patient actors that converse with a health chatbot, scored by physician judges on top-1 and top-2 diagnostic accuracy, specialist referral accuracy, and number of questions asked.
