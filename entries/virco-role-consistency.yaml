  notes: "Technische Hochschule Nurnberg. Extends the authors' earlier VirCo work, which supplied the seven personas and conversations. The model being tested plays the client; the users are counselor trainees (no schema value fits, see intended_users). The paper presents the test set as a contribution but gives no link or release statement, so open_data is unknown. Item languages are German per the paper's footnote, though the evaluated model is Vicuna and other open-source LLMs."
