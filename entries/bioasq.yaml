  notes: Merges the BioASQ 2021 challenge overview (r_912fe3293b, abstract empty, not read) and the 2023 Scientific Data paper on the BioASQ-QA corpus (r_b51664fec8, read in full). BioASQ also has a semantic-indexing task (Task A) that is out of scope. Challenges started in 2012-2013; year is the first challenge year. The Zenodo license and the total question count were not read, and the data may be provided under BioASQ registration terms. Gets heavy use in LLM evaluation (for example as a source in other medical benchmarks).
