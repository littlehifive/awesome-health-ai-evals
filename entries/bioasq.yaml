card:
  task: Answer each English biomedical research question with an exact answer where applicable and a paragraph-length
    summary, and return supporting articles and snippets.
  items_built: Twenty-one biomedical experts, seven of them most active, created 4,721 questions and answers from
    information needs encountered in their work, adding around 500 questions annually and selecting supporting MEDLINE
    articles and snippets through PubMed searches. Experts discard questions without adequate evidence and refine
    reference answers and supporting material after reviewing participating systems' responses.
  example: '"Which virus is best known as the cause of infectious mononucleosis?"'
  scoring: Exact answers are compared automatically with expert reference answers; yes/no questions use macro-averaged
    F1, with accuracy also reported. Each question's author rates summary answers from 1 to 5 for information recall,
    information precision, information repetition and readability, and average manual scores are reported.
  judge: Automatic comparison grades exact answers, and the biomedical expert who wrote each question grades its
    summary answers.
  scale: 'Summary answers: 1 (very poor) to 5 (excellent) on four criteria, reported as averages; yes/no answers:
    macro-averaged F1 and accuracy.'
  validation: ''
  score_meaning: Information recall measures whether the answer includes all necessary information, while information
    precision measures whether it contains only relevant information. Information repetition measures whether it
    avoids repeating information, and readability measures whether it is easy to read and fluent.
  annotation_process: Experts were selected from European universities, hospitals and research institutes to cover
    medicine, biosciences and bioinformatics. Regular in-person and virtual meetings trained experts on the annotation
    and assessment tools, question types and information sources, with ongoing support for issues arising during
    assessment. After each challenge round, experts reviewed system responses and could revise or enrich their reference
    answers and supporting material using information found by the systems.
  results: ''
  limitations: The authors note that changing vocabularies and databases complicate the dataset, and articles published
    after a question's annotation may contain relevant evidence missing from its reference material.
