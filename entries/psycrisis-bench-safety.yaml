id: psycrisis-bench-safety
name: PsyCrisis-Bench
kind: benchmark
year: 2025
summary: 608 Chinese user utterances expressing suicidal ideation, self-harm, or existential distress, taken from existing counseling datasets, with a reference-free LLM-as-judge protocol that scores model replies on five expert-defined binary safety dimensions.
