  notes: "The repository README (titled PsyCrisis-Protocol) states CC BY-NC 4.0 and 608 samples; GitHub's license detector reports NOASSERTION, so the README badge is the source. open_data is open because the repo is public and lists the dataset, but I did not open the data files. Six professionals scored 800 GPT-4o and DeepSeek-R1 responses for judge validation. First and last authors are both at HKUST (Guangzhou), China; co-authors are also at Wuhan, Iowa, and Manchester. Distinct from PsyCrisisBench (hotline transcripts, record r_aa00f27f57), which dedup grouped with this one by name."
