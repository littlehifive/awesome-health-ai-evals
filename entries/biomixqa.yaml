  notes: "UCSF (Baranzini lab) with UCSD and other co-authors. The paper (KG-RAG, a SPOKE knowledge-graph retrieval method) uses these datasets to test it; the Hugging Face card names the released set BiomixQA. Content is knowledge-base facts (gene-disease, drug-disease), closer to biomedical research knowledge than patient-facing questions, so scope is borderline. Counts are from the paper (311 T/F, 306 MCQ); the card says fewer than 1,000 rows. The arXiv ID was found by title and not read from the record."
