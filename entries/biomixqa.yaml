id: biomixqa
name: BiomixQA
kind: benchmark
year: 2024
summary: A biomedical question set of 306 five-option multiple-choice and 311 true/false questions on diseases, genes, and drugs, built from knowledge bases (Monarch, ROBOKOP, DisGeNET, MONDO, SemMedDB) and reviewed by domain experts, released to test KG-RAG.
