id: eval-ugib
name: EVAL (Expert-of-Experts Verification and Alignment) for UGIB
kind: eval_framework
year: 2025
summary: A framework that ranks LLM configurations and screens individual answers on upper gastrointestinal bleeding management, using expert golden-label answers, embedding similarity (fine-tuned ColBERT), and a trained reward model, with three small UGIB question sets (13 expert questions, 40 ACG MCQs, 117 simulation questions).
