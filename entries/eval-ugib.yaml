card:
  task: Answer questions about upper gastrointestinal bleeding management in free text or by selecting a multiple-choice
    answer.
  items_built: The datasets contain 13 expert-curated questions with independent reference answers from five experts,
    40 UGIB questions selected from American College of Gastroenterology board preparation tests, and 117 questions
    generated by clinical providers during medical simulation. The framework was developed using expert reference
    answers and human-graded model responses.
  example: ''
  scoring: TF-IDF, Sentence Transformers and fine-tuned ColBERT compare model responses with expert reference answers,
    and average similarity scores rank configurations. Human graders assess whether answers are entirely accurate,
    directly relevant and complete, with results reported as percentages correct; a reward model trained on binary
    human grades predicts each answer's probability of being good and can select the highest-scoring of five candidate
    answers.
  judge: Two independent gastroenterologists with a third expert tiebreaker grade standard free-text responses,
    four medical experts grade temperature-varying responses by majority vote, two reviewers check MCQs against
    reference answers, and a trained Grader Model assigns automated accuracy scores.
  scale: Human grades are 0 or 1, reported as percentage correct; similarity scores are averaged; the reward model
    outputs the probability that an answer is good.
  validation: Fine-tuned ColBERT scores correlated with performance at Spearman ρ = 0.91 for expert questions, 0.86
    for ACG MCQs and 0.81 for simulation questions, all p < 0.001. Reward-model agreement with human grades was
    87.9% internally on RAG-GPT-4 and 81.8% externally on SFT-GPT-4o; human graders required a tiebreaker for 6.6%
    of expert-question responses and 9.5% of simulation-question responses.
  score_meaning: Higher scores indicate better performance across all metrics. Reward-model alignment is the percentage
    of answers for which its label matches the human grade, rather than the percentage of answers that are correct.
  annotation_process: 'Five expert-of-experts independently supplied free-text reference answers through Qualtrics.
    Human grading was blinded: expert-question responses generated at temperature 0.8 were checked against clinical
    guidelines and expert answers, while simulation responses were checked against established clinical guidelines.
    The Grader Model was trained using Meta''s OPT-350M and previously human-graded answers to the expert-generated
    questions.'
  results: SFT-GPT-4o was selected as the best configuration by human grading and embedding similarity, but its
    overall benchmark score is not given in the excerpts. Practicing ACG physician test-takers averaged 75% correct
    on the 40 MCQs.
  limitations: The authors report that a gap persists between reward-model accuracy and human grading on the real-world
    question dataset.
