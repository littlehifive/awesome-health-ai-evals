id: sim-vail
name: SIM-VAIL
kind: eval_framework
year: 2026
summary: A framework that pairs LLM-simulated users (30 profiles, each a psychiatric vulnerability crossed with a conversational intent) with consumer chatbots and scores each turn on 13 clinically grounded risk dimensions, run over 810 conversations.
