  notes: "Built on the open-source Petri auditing harness; an LLM alignment judge scores 39 dimensions, of which 13 mental-health dimensions were chosen by three psychiatrists. Data (synthetic transcripts and scores) and code are in the GitHub repo, MIT license per the paper's data and code statements. The 27 clinician annotators were 24 UK-based and 3 US-based. Published in Nature Medicine per the DOI (not checked at the journal site)."
