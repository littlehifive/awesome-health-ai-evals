  notes: "Read the ACL Anthology PDF (CL4Health workshop at LREC-COLING 2024) and the GitHub README. The repo is GPL-3.0 and holds the extracted leaflet sections, the QA pairs with sources, and annotation responses; the full leaflets are not included. Questions are LLM-generated (GPT-3.5-turbo-instruct) and the covered content includes administrative as well as medical procedures. Evaluation uses ROUGE and similar metrics plus pass/fail for unanswerable questions; exact metrics were not itemised. Counts reported in the paper are inconsistent across sections (annotation set sizes), so size is approximate."
