  notes: "Explanations come from the official exam solutions. Three Peking Union Medical College doctoral students checked 320 samples (99.4% label and 99.0% explanation accuracy). Scoring is accuracy plus ROUGE on explanations, with human and GPT-4 ratings on five criteria (well-formedness, support, correctness, validity, novelty) for a few models. No license found in the paper or the repository metadata. The Hugging Face field in the screening record was empty."
