  notes: "Half the requests were written by prompting GPT-4 and half by jailbreaking Llama-2-7b-chat; safe responses come from GPT-4. A 25-doctor user study validated the requests. The harmfulness score is a 1 to 5 rating by GPT-3.5. NeurIPS 2024 Datasets and Benchmarks. Two Hugging Face copies are merged as mirrors: israel-adewuyi/med-safety-bench-reproduced (MIT tag) and Machlovi/Medsafety_test (900 rows of prompt, safe_response, prompt_label; no card, so its identity as the MedSafety-Eval split is inferred from size and content)."
