id: medsafetybench
name: MedSafetyBench
kind: benchmark
year: 2024
summary: 1,800 harmful medical requests with safe reference responses, written to violate the nine AMA Principles of Medical Ethics, split into a 900-item evaluation set and a 900-item fine-tuning set, with LLM-judged harmfulness scores.
