  notes: "Built for vision-language model evaluation; text-only and with-images results are reported separately and a paired image-removal audit is included. The paper says JMed48k is released but gives no repository or dataset link and no license, so open_data is unknown. Lead institutions: first author at The Hong Kong Polytechnic University (coded HKG), last author at the University of Tokyo. Exam professions: physician, dentist, pharmacist, nurse, public health nurse, midwife, physical therapist, occupational therapist, orthoptist, radiological technologist, clinical laboratory technologist."
