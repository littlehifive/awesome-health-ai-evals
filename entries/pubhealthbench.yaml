  notes: "Dataset card states CC-BY-4.0, with source-chunk columns remaining under the Open Government Licence v3.0. Human experts reviewed a sample of 800 questions and five non-specialists took sample tests as a human baseline (with search access, no AI). The card warns that some questions may be erroneous or out of date. A follow-up paper (arXiv 2607.06641, Healthier LLMs, r_0e7092c0ca) adds a retrieval-augmented setting and a four-criterion rubric LLM judge (faithfulness, completeness, factual consistency, clarity; validated on 100 responses double-annotated by humans) for the 760-question free-form subset; no new dataset or code link was seen in the text."
