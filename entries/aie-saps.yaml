id: aie-saps
name: Automatic Interactive Evaluation (AIE) with State-Aware Patient Simulator
kind: benchmark
year: 2024
summary: A multi-turn doctor-patient simulation framework for LLMs with a state-aware patient simulator, tested on 50 real hospital cases and 150 cases from public medical exam datasets, scored by automatic metrics, GPT-4, and human raters.
