  notes: "r_ea5223babe is the Nature Health version and r_8cbe6ce957 the Research Square preprint of the same work; the arXiv version (2508.00923) was read in paperclip. The Hugging Face card says the released data are initial seeds that the agents mutate on request; the dynamic mutation agents are the core of the method, and no code repository was found. The card's licensing section is mixed (privacy suite CC-BY-4.0 or CC-BY-NC-4.0; bias and hallucination suites adapted from other sources), and the card header says MIT. Evaluation of responses is done by LLM agents; the exact judge setup was not checked."
