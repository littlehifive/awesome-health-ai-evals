  notes: "Only the GitHub README was read; there is no paper. It is a compilation built to evaluate the Llama3-ELAINE-medLLM models, reusing the test splits of existing benchmarks under their own licenses (MIT, Apache-2.0, CC-BY-NC-SA-4.0), so the repository's MIT license (seen on GitHub) does not cover all data and license is left null. Lead country is from the releasing organization (aistairc, an AIST research group in Japan), which is inferred from the repository owner name. Included rather than excluded as a mirror because it adds DenQA and a multilingual harness."
