  notes: "The paper gives a GitHub link (the mGIPsim simulator repo) for code and data but also says the benchmark, testbed, and scripts will be released upon publication, so open_data is unknown; check whether the benchmark is actually in that repo. Questions are generated from templates, not written by people; the reasoning chains were labeled by the authors, who include time-series, cybersecurity, NLP, and diabetes-care experts. Metrics include symmetric MAPE, accuracy, and affinity F1. Authors are at NTU Singapore, Mayo Clinic, NUS, Manchester, and Imperial College London."
