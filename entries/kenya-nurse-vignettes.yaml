  notes: "Record r_dd766fa13b (EPIC 2025 proceedings, 'Co-designing a Large Language Model Benchmarking Dataset for Primary Care with Nurses in Kenya', 7,606 scenarios) is the ethnographic companion paper for the same dataset and was merged here on review; it was not read in full. Read via paperclip (medRxiv preprint 10.1101/2025.10.25.25338798, same work). The paper reports two pool sizes (7,606 source scenarios in Methods; 5,107 in the abstract); not reconciled. The GitHub repo (MIT, Zenodo 10.5281/zenodo.17340120) holds expert ratings for the 507 vignettes and a prompt-responses file; whether it includes all 7,606 source scenarios was not checked. The license is the repository license. Rubric adapted from existing medical-AI evaluation frameworks. Scored by six Kenyan family physicians, blinded to response source. Authors from KEMRI-Wellcome (Kenya), PATH, University of Birmingham, LSHTM."
