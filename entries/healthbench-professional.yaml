  notes: "Companion to HealthBench; not an official subset. About one third of examples come from deliberate red teaming; difficult examples were up-weighted about 3.5x. The paper and card do not state the item language; English is assumed from the examples shown, so check. Download is via the Hugging Face card (MIT) and an assets.zip link in the paper. The writing-and-documentation use case sits partly outside the catalog scope, but care consults and research questions are in scope. A small private held-out set is retained by the authors."
