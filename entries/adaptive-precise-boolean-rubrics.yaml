id: adaptive-precise-boolean-rubrics
name: Adaptive Precise Boolean rubrics
kind: eval_framework
year: 2025
summary: A rubric method that replaces Likert scales with granular yes/no questions, filtered per query and response, for scoring LLM answers to personalized metabolic-health queries from wearable and blood-biomarker data.
