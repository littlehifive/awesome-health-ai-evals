id: kazakhstan-protocol-alignment
name: Protocol-Based and Cross-Linguistic Evaluation Framework (Kazakhstan women's health)
kind: eval_framework
year: 2026
summary: A master's-thesis framework that checks whether AI health advisors match Kazakhstan's official obstetrics and gynecology clinical protocols, using 84 protocols, 15 protocol-derived clinical questions in English and Russian, and entity-level (precision, recall, omission, hallucination, Jaccard) plus embedding-similarity metrics; tested on four systems.
