card:
  task: Select the correct answer from four options for each healthcare exam question, or generate a free-form answer
    in the open-ended version.
  items_built: Lucia Urcelay Ganzabal and Pablo Bernabeu Pérez curated expert-written government exam PDFs through
    automatic extraction and manual review, excluding image-based, annulled and incorrectly parsed questions. GPT-4-0314
    translated the questions into English, and Qwen2.5-72B-Instruct rephrased them into open-ended questions; 10
    annotators reviewed 360 samples with at least three reviewers per sample, and feedback-driven revision and filtering
    left 2,769 open-ended items.
  example: '"What is the primary function of Leydig cells in the synthesis of testosterone?"'
  scoring: Closed-ended answers are compared with the correct option and reported as accuracy. Open-ended evaluation
    uses reference-answer overlap through BLEU and ROUGE, semantic similarity through BERTScore, BLEURT and MoverScore,
    reference-text prediction through perplexity metrics, and response grading by Prometheus.
  judge: Closed-ended scoring uses the answer key; open-ended scoring uses automatic metrics and the Prometheus
    model.
  scale: Closed-ended items are correct or incorrect, reported as accuracy; open-ended results use metric-specific
    scales.
  validation: ''
  score_meaning: ''
  annotation_process: For dataset validation, 10 annotators reviewed 360 randomly selected samples, with at least
    three annotators reviewing each sample; the same protocol was used for translations and open-ended rephrasings.
    Reviewer feedback led to a second rephrasing round and the removal of 961 questions with multiple valid answers.
    In a separate scoring-consistency experiment, the researchers generated and evaluated 11 responses per CareQA-Open
    prompt using top_p sampling with p = 0.9.
  results: ''
  limitations: CareQA has no formal bias assessment, may not represent all medical knowledge or patient demographics,
    and can contain parsing, translation or rephrasing errors, while its open-ended version lacks thorough healthcare-expert
    evaluation and covers fewer questions.
