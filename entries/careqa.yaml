  notes: English closed version translated with GPT-4; open-ended version rephrased from the closed one with Qwen2.5-72B-Instruct, with human review by 10 evaluators. The paper also proposes the Relaxed Perplexity metric. Record r_e172cec88e (a Chinese elderly-care QA dataset also named CareQA, 41,694 QA pairs, BIBM 2024) is a different dataset with no release link found, and is not included here.
