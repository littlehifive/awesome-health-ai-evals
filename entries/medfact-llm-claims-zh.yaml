card:
  task: Classify each Chinese medical claim using its supplied evidence as supported, partially supported, refuted,
    uncertain, or not applicable.
  items_built: The authors sampled 1,500 webMedQA questions across 23 medical topics, generated answers with Yi-Large-Turbo,
    and used DeepSeek-V2.5 to extract and screen claims, retaining 7,409 claims from 1,321 questions after manual
    checks. Evidence came from the top three Google Search results per claim, processed by GLM-4-Long, whose preliminary
    labels were reviewed and refined by two trained undergraduate annotators with medical backgrounds.
  example: '"The normal range for aspartate aminotransferase (AST) is typically between 8-40 U/L."'
  scoring: Predicted labels are compared with the dataset's reference labels, and F1 scores are averaged equally
    across the five classes to produce macro-F1, the primary ranking metric. Accuracy, macro precision, macro recall,
    and per-class F1 are also reported.
  judge: Exact match with reference labels initially generated by GLM-4-Long and reviewed by two trained undergraduate
    annotators with medical backgrounds.
  scale: Five categorical labels per claim; final macro-F1 across the five classes.
  validation: A third annotator reviewed 200 randomly selected samples from each of the two annotators, yielding
    Cohen's kappa of 81.54%. Human checks of decomposition and claim extraction on 100 questions reported 100% accuracy.
  score_meaning: Supported means the evidence fully supports the claim; Partially Supported means it supports only
    part, with uncertainty or uncovered details; Refuted means the evidence contradicts the claim. Uncertain means
    the evidence is related but cannot confirm or refute the claim, while Not Applicable means the evidence is completely
    unrelated.
  annotation_process: Annotators reviewed and refined the preliminary labels using a platform based on Label Studio.
    The student annotators were hired and paid according to agreed salaries and workloads.
  results: GLM-4-32B achieved the highest model macro-F1 of 46.81%, while Qwen3-4B led the fine-tuned models at
    44.65%. Human performance was 77.02% macro-F1 on a sample of 2,000 claims.
  limitations: The authors identify the restriction to Chinese questions from webMedQA and the imbalanced label
    distribution as limitations.
