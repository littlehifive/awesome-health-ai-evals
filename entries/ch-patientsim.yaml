  notes: Real data come from 150 gastroenterology outpatients; the rest were generated by LLMs with few-shot prompting and then manually verified. The paper says the dataset is available at github.com/SerajJon/MSPRP, but on 2026-10-26 that repo held only a README with a title and no data; check availability. Scoring uses BLEU, ROUGE, METEOR, BERTScore and an LLM judge on a 1-5 scale. No license is stated. The paper also proposes the MSPRP method, which is not part of this entry.
