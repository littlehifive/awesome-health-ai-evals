card:
  task: Select the preferred counselor response from a pair or select the best response from a reference response
    and four negative alternatives, using the counseling context.
  items_built: The authors constructed 13,893 prompts from 118 screened six-session CBT cases drawn from the American
    Psychological Association website, CBT textbooks, and DiaCBT, compressing earlier dialogue into summaries. Original
    counselor responses became preferred answers, while ten LLMs generated subtly harmful alternatives across 21
    negative experience categories; trivially poor pairs were discarded, and three licensed CBT practitioners checked
    200 sampled pairs.
  example: ''
  scoring: A pairwise judgment is correct when the reward model scores or selects the reference response above the
    rejected response; a Best-of-N judgment is correct when it selects the reference over all four negative alternatives.
    Accuracy is calculated for each task, and the leaderboard ranks models by the average of pairwise and Best-of-N
    accuracy.
  judge: Selections or reward scores from the model under test are compared with the benchmark's designated reference
    answers.
  scale: Correct or incorrect per item; percentage accuracy for each task and their average.
  validation: On 200 sampled pairs, three licensed CBT practitioners selected the designated preferred response
    in 86%, 92%, and 94% of cases; all three agreed on 84%, and majority vote matched the labels on 96%. PRMB rankings
    correlated with downstream response-quality rankings at Spearman's ρ = 0.700 (p ≈ 0.036), using average BERTScore
    across four policy models.
  score_meaning: Higher accuracy indicates better recovery of preferences anchored in original CBT counselor utterances
    over responses with deliberately introduced negative counseling behaviors. It does not measure whether a model
    can identify every possible high-quality counseling response.
  annotation_process: Preferred responses were taken from the original counseling cases, while ten LLMs generated
    negative alternatives through targeted prompting based on 21 client-reported negative experience categories.
    In the human validation sample, practitioners selected their preferred responses independently, with no ties
    allowed; their majority vote was compared with the benchmark labels.
  results: ''
  limitations: The authors acknowledge that reference-based choices do not capture all valid therapeutic strategies
    and that BERTScore, used for downstream validation, does not fully capture therapeutic appropriateness.
