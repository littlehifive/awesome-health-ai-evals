card:
  task: Generate a doctor's reply to a patient's medical query using the consultation description and preceding
    dialogue.
  items_built: The authors crawled patient-doctor consultations from icliniq.com and healthcaremagic.com for English
    and haodf.com for Chinese, retaining descriptions of patients' conditions and dialogue turns. The preprint reports
    257,454 English consultations from 2008 to 2020 and 1,145,231 Chinese consultations from 2010 to 2020; it does
    not describe checks on the collected consultations.
  example: I get mild left-sided chest pain with low Hb and vitamin B12 levels. Please help.
