  notes: "Read the ACL Anthology abstract, the arXiv abstract page, and the Hugging Face dataset card; the full paper was not read. The arXiv preprint (2004.03329) and the EMNLP version report different dataset sizes (preprint: 1.1M Chinese and 0.3M English conversations; the Hugging Face card lists 1.9M Chinese and 0.23M English raw dialogues); sizes above follow the EMNLP abstract. The card gives license as unknown and says copyright belongs to the source websites, so license is null. Pre-LLM resource: baselines are Transformer, GPT, and BERT-GPT dialogue generators; the metrics used were not checked. The GitHub repository returned 404 when checked, so the code link comes from the dataset card and arXiv abstract. Lead-institution country (UC San Diego) comes from the arXiv author list and was not verified against the PDF."
