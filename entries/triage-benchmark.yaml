  notes: "Also published as a peer-reviewed article in Scientific Reports 2025 (r_f097e17401, CC BY 4.0, data availability statement links the GitHub repo and HF dataset); the journal version has the same 87 items and the entry venue is left as preprint from the first record. Scored as correct or incorrect triage category, with errors split into overcaring, undercaring, and instruction-following. The HF dataset NLie2/TRIAGE exists (CSV, n<1K) but has no card, so no license was seen. Lead institutions are King's College London (UK) and the Medical University of Vienna (Austria). The paper reports that the triage questions were public or shared with the original authors' consent. A second arXiv paper (2410.19753) that claims to introduce Triage and MedLaw benchmarks was withdrawn by arXiv for text reuse and is not used here."
