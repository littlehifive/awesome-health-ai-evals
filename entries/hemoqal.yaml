  notes: "The data availability statement points to the GitHub repository, which holds a CSV of question, context, and answer (91 rows); the repository has no license file and the repo README gives no license. The paper's main contribution is evaluating the quality of the generated Q&A (four domain experts plus 13 LLMs as raters; TF-IDF, Word2Vec, and BERT similarity), so it is closer to a dataset-quality study than a model-scoring benchmark; kept because the set is released with reference answers and stated aim of supporting LLM evaluation. Health area is hematology (rare disease), coded other_specialty."
