  notes: "Read the Hugging Face dataset card and the arXiv abstract page; the paper body was not read. The card says license 'other' with source-specific licenses (not blanket MIT or CC0; some sources are noncommercial) and links to a LICENSES/README. The dataset repackages existing benchmarks in a 'Jev' decision-model request format, so it sits near a mirror/compilation; it is kept because it adds its own robustness, abstention and probability-selection protocols. Five source-restricted subsets (MIMIC-derived and VitalDB) are withheld. It also includes numeric tasks (CTG fetal-state classification from 21 predictors). The card does not name the authors' institutions; the arXiv authors were not checked for affiliation. Task types are mainly choice or binary decisions with detached gold labels."
