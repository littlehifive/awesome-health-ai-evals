year: 2024
summary: An automated agent pipeline plus a dataset of about 800 to 1,200 LLM-generated medical questions (from Mayo Clinic, UpToDate and Reddit r/AskDocs pages) for checking whether the sources an LLM cites support its statements, with a clinician-annotated subset of 284 pairs.
