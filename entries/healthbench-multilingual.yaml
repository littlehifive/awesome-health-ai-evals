card:
  task: Respond to health questions from patients and clinicians in multi-turn conversations in the language of
    each item.
  items_built: The dataset machine-translates OpenAI's HealthBench, which contains 5,000 synthetic and adversarially
    generated conversations with no real patient data, into 32 languages alongside the English original. The source
    benchmark includes 48,562+ rubric criteria authored by 262 physicians across 60 countries; the card does not
    describe translation review.
