id: mindvoyager
name: MindVoyager
kind: eval_framework
year: 2025
summary: An evaluation framework with a client simulator whose openness and metacognition can be set, plus two metrics (Cognitive Diagram Exposure Rate, Induced Diagram Similarity Score) that measure how well an LLM therapist uncovers a client's unexpressed beliefs.
