  notes: "Health relevance was checked by few-shot FLAN-T5 classification; a 10% human check labeled about 80% of samples health-related. Scoring is accuracy for steerable questions, Jensen-Shannon distance for distributional questions, and value coverage judged by GPT-4 and humans for Overton. The data sit in the dataset folder of the GitHub repo (MIT license applies to the repo; no separate dataset license seen), so license is null. readme_section is safety as the closest fit for a values and fairness benchmark; a human may prefer another section. Source dataset names beyond the cited papers were not checked in the appendix."
