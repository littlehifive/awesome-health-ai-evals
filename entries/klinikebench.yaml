  notes: "Clinicians write persona and requirements with LLM help on narrative and formatting, then revise after inspecting live simulations. Strict pass@1 requires all four gates; diagnosis, tools and actions are checked by a verifier and must-ask coverage by an LLM judge. Thirty clinicians rated 50 dialogues for quality. The 35 authoring clinicians are from Canada and China. The Apache-2.0 license is on the training-code repo, not stated for the tasks, so license is null. Trajectory and SFT data on Hugging Face (anon-caa-neurips/KLINIKEBENCH-Trajectories) is training data and is not listed as a benchmark link. Last author at Microsoft (country not stated), so only the first author's country is coded."
