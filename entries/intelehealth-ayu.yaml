  notes: Added by hand on 2026-11-25 from the Global Health AI Benchmarks site, an initiative of The Agency Fund
    and Endless Health, so it has no screening record. Facts come from the benchmark's page on that site and the
    team's report PDF. The site says the complete datasets stay with each organisation. The report says a request
    form for the full dataset will be provided and may involve a licence and a non-disclosure agreement; no form
    was found on 2026-11-25, so open_data is closed. The judge code is in private repositories. The site says Llama4-Maverick
    was chosen for the first phase of the pilot and that MedGemma-27b-it now does better on top-1 accuracy; it does
    not say which model produced each headline number. Lead institution and rater countries are taken from where
    the programme and its doctors work.
