  notes: Added by hand on 2026-11-25 from the Global Health AI Benchmarks site, an initiative of The Agency Fund
    and Endless Health, so it has no screening record. Facts come from the benchmark's page on that site and the
    team's report PDF. The site says the complete datasets stay with each organisation. The report says nothing
    about a public release, so open_data is closed. What is benchmarked is mainly the LLM judge (nine candidate
    judges against four human labellers), not the model that writes the replies. The danger-sign reference labels
    come from Jacaranda Health's fine-tuned XLM-RoBERTa triage model, not from the labellers. The 'reply that would
    be sent' example on the site was written for the page and is not from the dataset. Rater country is taken from
    the site's reference to Jacaranda Health's Kenyan clinicians.
