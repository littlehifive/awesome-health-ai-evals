summary: 528 real questions texted by Kenyan mothers to the PROMPTS maternal health helpline in English, Swahili
  or a mix of the two, with the AI's replies scored by four Jacaranda Health staff on clinical safety, tone and
  cultural fit, and used to test nine LLM judges and their danger-sign detection.
