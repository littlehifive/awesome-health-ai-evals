summary: A suite of seven English medical QA datasets (MedQA, MedMCQA, PubMedQA, MMLU clinical topics, LiveQA, MedicationQA, and the new HealthSearchQA of 3,173 commonly searched consumer questions), with a human evaluation framework for long-form answers rated by clinicians and lay users.
