  notes: "Read the arXiv version (130 questions); the 314-question count comes from the Research Square abstract. Data availability: a 25-question subset is published in the paper appendix and the rest is available on request from the authors. Almanac is the RAG system under test; ClinicalQA is the dataset. Rubric has three axes (factuality, completeness, safety) plus preference; adversarial-prompt and omission safety tests used subsets. Not the same as the Korean snuh/ClinicalQA dataset or the existing challengeclinicalqa entry."
