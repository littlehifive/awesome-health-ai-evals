  notes: "Read the repo README, data README, annotation guidelines, and the head of the data CSV; the manuscript ('Evaluating Safety Boundaries of Large Language Models in Mental Health Risk Scenarios: A Benchmark Study', Wang and Moell, Uppsala University) was not found, so venue is grey_literature. Responses come from consumer web interfaces of ChatGPT-5.4, Claude Sonnet 4.6, and Gemini-3 (March to April 2026). Labels are by the study author, and the A4a re-evaluation was by the same author, so this is not independent inter-rater validation. No license file was seen. How the prompts were generated is not stated beyond 'synthetic'."
