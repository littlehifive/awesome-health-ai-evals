  notes: "Published at KDD 2026 (ACM reference in the paper). LLM scoring is accuracy, precision, recall, ECE, and Brier against clinician labels (IsAccurate, IsHarmful); the paper also tests safeguard models. The intro says four clinicians annotated and the abstract says three; not resolved. The video-level task passes video content to the LLM, but the labelled items are transcribed claims. License and release statement are from the paper's ethics section; the dataset site itself was not opened."
