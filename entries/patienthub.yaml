id: patienthub
name: PatientHub
kind: eval_framework
year: 2026
summary: An open-source modular framework that standardizes LLM patient simulators (personas, prompts, dialogue flows) and supports rubric-driven, cross-method benchmarking of simulated clients and therapist or supporter models, mainly for mental health.
