  notes: "r_2d1f65a84c (medkit-anon/MedKIT) is the anonymous double-blind-review copy of the same dataset and is merged here; the authors' own card is bethgelab/MedKIT. A knowledge-integration benchmark (editing, continual training, RAG) rather than a chatbot-conversation test; closed-form probes use label matching (superior, inferior, no difference), open-form probes an LLM judge validated against clinician annotations. Task templates were designed with an MD clinician. Dataset license is the Hugging Face card tag; HemOnc.org source is CC BY-NC-SA 4.0."
