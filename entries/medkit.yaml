summary: "6,196 oncology treatment-comparison updates from HemOnc.org (publications 1960 to 2026), each paired with seven probes (update, two lexical paraphrases, relational reversal, compositional, operational, locality) that test whether newly integrated clinical knowledge is usable, scored by label match and an LLM judge."
