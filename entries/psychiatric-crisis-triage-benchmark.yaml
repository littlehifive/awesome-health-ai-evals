  notes: "OSF preregistration (au27q) and its working project (gr8t9). The registration describes 48 vignettes and a rubrics file (adjudication_rubrics.json: ESI concordance with quadratic weighted kappa and macro F1, a G-0 to G-3 guardrail taxonomy, hallucination categories), but vignettes_benchmark.json held only 4 vignettes when read, so the full set may not be released yet. ESI v4 and the 988 hotline suggest a US setting, but no country is stated. Authors' institution and how vignettes and gold labels were produced are not stated beyond 'synthetic' and 'board-certified emergency psychiatrists'. License not stated."
