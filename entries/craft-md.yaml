summary: A framework that tests clinical LLMs on simulated doctor-patient conversations (patient-AI, grader-AI, expert checks) instead of static vignettes, using case vignettes across 12 specialties from MedQA-USMLE and public and private dermatology sets, with a live leaderboard.
