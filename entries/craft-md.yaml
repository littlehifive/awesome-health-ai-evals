  notes: "The screening record is the Nature Medicine paper (record title is the paper's title; the approach is named CRAFT-MD). The license is the MIT license on the GitHub repository and may not cover the third-party vignettes. Item origin is US (MedQA-USMLE, US sources); no rater countries stated. r_4584a17e18 is the medRxiv preprint (doi 10.1101/2023.09.12.23295399, Sept 2023); its Methods describe a 140-question dermatology set (100 public vignettes from the DermNet NZ quiz bank plus 40 written by three dermatology residents), simulated with doctor-AI, patient-AI and grader-AI agents, with data and code at the GitHub repo. Vignette count of the final Nature Medicine version not verified; the Nature page and repository README were read, not the full Methods. Year is from the repository's August 2023 preprint note."
