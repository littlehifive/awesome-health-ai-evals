card:
  task: Ask a simulated patient questions to gather a medical history and give a diagnosis, either freely or from
    supplied answer choices.
  items_built: 'The 2023 preprint used 140 dermatology cases: 100 four-choice questions from DermNet NZ quizzes
    and 40 written by three dermatology residents to cover different diseases. A senior dermatology resident reviewed
    all 140 vignettes without answer choices and classified whether each supported a single diagnosis, one most
    likely diagnosis, or several possible diagnoses.'
  example: ''
  scoring: GPT-4 compares the final diagnosis with the reference answer, accepting synonymous disease names and
    alternative acceptable diagnoses; free responses containing multiple diagnoses or no diagnosis receive zero.
    Diagnostic accuracy is averaged over cases and repeated trials, with each case run 10 times in the preprint;
    experts separately assess history completeness and patient language.
  judge: GPT-4 grades diagnoses, and three dermatology residents evaluate agent performance, with a senior resident
    assessing history completeness.
  scale: Correct or incorrect per diagnosis; mean diagnostic accuracy across cases and trials.
  validation: Across three free-response settings using 100 public cases, average Spearman correlation between GPT-4
    grading and three dermatology residents' judgments was 0.94 for GPT-4 experiments and 0.912 for GPT-3.5 experiments.
    Manual checking found one error in about 200 responses, below 0.5%, when classifying responses as single, multiple,
    or no diagnosis.
  score_meaning: History completeness records whether the conversation contains the important information from the
    case vignette needed to reach the correct diagnosis. Patient language is assessed for the presence of medical
    terminology rather than everyday language.
  annotation_process: 'Experts reviewed 120 multi-turn conversations, 60 generated by GPT-4 and 60 by GPT-3.5. For
    comparison with the automated grader, all three dermatology residents annotated the same 100 public cases in
    three free-response settings: static vignettes, multi-turn conversations, and multi-turn conversations without
    physical examination details.'
  results: For free-response cases with a single possible answer, GPT-4 achieved 68.4% accuracy on static vignettes,
    compared with GPT-3.5's 54.6%. Multi-turn conversation accuracy fell to 43.1% for GPT-4 and 46.8% for GPT-3.5.
