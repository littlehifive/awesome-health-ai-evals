id: patient-simulator-persona-evaluation
name: Patient-simulator persona evaluation (Verily)
kind: eval_framework
year: 2026
summary: A tunable LLM patient simulator (20 parameters for emotion, strategy and communication style) with evaluations of parameter adherence, clinical fidelity and realism, used to test how patient communication style shifts LLM triage accuracy on 1,164 clinician-graded cases.
