year: 2026
summary: 81 realistic over-the-counter dosing questions about adult acetaminophen and ibuprofen use (timing intervals, rolling 24-hour intake, combined medications, missing information), with manually annotated gold decisions, scored on decision correctness, consistency, explanation verifiability, and failure type.
