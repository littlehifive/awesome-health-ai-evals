card:
  task: Produce health information in response to a user as a generative-AI physician system.
  items_built: The framework is intended to assess health information generated by AI physician systems and was
    developed around the GAI-HIQ quality indicator system. It was validated using PedRespDial.
  example: ''
  scoring: Three specialized scoring agents assess quality dimensions using GAI-HIQ, and a referee arbitration mechanism
    detects and corrects evaluative anomalies.
  judge: Three specialized scoring agents and a referee assign and arbitrate scores; their model names are not given.
  scale: ''
  validation: Cronbach's alpha was 0.859, and retest reliability ICC ranged from 0.751 to 0.786. Human review found
    96.2% score-reason consistency and 88.5% score reasonableness.
  results: ChatGPT had the highest overall scores among three evaluated AI physician systems, but the abstract gives
    no numerical scores. DeepSeek had comparable interaction quality and scored higher on privacy and security,
    while ZOE scored lowest across all dimensions.
  limitations: ''
