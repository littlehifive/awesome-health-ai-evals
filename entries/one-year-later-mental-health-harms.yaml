id: one-year-later-mental-health-harms
name: Mental health harm taxonomy and multi-turn jailbreak evaluation (One Year Later)
kind: eval_framework
year: 2026
summary: A provisional eight-type harm taxonomy for LLMs in mental health contexts and a multi-turn adversarial protocol (scripted prompts across 16 DSM-5 conditions in four attack variants) scored on harm dimensions by an LLM scorer with human verification.
