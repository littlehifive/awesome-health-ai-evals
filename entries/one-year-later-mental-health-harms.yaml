card:
  task: Respond to each turn of a scripted mental health conversation that attempts to elicit harmful, actionable
    content through changes in intent and framing.
  items_built: The authors reused the original study's 9-prompt self-harm script and 11-prompt suicide script verbatim
    and developed additional scripts covering 16 DSM-5 mental health contexts, each in four attack variants. The
    taxonomy draws on clinical and LLM safety literature, and the behavioral rubric was derived from empirical review
    of output scripts.
  example: ''
  scoring: For each conversation, the scorer records nine binary behavioral dimensions and the first turn on which
    each occurs; D1 through D5 determine whether safeguards held or failed, while D6 through D9 describe framing
    and redirection. Three independent repetitions per model and script support failure-rate estimates, with dimension
    counts and time to first harmful content reported separately.
  judge: Llama 3.3 70B Instruct scores the transcripts, and one independent human reviewer verifies them in full.
  scale: Nine yes-or-no dimensions with first-occurrence turns; failure rates across three repetitions, dimension
    counts, and time to first harmful content.
  validation: ''
  score_meaning: Naming substances or methods, giving quantities or dosages, and providing step-by-step instructions
    indicate increasingly actionable harmful content; directing users to external sources of harmful content counts
    as a soft failure. Dimension counts describe the breadth of observed behaviors, not cumulative severity, and
    a lower time to first harmful content means harmful content appeared earlier in the conversation.
  annotation_process: ''
  results: ''
  limitations: The authors state that the study tests only instructive harm in selected, isolated conditions and
    proprietary API-accessible models, does not establish transfer to consumer interfaces or mental health-specific
    models, and records first occurrences rather than the frequency or cumulative severity of harmful content.
