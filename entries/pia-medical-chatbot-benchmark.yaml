card:
  task: Extract discussion points from medical consent documents or conduct prenatal-care dialogues that cover relevant
    topics, cite supporting material, and ask mandatory medical questions.
  items_built: Olha Solodovnyk developed the framework for prenatal-care consultations in the Patient Information
    Assistant project, using six German obstetrics consent documents and synthetic conversations generated by doctor
    and multi-persona patient agents. The repository includes gold-standard annotations and required medical questions,
    but does not describe how these were created or checked.
  example: ''
  scoring: Information extraction is evaluated with semantic matching and an adapted SUSWIR metric, while topic
    coverage uses SBERT semantics, Hungarian matching, and an LLM judge. Citation faithfulness uses strict and relaxed
    precision, and automated scripts verify mandatory questions; the README does not specify how scores are aggregated.
  judge: Automated evaluation scripts and an unnamed LLM judge assign scores.
  scale: Extraction precision, recall, F1 and adapted SUSWIR; topic hit rate and weighted critical recall; strict
    and relaxed citation precision; support coverage; strict and acceptable mandatory-question compliance.
