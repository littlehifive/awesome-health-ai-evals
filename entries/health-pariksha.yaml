name: HEALTH-PARIKSHA
kind: benchmark
year: 2024
summary: 749 patient questions (666 English, plus Hindi, Tamil, Telugu, and Kannada) sent to a cataract-surgery WhatsApp chatbot in India, with doctor-approved reference answers, used to compare 24 LLMs in a RAG setup on LLM-judged factual correctness, semantic similarity, coherence, and conciseness.
