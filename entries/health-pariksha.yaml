  notes: "Authors at Microsoft and the University of Washington; the paper does not name author countries, so USA is from the affiliations. Reference answers are GPT-4 RAG answers approved without edits by doctors, so GPT-4 is favored. Scoring is GPT-4o as LLM judge on four 0-2 metrics, with human checks on semantic similarity by native-speaker annotators from KARYA. The paper does not state a dataset release or license; open_data is unknown. Speech inputs were transcribed and translated to English before the bot saw them."
