  notes: "The repo's year is 2025 but the paper preprint (arXiv 2604.05051) is from 2026; year follows the repo, so a human may want to set 2026. Authors are mostly at Northeastern, UT Austin, UC Berkeley, MD Anderson, and Georgia Tech. Consistency is judged by Gemini 2.5 Flash, which labels the evidence direction (higher, lower, same, uncertain) of each response, plus cosine similarity and entity, citation, and numeric overlap; eight LLMs are evaluated. Technical questions use terms extracted by Qwen3 Thinking 4B and templates; plain-language terms were simplified by Qwen3 4B and manually edited. The Apache-2.0 license is the repo's; no separate dataset license was seen. The repo ships data, code, and model outputs."
