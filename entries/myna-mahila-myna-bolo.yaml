  notes: Added by hand on 2026-11-25 from the Global Health AI Benchmarks site, an initiative of The Agency Fund
    and Endless Health, so it has no screening record. Facts come from the benchmark's page on that site and the
    team's report PDF. The site says the complete datasets stay with each organisation. The report plans a public
    sample of about 200 questions (50 per language) on Hugging Face under CC-BY-NC-SA-4.0; none was found on 2026-11-25,
    so open_data is closed and license is null. The report names a code repository (github.com/shahmeet18/myna-bolo-health-ai-benchmarking)
    that was not reachable. Results on the site are for the typed set; a spoken set of 1,200 questions (300 per
    language) also exists. Lead institution and rater countries are taken from where the service and its labellers
    work; the report does not give a head office.
