summary: Multi-turn benchmark of physician-curated clinical vignettes (mostly PubMed case reports, plus MedQA cases) that simulates a viva voce exam, where an LLM agent gathers history, exam findings, and investigations before giving a diagnosis scored against ICD-10 codes.
