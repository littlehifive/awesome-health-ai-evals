  notes: "The paper is inconsistent on size: the abstract says 1,762 vignettes, the text says 990 human-reviewed PubMed cases from 1,952 generated, the appendix mentions 1,152 PubMed cases plus 800 MedQA cases, and the Hugging Face card and repo README say 1,152; a human should confirm the final count. The reviewed set is the benchmark_pubmed config; the generated_raw config is unreviewed. Six volunteer clinicians reviewed cases. Metrics are top-k exact and approximate ICD-10 accuracy plus information-gathering precision and recall. r_92f19820e5 is the older repo chy-chiu/VivaBench_old (MIT). The code repo is CC-BY-SA-4.0 per GitHub metadata. The HF datasets yiihan/VivaBench, vivamed/Vivabench, and zhehuderek/VIVA_Benchmark_EMNLP24 were seen in search and not checked; the last is a different, vision benchmark."
