  notes: "The arXiv text calls the benchmark LingLanMiDian and counts 25,624 items; the GitHub README and Hugging Face release use LingLanMedBench and 25,620 items (29,620 JSONL rows in Full because joint reasoning cases are split into three label records). Hard is a subset of Full. Licensed TCM practitioners reviewed items, but no rater country is stated. Authors span Beijing Jiaotong University, Tasly, and several Chinese TCM hospitals and universities. The README links a leaderboard at linglan.top."
