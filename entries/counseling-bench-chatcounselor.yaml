  notes: "The paper's main contribution is the ChatCounselor model and its Psych8k training set (training data, not coded here); Counseling Bench is its evaluation part. The paper says the 229 questions are 'real-world' but does not say where they come from, so provenance is unknown. Only a sanitised subset (Sanitised_CounsQs_subset.jsonl) is in the repository, so the full set may not be public; Apache-2.0 is the repository license. Seven metrics: information, direct guidance, approval and reassurance, restatement/reflection/listening, interpretation, self-disclosure, obtaining relevant information. Authors are at HKU and HKUST (Hong Kong SAR) with one at Ohio State."
