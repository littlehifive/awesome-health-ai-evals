card:
  task: Answer yes-or-no and open-ended text questions about cervical cytology screening, giving an answer and a
    reason for each.
  items_built: The authors used GPT-4 to generate 773 QA pairs from 424 textual knowledge points extracted from
    the Bethesda System textbook, simplifying sentences and excluding those containing "follow-up". All pairs were
    manually reviewed to correct logic, grammar, context, question phrasing, and question-type errors, and GPT-4
    inserted "not" into some questions to balance yes and no answers.
  example: ''
  scoring: Close-ended answers are compared with reference answers to calculate accuracy, specificity, precision,
    recall, and F1 score. For open-ended answers, three experts and GPT-4 independently assess accuracy, completeness,
    logic, precision, risk awareness, and conciseness, with average expert scores and distributions of G-Eval scores
    reported.
  judge: Three experienced experts assign human scores, and GPT-4 assigns G-Eval scores.
  scale: Close-ended classification metrics; open-ended expert scores up to 10 points and G-Eval scores up to 1
    point.
  validation: The authors assessed agreement among the three experts using mean Spearman rank correlations across
    questions and reported that QA G-Eval scores were consistent with expert evaluations, but the supplied text
    gives no numerical agreement values.
  results: GPT-4 performed best on the text QA dataset, with 70.5% accuracy on close-ended questions and an average
    expert score of 6.9/10 on open-ended questions.
  limitations: The authors state that model responses still differ from those of cytopathologists and that misinformation
    could cause harm in clinical practice.
