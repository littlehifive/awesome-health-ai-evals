id: climb
name: CLIMB
kind: benchmark
year: 2024
summary: "A clinical bias benchmark that measures intrinsic bias (name-diagnosis association disparities across sex and ethnicity groups over ICD-10-CM diagnoses) and extrinsic bias (change in diagnosis recall when demographics in 199 CliBench MIMIC-IV admission notes are swapped)."
