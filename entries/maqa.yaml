  notes: "Authors are at Cairo University. The paper says the dataset is publicly and freely available as an SQLite database and cites a 2022 data deposit (Abdelhay and Mohammed 2022); the deposit link was not resolved and no license was seen. Primarily a Q&A corpus used to train and test answer-generation models, so benchmark status is borderline (the paper's own framing is a corpus plus model baselines)."
