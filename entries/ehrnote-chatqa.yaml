card:
  task: Answer a sequence of five-option clinical questions about a patient's discharge summaries, alternating content
    answers with selections of the minimal note sections that support them.
  items_built: Four medical experts, comprising three clinicians and one nurse, developed a discharge-summary schema
    and 80 multi-turn templates used by Gemini 2.5 Pro to generate questions from 1,000 MIMIC-IV patients. Each
    sample was reviewed by one of 11 medical experts, comprising nine specialist clinicians, one clinician resident
    and one nurse; they revised questions and choices and removed 33 samples, leaving 967 samples with 8,036 content
    questions and 8,036 evidence-grounding questions.
  example: '"What are the minimal exact sources from the patient''s discharge summaries that fully contain information
    for your previous answer?"'
  scoring: Selected answer letters are compared with the answer key, separately for content, source selection, and
    pairs where both answers must be correct. Each criterion is reported as accuracy across all turns, the mean
    of per-sample accuracies, and the proportion of samples with every relevant turn correct.
  judge: Rule-based exact match with the answer key grades multiple-choice runs; an unspecified LLM judge grades
    optional free-text runs.
  scale: Correct or incorrect per answer or content-source pair; nine accuracy metrics reported as percentages.
  validation: ''
  results: Among 22 models, gpt-5.4 achieved the highest reported content-question accuracy at 98.33% and the best
    strict whole-sample paired accuracy at 40.02%.
  limitations: The authors note that the data come from one hospital system, cover only discharge summaries rather
    than other EHR sources, and have each sample reviewed by one expert rather than multiple independent annotators.
