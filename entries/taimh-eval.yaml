  notes: "Extended abstract at AIES 2024 (record); the arXiv version 2406.11852 was read. TAIMH in the paper means task-autonomous AI for mental health, the framework; TAIMH-Eval is the repository name (taimh_eval) and is used here as the benchmark name. Lead institutions are Stanford and Northwestern per the arXiv version. Clinicians are M.D.s but their country is not stated. Redacted data and code are on GitHub (MIT); the full unredacted set is available on request because of harmful content."
