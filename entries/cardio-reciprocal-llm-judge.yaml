name: Cardio reciprocal LLM-judge evaluation (cardio_evaluations)
kind: benchmark
year: 2026
summary: "A cardiology free-text QA set (269 curated questions from a PubMed-grounded RAG system, about 490 answers by experts, a standard LLM, and a chain-of-thought LLM) scored 1 to 7 for accuracy, completeness, and clarity by 53 human experts and six LLM judges, built to test LLM-as-judge self-preference and reproducibility."
