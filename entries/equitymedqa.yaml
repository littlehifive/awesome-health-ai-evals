  notes: "Rubrics cover independent, pairwise, and counterfactual assessment. Raters were 11 physicians and 9 health-equity experts in the US, UK, and India, plus consumer raters. Lead-institution country is the releasing organization (Google), not read from an affiliation block. Data released on Hugging Face (mirror of the arXiv ancillary files, CC-BY-4.0 on the card); Med-PaLM 2 outputs and human ratings are not included. The HF card also holds three non-EquityMedQA comparison datasets (MultiMedQA, Mixed MMQA-OMAQ, Omiye et al.)."
