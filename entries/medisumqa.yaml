  notes: "Questions were LLM-generated from sentences of clinician-written discharge letters, then one physician filtered them; models answer from the discharge summary without the letter. A physician rated 100 answers for patient-friendliness, relevance, and safety. The paper says it is released on PhysioNet; I saw no access terms or link (MIMIC-derived data is typically credentialed), so open_data is unknown. Borderline scope: discharge summaries are EHR text, but the task is patient-facing question answering."
