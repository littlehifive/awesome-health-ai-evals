  notes: "Read the paper's method sections and the repository README. Raters are 100 licensed or trained practitioners recruited across the US via Upwork. Six dimensions: overall quality, empathy, specificity, medical advice, factual consistency, toxicity (5-point scales, plus span annotations and rationales); LLM judges are also tested against the experts. Both Hugging Face cards show license cc-by-nc-nd-4.0 (read from the Hugging Face API). Human annotations for CounselBench-Adv are released separately."
