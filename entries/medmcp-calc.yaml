summary: 118 scenario tasks across 4 clinical domains in which an LLM agent must pick and chain medical calculators from a vague clinician-style query, pulling inputs from a MIMIC-IV-based EHR database through MCP tools, scored on task completion, calculator selection, numeric precision, and evidence acquisition.
