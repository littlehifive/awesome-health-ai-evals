  notes: "Shanghai Jiao Tong University X-LANCE Lab with Shanghai Mental Health Center. Dialogues are simulated: psychiatrists and trained actors play doctor and patient, based on reference sessions with real depressed patients; psychiatrists screened quality. Access requires emailing a signed Data Usage Agreement (no sharing, research only), so the license is custom. Tasks: response generation, topic prediction, and severity classification, scored with automatic metrics and human rating."
