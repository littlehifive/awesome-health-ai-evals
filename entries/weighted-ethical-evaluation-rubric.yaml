  notes: "MSc research project at the National College of Ireland (student thesis in the NORMA repository), so grey literature and not peer reviewed. The full rubric is in Table 1 of the thesis. Responses were scored by a fixed LLM evaluator at temperature 0 with no human validation seen. The study's main question was whether a Constitutional-AI-style prompt prefix improves ethical quality (GPT-4o, Claude Sonnet 4, Gemini 2.5 Pro). No dataset or code link found."
