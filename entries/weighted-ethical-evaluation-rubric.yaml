year: 2025
summary: "A six-dimension weighted rubric (safety 25%, accuracy 20%, transparency, empathy and human oversight 15% each, privacy 10%) grounded in Irish, UK and European psychology ethics codes and the EU AI Act, scoring LLM replies to mental health prompts 0-4 with Red/Amber/Green/Excellent tiers; applied to 1,020 synthetic prompts."
