  notes: "Standard developed by critical care pharmacists via two surveys (40 prompts, 4 pharmacists) and a modified Delphi panel. Tested four LLMs (GPT-4o-mini, Gemma-3-27B, Qwen3-32B, LLaMA-3.3-70B) on arranging prompts into the MedMatch format; the main task is formatting rather than open clinical answering. No data availability statement or repository link found; the license and open_data are unknown."
