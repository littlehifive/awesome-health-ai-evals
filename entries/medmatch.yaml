card:
  task: Reformat each medication order written as a sentence into the standardized MedMatch fields, and identify
    its administration route when route information is withheld.
  items_built: 'Two clinicians curated 100 medication prompts and reference orders: 40 oral solid, 10 oral liquid,
    17 intravenous intermittent, 17 intravenous push, and 16 intravenous continuous infusion orders, plus a version
    withholding route information. The format was developed through two surveys with four board-certified critical
    care pharmacists and modified Delphi discussions with five pharmacist panelists.'
  example: ''
  scoring: An order counts as correct only when all fields exactly match the standardized reference; accuracy is
    the number of correct entries divided by all entries, multiplied by 100. A separate experiment measures correct
    route categorization, and each prompt was tested three times.
  judge: Automated exact matching against reference orders assigns accuracy, with a clinician pharmacist panel reviewing
    LLM performance for reliability.
  scale: Each order is correct or incorrect; accuracy is reported as a percentage by medication type.
  validation: ''
  results: ''
  limitations: The authors note that other order formats may be reasonable, regional or demographic differences
    were not covered by the pharmacist panel, and the standards exclude several complex dosing patterns and routes
    other than oral and intravenous.
