summary: Three automated metrics (Context Relevance, Refusal Accuracy, Conversational Faithfulness) for evaluating RAG-based clinical question answering, validated on about 240 patient questions from a cataract-surgery follow-up voice agent plus out-of-scope questions, with clinician labels.
