id: bias-amplification-cascade
name: Bias Amplification Cascade
kind: benchmark
year: 2026
summary: Pipeline that sends 10 standard probe templates per disease for 175 Global Burden of Disease categories to six frontier LLMs (10,500 queries) and scores the semantic similarity of answers to PubMed literature, to test how structural gaps in biomedical research reach LLMs and affect African health equity.
