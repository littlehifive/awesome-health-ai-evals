  notes: Based on the GitHub README and the Zenodo record title only; the Communications Biology paper was not read. The repository ships code, disease ground-truth metadata, and per-answer similarity scores but not the raw LLM responses. Scoring is PubMedBERT embedding cosine similarity to PubMed centroids, which measures alignment to the literature, not correctness. Lead institution country (UK) is a guess from author names and was not checked.
