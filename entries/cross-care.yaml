  notes: "Probability-based bias test on model logits (mostly base models such as Pythia, Llama, Mistral, Qwen), not a chatbot conversation test. Repo license MIT (GitHub API), though the README badge says Apache-2.0. Pile co-occurrence counts are downloadable at crosscare.net/downloads per the paper. The Chinese-language item origin is not tied to a country. Languages other than English come from the paper's multilingual-template discussion; the full list was not confirmed."
