  notes: "Full text was not reachable (ACM page returned 403); based on the abstract (via Semantic Scholar and Crossref) and the GitHub repository. The repo ships only the processed QA subset (data/fairmed/qa.jsonl, 992 rows: medxpertqa-r 658, medxpertqa-u 129, medqa 93, medbullets 84, mmlu-pro 12, mmlu 11, medmcqa 5) with gender and age fields; the clinical-prediction part described in the abstract was not found in the repo. The repository has no license file. The paper's main contribution is the MAPPE prompt-optimization method; FairMed is the evaluation set. Lead country from first author's Zhejiang University affiliation in Crossref."
