  notes: "Read the arXiv HTML text. The paper says the dataset and fine-tuned models will be made public with a URL added after acceptance; none was available, so open_data is unknown. Items are LLM-generated and verified by a second model, without expert review (listed as future work). Zero-shot accuracy ranged from 49.5% to 74.4% across 23 models. Generalization was checked on ECG-related subsets of MedMCQA and MedQA converted to true/false. Intended users are inferred. Lead institutions: Emory University and Georgia Tech."
