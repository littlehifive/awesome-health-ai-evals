card:
  task: ''
  items_built: The framework is intended to assess health conversational AI products used for daily health consultation,
    rather than a fixed set of test items. A seven-member research team developed preliminary indicators from literature,
    industry standards, and group discussions, then revised them through two Delphi rounds between November 2024
    and February 2025, with 15 experts completing both rounds.
  example: ''
  scoring: The analytic hierarchy process assigns weights to the indicators, with primary weights of 0.4781 for
    ethics and compliance, 0.4112 for health consultation capability, and 0.1107 for user experience. The provided
    text does not specify how chatbot outputs receive indicator scores or how those scores are combined into a final
    result.
  judge: ''
  scale: ''
  validation: Agreement on indicator importance, feasibility, and sensitivity was measured using Kendall W, ranging
    from 0.14 to 0.20 in round 1 and 0.13 to 0.17 in round 2, with all P values at or below .001. These checks concerned
    expert ratings of the framework, not scores assigned to chatbot outputs.
  score_meaning: Expert ratings concern the indicators, not chatbot performance; feasibility ranges from 1 (very
    difficult to collect the relevant data) through 2 (relatively difficult), 3 (moderate), and 4 (relatively easy)
    to 5 (very easy). The indicator inclusion criteria were a mean rating of at least 3.50 and a coefficient of
    variation below 0.25.
  annotation_process: For framework development, 16 experts rated indicator importance, feasibility, and sensitivity
    in the first Delphi round, and 15 rated them in the second. Experts were recruited through research collaborations,
    professional association recommendations, and industry expert databases; before recruitment, two consensus meetings
    explained HCAI, the study procedures, and evaluation methods. Expert feedback and group discussions informed
    decisions to revise, retain, or delete indicators rather than applying numerical inclusion criteria alone.
  results: ''
  limitations: The authors state that the small, China-only expert panel limits generalizability, that real-world
    utility remains unvalidated, and that operational thresholds and performance benchmarks need further refinement.
