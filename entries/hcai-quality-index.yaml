summary: A weighted indicator system for LLM-based health conversational AI (3 primary, 7 secondary, and 28 tertiary indicators spanning medical effectiveness, user experience, and ethics) built through two Delphi rounds with 15 experts and analytic-hierarchy-process weighting.
