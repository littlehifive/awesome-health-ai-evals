  notes: "Read the methods and results in paperclip. Authors are at Capital Medical University (Beijing) and Bytedance Xiaohe Health; Delphi consultations ran November 2024 to February 2025 (15 of 16 experts completed both rounds). Delphi questionnaires with indicator definitions and scoring rules are in multimedia appendices. The final weighted system is not a test set; the exact scoring procedure for a given chatbot (human or automatic) was not confirmed, so eval_methods is a best guess."
