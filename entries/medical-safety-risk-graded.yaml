  notes: "Query seriousness (non-serious, serious, critical) and response risk (no information, general information, recommendations, treat or diagnose) are graded by one Advanced Nurse Practitioner from NHS Scotland; a subset also has three Mechanical Turk labels. Scoring is by classifier F1 and mean absolute error for detecting query seriousness and response risk, so it targets safety classifiers more than chatbot answers. Rater country is inferred from the NHS Scotland affiliation stated in the repository. License GPL-3.0 is the GitHub repository license. Few serious or critical queries (authors' stated limitation). Repository data files are named medicheck-*.csv."
