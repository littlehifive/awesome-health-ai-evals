  notes: "The paper states the dataset is released; the Hugging Face card (official repository, research use only) has no license field. The card's split sizes disagree with the paper (card lists 993 test and 2.01K valid; paper lists 993 dev and 2,013 test). The task is retrieval of the exact answer passage (P@K, mAP), not generation; the paper's contribution is the SPBERTQA retrieval system."
