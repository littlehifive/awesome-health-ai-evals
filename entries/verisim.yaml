id: verisim
name: VeriSim
kind: eval_framework
year: 2026
summary: "A patient-simulation framework that injects controllable communication noise (memory gaps, low health literacy, anxiety and others) into 300 diagnostic cases while a UMLS-grounded verifier keeps the patient's facts true, used to stress-test doctor LLMs on top-1 diagnostic accuracy and conversation length."
