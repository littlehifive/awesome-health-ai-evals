summary: "About 1,000 real MIMIC-IV hospital admissions per task (diagnoses, procedures, lab test orders, prescriptions), where an LLM predicts the clinicians' coded decisions from the admission record, scored by multi-granular precision, recall, and F1 against ICD-10, LOINC, and ATC codes."
