  notes: "Items are de-identified hospital EHR records, not chatbot conversations, so item_provenance real_user_queries is the closest enum value. The repo builds the benchmark from MIMIC-IV, which needs credentialed PhysioNet access (gated); the GitHub code is Apache-2.0 but no data license was seen, so license is null. Free-text answers are mapped to codes by embedding similarity. Evaluation sets: 1,081 diagnosis, 1,100 procedure, 1,064 lab, and prescription visits per Table 2."
