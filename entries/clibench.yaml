card:
  task: Given a hospital patient's records, produce a set of discharge diagnoses, treatment procedures, lab test
    orders, or medication prescriptions, depending on the task.
  items_built: The authors extracted about 1,000 evaluation cases per task from MIMIC-IV records at Beth Israel
    Deaconess Medical Center from 2008 to 2019, sampling across medical code categories. A rule-based pipeline removed
    post-decision information from discharge notes, its rules were refined through screening 1,000 records, and
    a clinical NLP expert manually verified every evaluation-set admission record.
  example: ''
  scoring: Generated codes are parsed and normalized, while free-text decisions are mapped to codes using cosine
    similarity between BERT sentence embeddings; the resulting sets are compared with recorded clinician decisions.
    Micro precision, recall, and F1 are calculated across admissions at each code hierarchy level, with averages
    across levels also reported.
  judge: Automated code matching assigns scores, with a BERT model trained on 1 billion sentence pairs mapping free
    text to codes.
  scale: Set overlap at each code hierarchy level; micro precision, recall, and F1, with F1 reported as a percentage
    and averaged across levels.
  validation: ''
  score_meaning: Higher scores indicate closer agreement with recorded clinical decisions. Coarse-level scores measure
    broad choices, such as selecting among 21 disease chapters, while finer-level scores test distinctions such
    as selecting among 283 disease category groups.
  annotation_process: The reference labels use billing diagnoses as estimates of discharge diagnoses and clinician-ordered
    procedures, lab tests and prescriptions at the first timestamp after admission. A clinical NLP expert manually
    verified all admission records in the evaluation set after manual screening of 1,000 sampled records was used
    to refine the extraction rules.
  results: ''
  limitations: ''
