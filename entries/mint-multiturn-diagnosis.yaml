id: mint-multiturn-diagnosis
name: MINT (Medical Incremental N-Turn Benchmark)
kind: benchmark
year: 2026
summary: 1,035 medical diagnosis cases split into clinically labeled evidence shards revealed turn by turn, to measure premature answering and self-correction of LLMs in multi-turn diagnosis.
