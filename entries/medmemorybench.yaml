  notes: "Dataset card only; no paper or builder statement found. The three Hugging Face repos carry identical cards (CC-BY-NC-SA-4.0). Cyan27 was created first (2026-05), CynthiaHo next (2026-07), AQ-MedAI last (2026-10), so the canonical owner is unclear. Six query types (entity exact match, temporal localization, state update, inference, multiple choice, multi-hop deduction) plus trap events for allergies and contraindications; the card does not describe the scoring procedure for open query types. Builder type and country unknown."
