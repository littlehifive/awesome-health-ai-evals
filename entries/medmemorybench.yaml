card:
  task: Read a patient's dialogue sessions in order, then answer questions requiring recall of medical facts, tracking
    of changes, identification of event timing, and deductions linking multiple facts.
  items_built: Specialized patient and doctor LLM agents generated conversations from synthetic patient profiles
    and causal event timelines, guided by clinical guidelines including the Chinese Diabetes Prevention Guidelines
    2024, ADA Standards of Care, GOLD COPD Strategy, and ESC Heart Failure Guidelines. The dataset contains 1,939
    queries per language, with expert-reviewed reference answers, human expert review of queries, and deduplication.
