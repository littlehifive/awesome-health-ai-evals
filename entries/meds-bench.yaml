id: meds-bench
name: MedS-Bench
kind: benchmark
year: 2024
summary: Benchmark of 11 clinical task types (multiple-choice QA, summarization, information extraction, explanation, NER, diagnosis, treatment planning, outcome prediction, classification, fact verification, NLI) built by reformatting 28 existing datasets into instruction prompts, scored with accuracy, BLEU, and ROUGE.
