  notes: Secondary contribution of a paper mainly about targeted LoRA for Arabic medical QA. The paper presents the benchmark but I found no release statement or link, so open_data is a guess (closed). Dialogues were expanded from clinician case templates by an LLM and verified by clinicians; dialect versions were machine-translated and reviewed by two native speakers each. Physician inter-annotator agreement 87%. Judge is correct/incorrect against the reference, not a multi-criterion rubric.
