id: cspt
name: CSPT (Chinese Standardized Patient Testing)
kind: benchmark
year: 2024
summary: 72 Chinese standardized-patient cases across five departments, each with patient information, a dialogue script that drives an LLM patient simulator, and a checklist of key symptoms, tests, and diagnoses used to score a doctor model over simulated multi-turn consultations.
