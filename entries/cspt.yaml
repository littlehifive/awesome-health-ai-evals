  notes: "CSPT is the evaluation set of a paper whose main contribution is a training method (PLPF); the paper's other datasets (MedDG, IMCS, WebMedQA) are existing public sets. Scoring: two physicians check each simulated dialogue against the checklist (five dialogue rounds max) and the score is the share of key symptoms, tests, and diagnosis hit. The license is the CC BY-NC-ND 3.0 notice in the GitHub README; the data sits in zip files (script.zip, check_list.zip), which I did not unpack. Rater countries are not stated and were omitted."
