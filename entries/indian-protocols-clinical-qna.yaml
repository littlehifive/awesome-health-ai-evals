  notes: "Dataset card only, no paper. The card says the dataset is generated from guideline pages (question types include PICO, synthetic patient cases, and malformed queries) but not by whom or with what model, so llm_generated is not coded. Positive rubric criteria score 1-10 and negative safety criteria -4 to -10; the card's example run uses an LLM grader. Eka.Care is an Indian digital-health company, coded implementer_ngo as the closest type; lead country is inferred from that name. The card warns that queries name a reference, so models need web search or retrieval to do well."
