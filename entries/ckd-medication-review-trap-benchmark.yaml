  notes: "Each case has at least 2 embedded traps from 10 categories (T01-T10). Model outputs are parsed by an LLM extraction step into problem tuples and matched to the gold list with 13 decision rules and 4 hallucination rules; a second nephrologist checked completeness and a blinded inter-rater check gave kappa 0.934. Authors are at China Medical University, Asia University, and An-Nan Hospital in Taiwan (from OpenAlex and the ethics committee named in the paper). I found no data or code release statement and no repository link in the text, so open_data is unknown; supplementary appendices are referenced but were not seen. Pilot (Phase A) study; a real-chart Phase B is planned. Distinct from the existing CKD entries ckd-diet-llm-benchmark and ckd-renoprotective-omission-benchmark."
