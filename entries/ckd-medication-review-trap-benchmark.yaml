card:
  task: Review each synthetic chronic kidney disease case in free text, identifying medication-related problems
    and recommending actions.
  items_built: 'The authors constructed 50 synthetic cases with guideline-referenced medications and clinical context
    from nursing and pharmacy staff at An Nan Hospital: 20 G3a-G3b, 15 G4, and 15 G5/G5D/transplant cases, each
    with 8-12 medications and at least two traps from ten categories. Nephrologist adjudication and an independent
    completeness review produced 307 gold-standard problems, ranging from 2 to 13 per case.'
  example: ''
  scoring: Claude Sonnet 4.5 extracts drug, issue type, and action tuples and proposes matches to the gold list
    using 13 decision rules; the principal investigator reviews all classifications and checks hallucinations using
    four additional rules. Consensus across three runs uses a two-of-three majority, falling back to Run 1 when
    all differ; precision and recall yield per-case F1, which is averaged across 50 cases.
  judge: Claude Sonnet 4.5 performs extraction and candidate matching, and the nephrologist principal investigator
    makes the final scoring decisions.
  scale: Problem-level true positive, false positive, or false negative; per-case precision, recall, and F1 from
    0 to 1, averaged across cases.
  validation: Extraction matched principal-investigator verification on 100% of 333 sampled tuples, and a second
    nephrologist confirmed 98% completeness on 50 outputs. Blinded scoring by two nephrologists achieved 96.7% agreement
    and κ = 0.934 on 92 problems across 15 cases; exploratory false-positive reclassification had 71% agreement
    and κ = 0.21.
  score_meaning: The safety-critical omission rate is the proportion of cases with at least one missed Level 3 problem
    (could cause harm) or Level 4 problem (contraindicated). The hallucination rate is the proportion of cases with
    a confirmed hallucination, so 54% means 27 of 50 cases contained one.
  annotation_process: The principal investigator could see model identities during Stage 2 adjudication. For the
    exploratory false-positive analysis, the investigator classified 162 unique drug-and-issue patterns by clinical
    validity, and an independent second nephrologist classified a 30% stratified sample.
  results: Grok 4.1 Fast had the highest strict macro F1 at 0.49, but a 52% hallucination rate. GPT-5.4 had zero
    hallucinations and the lowest safety-critical omission rate; no human-performance baseline was included.
  limitations: The authors identify synthetic cases with limited real-world complexity, no human comparator, model-visible
    scoring by one nephrologist, post-hoc subjective false-positive reclassification, and configuration differences
    across models as limitations.
