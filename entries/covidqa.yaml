card:
  task: Rank the sentences in a supplied scientific article by their relevance to a COVID-19 question, given either
    as a natural language question or a keyword query.
  items_built: Five University of Waterloo co-authors manually converted Kaggle literature-review answer tables
    into 124 question-article pairs covering 27 questions and 85 articles from the April 10 CORD-19 corpus, creating
    both keyword and natural language versions of each question. They located verbatim answer spans within single
    sentences, with 1.6 spans per pair on average, and a lead annotator approved topics and answered annotation
    questions.
  example: '"What proportion of patients are asymptomatic?" Answer span in article 56zhxd6e: "49 (14.89%) were asymptomatic".'
  scoring: A ranked sentence is marked correct automatically if it contains an annotated answer span through substring
    matching. Mean reciprocal rank, precision at rank one and recall at rank three are reported as micro-averages
    across question-answer pairs.
  judge: Automatic substring matching against manually annotated answer spans assigns sentence correctness.
  scale: Binary sentence correctness; micro-averaged MRR, P@1 and R@3, each from 0 to 1.
  validation: ''
  results: 'T5 fine-tuned on MS MARCO achieved the best overall results with natural language questions: MRR 0.415,
    P@1 0.282 and R@3 0.404.'
  limitations: The authors state that the dataset is too small for supervised training, its annotators lack relevant
    domain expertise, and it contains no documents without an answer, so it cannot test whether models detect missing
    answers.
