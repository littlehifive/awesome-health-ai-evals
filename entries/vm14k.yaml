  notes: "The paper says the three sets are released and links a project page, but no download link or license appears in the text, so open_data is unknown. Questions were extracted from about 100,000 raw items with GPT-4o and Gemini 2.0 Flash, deduplicated, answer-verified, and annotated by medical experts; difficulty and topic labels were partly assigned by LLMs. Hugging Face datasets Venera-AI/VM14K, Venera-AI/VM14K-Megarepo, AnonymouseV/VM14K, and hanguyennn2812/VM14K_Research exist; their cards could not be read, so none is linked. Authors are at Vietnamese and US universities and Venera AI; the first and last authors' institutions are in Vietnam."
