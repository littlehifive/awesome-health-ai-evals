  notes: "Data license is CC BY-NC 4.0 and code is MIT, per the GitHub README. Questions are standardised (eight per report) and answers were written by one of three nutritionists; the countries of the nutritionists and expert raters are not stated. The paper reports 6 to 10 percent of reference answers as contestable and finds the LLM-judge rubric unreliable on clinical safety. Fine-tuned baselines (IndoBERT, mT5, RAG) are also reported."
