  notes: "Objective queries have numeric ground truth (for example the longest run in the past 21 days) and are scored by accuracy; open-ended queries are rated by expert annotators on a 1-5 scale, three raters per response, in a 650-hour evaluation. The Data availability statement points to the GitHub repo, which holds the two query spreadsheets, deidentified real wearable users, and synthetic users. The article is CC BY-NC-ND 4.0; the repository license is not a standard SPDX type (GitHub reports NOASSERTION), so license is left null. How the query sets were generated (LLM versus human authors) was not checked in detail; item_provenance is a guess and should be verified. The authors point to a successor Personal Health Agent project from the same group."
