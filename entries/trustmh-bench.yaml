summary: A trustworthiness benchmark for mental health LLMs covering eight pillars (reliability, crisis identification and escalation, safety, fairness, privacy, robustness, anti-sycophancy, ethics), assembled from existing datasets plus new sets such as JailbreakMH, PsyLeak, and ESConv-Fair.
