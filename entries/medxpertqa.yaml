  notes: "The MM subset needs images and is outside the text-chatbot scope; the Text subset is in scope. Questions were rewritten and options augmented to reduce leakage, then reviewed by physicians. Record r_c9626ebde9 is the GitHub repo. Merged as records only: yiyanhuang/MedXpertQA (copy), Shaow/medxpertqa-text-bioharness (format conversion for another harness). ChuGyouk/MedXpertQA (r_d19ac59dc3) holds Gemini 2.5 Pro outputs, not the benchmark, and its second arXiv ID (2504.10481) is the xVerify paper; neither is linked."
