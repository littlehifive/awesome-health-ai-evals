id: rshs-hallucination-risk
name: Risk-Sensitive Hallucination Score (RSHS)
kind: eval_framework
year: 2026
summary: A metric framework that scores patient-facing medical answers by the presence of risk-bearing language (treatment directives, contraindications, dosages, urgency cues, high-alert drugs) plus query-response relevance, demonstrated on 200 template-generated prompts.
