  notes: "Paper and Hugging Face card disagree: the paper reports nine languages with 1,000 examples each (including MedNLI); the card lists 14 languages with 850 each and says MedNLI was excluded for distribution-policy reasons. Languages beyond the paper's nine (French, Malay, Igbo, Wolof, Yoruba) are in the card only. Seven languages reuse machine translations from GlobMed; Thai was translated with GPT-5.5. Open-ended QA is scored by an LLM evaluator checked against expert ratings on small samples. 23 physicians and medical experts from nine countries and regions reviewed translations; their countries are not named. The Hugging Face dataset is cited in the paper, not in the screening record."
