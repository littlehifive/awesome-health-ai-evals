card:
  task: Select an answer to a medical multiple-choice question, classify the logical relation between two biomedical
    or clinical statements, or write a free-form answer to a medical question in the item's language.
  items_built: Over two years, 23 physicians and medical experts developed the paper's 1,000-example set from nine
    English datasets, using GlobMed translations for seven languages and GPT-5.5 for Thai; two bilingual experts
    rated each translation's accuracy, fluency and completeness, revised it, and checked remaining errors. The dataset
    card instead reports 850 examples in each of 14 languages, excludes MedNLI for distribution-policy reasons,
    and states that French had only one reviewer.
  example: ''
  scoring: MCQA and NLI use accuracy, averaged equally across the six datasets within each language and then across
    nine languages. For open-ended QA, an LLM evaluator receives the question, expert-verified reference and model
    answer, assigns five scores for completeness, reference alignment, clinical consensus, clinical appropriateness
    and safety, and averages them into an overall score, with model scores averaged equally across the three QA
    datasets.
  judge: MCQA and NLI use the correct answers; open-ended QA uses an LLM evaluator whose model name is not given
    in the supplied text.
  scale: 'MCQA and NLI: accuracy; open-ended QA: five criteria rated 1 to 5, averaged per response and then across
    datasets.'
  validation: Medical experts and the LLM evaluator rated 45 responses per language in Chinese, Japanese and Thai,
    drawn from 15 questions answered by three models. Scores were within one point of expert ratings for 88.9%,
    64.4% and 95.6% of responses, respectively, with concordance coefficients of 0.56, 0.11 and 0.77.
  results: GPT-5.4 led open-ended QA with an overall score of 4.33 out of 5, scoring 4.31 in higher-resource languages
    and 4.35 in lower-resource languages.
  limitations: The authors state that the small, single-turn benchmark omits dialogue-level capabilities, task-oriented
    scores miss translation-specific qualities, and limited clinician evaluation does not cover every language or
    the full range of clinical and regional practices.
