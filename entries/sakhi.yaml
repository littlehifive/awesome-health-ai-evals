  notes: "Read the Hugging Face dataset card and GitHub README; the paper (NeurIPS 2026 Evaluations and Datasets track submission) was not read and is anonymized in the repo. Reviewers were 11 practising Indian doctors (2 OB/GYN, 9 GPs), ASHA workers, and healthcare-nonprofit staff. MQS (Medical Quality Score) weights Accuracy 0.30, Completeness 0.25, Context Awareness 0.20, Communication 0.15, Terminology Accessibility 0.10; judge is GPT-4o-mini. Builder SimPPL is inferred to be a non-profit research group from the dataset owner name only; check. Code is MIT."
