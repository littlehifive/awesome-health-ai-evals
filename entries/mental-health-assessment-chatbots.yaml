id: mental-health-assessment-chatbots
name: Mental Health Assessment for the Chatbots
kind: eval_framework
year: 2022
summary: A questionnaire-based framework that rewrites four psychology questionnaires (PHQ-9 depression, GAD-7 anxiety, CAGE alcohol addiction, TEQ empathy) into conversational prompts to measure the mental-health tendencies of open-domain chatbots.
