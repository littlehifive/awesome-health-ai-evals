  notes: "Four stages: rewrite questionnaire items as utterances, query the chatbot (single-turn and multi-turn), align free-text replies to answer options, then score with the questionnaire's rating scale. Alignment was done by six annotators hired from a commercial data-annotation company (country not stated), so expert_human_rating is the closest eval method. The paper says the framework will be released publicly, but no link or license was found. Authors are from Tencent and the Institute of Computing Technology, Chinese Academy of Sciences. Chatbots tested were Blender, DialoGPT, Plato, and DialoFlow, which are pre-LLM systems."
