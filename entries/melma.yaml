summary: A 30-item clinician-rated questionnaire (MELMA-Q) across seven domains with a two-tier safety-gated acceptability framework (MELMA-CAF), plus a web tool (MELMA-W) that applies the rubric to LLM answers; piloted on five otolaryngology scenarios.
