  notes: "Read the Springer abstract page (full text is paywalled; not in paperclip) and the MELMA-W README. The seven domains are Medical Accuracy/Groundedness, Clinical Reasoning/Management, Safety/Ethics/Trustworthiness, Linguistic Quality/Semantic Fidelity, Understandability/Literacy Adaptation, Usefulness/Decision Support, and Performance/Answer Behavior. Inter-rater ICC was 0.89. Anonymized evaluation data are on Zenodo, while the fuller datasets are available on reasonable request. The article lists a second code repository (drNatigAhmadov/MELMA-W-Evaluation) that was not opened. The MIT license is from the MELMA-W repository. Whether MELMA-W scores with an LLM is not stated in the sources read, so rubric_llm_judge is not listed. Authors: Azerbaijan Medical University (first), Yeditepe University (Turkey) and Denver Health (USA) for the last author. Rater countries are not stated."
