  notes: "Borderline scope: it evaluates conversational AI tutors in an endocrinology curriculum (medical education) rather than health advice. The rubric is in Table 2, the agent configurations in Multimedia Appendix 1 and the full scoring prompt in Multimedia Appendix 2 (listed in the PMC text, not opened). Scored by LLM evaluators (Claude, DeepSeek, Qwen; AI-expert ICC 0.51 on total score), with DeepSeek and Qwen showing ceiling effects. Dimension weights were set by the team without validation. Health area coded other_specialty (endocrinology). No data release link seen."
