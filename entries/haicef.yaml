id: haicef
name: Health Care AI Chatbot Evaluation Framework (HAICEF)
kind: eval_framework
year: 2025
summary: A three-level construct hierarchy (3 priority domains, 18 second-level and 60 third-level constructs) holding 271 evaluation questions extracted from 11 existing chatbot evaluation frameworks in a PRISMA-guided systematic review, mapped to Coalition for Health AI constructs.
