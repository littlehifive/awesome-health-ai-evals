  notes: "Read the methods, results, and discussion in paperclip (Harvard Business School, Beth Israel Deaconess, and others; first and last authors Yining Hua and John Torous). Questions are not scored: the paper says it maps questions to constructs without assigning scores, so eval_methods is a best fit (questions are meant to be answered by evaluators). Full question list and binary-question rewrites are in multimedia appendices. r_cb1207a9ad is the JMIR preprint of the same article. Some constructs (accessibility and accountability assurance) are placeholders because the literature covered them thinly."
