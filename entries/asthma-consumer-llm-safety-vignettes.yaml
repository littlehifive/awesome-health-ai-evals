  notes: "OSF registration (pre-registered protocol plus companion files S1 vignette bank with reference keys, S2 benchmark-to-vignette mapping, S3 rater manual); the files are downloadable. No data had been collected at registration, so there is no peer-reviewed paper. Authors, institutions, and license are not stated in what was read (lead country UNKNOWN; builder_types academic is a guess). Who wrote the vignettes is not stated; clinician_written is assumed from the reference-key design. Scoring uses a safety axis (safe, potentially harmful, dangerous) and a guideline-concordance axis by two raters, with eight binary flags. The health_areas label other_specialty stands for respiratory."
