card:
  task: Read a recipe's title, ingredients and preparation instructions and answer YES or NO to whether it is suitable
    for people managing diabetes.
  items_built: The University of South Carolina AI Institute authors collected 3,807 suitable recipes from MayoClinic,
    Diabetes UK and Diabetes Food Hub. They selected 3,800 unsuitable recipes by searching Recipe1M titles and ingredients
    for keywords drawn from MayoClinic guidance on foods to avoid, then randomly sampling the matches for class
    balance.
  example: ''
  scoring: YES/NO predictions are compared with the dataset labels to report accuracy, precision and recall across
    recipes separately for each of three prompt styles. The authors also report F1 scores and a stability score
    calculated as 1 − |precision − recall|, with averages across prompt styles.
  judge: Exact match with the dataset's YES/NO labels determines classification correctness.
  scale: Binary correctness per recipe; aggregate accuracy, precision, recall, F1 and stability on a 0 to 1 scale.
  validation: ''
  results: Llama3.1 70B achieved the highest accuracy, 0.85, with the Exemplary Context Prompt, with precision 0.91
    and recall 0.79. Mistral 7B led the Direct Query Prompt with accuracy, precision and recall all at 0.84.
  limitations: The authors state that domain-expert validation is needed and that their analysis does not establish
    whether models reasoned over individual ingredients and cooking methods.
  sources:
