  notes: "The paper says corpus, response records, and audit are released on Hugging Face (yh0502/risp-bench, CC-BY-4.0, with MedMCQA Apache-2.0 and GSM8K MIT inheritance) with an anonymized companion GitHub repo, but that Hugging Face ID did not resolve when checked, so open_data is unknown and the dataset is not listed in links. 770 of 2,494 candidate items were excluded in an audit (732 multi-answer). Wrong rationales are GPT-5.4-generated and not expert-validated. Evaluated on 10 open-weight models (1B-27B). Authors and affiliations were not visible in the text read; builder type is assumed academic."
