id: clinical-nursing-llm-evaluation-framework
name: Clinical Nursing LLM Evaluation Framework
kind: eval_framework
year: 2026
summary: A preliminary framework for evaluating LLMs in clinical nursing, with 37 metrics grouped into six domains, a scenario classification, and a minimum technical reporting checklist, derived from a scoping review of 42 studies and three expert meetings.
