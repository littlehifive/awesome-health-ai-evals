card:
  task: Perform clinical nursing tasks such as generating nursing documentation, supporting decisions, retrieving
    knowledge, educating patients, or communicating with patients.
  items_built: The framework is intended for evaluating LLM applications in clinical nursing rather than a fixed
    set of test items, and was developed from 42 studies found in Web of Science, PubMed, Embase, and the Cochrane
    Library through June 21, 2025. Eight experts in medical and nursing management, nursing informatics, and clinical
    nursing practice refined the metrics and scenarios in three meetings, reaching consensus through discussion.
  example: ''
  scoring: Performance metrics compare model outputs with a gold standard, while clinical experts assess content
    for clinical appropriateness, quality, and potential harm. The framework does not establish a combined score
    or validated scenario-specific priorities or weights.
  judge: Clinical experts assess clinical validity and safety; no fixed scoring panel or model grader is specified.
  scale: ''
  validation: ''
  score_meaning: ''
  annotation_process: ''
  results: ''
  limitations: The authors identify possible missed studies, evolving policies, limited evidence quality and nursing-specific
    knowledge representation, geographically limited expert participation, and insufficient evidence to establish
    validated scenario-specific indicators, priorities, or weights.
