  notes: "Not related to OpenAI's HealthBench despite the name. The true/false items were generated with GPT-5.2 from guideline text (the paper does not report human review). True/false is scored by regex-extracted verdict; PCDT-QA by a GPT-4.1 correct/incorrect judge. PCDT-QA is a second benchmark in the same repo (hugo/pcdt-qa on Hugging Face, not read directly). The HF card lists CC-BY-4.0 while the GitHub README says research use only; the card license is recorded. The paper's main purpose is a training method (continual pre-training and GRPO); the benchmarks are secondary. Authors at UNICAMP, Maritaca AI, and NoHarm.ai, all in Brazil."
