  notes: Methodology paper (2507.14615) introduces the dataset and evaluation metrics (Needle in the Haystack, Decision Points, contextual adaptability); the 2507.16322 paper uses the English set to compare benchmark representativeness for African disease burden and is a use of the benchmark, not a separate one. Neither paper gives a download link or license, so open_data is closed; a human should check for a release. Generation model was Gemini Flash 2.0 Lite; physicians from the Kenya Medical Association reviewed items. Authors from Qhala, Kenya Medical Association, and Africa CDC.
