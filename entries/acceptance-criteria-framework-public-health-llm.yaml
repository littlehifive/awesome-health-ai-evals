id: acceptance-criteria-framework-public-health-llm
name: Acceptance Criteria Framework (ACF) for Custom LLMs in Public Health Interventions
kind: eval_framework
year: 2026
summary: A predeployment protocol in which a foundation model generates 100 project-relevant and 50 off-topic prompts, three experts code responses as problematic or not, and the custom LLM passes if interrater agreement is at least 0.80 and few responses are problematic; applied to an English and Spanish tobacco quitline text-messaging chatbot.
