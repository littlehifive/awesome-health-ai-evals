id: llm-repeatability-reproducibility-framework
name: LLM Repeatability and Reproducibility Framework for Diagnostic Reasoning
kind: eval_framework
year: 2025
summary: A statistical framework defining semantic and internal (token-entropy) repeatability and reproducibility scores for LLM outputs, demonstrated on 518 free-response MedQA cases and 90 non-public Undiagnosed Diseases Network cases with five chain-of-thought prompts.
