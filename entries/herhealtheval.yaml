  notes: "The paper states that the benchmark and adaptation data are withheld for double-blind review and intended for release after acceptance, so open_data is closed for now and no repository link exists. Register variants were machine-generated and reviewed for semantic preservation; targets for risk and under-specification are structured labels, not clinician-adjudicated. Scoring is classification-style (concern accuracy, under-triage, clarification recall, parse compliance, consistency). Source datasets are partly web consultation platforms (item_provenance web_forum). health_areas other_specialty covers PCOS, fertility, menopause."
