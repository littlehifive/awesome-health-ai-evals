id: herhealtheval
name: HerHealthEval
kind: benchmark
year: 2026
summary: Controlled multilingual test set of women's-health cases (540 items per language) in English, French and Modern Standard Arabic across six communicative forms, scoring concern classification, risk calibration, clarification behavior and cross-form consistency.
readme_section: multilingual_regional
