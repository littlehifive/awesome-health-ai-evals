  notes: "Dataset cards only, no paper. The 1006 card says questions come from Swedish medical exams between 2022-09-15 and 2024-05-21, obtained from the Umea University website; its license field says unknown, so license is null. The 1002 versions have the same card and fields (1,002 rows); the -json variants were not opened. The 2021-09-09 set (record r_abc7ee70f6, same uploader as the 1002 sets) keeps text-only, single-answer questions from a 140-question exam; the exact count was not checked and could be below 50, but it is folded into this entry rather than kept separate. The cards give answers but no explicit evaluation protocol; the exact-match method is implied. Uploader institutions are unknown. The sets are related to the SMDT sub-benchmark in swedish-medical-llm-benchmark, but that overlap was not verified."
