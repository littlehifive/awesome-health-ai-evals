  notes: "Questions are instantiated from task templates over a relational database built from AI4FoodDB; answers come from executed SQL queries and were manually spot-checked. Two evaluation settings (context prompting and database prompting), accuracy as the main metric. The paper says the benchmark is publicly available and releases the construction pipeline, but the only link is an anonymized 4open.science repository; no dataset download, license, or Hugging Face ID was seen. Item language is assumed English (templates and examples are English). Authors at UC San Diego and Google Research."
