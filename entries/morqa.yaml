  item_origin_note: Built on existing sets; LiveQA-Clinical is consumer health questions sent to US NIH sites, and MedDialog-ZH is from Chinese online doctor consultations. The paper does not state countries for DermaVQA or WoundcareVQA. Chinese versions of DermaVQA and WoundcareVQA are translations.
