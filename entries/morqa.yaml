  notes: "This is a meta-evaluation benchmark: it tests evaluation metrics, not chatbots directly. Includes image-based VQA collections (DermaVQA, WoundcareVQA) alongside text-only LiveQA and MedDialog; modality is listed as text only because the in-scope items are patient questions with free-text answers. The paper footnote says code and data will be released upon publication; no link or license was seen, so open_data is unknown. Authors are at Microsoft Health AI and the University of Washington. English dermatology and wound ratings were by practicing physicians; Chinese ratings by one annotator with Chinese medical school training."
