id: morqa
name: MORQA
kind: benchmark
year: 2025
summary: A benchmark for judging evaluation metrics on open-ended medical QA, with expert gold answers and 16,041 expert ratings of model responses across six English and Chinese collections (DermaVQA, WoundcareVQA, LiveQA-Clinical, MedDialog-ZH), scored by how well BLEU, ROUGE, BERTScore, BLEURT, and LLM judges agree with the experts.
