  notes: Built with Intron Health (Nigeria) and Georgia Tech, among others. Short-answer questions are scored with BERTScore, QuestEval, and ROUGE-Lsum; 379 raters (58 clinicians, 321 non-clinicians) rated model answers, but the paper does not give the raters' countries. afrimedqa/afrimed-qa-parallel (gated, CC-BY-4.0 per card tag, multi-way parallel version in African languages; languages not listed on the public card) is merged here as a same-team release; r_60c0d2ff46 is a Cassyni talk record. TRINDS is a later release and is not part of this entry.
