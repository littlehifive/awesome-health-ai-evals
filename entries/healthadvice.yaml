  notes: "The data-availability statement says the dataset, chatbot responses, and physician ratings will be posted on GitHub upon publication; no link was found in the paper text read, so open_data is unknown. Rater countries are taken from the physicians' listed affiliations (all US). The paper is a red-teaming study of four chatbots (Claude 3.5 Sonnet, Gemini 1.5 Flash, GPT-4o, Llama 3) that also defines a reusable dataset and rating scheme; kept as a benchmark because the paper names HealthAdvice as a dataset."
