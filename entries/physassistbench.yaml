  notes: "Session files inherit the PhysioNet Credentialed Health Data Licence and are to be distributed via a PhysioNet-linked repository (paper says will be released); code is MIT per Appendix A and Apache-2.0 per Appendix B (the paper is inconsistent). Four scenarios: diagnostic workup, medication safety, treatment, and one more. One physician and 8 trained annotators reviewed sessions; their countries are not stated. Heavily EHR-oriented, kept because of the doctor-patient dialogue component."
