  notes: Stanford-led; the taxonomy was built with 29 clinicians, 26 of them from Stanford. The LLM jury (GPT-4o, Claude 3.7 Sonnet, Llama 3.3 70B) rates open-ended outputs 1-5 on three axes, and 20 clinicians rated a subset to validate it. Much of the suite covers EHR and documentation tasks, which this catalog otherwise leaves out of scope; it is listed for its task taxonomy. real_user_queries refers to the EHR-derived benchmarks. The paper doesn't state a license.
