open_data: gated
geography:
  item_languages: [Italian]
  item_origin_countries: [ITA]
  item_origin_note: Forum threads from the Italian sites MedicItalia and Dica33; exam questions from the Italian specialization-exam simulator CompitoInClasse.org.
  localization: native
  lead_institution_countries: [ITA]
  subsets:
    - {name: IMB-QA, languages: [Italian], countries: [ITA], localization: native}
    - {name: IMB-MCQA, languages: [Italian], countries: [ITA], localization: native}
origin:
  builder_types: [academic]
  item_provenance: [web_forum, exam_questions]
  venue: peer_reviewed
