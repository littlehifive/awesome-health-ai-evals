id: imb
name: IMB (Italian Medical Benchmark)
kind: benchmark
year: 2025
summary: Two Italian medical QA sets, IMB-QA with 782,644 patient-doctor forum conversations and IMB-MCQA with 25,862 multiple-choice specialty-exam questions, scored by BERTScore and accuracy.
readme_section: multilingual_regional
links:
