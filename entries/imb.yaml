card:
  task: Answer an Italian patient's open-ended medical question or select the correct answer from four or five options
    in an Italian medical specialization exam question.
  items_built: The authors collected 782,644 patient questions and certified professionals' answers from MedicItalia
    and Dica33 across 77 categories, removed incomplete questions, and used Llama3-Med42-8B to reformulate and anonymize
    answers while retaining patient questions as written. They also collected 25,862 exam questions across 60 fields
    from CompitoInClasse.org, with correct answers validated by domain experts, and standardized their formatting.
  example: '"Psichiatri: per fare psicoterapia necessitano di specializzazione? Gentili dottori, uno psichiatra
    è automaticamente abilitato a fare lo psicoterapeuta, o deve, come gli psicologi che intendono anche essere
    psicoterapeuti, fare i 4 anni di specializzazione in psicoterapia? Grazie."'
  scoring: Open-ended responses are compared with reference answers using BERTScore with bert-base-multilingual-cased;
    the fine-tuning results also report ROUGE, BLEU and METEOR. Multiple-choice accuracy is the proportion of questions
    answered correctly.
  judge: BERTScore uses bert-base-multilingual-cased; multiple-choice responses are checked against the answer key.
  scale: BERTScore precision, recall and F1 for open-ended answers; proportion correct for multiple-choice answers.
  validation: ''
  results: The paper identifies gemma-2-9b-it as the strongest model in the open-ended model comparison, reporting
    BERTScore precision up to 0.638. In the separate fine-tuning table, Llama-3.2-1B-Instruct achieves the highest
    BERTScore precision, 0.7107, and F1, 0.6976.
  limitations: The authors report uneven specialty coverage, noisy or ambiguous source material, multiple-choice
    questions with multiple valid interpretations, and residual risks of identifying people after anonymization.
  sources:
