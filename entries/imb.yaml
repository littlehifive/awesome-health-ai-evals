  read_full_text: true
  confidence: high
  notes: "Paper appeared at CLiC-it 2025. Doctor answers in IMB-QA were reformulated and anonymized with Llama3-Med42-8B; patient questions are kept as written. Open-ended answers are scored with BERTScore (also ROUGE, BLEU, METEOR in the fine-tuning table); MCQ with accuracy. License conflict: the Hugging Face tag says CC-BY-NC-ND-4.0, the GitHub README badge and LICENSE file say CC BY-NC 4.0; the HF tag is used. The HF dataset is gated with manual approval. Experiments used a sampled subset of IMB-QA."
