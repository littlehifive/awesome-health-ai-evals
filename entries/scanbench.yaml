  notes: "ScanBench is introduced inside the Baichuan-M3 model paper (Baichuan-M3 Team); the paper says the dataset is 'slated for open-source release' and gives no link, so open_data is unknown. Language and case origin are not stated. Lead country CHN is the releasing company's location (Baichuan), not stated in the text I read. The inquiry stage is scored with GPT-4.1 checking coverage of the checklist, within a four-dimension SCAN framework (Safety Stratification, Information Clarification, Associative Questioning, Normative Output). The same record introduces HealthBench-Hallu, a claim-level hallucination rate (Weighted Hallucination Rate over atomic claims verified by a search agent) applied to model answers on HealthBench prompts; it ships no new items, so it is noted here rather than given its own entry. Intended users inferred from the OSCE and decision-support framing."
