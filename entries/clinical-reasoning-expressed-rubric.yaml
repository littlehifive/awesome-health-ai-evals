summary: A multidimensional rubric with provisional behavioral anchors, applicability rules, and a separate safety-critical-error flag for scoring free-text LLM responses to gold-standard clinical vignettes, with domains such as groundedness, reasoning process quality, diagnostic reasoning, temporal reasoning, and uncertainty handling.
