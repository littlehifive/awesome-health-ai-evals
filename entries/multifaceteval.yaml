  notes: "Tsinghua University. The paper names its MedQA-derived dataset MultiMedQA, which is unrelated to Google's MultiMedQA collection; keep the two apart. Five-shot accuracy with regex answer extraction; the headline metric is the proportion of knowledge points mastered across all facets. The abstract says codes and datasets are at the GitHub repo; the repo listing shows a medqa folder and rewrite.jsonl, and the MultiDiseK files were not confirmed. MIT is the repository license. MultiDiseK language and size were not found in the sections read."
