id: multifaceteval
name: MultifacetEval
kind: benchmark
year: 2024
summary: A multifaceted evaluation framework that asks the same medical knowledge point as comparison, rectification, discrimination, and verification questions, with two datasets - MultiDiseK (from a 1,000-disease expert-annotated knowledge base) and a MultifacetEval version of MedQA with 800 source questions expanded to 7,200 items.
