  notes: "Questions were generated by an LLM from label passages, steered by feedback from FDA regulatory assessors on 50 seed questions, then filtered by rules and an LLM judge validated against three human annotators. Scoring: LLM-judged answer correctness, F1 for refusal behaviour, citation quality. The Apache-2.0 license is the GitHub repository's, which holds the data (data/qa/qa.jsonl). The intended user is FDA regulatory assessors for generic drug assessment, so it is a regulatory document-QA setting at the edge of scope. Authors are at Stanford, University of Washington and the US FDA."
