  notes: "Paper text (arXiv v3) and the Hugging Face card were read. 356 seed policies, five GPT-5 queries per policy, manual check of 100 samples. Scored by keyword-based attack success rate for LLMs and accuracy/F1/FPR/FNR for guardrails. The paper also introduces the FoodGuard-4B guardrail model (not part of this entry). The GitHub link in the paper (tenghaohuang/FoodGuardBench) returned 404 when checked, so it is not listed. The HF card describes an expanded release, so counts match the paper. Food safety is borderline health scope (foodborne illness); a human may want to confirm."
