  notes: "Research Square preprint (CC BY 4.0 for the paper; no dataset license). Scenario definitions, sentinel lists, scoring rules, and prompts are available to qualified researchers on reasonable request and deliberately not posted publicly, so open_data is gated. Rater countries come from the authors' shared UCSD affiliation, not an explicit statement. Three frontier chat models were run through consumer web interfaces, three runs per scenario, and double-scored by blinded clinicians with no adjudicator. Scenario stems do not name the diagnosis."
