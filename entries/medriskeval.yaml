  notes: "The DOI record (Underline) is a conference page for the arXiv paper, originally titled Medical Red Teaming Protocol of Language Models. Only PatientSafetyBench is new; the clinician view reuses MedSafetyBench. The five categories are harmful medical advice, misdiagnosis and overconfidence, unlicensed practice, health misinformation, and bias and stigmatization (from the HF card). Authors are at Microsoft Healthcare & Life Sciences and Microsoft Research Montreal (Mila); the first affiliation's location is not stated, so Canada is recorded from the Montreal affiliation only. Judge protocol details were not read in full."
