  notes: "Read the dataset, curation and evaluation sections. No release link found: the 17 new datasets are described as proprietary, so open_data is unknown (possibly closed). Items were generated by LLMs (Gemini-2.5-pro, Qwen3-235B, DeepSeek-R1) from guidelines, textbooks and anonymized EHRs, then verified by 300 licensed physicians. Includes tasks outside scope (information extraction such as NER, medical record understanding). Open-ended answers are scored by two GPT-4o assessors with expert escalation plus a fine-tuned judge model. Authors are at Ant Group, Zhejiang University and Zhejiang provincial health bodies."
