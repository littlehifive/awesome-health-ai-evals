id: mlb
name: MLB (Medical LLM Benchmark)
kind: benchmark
year: 2026
summary: A Chinese clinical benchmark of 22 datasets (17 newly built) across medical knowledge, safety and ethics, record understanding, patient-facing services and physician support, with 4,250 sampled items scored by accuracy, F1 and an SFT-trained LLM judge.
