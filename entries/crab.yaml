  notes: "Entry is the CRAB paper (PatSnap, EMNLP 2025 Industry Track). The screened record is PatSnap/Hiro-Pharma-RAG-Benchmark, whose card cites the paper and holds the same four 100-query files; its card calls the repo private but the hub API showed it public and ungated when checked. zhm0/CRAB is the dataset linked in the paper. Scoring is citation-based (relevance precision, irrelevance suppression, curation efficiency F1), not answer correctness; human evaluation of citations was done only on the English portion to validate the metric. Query categories: basic biology, drug development and design, clinical translation and application, ethics and regulation, public health and infectious disease. Scope is borderline (biomedical RAG curation rather than health chat); a human may want to decide."
