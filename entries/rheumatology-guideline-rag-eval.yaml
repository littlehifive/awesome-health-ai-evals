  notes: "Primarily a RAG-system paper; the question set is a by-product, released as a supplementary Excel file (per the medRxiv data-availability statement; code only on request). open_data is set to open on that basis but the supplement itself was not opened. Questions were generated with ChatGPT-4.5 and 14 were replaced by rheumatologists; the authors note they did not verify that each question is answerable from the guideline. Judge was Gemini 2.0 Flash; two rheumatologists rated a 15 percent sample. Records are the journal version (EULAR Rheumatology Open) and the medRxiv preprint. Not related to RheumBench or RheumaMIR."
