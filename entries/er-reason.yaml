  notes: "Dataset is on PhysioNet under the PhysioNet Contributor Review Health Data License 1.5.0 with credentialed access (CITI training, data use agreement), per the GitHub README and PhysioNet page. Inputs are real EHR notes, so this is borderline against the EHR-documentation exclusion; kept because the tasks are clinical decision reasoning, not documentation or coding. Rater countries assumed USA from the single US health system; the paper does not list them separately. Rationale authors are residents and attendings. Lead institution country from the author block (UC Berkeley, UCSF)."
