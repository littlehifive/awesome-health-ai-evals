card:
  task: Generate a long-form answer in Persian to each medical question.
  items_built: The authors collected 5,231 medical question-and-answer pairs from publicly available textual resources,
    selecting pairs approved by at least two specialist doctors.
  example: ''
  scoring: Generated answers are compared with reference answers using ROUGE-L, BERTScore, MoverScore, and BLEURT.
    The paper reports separate dataset scores for each metric and evaluation setting but does not specify how item
    scores are aggregated.
  judge: Automatic scoring uses ROUGE-L, BERTScore, MoverScore, and BLEURT.
  scale: Separate ROUGE-L, BERTScore, MoverScore, and BLEURT scores; BERTScore is described as normalized to 0-1
    but reported on a 100-point scale.
  validation: ''
  results: BioPars led the tested models on BioParsQA, with maximum scores of 29.99 ROUGE-L, 90.87 BERTScore, 60.43
    MoverScore, and 50.78 BLEURT across evaluation settings. GPT-4's best ROUGE-L was 28.99.
  limitations: The authors state that BioPars cannot guarantee accurate answers and advise users to seek expert
    advice because incorrect medical information can have serious consequences.
