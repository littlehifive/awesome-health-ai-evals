  notes: The main contribution is the BioPars model and BIOPARS-BENCH pretraining corpus (not part of this entry); the QA set is the evaluation part. The paper says the QA dataset is "publicly available for research purposes", but gives no link, and the listed repository (github.com/amirap80/BioPars) returned 404, so open_data is unknown. The scoring metrics were not confirmed in the text read (automatic metrics assumed from the screening record). Question source sites and the doctor-approval step are from one paragraph. The lead country is Iraq (first author, University of Kufa); the last author is in Iran. Second record is the Scientific Reports version.
