  notes: "README of the companion repository for a primer paper ('Benchmarking Language Models for Clinical Safety: A Primer for Mental Health Professionals') whose citation was not yet published. SIRI-2 is an existing human clinical-skills instrument (cited 1997); the repo ships its items and expert scores (license listed as MIT for the repo, but the underlying instrument's rights were not checked). Part of MindBench.ai with NAMI, per the README. The README says 24 items in one place and 25 scenarios in another; counts are as stated. The scoring compares model ratings to expert means, which fits expert_human_rating loosely. Authors and institutions not identified from the README; owner is a GitHub user."
