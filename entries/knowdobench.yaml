  notes: "Two board-certified physicians (Internal Medicine and Informatics; Emergency Medicine and Ethics) independently reviewed all cases and agreed on every label. Case families: solvable, epistemic constraint, normative constraint, normative control. Scoring is deterministic (a correct number or a refusal); an LLM classifier tags failure types. The released dataset also holds 197 finance cases that are out of scope. FrameProbe is the accompanying evaluation framework and is covered by this entry. Authors at the Michael E. DeBakey VA Medical Center and Baylor College of Medicine (per the dataset card)."
