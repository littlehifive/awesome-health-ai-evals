summary: A multi-metric framework (G-Eval, BARTScore, semantic entropy, cosine similarity) for scoring clinical hallucination in web-deployed custom medical GPTs, used with an LLM-based pipeline for policy violations on 1,500 sampled MedGPTs and 10 open-source LLMs.
