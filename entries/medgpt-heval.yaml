card:
  task: Answer a diagnostic question presented in a clinical vignette five times so that factual alignment and response
    consistency can be assessed.
  items_built: The authors extracted diagnostic questions from MedQA and framed them within clinical vignettes,
    repeating each question five times. The framework was applied to 1,500 sampled MedGPTs and 10 open-source medical
    LLMs.
  example: ''
  scoring: Gemini 3.1 Pro scores each response on five G-Eval criteria, with rubric scores averaged across components
    and responses. Separate metrics measure response likelihood given the clinical input using BARTScore, semantic
    alignment using BioBERT cosine similarity, and variability across repeated answers using semantic entropy.
  judge: Gemini 3.1 Pro assigns G-Eval scores; pretrained BART and BioBERT compute BARTScore and cosine similarity.
  scale: 'G-Eval and cosine similarity: 0 to 1, higher is better; BARTScore: log-probability, higher is better;
    semantic entropy: lower is better.'
  validation: Human reviewers independently assessed responses from 300 MedGPTs, comprising 200 top-tier and 50
    each middle- and bottom-tier models, and resolved discrepancies by consensus. Agreement with automated scoring
    was 90.5-94.0%, with Cohen's kappa of 0.8163.
  score_meaning: Cosine similarity of 0 means no similarity to the clinical input, while 1 means perfect alignment.
    BARTScore below -4 indicates weak alignment and scores of -3.5 or higher indicate stronger alignment; semantic
    entropy below 2 indicates moderate response stability.
  annotation_process: Each model received the same MedQA clinical question five times to capture variation across
    answers. G-Eval checked factual consistency, cited sources and logical coherence, incorporating token-level
    confidence to reduce verbosity bias. Human reviewers assessed responses against the ground truth using the same
    metrics as the automated system.
  results: Among the 10 open-source models, Galactica had the highest G-Eval score at 0.6480. MedAlpaca and Apollo
    tied for the highest reported cosine similarity at 0.4863 and BARTScore at -1.6549.
