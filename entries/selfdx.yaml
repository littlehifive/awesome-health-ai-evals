  notes: "The 200 evaluation cases are withheld (supplementary D.2); the paper promises release of a 358-case construction pool, the 128-example SFT set, two rubrics and a physician workbook, with no link seen. open_data is closed for the evaluation set; recheck later. An LLM judge (Gemini) scores the first two substantive sentences on a 5-point rubric, validated against one physician (kappa 0.73). Lead institution country inferred as USA from NYU Langone (last author) and Pareto Inc (first author, country not stated). Builder type is a guess (Pareto Inc type not stated)."
