  notes: "Items are organized under three roots of the Tree of Medicine (physiopathology, diagnosis, therapy). Stems were drafted by GPT-5.4 from annotator-extracted evidence spans, then adjudicated by a panel of five (three Tibetan medicine physicians, one TCM physician, one biomedical physician). MCQ distractors are labeled as intra-Tibetan, TCM-drift, or biomedical-drift, which gives log-odds drift metrics; open-ended QA is scored 1-100 by a GPT-5.4 judge on a five-dimension rubric. Code and data are linked only through an anonymous review repository, which was not opened, so open_data is unknown and no license is recorded. Countries (CHN) are inferred from the authors' institutions (UESTC, Tibet University) and the Chinese national standard used, not from an explicit statement; please check."
