  notes: "Paper and the ACM KDD 2026 proceedings record (Crossref 10.1145/3770855.3817579, retitled Contamination-Limited) are the same work. The paper says code and data are available but gives no resolvable link in the text read here, so open_data and license are unknown. The GitHub repo liuqingqing031122/LiveMedBench (record r_596c11a612) is NOT this benchmark: its README describes a web platform for judging outdated medical information in Claude, GPT-5, Gemini, and DeepSeek; it is kept in records for traceability only and not linked. A human check on 50 cases used two bilingual physicians. Items are real physician-answered forum threads, rewritten into structured cases by a multi-agent pipeline."
