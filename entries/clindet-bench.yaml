  notes: "Repo README lists the benchmark data, raw outputs of 8 LLMs, and runner scripts; the repo carries an MIT license but the data license was not separately seen, so license is null. The paper reports 94 cases in one place and 333 scenarios across the evaluation in another; the counts were not reconciled. Cases were created and verified by one board-certified physician (Japan-based authors). Language is assumed English. Evaluated under Base, CoT, and Safe prompts."
