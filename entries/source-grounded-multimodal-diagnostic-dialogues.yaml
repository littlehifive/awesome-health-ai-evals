summary: A framework that converts PubMed Central case reports into staged multimodal diagnostic dialogues with evidence disclosure, scored by an LLM judge on final diagnosis, reasoning, and image-finding F1 plus factuality, validity, coherence, and utility; tested on 24 internal medicine cases.
