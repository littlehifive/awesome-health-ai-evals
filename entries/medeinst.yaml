card:
  task: Read each first-person patient narrative and name the correct diagnosis from 49 possible diseases, treating
    control and trap cases as independent diagnostic tasks.
  items_built: The authors filtered 226,814 DDXPlus samples for cases whose two leading diagnoses differed in probability
    by less than 0.5%, converted structured features into narratives, and used an LLM to substitute distinguishing
    evidence grounded in the DDXPlus knowledge base. GPT-5, DeepSeek-R1, and Gemini-2.5-Pro checked the pairs, requiring
    two votes for diagnostic correctness; four board-certified physicians with over eight years of clinical experience
    reviewed 1,500 pairs, finding 96.1% valid with Fleiss' kappa of 0.79, and failing pairs were revised or excluded.
  example: ''
  scoring: 'Predicted diagnoses are compared with the control and trap ground-truth labels: Baseline Accuracy is
    the fraction of controls diagnosed correctly, and Robust Accuracy is the fraction of pairs with both diagnoses
    correct. Bias Trap Rate is the fraction of correctly solved controls whose paired trap receives the control
    diagnosis rather than the trap diagnosis.'
  judge: Predicted diagnoses are compared with the dataset's ground-truth labels.
  scale: Correct or incorrect diagnosis per case; Baseline Accuracy, Robust Accuracy, and conditional Bias Trap
    Rate are reported as percentages.
  validation: ''
  results: ECR-Agent using Qwen3-32B achieved the highest Baseline Accuracy at 69.49%, the highest Robust Accuracy
    at 24.21%, and the lowest Bias Trap Rate at 33.75%. Among standalone LLMs, GPT-5 led Baseline Accuracy at 54.30%
    and Robust Accuracy at 15.78%, with a Bias Trap Rate of 51.87%.
  limitations: The authors note that coverage is limited to 49 common pathologies across eight departments, leaving
    rare diseases and complex comorbidities unexplored, and warn that the synthetic narratives are biased toward
    acute-care conditions and require rigorous clinical validation before real-world deployment.
