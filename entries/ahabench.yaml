id: ahabench
name: AHaBench
kind: benchmark
year: 2025
summary: 500 mental-health prompts adapted from Reddit posts with emotional-dependency cues and reference responses, used to score LLM responses for affective hallucination (emotional enmeshment, illusion of presence, fostering overdependence).
