  notes: From the Zenodo record and the Data (MDPI) abstract. The earlier abstract says 1,147 pairs; the Zenodo record and journal paper say 1,262. QA pairs were generated by GPT-4o mini and checked with a Claude Sonnet 4.5 G-Eval judge plus a physician and a physical therapist rating 200 pairs. No protocol for scoring other models is described, so eval_methods is a guess; the data is positioned for RAG and language-model evaluation and development. Author institutions and builder type were not captured. Zenodo also offers an Alpaca-format version for fine-tuning.
