  notes: "Fitness and exercise coaching; health area is a placeholder (other_specialty) because no sports-medicine value exists. The GitHub repository (no license identified) releases only 80 of the 809 questions and keeps full scoring evidence private; grading is run by maintainers, and the README warns that public rubrics and answers can leak into training data. Items are generated by LLM pipelines from user profiles and real activity logs; the extent of expert review was not checked. The README says the repo was moved to Keep-Tech/MoveBench. Rubric items stress safety, scientific validity, and personalization."
