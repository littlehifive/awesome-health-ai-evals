  notes: "Translation used an agentic pipeline (medical NER, a 350,000-pair dictionary, two LLM reviewer agents, Claude as translator) with expert rating of samples (at least two bilingual experts per entry sampled, 1-5 scale). Benchmark evaluation covers NLI and MCQA only; long-form QA is in the dataset but not scored in the evaluation section. The paper also trains GlobMed-LLMs (not an entry). MIT license is from the Hugging Face card and the GitHub repo; MedNLI is excluded from public release (PhysioNet access). Hugging Face list was found by searching the ruiyang-medinfo account; the paper links a collection. Rater countries not stated."
