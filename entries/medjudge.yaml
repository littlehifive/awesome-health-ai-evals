  notes: "University of Pittsburgh lead. Evaluates the judge rather than the health model directly, and reads partly as governance guidance, so a human may prefer to move it to Related guidance. Pillars cover task-paradigm alignment, judge model diversity, bias audit, error propagation, adversarial robustness, expert validation, and drift monitoring."
