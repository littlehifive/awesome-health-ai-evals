card:
  task: Evaluate a healthcare LLM judge through risk-tiered checks of its scoring validity, bias, robustness, error
    propagation, and human oversight.
  items_built: The authors developed guidance for healthcare LLM-as-a-judge systems from a PRISMA-ScR scoping review
    of six databases covering January 2020 to January 2026, screening 11,727 studies and including 49. The framework's
    requirements were derived from gaps in those studies rather than a fixed set of test items.
  example: ''
  scoring: The framework proposes comparing judge scores across reordered, reformatted, and source-attributed versions
    of the same content, and comparing judge ratings with expert ratings. It specifies separate checks and risk-tier
    thresholds rather than a combined overall score.
  judge: Domain-relevant experts validate judges, with board-certified specialists for Tier B and multi-institutional
    subspecialty panels for Tier C.
  scale: Separate check-specific metrics, including score variance, length-score correlation, expert agreement,
    and system error rate; no overall scoring scale.
  validation: ''
  results: ''
  limitations: The authors state that MedJUDGE is an evidence-informed starting point rather than a finalized deployment
    standard, and that its proposed thresholds and error-propagation bounds require empirical calibration across
    clinical tasks and real pipelines.
  sources:
  - https://arxiv.org/abs/2604.25933
