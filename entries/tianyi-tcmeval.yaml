  notes: "The paper is mainly about the Tianyi model (7.6B parameters); TCMEval is its evaluation framework. Data statement: de-identified TCMEval data can be requested from the corresponding author under a data-request protocol, hence gated. Item counts for TCM-MCE (a 20% sample of collected exam questions), TCM-CRT and TCM-DQA were not found. Ten TCM doctors (five senior) rated answers on correctness, comprehensiveness, safety and legibility. Named TCMEval in the paper; not the same as TCM-Eval (Beihang) or TCMEval-SDT or TCMEval-PA."
