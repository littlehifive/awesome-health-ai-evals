summary: Evaluation suite released with the Tianyi TCM language model, combining regular TCM tasks (exam multiple-choice, clinical-record syndrome and prescription tasks, domain QA) with real-world tests (physician ratings of syndrome and prescription answers, clinical-trial outcome prediction).
