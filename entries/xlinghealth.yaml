summary: Cross-lingual health Q&A benchmark built by translating three English expert-curated datasets (HealthQA, LiveQA, MedicationQA; 2,070 questions) into Spanish, Chinese, and Hindi, with the XLingEval framework scoring correctness, consistency, and verifiability.
