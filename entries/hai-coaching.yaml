  notes: "Primarily a dataset-construction case study; the evaluation use (safety classification and generation tests of open LLMs, appendix tables) is secondary, so check whether it belongs in the catalog. The license is the repository's (LGPL-2.1); the dataset is dataset.xlsx in the GitHub repo. Safety was left to each expert's judgment, then aligned by discussion; inter-annotator agreement was checked on 400 candidates. Lead institution: first and last authors are at Charles University, Prague (second affiliation Aberdeen, UK; Cagliari, Italy for others); expert raters appear to be nutrition professionals but their countries are not stated in the text I read."
