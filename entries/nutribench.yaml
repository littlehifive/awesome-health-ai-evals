card:
  task: Estimate the total carbohydrate content in grams from each natural-language meal description.
  items_built: GPT-4o-mini generated 11,857 meal descriptions from What We Eat in America and FAO/WHO GIFT dietary
    records across 11 countries, with nutrient labels derived from the source data. One author checked that food
    names and serving sizes matched the labels and corrected missing information.
  example: '"During lunch, I had a piece of tasty medium crust pepperoni pizza and washed it down with a carton
    of 100% orange juice."'
  scoring: Predicted carbohydrate amounts are compared numerically with the meal labels to calculate mean absolute
    error and Acc@7.5, the percentage within 7.5 grams of the labeled value. Models can return -1 when uncertain,
    and answer rate reports the percentage of queries answered.
  judge: Numerical comparison with the dataset's carbohydrate labels determines the scores.
  scale: Per-item absolute error in grams and correctness within ±7.5 grams; aggregate MAE, Acc@7.5, and answer
    rate.
  validation: ''
  results: GPT-4o with chain-of-thought prompting achieved the highest accuracy, 66.82%, with an answer rate of
    99.16% and MAE of 8.61 grams. Three professional nutritionists estimated carbohydrates for 72 U.S. meals, taking
    an average of 43 minutes, compared with 2 minutes for GPT-4o-mini.
  limitations: The authors report that prediction errors increase with meal carbohydrate content and vary across
    countries and cuisines.
