  notes: "Meal descriptions were generated by GPT-4o-mini from real survey meals and human-verified; the paper evaluates carbohydrate estimation (accuracy within a tolerance and MAE), with a study of three nutritionists and a type 1 diabetes glucose simulation. The ICLR 2025 venue is from the dataset card; the arXiv text was read. Several other Hugging Face datasets (translations such as NutriBench-Spanish, and NutriBench-Kitchen) appear to be by other teams and are not merged here. The paper says to reproduce its results with v1."
