id: chiu-chung-genai-clinical-consultation-protocol
name: Protocol for human evaluation of GenAI chatbots in clinical consultations
kind: eval_framework
year: 2024
summary: A study protocol that defines a standardized zero-shot prompt template and a 5-point Likert rubric (factual consistency, comprehensiveness, coherence, medical harmfulness) graded by two clinician panels, for 40 clinical microbiology and infectious-disease consultation scenarios across four chatbots.
