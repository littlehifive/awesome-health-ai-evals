id: nlat-ai-ref-ai
name: NLAT-AI and REF-AI
kind: eval_framework
year: 2024
summary: Two rubrics from a prostate-cancer patient-education study, NLAT-AI (expert Likert rating of accuracy, safety, appropriateness, actionability, effectiveness) and REF-AI (check of chatbot references for hallucination, relevance and quality), used with adapted PEMAT, DISCERN and readability measures on 8 ChatGPT-4 answers.
