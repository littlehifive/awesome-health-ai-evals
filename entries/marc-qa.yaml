  notes: "The paper states the dataset and code are public at the GitHub repo (the repo calls it MedARC-QA, data in data_medARC_v1); the paper itself is CC-BY-4.0 but no separate dataset license was seen. Five physicians answered the questions as a baseline (average accuracy 0.66); their countries are not stated. Lead institution taken from the first author's Stanford affiliation; later authors are at several US and UK institutions. Also analyses uncertainty and overconfidence."
