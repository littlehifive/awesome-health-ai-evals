id: dyreme
name: DyReMe
kind: benchmark
year: 2026
summary: A dynamic diagnostic benchmark that generates fresh consultation-style cases (with differential-diagnosis and misdiagnosis confounders and varied patient expression styles) from seed cases, scored by the EvalMed protocol for accuracy, veracity, helpfulness, and consistency; 3,200 questions were used to test 12 LLMs.
