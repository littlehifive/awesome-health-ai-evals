id: medical-ai-evaluation-diabetes-dialogue
name: Medical AI Dynamic Evaluation System (diabetes assistant)
kind: eval_framework
year: 2026
summary: An open-source system in which an LLM patient agent plays five predefined diabetes patient roles in multi-turn conversations with a target medical AI, and an isolated LLM evaluator scores the logs on eight dimensions including correctness, safety, multi-turn fluency, and empathy.
