card:
  task: Answer medical questions written in Moroccan Arabic (Darija).
  items_built: The authors compiled 108,943 question-answer pairs from medical websites, books, articles, and transcribed
    health videos and radio programs, translating non-Darija content into Moroccan Arabic. Three native Moroccan
    Arabic speakers reviewed transcriptions and translations, and five medical doctors each reviewed every pair
    for medical accuracy and specialty labels, resolving ambiguous categories by consensus.
