id: meddx
name: MedDDx
kind: benchmark
year: 2024
summary: 1,769 four-option multiple-choice medical questions (drug, disease, and gene/protein queries) built from STaRK-Prime, with distractors chosen by semantic similarity and three difficulty tiers (Basic 483, Intermediate 1,041, Expert 245).
