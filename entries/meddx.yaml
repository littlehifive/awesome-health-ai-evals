  notes: "Introduced inside the KGARevion agent paper (Harvard, Zitnik lab); the benchmark is a side contribution. The repository dataset folder holds MedDDx.json; no license seen on the repo. Questions are knowledge-graph style (find drugs, genes, or proteins matching a description), so the content leans biomedical-knowledge rather than clinical vignettes; scope is borderline. The paper also uses AfriMed-QA, MedQA, MMLU-Med, PubMedQA, and BioASQ, which are not part of this entry. Venue: arXiv preprint (a conference version may exist; not checked)."
