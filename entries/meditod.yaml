  notes: "Six annotators with medical or pharmacy backgrounds labeled the dialogues under a doctor's supervision, using a questionnaire-based scheme (CMAS ontology). It is mainly a dataset for building and evaluating medical task-oriented dialogue systems (slot and intent understanding, next-question policy, generation), so it leans toward training and evaluation of dialogue components rather than chatbot answer quality. GitHub repo has no license file (API 404), so license is null. Venue unconfirmed (likely a 2024 NLP conference), listed as preprint."
