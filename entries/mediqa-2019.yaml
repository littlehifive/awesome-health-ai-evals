  notes: "NLM (US National Institutes of Health) lead with IBM Research. Overview paper of a shared task; 72 teams took part. The paper says the training, validation and test sets are publicly available (GitHub and AIcrowd links), but no license was seen. Only the QA re-ranking and question-entailment tasks are consumer-health questions; the NLI task is clinical sentence pairs from MIMIC-III (biomedical NLP), so scope is partial. Distinct from the existing mediqa-answer-summarization entry (MEDIQA-AnS)."
