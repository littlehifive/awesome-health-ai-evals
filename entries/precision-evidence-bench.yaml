card:
  task: Answer each patient-specific clinical question with citations to applicable evidence, report that evidence
    faithfully, and indicate when no matching evidence exists.
  items_built: Atropos Health created 209 synthetic questions specifying treatment comparisons, patient populations,
    outcomes and follow-up windows, with no patient data. Two physicians refined the questions over several rounds.
  example: ''
  scoring: 'Graders assess five criteria against the question and the answer''s own citations, without a reference
    answer: full PICO alignment, three partial alignments and faithful reporting. Majority verdicts determine five
    ratings: faithful full alignment is highest, faithful answers with two, one or no partial matches rank below
    it, and unfaithful answers rank lowest regardless of alignment.'
  judge: The internal grading panel uses three LLM jurors from different providers; their model names are not given.
  scale: Fraction of jurors agreeing on each criterion; five answer ratings from Precision match to Unsupported
    claim, with Precision match rates reported across questions.
  validation: ''
  results: Across four frontier LLMs, Precision match rates were 13-18% with web search alone, 17-28% with access
    to 100 million precision evidence-based findings, and 41-56% with 500 million findings. The abstract does not
    identify the highest-scoring model.
  limitations: ''
