card:
  task: Hold a multi-turn conversation with a simulated primary-care patient, use the patient's health record, and
    carry out healthcare tasks through tools.
  items_built: The framework generates synthetic patient profiles, health records, clinical scenarios, and initialized
    healthcare sandboxes on demand from a configurable seed distribution, rather than providing a fixed dataset.
    The paper used 1,200 scenarios.
  example: ''
  scoring: An LLM jury scores each conversation trace, including messages, tool calls, and tool results, against
    over a hundred clinician-grounded criteria across six dimensions. Results report mean dimension scores, the
    percentage of conversations scoring at least 3, and an aggregate score.
  judge: An LLM jury assigns the scores; the provided text does not name its models.
  scale: 1-5 per dimension; mean scores, pass rates at ≥3, and an aggregate score.
  validation: Licensed clinicians rated shared conversations to validate the jury, with 79-93% adjacent agreement.
  score_meaning: A score of 3 means Adequate, and higher scores indicate better performance.
  annotation_process: ''
  results: Claude Opus 4.8 ranked first with an aggregate score of 4.25.
  limitations: ''
