  notes: "The data-availability statement says the data are on the MedBench platform (medbench.opencompass.org.cn) and access is by contacting the MedBench team or the corresponding author, so recorded as gated. The 2,260 total is my sum of the table rows, not a figure stated by the authors. Builds on and extends TCM-3CEval from the same group (Shanghai University of TCM and Shanghai AI Laboratory). Also reports a five-permutation option-shuffle consistency test. Not seen: dataset license."
