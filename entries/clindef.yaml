  notes: "Zhejiang University with AntGroup. The Diagnostic Quality Score covers seven dimensions (chief complaint exploration, history completeness, evidence chain integrity, test justification, differential diagnosis, diagnostic correctness, diagnostic uncertainty) with 0 to 100 total weights. Patient and examiner agents were GPT-5. Three experts validated the LLM judge and five clinicians checked 200 cases (99.0 percent without information leakage). No code or data link found in the text."
