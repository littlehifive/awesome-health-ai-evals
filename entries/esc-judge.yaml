  size: "25 synthetic help-seeker roles in the paper's study; framework can generate more"
card:
  task: Hold an emotional-support conversation with a simulated help seeker so that it can be compared with another
    model's conversation with the same role.
  items_built: The framework synthesizes help-seeker roles by sampling stressors, personality attributes, and life
    history, then uses those roles to simulate separate sessions with each model under test. Its evaluation rubrics
    are grounded in Clara Hill's Exploration-Insight-Action counselling model.
  example: ''
  scoring: A judge LLM compares two models' conversations with the same help-seeker role and assigns pairwise preferences
    across rubric-anchored skills in Exploration, Insight, and Action.
  judge: A judge LLM assigns preferences; the repository's example judging command uses o1-mini.
  scale: Pairwise preferences by rubric skill across Exploration, Insight, and Action.
  validation: The judge agreed with two PhD-level annotators on 85% of Exploration, 83% of Insight, and 86% of Action
    decisions.
  score_meaning: ''
  annotation_process: The judging script matches conversation outputs by role ID before evaluation. It loads the
    judging prompt and skill criteria from files in the repository's data directory.
  results: ''
  limitations: ''
