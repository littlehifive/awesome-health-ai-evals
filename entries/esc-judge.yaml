id: esc-judge
name: ESC-Judge
kind: eval_framework
year: 2025
summary: An automated pipeline that compares emotional-support chatbots head-to-head by simulating help-seeker roles and having a judge LLM give pairwise preferences on Exploration, Insight, and Action skills from Hill's counselling model.
