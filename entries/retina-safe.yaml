  notes: "Text-only: each sample is a question, four options, gold answer, and evidence text derived from DR grading signals (no image input to the LLM). The paper's main contribution beyond the benchmark is ECRT, a white-box hallucination detector scored by balanced accuracy on five 2-8B open models. No code, data link, or license was found in the text, so open_data is unknown. Only part of the paper was read; borderline for scope as a detector benchmark."
