  notes: "A clinician agent talks to LLM patient and environment-controller agents and an LLM evaluator scores the trajectory against the rubric. Twelve clinicians reviewed 100 constructed cases. MIT is the license on the Hugging Face card; the paper says the code is CC BY-SA and the source MedEdPORTAL articles are CC BY, CC BY-NC, or CC0, so redistribution terms are mixed. The data is a file tree, not a tabular dataset."
