  notes: "The paper (TrackList) is an analysis of how pretraining term frequency affects small open LLMs (OLMo, Pythia); RefoMed-EN is the dataset it introduces. The ethics section says the dataset has an open license (CC BY-NC 4.0) and says it will be shared on GitHub, but no link was found, so open_data is unknown. r_103f91e560 is an Underline conference-video record of the same paper; the venue was not identified, so venue is preprint. The original RefoMed2 (Buhnila et al., 2024) has no entry, so adapted_from is omitted."
