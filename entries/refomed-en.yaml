card:
  task: Answer a medical question by giving the requested definition, name, example, explanation, or paraphrase.
  items_built: The authors translated French RefoMed2 into English using the DeepL Translator API, retaining 6,170
    human-annotated medical terms and their reformulations, originally extracted semi-automatically from scientific
    and public-facing texts and abstracts in the ClassYN and CLEAR corpora. They extensively preprocessed the dataset
    to address formatting and translation inaccuracies.
  example: '"Give examples of severe motor disorders"'
  scoring: BERTScore compares each generated answer with its human-annotated reference answer, and Pearson correlations
    relate these scores to log term frequency in the pretraining corpus by question type. A separate analysis uses
    paraphrase-MiniLM-L6-v2 embedding cosine similarity between terms and answer n-grams, retaining the top three
    matches and correlating similarity with pretraining co-occurrence probability.
  judge: Automatic scoring uses BERTScore and paraphrase-MiniLM-L6-v2; the authors also manually examined 400 answers
    for hallucinations.
  scale: Per-answer BERTScore and embedding cosine similarity; reported Pearson correlations with pretraining frequency
    and co-occurrence probability.
  validation: ''
  results: OLMo-1b had the lowest reported hallucination rate, 33%, in a manual analysis of 400 answers from four
    models on 100 head and tail terms. OLMo-7b-Instruct followed at 39%.
  limitations: The authors evaluated only small models without domain fine-tuning or retrieval, and noted that BERTScore
    can reward irrelevant repetition of a medical term rather than a correct answer.
