summary: 6,170 human-annotated medical terms with gold definitions, denominations, exemplifications, explanations, or paraphrases (machine-translated from the French RefoMed), used to test how open LLMs answer five question types about head and tail medical concepts, scored by BERTScore and embedding similarity.
