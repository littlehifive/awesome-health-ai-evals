  notes: "Gemini-flash 2.0 generated the questions from decision paths extracted from three textbooks (Mushlin and Greene, Harrison and Mohammed, Goldfarb-Rumyantzev); a second LLM pass refined flawed items and a human-in-the-loop checked a subset. Multiple-choice is scored by exact match on the letter; open answers by a Gemini-flash 2.0 judge (0 to 10) and BGE-M3 semantic similarity. Physicians and senior students rated a sample on a 0-15 scale (Table 3). The paper says the dataset is available on Kaggle but gives no link or license, so license is null. The code link is an anonymized repository. First-author countries are from the affiliations (Italy; the Cambridge author is last)."
