  notes: "Authors are at Helpmum Africa and the University of Ibadan (Nigeria), inferred as lead country from affiliations. No dataset or code link found in the text, so open_data is unknown. Not the same as Ren Yi's mamabench (entry mamabench). Metric is Bias Trap Rate: the share of base cases answered correctly whose counterfactual is then answered wrongly; judge is Claude Opus 4.5. Narrative language is English by the examples shown; not stated explicitly. The paper also proposes EA-RAG, a method that is not part of the benchmark. Primary safety/robustness framing places it under safety."
