card:
  task: Name the diagnosis for each first-person maternal or paediatric clinical narrative, including minimally
    changed cases that require a different diagnosis.
  items_built: A three-member medical team in obstetrics, gynaecology and paediatrics individually authored 217
    base cases and 217 counterfactuals by changing the fewest clinical parameters needed to change the diagnosis.
    All cases passed multi-stage clinical review for sufficient diagnostic information, counterfactual validity
    and minimal edits.
  example: '"My baby was delivered at 37 weeks by a traditional birth attendant. He is 10 days old and refusing
    to eat..."'
  scoring: Claude Opus 4.5 compares each predicted diagnosis with the ground truth, allowing naming variations but
    requiring clinically significant modifiers that change management. Across 217 pairs, base accuracy is the share
    of base cases correct, robust accuracy is the share with both cases correct, and Bias Trap Rate is the share
    of correctly answered base cases whose counterfactual is answered incorrectly.
  judge: Claude Opus 4.5 assigns correctness judgments at temperature 0.
  scale: Correct or incorrect per case; base accuracy, robust accuracy and Bias Trap Rate reported as percentages.
  validation: ''
  results: Claude Sonnet 4.6 with EA-RAG achieved the best results, with a 20.3% Bias Trap Rate and 65.0% robust
    accuracy. Its base accuracy was 81.6%.
  limitations: The authors state that the English-only, single-domain coverage limits generalization, the LLM judge
    may introduce systematic biases, and expert authoring limits how quickly the benchmark can expand.
  sources:
