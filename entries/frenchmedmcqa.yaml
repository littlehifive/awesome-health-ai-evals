  notes: "License is Apache-2.0 per the Hugging Face card tag and the GitHub README badge; the paper states none. The 2025 RANLP paper (r_46601f30d5) enriches the same questions with student answer rates and difficulty annotations (uy-rrodriguez/FrenchMedMCQA-extended, CC-BY-4.0 per its tags) and is merged here as an extension by the same research community (Avignon/Aix-Marseille); authors overlap was not checked. The original paper's baselines are fine-tuned encoder models, not chatbots, but the dataset is widely reused for LLM evaluation."
