card:
  task: Answer yes or no to whether a patient needs immediate emergency intervention or should receive opioid analgesics
    during a hospital stay, using the clinical details provided.
  items_built: The authors extracted 6,800 ED cases using initial vital signs, chief complaints and Emergency Severity
    Index labels, and 1,812 opioid cases using hospitalization profiles, discharge notes and prescription labels
    from MIMIC-IV v3.1, removing inconsistent fields and gender-specific diagnoses. They generated a demographic-free
    baseline and 12 race-by-gender variants at three context levels, then split cases into 80% training, 5% validation
    and 15% test sets, keeping all variants of each case together.
  example: ''
  scoring: Accuracy is the proportion of predicted yes/no labels matching the recorded targets; five fairness scores
    compare prediction probabilities across demographic groups and against the demographic-free baseline, subtracting
    normalized statistically significant effect sizes from 1. The geometric mean of the five fairness scores gives
    mFARM, and the harmonic mean of mFARM and accuracy gives the Fairness-Accuracy Balance (FAB) score.
  judge: Automated exact-match scoring against recorded labels and statistical tests assign the scores.
  scale: Per-item labels are correct or incorrect; accuracy, fairness sub-scores, mFARM and FAB range from 0 to
    1, with higher scores better.
  validation: ''
  score_meaning: A fairness sub-score of 1.0 is assigned when the initial statistical test finds no significant
    differences across groups; lower scores reflect more frequent or larger significant disparities. A low score
    on any one fairness dimension strongly reduces mFARM, while a high FAB score requires both high fairness and
    high accuracy.
  annotation_process: For variance fairness, Levene's test first checks for differences across demographic groups.
    If differences are significant, follow-up Levene's tests compare each demographic group with the demographic-free
    baseline and with other demographic groups, using Bonferroni-adjusted p-values.
  results: Fine-tuned BioLlama3-8B led ED triage with a FAB score of 0.804 and accuracy of 0.738. Fine-tuned Mistral-7B
    led opioid recommendation with a FAB score of 0.875.
  limitations: The framework does not yet support free-text outputs.
