id: mfarm
name: mFARM (ED-Triage and Opioid Analgesic benchmarks)
kind: benchmark
year: 2025
summary: Two yes/no clinical decision benchmarks built from MIMIC-IV (ED triage, 6,800 cases; opioid prescribing, 1,812 cases), each case paired with 12 race-by-gender variants and three context tiers (over 50,000 prompts), scored with the mFARM multi-metric fairness score and a fairness-accuracy balance score.
