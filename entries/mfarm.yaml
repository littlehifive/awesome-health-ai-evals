  notes: "IIT Madras (CeRAI) lead, University of Texas at Dallas last author. Only the code to build the prompts is public; MIMIC-IV access needs PhysioNet credentialing, so the prompts themselves are not released (open_data set to closed on that basis; a gated route via the code is possible). The paper also fine-tunes four 7-8B models with LoRA. Scoring is binary (yes/no) outputs plus fairness statistics, not free text."
