  notes: "The first two records are the 2025 JMIR AI preprint of the English-only version (1,341 MCQs; 918 from WHO and CDC guidance, 423 from journal articles); the npj Vaccines paper (2026) adds Spanish and Chinese and is the main source here. English MCQs were generated by GPT-4 from authoritative pages and articles, then reviewed; Spanish and Chinese sets were reviewed by native speakers. CC-BY-4.0 is the license on the Zenodo record; the code repo is MIT. Authors are at the University of Hong Kong, HKUST, and LSHTM; Hong Kong is coded CHN. Spanish and Chinese item-origin countries are not stated."
