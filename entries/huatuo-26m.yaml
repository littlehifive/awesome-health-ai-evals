  notes: "Mainly a large training corpus; the benchmark use is retrieval (top-1000 ranking) and generation scored with BLEU, ROUGE and similar. Paper says the URL-only version is open and the full-text version is released only to research institutions, so access is recorded as gated. License not stated in the sources seen. Answers come from doctors in online consultations and automatic extraction and may contain errors (per the paper's ethics statement). Tests of the Huatuo26M-Testdatasets Hugging Face set were not examined."
