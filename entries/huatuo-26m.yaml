card:
  task: For each Chinese medical question, rank the top 1,000 answers from the dataset's answer pool or generate
    an answer.
  items_built: The authors produced 26,504,088 QA pairs by crawling patient questions and doctors' answers, applying
    manually designed question templates to Chinese Wikipedia and Qianwen Health articles, and extracting facts
    from CPubMed-KG, 39Health-KG and Xywy-KG. They cleaned and deduplicated the data, but its size prevented manual
    checking by medical experts.
  example: ''
  scoring: Retrieval is scored against the paired answer using Recall@k and MRR@10, which averages the reciprocal
    rank of the first relevant result within the top 10. Generated answers are compared with reference answers using
    BLEU, ROUGE and GLEU, with Distinct-1/2 measuring response diversity.
  judge: Automatic retrieval and text-generation metrics assign the scores.
  scale: Recall@k and MRR@10 for retrieval; BLEU, ROUGE, GLEU and Distinct-1/2 for generation, with no combined
    score.
  validation: ''
  results: ''
  limitations: The authors state that the data can contain errors from doctors or automatic extraction, expert checking
    at this scale is infeasible, and single-turn QA cannot capture all patient-specific information needed for medical
    advice.
