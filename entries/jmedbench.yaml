  notes: "Only the multiple-choice QA part (7 datasets) is in scope as health QA; the NER, document classification, semantic similarity and translation datasets are biomedical NLP and are kept here because they ship as one benchmark. License is per dataset on the Hugging Face card (mostly MIT or CC-BY-4.0, with CC-BY-NC-SA-4.0 for NRNER and JCSTS; IgakuQA none listed), so license is coded custom. Venue is COLING 2025 per a citation in the JMed48k paper; the arXiv version was read."
