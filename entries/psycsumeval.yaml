card:
  task: Compress a Cochrane mental-health systematic review abstract into a clinician-oriented summary that preserves
    its clinically important details.
  items_built: GPT-4o, Claude Opus, LLaMA-3.1-70B-Instruct and GPT-4o-mini each summarised 115 Cochrane abstracts,
    producing 460 summaries using only the abstracts as input. The prompt drew on PRISMA for Abstracts and Cochrane
    guidance, and psychiatrists checked the summaries for accuracy and professional acceptability.
  example: ''
  scoring: Psychiatrists compare each summary with its source abstract and score nine content dimensions, providing
    reasons for missing or inaccurate information and corrective actions for main findings, methodology and conclusions.
    The provided text does not specify how dimension scores are combined into an overall score.
  judge: Psychiatrists assign the scores; each model-specific evaluation file contains one psychiatrist's assessments.
  scale: Seven dimensions use 0-2; evidence quality uses 0-1; currency uses 0-1 or "No date reported"; no aggregate
    metric is specified.
  validation: ''
  score_meaning: For Population, Intervention, Comparator and Outcome, 0 means missing, 1 means partially correct
    or inaccurate, and 2 means accurate and complete; Main Findings uses the same anchors except that 2 means accurate.
    For Quality of Evidence, 1 means consistency with the abstract, including when evidence-quality information
    is absent from both texts, and 0 means inconsistent or partial information.
  annotation_process: ''
