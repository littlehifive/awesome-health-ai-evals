  task: Classify patient-message intent, answer patient questions, distinguish danger-sign messages from look-alikes,
    respond to adversarial messages, extract expected fields from laboratory report and prescription images, and
    process recorded voice questions.
  items_built: The intent test set contains 120 messages written entirely by people, with a separate 50-message
    sample labelled independently by two annotators. The synthetic full-system evaluation sets contain 40 questions
    written in all three languages with answering guideline documents and a tune/report split, 30 danger-sign messages,
    30 look-alikes, 20 adversarial messages, 10 laboratory report images, 10 prescription images with expected fields,
    and 45 recorded voice questions with transcripts.
