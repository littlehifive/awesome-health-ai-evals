  notes: "Read the GitHub README (data composition, settings, links) and the ACL Anthology page; the full paper text was not read. benchmark.json is in the repo and on Google Drive; the repo licence shows as NOASSERTION and each component set keeps its own licence. Evaluation settings are zero-shot, multiple choice, RAG, and question-only retrieval. The MedRAG toolkit accompanies it. Builder types: authors are at the University of Virginia and the US National Library of Medicine (NIH); NIH is listed as government."
