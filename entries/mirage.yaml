  task: Answer each medical question by selecting an option, using retrieved external information without examples
    in the prompt and without including answer options in the retrieval query.
  items_built: The authors assembled 1,089 questions from six biomedical MMLU tasks, 1,273 four-option MedQA-US
    test questions, 4,183 MedMCQA development questions, 500 expert-annotated PubMedQA test questions, and 618 BioASQ
    Task B yes/no test questions from 2019-2023. They removed the supplied contexts from PubMedQA and the ground-truth
    snippets from BioASQ.
