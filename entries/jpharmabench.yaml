  notes: "The paper mainly presents the JPharmatron model; the three benchmarks are one of its contributions. Only EQUES/YakugakuQA was found on Hugging Face (card: CC-BY-SA-4.0, 13 exam years 2012-2024, over 4K questions including image items; EQUES/NayoseQA and EQUES/SogoCheck returned 401 from the API, so their availability is unconfirmed). The paper says NayoseQA also exists in a separately released instruction-style form. NayoseQA and SogoCheck are terminology and document-consistency tasks, closer to biomedical NLP than health QA. Venue is IJCNLP-AACL 2025 per a citation in the JMed48k paper. Authors at EQUES Inc., University of Tokyo and University of Tsukuba."
