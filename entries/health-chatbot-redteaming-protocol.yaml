id: health-chatbot-redteaming-protocol
name: Health chatbot red-teaming protocol (HRSN)
kind: benchmark
year: 2025
summary: "A red-teaming protocol and test set for a retrieval-augmented health-related social needs chatbot: seven attack vectors, 140 single-turn and 20 multi-turn attack examples, and an error scheme separating knowledge adherence from behavioral adherence, annotated as correct or error with high or low risk."
