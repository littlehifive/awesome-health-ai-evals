id: cat-medical-llm-eval
name: CAT for medical LLM evaluation
kind: eval_framework
year: 2026
summary: An item-response-theory computerized adaptive testing framework that scores LLM medical knowledge with far fewer items, validated on 38 LLMs using a non-public bank of 2,815 calibrated Chinese medical MCQs.
