id: medic-m42
name: MEDIC (M42)
kind: eval_framework
year: 2024
summary: A framework that evaluates LLMs on five dimensions of clinical competence (medical reasoning, ethics and bias, data and language understanding, in-context learning, clinical safety) using existing QA, safety, summarization and note-generation datasets and a reference-free cross-examination method for hallucination and coverage.
