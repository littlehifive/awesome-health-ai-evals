card:
  task: Generate post-care patient education for each clinical vignette.
  items_built: The framework is intended for evaluating LLM-generated post-care patient education using clinical
    vignettes. It was developed through the NIH AIM-AHEAD CLINAQ fellowship program in partnership with Ochsner
    Health and Xavier University of Louisiana.
  example: ''
  scoring: Clinicians rate each output using a TAM-based questionnaire that maps perceived usefulness to accuracy
    and completeness, and perceived ease of use to clarity and appropriateness. The MCRS is administered after scoring
    to examine whether clinicians' regard for the conditions in the vignettes influences their ratings.
  judge: An expert clinician panel and automated assessment methods form the two proposed evaluation arms.
