summary: Multi-session (6-10 sessions per case) Chinese psychological counseling dialogues across five therapy modalities plus integrative therapy, rebuilt with LLMs from 369 published clinical case reports and over 2,000 client profiles, with 18 LLM-judged metrics for AI counselors using a client simulator and supervisor agent.
