card:
  task: Choose one of ten answers by computing over a user's longitudinal health measurements, interpreting them
    physiologically, or both.
  items_built: The authors used LLM agents to construct 4,084 questions from 200 users' records, grounding them
    in 11 peer-reviewed consumer-wearable papers or statistically verified cohort patterns and computing answers
    deterministically from each user's measurements. They checked statistical stability, removed duplicates and
    answer leaks, verified distractors, and had GPT-5.4, Gemini-3.1-Pro, and Claude-Opus-4.6 review questions before
    human verification.
  example: ''
  scoring: Each response is parsed into a single option identifier and compared with the deterministically computed
    answer key; empty or unparseable responses count as incorrect. The reported score is the percentage of questions
    answered correctly, with 95% Wilson confidence intervals.
  judge: Exact match with the deterministically computed answer key assigns the score.
  scale: Correct or incorrect per question; overall accuracy from 0% to 100%.
  validation: ''
  results: Gemini-3.1-Pro achieved the highest accuracy at 72.9% among 14 models, against a 10% chance baseline.
  limitations: ''
