  notes: "Questions use a dual-grounding design: literature-grounded findings from consumer-wearable studies and statistically validated population patterns, with ground truth computed deterministically; LLM agents help write the questions. Authors are at Meta, KAIST, and Korea University, so lead countries are inferred from affiliations only. The paper's source cohort and its consent terms were not checked. Scope is borderline: questions are over personal sensor data, not conversational health queries."
