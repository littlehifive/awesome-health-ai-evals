  notes: "Three tasks: exam MCQs scored by accuracy, guideline-based open QA, and multi-turn dialogues where a Qwen-driven simulated patient (given the case vignette) talks to the target model. Rubric checkpoints and weights come from a three-round Delphi consensus (39 initial indicators). I did not confirm what model judges the open-ended and dialogue scores. The repo (MIT) holds test_data and raw_data; the SSRN DOI is the record's DOI and the arXiv paper is the same work. Authors include employees of Medlinker, a company whose MedGPT model tops the results, so builder_types lists industry_lab as a judgment. Rater (Delphi panel) countries are not stated."
