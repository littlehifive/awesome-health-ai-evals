card:
  task: Answer dental multiple-choice and guideline-based open questions, and conduct multi-turn consultations with
    a simulated patient to gather information and formulate a treatment plan.
  items_built: The authors retained 4,258 questions from the MedMCQA dental subset and Chinese National Dental Licensing
    Examination database after removing non-dental entries and checking explanation logic. Qwen (qwen3-max-preview)
    drafted 205 open questions from 60 guidelines for clinician review, while 118 case reports became simulation
    scenarios with clinician-verified mappings to 37 criteria established through three Delphi rounds.
  example: ''
  scoring: MCQs are scored by accuracy and Macro-F1; GPT-4.1 evaluates open answers and dialogues against reference
    rubrics, awarding binary safety scores and normalizing effectiveness criteria weighted from -10 to 10 into checkpoint
    scores from 0 to 1. Checkpoint scores are combined into weighted averages using Delphi-derived severity weights
    from 1 to 5, with any zero safety score independently treated as a clinical veto.
  judge: GPT-4.1 (gpt-4.1-2025-04-14) is the automated scoring engine.
  scale: 'Safety checkpoints: 0 or 1; effectiveness checkpoints: 0 to 1; final weighted mean, MCQ accuracy and Macro-F1.'
  validation: Automated scores were compared with human expert ratings, with Spearman correlations ranging from
    0.8286 to 0.9429 across experts.
  results: MedGPT-251130 led all three tasks, with MCQ accuracy of 0.9436, an open-QA score of 0.7508, and a multi-turn
    dialogue score of 0.5030.
  limitations: The authors identify limited expert-panel generalizability, possible selection and Delphi conformity
    biases, limitations of a single model judge, and evaluation restricted to text-based decisions rather than physical
    actions or EHR integration.
  sources:
