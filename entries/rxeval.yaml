  notes: "Questions are built from real MIMIC-IV prescriptions; distractors and reasoning chains are LLM-generated and then validated. A reasoning-chain annotation step exists; a sampled audit rated distractors. No code or data link found in the text read, so open_data is unknown; MIMIC-IV itself requires PhysioNet credentialing, so any release is likely gated. Lead institution country (China) is from the Chinese University of Hong Kong affiliations on the first page; author-level mapping not checked. Borderline scope because it is built from EHR data, but the task is clinical prescribing decisions by LLMs, not documentation."
