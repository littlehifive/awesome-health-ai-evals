  item_origin_countries: [USA, IND, GLOBAL]
  item_origin_note: Text questions come from existing English sets. MedQA follows the US licensing exam format and MedMCQA comes from Indian medical entrance exams (AIIMS/NEET); the MMLU health subjects have no stated country. Audio is synthetic (OpenAI tts-1, six voices).
  localization: adapted
