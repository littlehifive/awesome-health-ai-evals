id: spoken-medical-qa
name: Spoken Medical QA
kind: benchmark
year: 2024
summary: 6,545 four-option medical multiple-choice questions (MMLU health subjects, MedQA test, MedMCQA validation) converted to synthetic speech with a text-to-speech API, scored by accuracy for zero-shot spoken question answering.
readme_section: voice
