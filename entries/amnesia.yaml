  notes: Questions are generated by GPT-5 nano from the notes (4 factual and 4 reasoning per patient). Scoring uses answer-level metrics (answer forgetting and model utility) plus exact-match keyword leakage. The paper says all data and code will be released without restrictions, but no repo or license was found. Borderline scope since the task is privacy-motivated unlearning, not answering health questions for users. Lead institution not read.
