id: counterfactual-patient-variations
name: Counterfactual Patient Variations (CPV)
kind: benchmark
year: 2024
summary: Clinical case multiple-choice questions (1,734 JAMA Clinical Challenge cases, plus MedQA, MedMCQA, and PubMedQA versions on Hugging Face) with gender and ethnicity swapped in otherwise identical vignettes, used to measure demographic bias in LLM answers and explanations.
