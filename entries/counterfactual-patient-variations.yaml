  notes: "Paper (NAACL 2025) is built on the JAMA Clinical Challenge dataset; the Hugging Face CPV sets listed in the GitHub README (MIT per cards) are derived from other datasets and are the released versions. The README does not say whether the JAMA-based CPV set itself is released. Bias is scored by accuracy deltas, equality of odds, SkewSize, SHAP, and embedding measures on MCQ answers and explanations. Rater countries are not applicable (no human raters stated). MIT license read from the medqa-cpv, medmcqa-cpv, and pubmedqa-cpv dataset cards."
