  items_built: The framework is intended to evaluate the service quality of AI health care chatbots. An initial
    pool of 26 indicators came from a literature review and consultations with 4 experts; 20 experts recruited from
    hospitals, universities, and health commissions took part in a 2-round Delphi process with a virtual meeting
    between rounds, followed by a third round using the analytic hierarchy process to determine weights.
