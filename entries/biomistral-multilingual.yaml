  notes: The benchmark is one contribution of a model paper (BioMistral 7B); the model and its pretraining data are not part of this entry. The Hugging Face card (BioInstructQA, Apache-2.0) mixes train and test splits and lists seven languages including English, while the paper names seven other languages; the language list here follows the paper's results tables. The lead country France is inferred from the paper's affiliations and was not checked in the text read.
