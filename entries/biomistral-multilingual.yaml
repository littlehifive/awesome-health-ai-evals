id: biomistral-multilingual
name: BioMistral multilingual medical QA benchmark (BioInstructQA)
kind: benchmark
year: 2024
summary: Ten English medical multiple-choice QA tasks (MMLU medical subjects, MedQA, MedMCQA, PubMedQA) machine-translated into seven other languages (Arabic, Chinese, French, German, Portuguese, Russian, Spanish) with GPT-3.5 Turbo, scored by accuracy.
readme_section: multilingual_regional
adapted_from: [medqa, medmcqa, pubmedqa]
