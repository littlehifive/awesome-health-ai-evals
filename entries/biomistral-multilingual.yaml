geography:
  item_languages: [English, Arabic, Mandarin Chinese, French, German, Portuguese, Russian, Spanish]
  item_origin_countries: [USA, IND, GLOBAL]
  item_origin_note: Source sets are MedQA (USMLE, USA), MedMCQA (Indian medical entrance exams), PubMedQA and MMLU medical subjects; the translations are automatic, with no human check described.
  localization: translated
  lead_institution_countries: [FRA]
origin:
  builder_types: [academic]
  item_provenance: [adapted_dataset, exam_questions]
