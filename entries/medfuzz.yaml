id: medfuzz
name: MedFuzz
kind: eval_framework
year: 2024
summary: An adversarial method in which an attacker LLM rewrites MedQA-USMLE vignettes to violate benchmark assumptions (such as patient characteristics) while keeping the correct answer for a clinician, to measure how far benchmark accuracy generalizes, with a permutation test for individual attacks.
