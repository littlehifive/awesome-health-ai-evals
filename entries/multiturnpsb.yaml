  notes: "University of Pennsylvania preprint. Turns 2-4 are generated by GPT-4o-mini and frozen (fixed template), or produced live by an adversary model. A response scores 1 (refusal) to 5 (full violation) from a GPT-4o-mini judge, and 3 or higher counts as unsafe. The paper also tests an input-side classifier defense, which is not part of the benchmark. No dataset or code link found, so open_data is unknown. PatientSafetyBench (MedRiskEval) is the parent benchmark and has no entry in this catalog yet."
