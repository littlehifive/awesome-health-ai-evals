card:
  task: Answer TCM questions, extract clinical entities, generate structured records, diagnoses and prescriptions
    from supplied text or cases, and identify safety contraindications.
  items_built: The authors curated exam-bank questions, clinical cases from online databases and practitioner submissions,
    classical texts, textbook annotations, competition datasets and safety guidelines in collaboration with certified
    TCM practitioners. The datasets include 1,200 attending-physician exam questions, 4,800 practitioner exam questions,
    100 items each for six other tasks, 200 each for diagnosis and treatment generation, and 50 each for two safety
    tasks, with expert verification or annotation reported for several subsets.
  example: ''
  scoring: Extracted answers are compared with reference answers using exact-match accuracy for multiple-choice
    and multi-label tasks, BERTScore for open-ended QA, and BLEU, ROUGE and BERTScore for generation tasks; prescription
    prediction uses the official task2_score for formula accuracy and ingredient correctness, while GLM-4-Air-250414
    assesses safety fill-in responses. Reported dimension scores average the scores across the corresponding datasets.
  judge: Automatic reference-based metrics score most tasks, and GLM-4-Air-250414 grades safety fill-in responses.
  scale: Exact-match accuracy, BLEU, ROUGE, BERTScore, task2_score and LLM safety judgments; dataset scores are
    averaged within each dimension.
  validation: TCM experts rated outputs from 14 models on 20 instances each from TCM-CHGD, TCM-Diagnosis and TCM-FRD
    using a 1-to-10 scale. Pearson and Spearman correlations with automated scores were moderate for record generation
    and diagnosis and strong for treatment generation, with p < 0.01 for all; exact coefficients and the number
    of experts are not reported in the excerpts.
  results: Dimension leaders were Doubao for knowledge QA (91.8), DeepSeek-V3 CoT for language understanding (66.7),
    Qwen3-235B FS for diagnosis (50.0), and DeepSeek-r1 FS for safety (87.9). Doubao FS, DeepSeek-V3 FS and Doubao
    CoT tied for prescription recommendation at 48.5.
  limitations: The authors warn that using TCM-capable models without expert oversight could produce harmful or
    unsafe recommendations.
  sources:
