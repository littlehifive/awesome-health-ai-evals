  notes: Medbullets data is in the repo. JAMA data is not redistributed for license reasons; the repo gives article URLs and a scraper, so access needs a JAMA full-text license. No dataset license is stated in the repo. Lead institution country (USA) is not stated in the text read; check the author affiliations. Both datasets exclude images. Record r_9d76554df9 is the arXiv/ACL version. Hugging Face sets JesseLiu/medbulltes4op and medbulltes5op are third-party reformats of the Medbullets split (Apache-2.0 on their cards), and SII-SPIRAL-MED/o1-journey-Ophiuchus is a training set; none are listed in links. The repo's medbullets folder holds the 4-option and 5-option CSV/JSON files.
