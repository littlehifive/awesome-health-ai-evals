summary: Two English multiple-choice clinical QA sets with expert-written explanations, JAMA Clinical Challenge (1,524 questions from challenging clinical cases) and Medbullets (308 USMLE Step 2 and 3 style questions), scored by answer accuracy and by automatic and human evaluation of the explanations.
