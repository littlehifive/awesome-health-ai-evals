summary: "A telemedicine evaluation harness for real-time audio-video medical agents: a universal TelePACES rubric (adapted from the PACES clinical-exam rubric) plus case-specific rubrics for 20 standardized outpatient scenarios, rated by physician-role-players after simulated video consultations."
