  notes: "Introduced inside the paper on Google's AI co-clinician system (Gemini-based). Real-time audio plus video, so modality is recorded as voice only. The authors state they will not open-source code or prompts; rubrics appear as tables in the paper, and no scenario release was seen. Case-specific rubric domains: history taking, telehealth physical exam, clinical reasoning, communication and counseling, red-flag identification and triage, treatment and next steps."
