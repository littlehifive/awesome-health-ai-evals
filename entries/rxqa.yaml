  notes: "RxQA is a secondary contribution of the AMIE disease-management paper (preprint 2025, Nature 2026). Gemini 1.5 Flash drafted and filtered questions from sampled drug labels; one board-certified pharmacist per jurisdiction revised each question; three PCPs per jurisdiction gave human baselines. Data availability statement only mentions MedQA, MultiMedQA and MIMIC-III as open sets and says AMIE code and weights are not released; no RxQA download found, so open_data is unknown. Nature supplementary data availability statement not read. Rater countries follow the paper's wording that pharmacists and PCPs were drawn from each jurisdiction."
