  notes: "General-purpose hallucination benchmark; health is one of four domains (medical guidelines, 250 seeds). Questions for the medical domain were written by GPT-5-mini from guideline articles and reviewed by domain experts. A user LLM writes follow-up turns; responses must carry inline citations, and the judge retrieves and reads sources via web search. The public repo holds medical_guidelines/data/guidelines.jsonl (source guidelines); I did not confirm that the question files are in the repo, and no license file was found."
