  notes: "Read the paper's abstract, method and results sections and the GitHub README. The vignettes and scripts are in the GitHub repo (no license file found on the repo). The repo does not redistribute UMLS, DrugBank or SIDER, so rebuilding the full graph needs separate licenses. How the vignettes were written (hand-made, templated or LLM-generated) was not found. Scoring checks that the answer contains required rule IDs and bridge tokens, so it measures evidence compliance rather than clinical correctness. Models tested: GPT-4o-mini and GPT-4o."
