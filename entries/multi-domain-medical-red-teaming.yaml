  notes: "Text2Story'26 workshop paper by authors with John Snow Labs emails. The paper describes a framework and dataset but gives no download link or license for the scenarios, so open_data is unknown. Rubric dimensions: safety, medical accuracy, robustness to mutations, bias and equity, ethical compliance, privacy, toxicity. Seven mutation types (negation, contradiction, impossibility, missing context, distraction, bias counterfactual, privacy trigger). GPT-5 judge, with humans auditing about 10 percent of outputs."
