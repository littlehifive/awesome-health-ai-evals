  notes: "Questions were generated by GPT-4o-mini from Wikipedia facts and pre-filtered by a GPT-5 judge (agreement with native speakers 44 to 76 percent); the English subset count is not given in the tables read. Answers are scored with AlignScore against evidence snippets (a relative proxy for factual alignment), not against gold answers. A footnote says the dataset and code will be released after review; no link was found, so open_data is unknown. Springer LNCS version of arXiv 2510.17476 (title Disparities in Multilingual LLM-Based Healthcare Q&A)."
