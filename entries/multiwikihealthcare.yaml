id: multiwikihealthcare
name: MultiWikiHealthCare
kind: benchmark
year: 2025
summary: Synthetic health questions (about 500 to 1,000 per language) generated from aligned facts in English, German, Italian, Turkish, and Chinese Wikipedia pages on trending health topics, used to measure how well LLM answers align with source-language versus English evidence.
