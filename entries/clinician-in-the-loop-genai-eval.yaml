id: clinician-in-the-loop-genai-eval
name: Clinician-in-the-loop GenAI evaluation framework
kind: eval_framework
year: 2025
summary: A five-dimension framework (helpfulness, comprehension, correctness, completeness, clinical harmfulness) with a two-to-three specialist reviewer protocol, applied to Elsevier's ClinicalKey AI using a 633-query clinician question set rated by 41 clinicians.
