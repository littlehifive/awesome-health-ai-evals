card:
  task: Answer open-ended clinical questions intended to support clinicians at the point of care.
  items_built: The authors assembled 633 queries from user logs, a benchmark dataset, and subject matter expert-curated
    questions. Internal physicians curated and labeled the queries before testing, including clinical specialties
    qualified to evaluate each response.
  example: ''
  scoring: Two specialists independently score each response, checking correctness line by line against the cited
    literature; disagreements trigger a third review, with the mode used per dimension and unresolved differences
    handled through anonymized email consensus or the lowest score if a reviewer does not respond. Final scores
    are reported as proportions in each rating category for each dimension, with Wilson confidence intervals, using
    only pairs evaluated by at least two reviewers.
  judge: Forty-one board-certified physicians and pharmacists provided ratings, with two or three specialty-matched
    reviewers per query-response pair.
  scale: Dimension-specific numeric rating scales, including comprehension from 0 to 2 and correctness from 0 to
    4; final percentages by rating category and dimension.
  validation: The initial two reviewers agreed across all dimensions in 60.6% of evaluations. A panel of four credentialed
    Elsevier physicians reviewed 35 responses flagged as potentially harmful by at least one reviewer and disagreed
    with the harm classification for 33.
  results: ClinicalKey AI version 2.2.0.0.0 received ratings of 95.5% correctness, 98.6% comprehension, and 94.4%
    helpfulness across 426 fully evaluated responses. Two responses, or 0.47%, were rated as potentially harmful.
  limitations: The authors identify subjective interpretation of open-ended queries and responses, difficulty reaching
    agreement on potential harm, and time and resource constraints on clinician review.
