  notes: "Read the abstract and method sections of the PDF. User narratives and plans are LLM-planned, indicator dynamics are algorithmically simulated; the paper says the code base ships the query inventory and judge prompts but gives no repo URL, so open_data is unknown. Scoring is a two-stage check with value or format correctness and a GPT-4.1 rubric judge for Explanation queries. Evaluates agents with tools, database agents, and memory RAG, not plain chat. Affiliations from the author block: Shanda Group (first and last authors) and Duke (one author)."
