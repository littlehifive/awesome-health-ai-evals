  notes: Dataset card only. Made in the SPAR 2026 Spring programme (mentor at Google DeepMind). Task is classifying each conversation as correct or harmful, scored against known labels; eval_methods uses automatic_metric as the closest option. Clean conversations were generated with Claude Sonnet 4.6. Source article text is CC BY-NC-ND 4.0 while the dataset card says MIT.
