  notes: "r_4b1ac3f4e9 is the arXiv preprint (titled 'Are Large Language Models True Healthcare Jacks-of-All-Trades?') and r_1c592bcf18 the ACL Findings 2025 version. The paper says the Taiwanese authorities impose no specific license; the Hugging Face card states CC-BY-NC-ND-4.0, which is what is recorded. Lead institution is the University of Manchester (first and last authors). Health areas cover 20 professions including physician, nurse, pharmacist, dentist, TCM practitioner, optometrist, and audiologist. Hugging Face dataset KenLuo/EMPEC found by search; the paper itself did not give a link in the portions read."
