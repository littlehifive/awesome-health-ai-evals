card:
  task: Answer open-ended women's health questions with clinically accurate, safe, patient-specific guidance.
  items_built: The 47 questions were developed with board-certified OB/GYNs, reproductive endocrinologists, fertility
    specialists, and Dandi Fertility, whose clinical team supplied real-world patient scenario patterns and informed
    difficulty calibration. Each question received 4 to 6 independent reference answers from clinicians and fertility
    nursing specialists who could not see one another's responses.
  example: '"What are the Rotterdam criteria for PCOS?"'
  scoring: Blinded LLM judges compare each response with all expert reference answers and a question-specific clinical
    checklist, starting each criterion at Fail unless explicitly met. Fixed, safety-weighted criterion scores are
    recalculated server-side, normalized using (raw + 58)/150 × 100, and averaged across questions and three runs
    per model.
  judge: Claude Sonnet 4.6 is the primary judge, and GPT-5.4 independently scores responses as the secondary judge.
  scale: Binary criteria plus four three-level criteria; weighted totals range from -58 to +92 and normalize to
    0-100%, with Correct ≥80%, Partially Correct 45-79%, and Incorrect <45%.
  validation: The two LLM judges had 51.6% agreement on final labels (κ = 0.238), category-level κ = 0.538, and
    model-ranking Spearman ρ = 0.916. Equity agreement was 91.7%, but κ was only 0.153.
  results: Claude Opus 4.6 led 22 models with a mean score of 72.1% (95% confidence interval 69.6-74.4). It met
    the 80% correctness threshold on 35.5% of responses and had unsafe commission or omission on 12.8%.
  limitations: The authors note sparse coverage of some topics, English-only questions, weaker judge agreement on
    subjective criteria such as equity, and reliance on LLM judging rather than clinician adjudication of every
    response.
