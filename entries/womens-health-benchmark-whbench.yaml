  notes: "The paper says full vignettes and reference answers are in a public data release but gives no link. therubricai/womens-health-benchmark-ground-truth (r_dd4d4871c9) is a sample subset of unstated size (n<1K, MIT per card) that links the WHBench report (https://therubric.ai/research/whbench); its card text matches the WHB prompts-plus-justifications format of the Lumos AI benchmark (womens-health-benchmark-whb), so whether it belongs to WHBench is uncertain. Judges were Claude Sonnet 4.6 (primary) and GPT-5.4 (secondary); the expert panel's countries are not stated. Authors are at Columbia University and Rubric AI (country not seen)."
