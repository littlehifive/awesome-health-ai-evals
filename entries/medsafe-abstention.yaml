id: medsafe-abstention
name: MedSAFE (abstention)
kind: eval_framework
year: 2025
summary: "A decision-theoretic framework for evaluating whether medical LLMs abstain, answer, or ask for clarification in clinical dialogues, with an auditor-target-judge pipeline, eight benign and risky scenarios, and a seven-dimension safety rubric."
