  notes: "Paperclip's full text says 100 cases and 31 LLMs; the abstract in the screening record says a 1,100-task benchmark and 20 LLMs plus 4 RAG tools, so versions differ and the size should be checked. The data availability statement says the public case set will be available after publication at github.com/HealthRex/noharm; that repo returned 404 when checked, so open_data is unknown. Models are scored against specialist ratings of each option (appropriate or harmful, on a modified RAND-UCLA scale with WHO harm severity), producing Safety, Completeness, and Restraint metrics. The paper also includes a randomized study of 101 physicians with and without AI. Specialties covered include Allergy, Cardiology, Dermatology, Endocrinology, Gastroenterology, Hematology, Infectious Diseases, Nephrology, Neurology, and Pulmonology."
