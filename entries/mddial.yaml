  notes: Dataset is in the GitHub repo (train.json, test.json); no license file seen. The paper positions it mainly for training ADD dialogue systems, with GPT-2 and DialoGPT as baselines; evaluation uses a symptom score, diagnosis accuracy, and a reliability score, plus unseen-template test sets for generalization. Dialogue counts are in the paper's Table 2, not read.
