id: healthq
name: HealthQ
kind: eval_framework
year: 2024
summary: A framework and code base for scoring how well LLM healthcare chains (hardcoded, RAG, ReAct, chain-of-thought, reflective) ask questions of a simulated patient, using an LLM judge for specificity, relevance, and usefulness plus ROUGE and NER-based information-elicitation metrics on ChatDoctor and MTS-Dialog cases.
