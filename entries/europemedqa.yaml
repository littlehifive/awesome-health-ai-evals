  notes: "The paper is a study protocol (future tense); the question count and exam table come from the GitHub README, which hosts EuropeMedQA.csv and .xlsx. The repo license says only that the data is for research and benchmarking and to respect the exam owners' terms, so license is null. Translation uses ChatGPT 4o mini per the protocol. r_f0dea7586d is a separate Italian paper (Mistral-7B on the 1,120-question Italian SSM subset). The repo also states the data is a superset of the Italian SSM set used in causius0/medical-ai-leaderboard. The paper includes image-based questions (multimodal), which the modality field cannot express."
