  notes: "Same first author and method as MedREQAL (separate dataset, larger and time-aware). Two annotators (one physician) checked 100 examples for question and label correctness. Eight LLMs were tested. The paper says only generated questions and labels will be released, not the Cochrane text; the GitHub repo is the code and data link, but its contents and license were not checked, so open_data is unknown. Record r_2e7cbd1d07 is the Underline conference video page; the paper is the arXiv and EMNLP Findings version."
