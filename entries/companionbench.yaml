  notes: "Read the arXiv HTML version in part (introduction, method, datasheet appendix). The paper says it WILL release the 500 pairs and evaluation code; no download link was seen, so open_data is unknown. The raw corpus is not released and carries training-use terms from the data provider. Crisis scenarios and minors are excluded. Scope is emotional companionship rather than clinical care; a human may want to confirm it belongs in the catalog. Ten capabilities (C1 to C10) from 25 psychology theories are rated 1 to 10, plus a deterministic disclosure-depth measure; capability definitions are left to pass 2. Affiliations of authors were not checked."
