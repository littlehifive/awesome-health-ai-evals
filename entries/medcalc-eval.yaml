card:
  task: Extract the relevant patient information from a Chinese clinical description, apply the appropriate medical
    formula or scoring rules, and output the calculated result.
  items_built: The authors generated a separate test set with MedCalc-Env by sampling calculator inputs or scoring-scale
    options from configuration files, computing reference answers, and manually verifying the cases. The 709 calculation
    tasks cover 132 formula-based categories and 27 scale-based categories; the number of test cases is not stated.
  example: ''
  scoring: Final numerical answers are compared with calculated reference values, and performance is reported as
    percentage accuracy. The text specifies binary answer matching and a ±1% tolerance for formula-based tasks in
    the training reward, but does not separately specify the evaluation matching rules.
  judge: An automated verifier compares final answers with reference values calculated by the simulation tool.
  scale: 'Final metric: percentage accuracy.'
  validation: ''
  score_meaning: ''
  annotation_process: The evaluation used a separate test set generated by the MedCalc-Env bootcamp and then checked
    manually.
  results: Qwen2.5-32B trained with MedCalc-Env achieved the highest accuracy, 40.8%, compared with 25.4% for its
    base model. The best zero-shot model was Qwen3-235B-A22B at 31.1%.
  limitations: The authors identify static, structured inputs as a limitation and call for realistic, unstructured
    patient narratives containing redundancies, synonyms, and irrelevant information.
