  notes: "Questions and verdict labels were generated with an LLM from review objectives and conclusions. Classification is scored with F1 and the long-answer task with text-similarity metrics; six LLMs were tested. lavita/MedREQAL is a converted copy of the GitHub CSV (single train split of 2,786 rows). No license was seen on the card or in the paper; GitHub reports none. Authors are at the Technical University of Munich."
