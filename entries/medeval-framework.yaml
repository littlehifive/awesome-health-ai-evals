summary: An open-source Python package (PyPI) that evaluates medical LLMs and LoRA adapters on MedQA, PubMedQA, MedMCQA, MMLU-Medical or custom JSONL data for accuracy, NLI-based hallucination, calibration (ECE, Brier), and rule-based safety checks for sickle cell disease and cardiology.
