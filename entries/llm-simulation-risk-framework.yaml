id: llm-simulation-risk-framework
name: Simulation-based LLM-SaMD risk framework
kind: eval_framework
year: 2025
summary: "A simulation-based method for estimating the probability that an LLM failure leads to a hazardous situation and to patient harm (medical-device risk language), demonstrated with synthetic suicidal-ideation, therapy-request and therapy-like-interaction classification tasks reviewed by psychiatrists."
