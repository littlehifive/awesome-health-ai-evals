  notes: "Cases are real patient records (imaging reports, pathology, clinical notes, genomic results), not user queries; real_user_queries is the closest provenance value. Labels come from a two-stage senior-clinician annotation. License MIT and the language tags (zh, en) come from the Hugging Face dataset tags; the card itself is gated (automatic approval), so item languages and the exact data format were not seen. TNM accuracy is exact match on T, N, and M; treatment recommendation uses precision and BERT-F1; reasoning quality uses an LLM judge. Rater and lead countries inferred from the author list (BUPT, Peking Union Medical College Hospital). The paper also proposes LCAgent, a method, which is not part of the benchmark. Called multimodal by the authors, but inputs appear to be text reports."
