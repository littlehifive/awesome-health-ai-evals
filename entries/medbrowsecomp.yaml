  notes: "Borderline scope: it tests web-browsing agents on medical fact retrieval rather than a chatbot answering health questions; kept because it targets clinician and researcher information-seeking. Final test sets are byte-encoded to limit contamination; a decode script is on GitHub (repo link not captured). The LLM judge (GPT-4.1 mini) matches short answers, so rubric_llm_judge is a loose fit; two annotators agreed 98% with the judge on the 50-question subset. Datasets on Hugging Face (apache-2.0 on all three cards): the main repo holds the 50/605/CUA splits, _Meta holds the cleaned HemOnc metadata, _CUA holds the computer-use split. Paper does not give rater countries."
