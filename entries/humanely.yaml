id: humanely
name: HumanELY
kind: eval_framework
year: 2023
summary: A human-evaluation framework and web app for rating LLM outputs in healthcare on five metrics (Relevance, Coverage, Coherence, Comparison, Harm) with 17 Likert-scale submetrics, accompanied by a systematic review of 186 studies.
