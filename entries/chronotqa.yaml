card:
  task: Answer multiple-choice, binary-comparison, and free-text questions about disease and phenotype onset, progression,
    and ordering, alongside static knowledge controls.
  items_built: The authors generated 3,329 questions across eight task types and a separate 12-question diagnostic
    probe from Orphadata, HPOA, GA4GH Phenopackets, and PMID-linked ChronoMedKG triples. Four rounds of independent
    LLM review covered 180 questions with 540 assessments; automated checks removed 30 logically inconsistent questions,
    and all 1,447 external-source answers matched their source data.
  example: '"at what age does phenotype X emerge in disease Y?"'
  scoring: Answers are evaluated for correctness and reported as accuracy by task on a stratified 120-question baseline
    sample. The separate 147-question retrieval experiment uses a calibrated rubric and reports accuracy plus the
    fraction of questions answered incorrectly without retrieval that are answered correctly with retrieval.
  judge: ''
  scale: Answer accuracy; retrieval rescue rate on questions failed without retrieval.
  validation: ''
  score_meaning: ''
  annotation_process: Question quality assurance used four rounds of independent LLM evaluation, with three evaluator
    LLMs per question and 540 assessments across 180 questions, to check wording and answer correctness. Automated
    quality checks removed 30 logically inconsistent questions. All 1,447 answers drawn from external sources were
    checked against the source data, with no mismatches.
  results: ''
  limitations: The authors state that the underlying graph still contains extraction errors despite multi-model
    consensus and that its 6,250 diseases without external reference coverage require expert review at scale.
