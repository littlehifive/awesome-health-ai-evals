  notes: "Read the arXiv paper (ChronoMedKG, University of Hamburg authors). ChronoTQA is the benchmark half of a knowledge-graph paper: mixed formats, with bounded multiple-choice subtasks, binary comparisons, and a free-text age-range onset subtask. Paper states ChronoMedKG is CC BY 4.0 and code is MIT; the exact license of the question set on Zenodo was not checked, so license MIT from the earlier read is kept unverified. Scope is borderline: disease-knowledge QA derived from a KG, tested on LLMs via chat and retrieval."
