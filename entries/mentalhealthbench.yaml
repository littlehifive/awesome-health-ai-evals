card:
  task: Write the next assistant response to a mental-health conversation, retaining any initial system message
    that supplies age or other background context.
  items_built: OpenAI built the synthetic conversations, and more than 80 licensed psychiatrists and psychologists
    from more than 20 countries wrote the rubrics. Two clinicians authored each rubric, and a third adjudicated
    it.
  example: ''
  scoring: An OpenAI model grades the response against the conversation's rubric criteria. Meeting a positive criterion
    earns its assigned points, while meeting a negative criterion incurs its assigned penalty; the provided text
    does not specify how these scores are combined into the reported metric.
  judge: An OpenAI model assigns the scores; its name is not given in the provided text.
  scale: Signed integer points per criterion; final aggregation is not specified.
