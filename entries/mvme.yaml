  notes: "Alibaba-led paper (with Huazhong University of Science and Technology and Fudan). The LLM Chief Physician agent compares each part of the doctor's report with the full record, and entity-overlap metrics are also computed for the diagnosis. Records came from real cases, but the paper does not say whether they were de-identified patient records or published case write-ups. The MIT license is the GitHub repository license; patients.json sits in the repo. The paper also proposes a dispute-resolution collaboration method that is not part of the benchmark."
