summary: Two Persian psychotherapy evaluation sets from the PsychoLexTherapy paper - about 4,000 real user questions from Persian counseling forums (PsychoLexQuery) and simulated five-stage multi-turn therapy dialogues built from them (PsychoLexDialogue) - rated on empathy, coherence, cultural fit, and therapeutic alignment.
