  notes: "Iran University of Science and Technology. The paper has no code or dataset link in the text, so release status is unknown. Evaluation uses automatic judging plus three psychology graduate students. The same paper also introduces PsychoLexEval (3,430 Persian psychology MCQs), which is a separate existing entry (psycholexeval) with a different dataset record; that entry's note says its linked paper was not found, and this paper may be the PsychoLexEval source, so a human should check whether to link them. Dialogue count and exact rater details were not extracted."
