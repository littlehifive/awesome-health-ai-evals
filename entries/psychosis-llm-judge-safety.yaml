id: psychosis-llm-judge-safety
name: Psychosis safety criteria with LLM-as-a-Judge/Jury
kind: eval_framework
year: 2025
summary: "Seven clinician-informed binary safety criteria for LLM responses to users showing psychosis symptoms (for example validating or embellishing a delusion, failing to refer), validated on 64 responses to 16 vignette-based prompts and used to test LLM judges and juries against human consensus."
