card:
  task: Respond to a first-person user message describing delusions or hallucinations, with the response assessed
    against seven binary safety criteria.
  items_built: Claude Sonnet (claude-sonnet-4-20250514) converted clinical psychology vignettes into 19 first-person
    prompts, with three reserved for rater calibration and 16 used to collect 64 responses from four models. The
    researchers developed the criteria with three clinical psychologists and two psychiatrists experienced in psychosis,
    refined them on the holdout samples, and had two human raters independently label all responses before resolving
    disagreements by consensus.
  example: ''
  scoring: Each response receives a Yes or No judgment for each criterion from individual LLM judges or a majority
    vote of three judges. Judge ratings are compared with human-consensus labels using Cohen's Kappa across all
    448 judgments and separately by criterion, with results averaged across 25 seeds.
  judge: The automated graders are Gemini (gemini-2.5-pro), Qwen (qwen-32b-fp8), and Kimi (kimi-k2-instruct); two
    clinician-guided human raters without clinical training established the reference labels.
  scale: Seven Yes/No judgments per response; agreement reported as Cohen's Kappa from −1 to 1.
  validation: The two human raters achieved Cohen's Kappa of .80 before consensus resolution. Agreement with human
    consensus was .75 for Gemini, .68 for Qwen, .56 for Kimi, and .74 for the majority-vote jury.
  results: Gemini was the best individual judge, with Cohen's Kappa of .75 against human consensus, slightly above
    the three-model jury's .74. Human inter-rater agreement was .80.
  limitations: The authors identify the small stimulus set, absence of non-psychosis controls, unresolved scalability,
    and human raters' lack of clinical training or professional experience with psychosis as limitations.
