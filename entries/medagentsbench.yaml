  notes: "r_62a8574de6 is the later Patterns journal version (doi 10.1016/j.patter.2026.101610; Gerstein lab authors, same 862-question benchmark under the name MedicalAgentsBench), merged here; Crossref metadata and the abstract were checked, not the full text. Count of 862 is my sum of the per-source numbers in the paper's sampling description. The license comes from the super-dainiu HF card and the GitHub API. Annie713/medagents-benchmark and xk-huang/medagents-benchmark are Hugging Face copies of the same data (same configs, card has no prose; xk-huang also has a test_hard_leftout split) and are merged here. The paper also describes human annotation of reasoning depth and a contamination analysis; it studies prompting methods and agent frameworks alongside the dataset."
