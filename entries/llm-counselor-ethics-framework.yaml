id: llm-counselor-ethics-framework
name: LLM Counselor Ethical Violations Framework
kind: eval_framework
year: 2025
summary: "A practitioner-informed framework of 15 ethical violations in 5 themes, mapped to APA-style professional codes, for judging LLM counselors in CBT-style sessions; derived from 137 sessions (110 self-counseling, 27 simulated) rated by clinical psychologists."
