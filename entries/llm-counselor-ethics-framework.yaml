card:
  task: Conduct a counseling conversation that can be examined for violations of professional ethical standards.
  items_built: 'The framework was developed through an 18-month collaboration with three clinically licensed psychologists
    and seven trained peer counselors, using qualitative analysis and expert evaluation of 137 sessions: 110 self-counseling
    and 27 simulated sessions. It maps counseling behavior to professional codes of conduct, including those of
    the American Psychological Association.'
  example: ''
  scoring: Session behavior is qualitatively examined for 15 ethical violations grouped into five themes and mapped
    to professional codes of conduct; no numerical scoring or aggregation method is reported.
  judge: Licensed clinical psychologists evaluated the sessions.
  scale: Qualitative taxonomy of 15 ethical violations in five themes; no numerical scale or final metric is reported.
