  notes: "The paper's footnote says the dataset may be accessed upon request (Zenodo record), so it is coded gated; no license seen. The model under test acts as a virtual patient for student training, so the scope is medical education rather than patient-facing advice. Rater countries inferred from the team that transcribed and evaluated the dialogues (Multispeech team, Nancy); the audio is released but scoring is on transcripts."
