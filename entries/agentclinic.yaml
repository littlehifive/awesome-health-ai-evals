id: agentclinic
name: AgentClinic
kind: benchmark
year: 2024
summary: Simulated clinical environment in which an LLM doctor agent diagnoses LLM-played patients through dialogue and tool use, built from USMLE (MedQA), MIMIC-IV, NEJM case challenges, MedMCQA specialty cases, and six translated languages, scored by diagnostic accuracy against the ground-truth diagnosis.
