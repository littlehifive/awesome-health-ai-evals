card:
  task: Interview a simulated patient, request examination findings and test results, and give a diagnosis within
    20 patient and measurement interactions.
  items_built: The authors used GPT-4 to turn MedQA, MIMIC-IV and NEJM cases into structured clinical scenarios
    and manually validated each scenario, producing 215 USMLE-based cases and 120 NEJM cases. They also built 260
    specialist cases from MedMCQA and 749 cases across seven languages, with GPT-4 translations into six languages
    manually corrected by native speakers.
  example: ''
  scoring: A moderator agent compares the final diagnosis with the case's ground-truth diagnosis, and diagnostic
    accuracy is the percentage of cases diagnosed correctly. Bias evaluations divide accuracy with bias by accuracy
    without bias, while GPT-4 patient agents separately rate confidence in the doctor, willingness to follow treatment
    and willingness to consult again.
  judge: GPT-4 is the default moderator grader, and GPT-4 patient agents provide patient-perception ratings.
  scale: Correct or incorrect diagnosis per case; percentage diagnostic accuracy and biased-to-unbiased accuracy
    ratio.
  validation: ''
  score_meaning: A normalized bias accuracy of 92% means the model retains 92% of its unbiased accuracy, not that
    it diagnoses 92% of cases correctly; the paper's example falls from 52% correct without bias to 48% with bias.
  annotation_process: For the human dialogue evaluation, three clinicians with MD degrees rated dialogues from 20
    agents on AgentClinic-MedQA. They used a 1-10 scale for doctor, patient, measurement and empathy ratings, and
    the paper reports average ratings for each category.
  results: Claude-3.5-Sonnet led AgentClinic-MedQA with 62.1% ± 3.3 diagnostic accuracy and AgentClinic-MIMIC-IV
    with 42.9% ± 3.3.
  limitations: The authors identify simplified clinical environments, reliance on an LLM judge, possible training-data
    leakage in proprietary models and possible advantages when the same model plays both doctor and patient.
