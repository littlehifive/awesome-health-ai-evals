  notes: "Merged the Preprints.org version (r_df1943f5e9) with the npj Digital Medicine paper (r_607d44659c, PMC12559286). Data availability statement says the benchmarking data are on GitHub (biocypher/biochatter, Apache-2.0 for the repo; the paper does not give a separate data license) and the repo is archived on Zenodo (14775193). Judge is GPT-4o mini scoring five requirements (comprehensiveness, correctness, usefulness, interpretability/explainability, safety) with physician-written ground truths; one author rated 1,000 responses to check judge alignment, so human rating is only a validation step. Author affiliations are Rostock, Stendal, and Munich in Germany."
