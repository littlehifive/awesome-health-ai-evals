card:
  task: Give free-text advice on whether a longevity intervention is appropriate for a person described by a medical
    history and biomarker profile, ending with a Yes or No recommendation.
  items_built: Hans Jarchow drafted 25 synthetic medical profiles and accompanying ground truths, which four domain
    experts reviewed in three rounds; no real patient data were used. Rephrasing backgrounds and biomarker profiles
    and adding or omitting distracting statements produced 1,000 test cases.
  example: ''
  scoring: GPT-4o mini compares each response with expert commentaries, keywords and, for correctness in the standard
    setting, a Yes/No ground truth, assigning binary verdicts for the five requirements. Each judgment is repeated
    twice, disagreements are counted as failures, and mean balanced accuracies are reported by requirement and aggregated
    across requirements.
  judge: GPT-4o mini assigns the benchmark scores.
  scale: Each requirement receives 0 or 1; disagreement between two judgments becomes 0; the final metric is mean
    balanced accuracy.
  validation: Hans Jarchow blindly rated randomly sampled responses across the five requirements, producing 1,000
    individual judgments. Agreement with GPT-4o mini had Cohen's kappa values of 0.69 to 0.87 across tested models
    and 0.63 for safety to 0.81 for correctness across requirements.
  results: GPT-4o achieved the highest overall balanced accuracy across the five requirements, but the supplied
    text does not give its numerical score.
  limitations: The authors identify limited generalizability from 25 synthetic profiles with unusually complete
    information, coverage of only five established interventions, possible model-specific judge bias, and the absence
    of a comprehensive human evaluation.
