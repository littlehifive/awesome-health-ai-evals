  notes: DiagBench is one contribution of the DiagGym/DiagAgent RL paper (Section 5.3). Data Availability says MIMIC-IV licensing prevents open-sourcing the dataset (they are discussing a PhysioNet release); code is at the GitHub link. Cases are LLM-restructured from EHR records and physician-reviewed; rubric authors and countries are not stated. Scored by diagnosis accuracy, examination-recommendation hit ratio and F1, and a weighted rubric score judged by an LLM (judge model not checked). Lead institution countries come from the first-author affiliations (Shanghai Jiao Tong University, Shanghai AI Laboratory, Ant Group).
