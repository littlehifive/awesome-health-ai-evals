id: womens-health-benchmark-whb
name: Women's Health Benchmark (WHB)
kind: benchmark
year: 2025
summary: 96 expert-written women's health prompts ("model stumps") that elicited wrong model answers, each with an expert justification and source, across five specialties, three query types, and eight error types; 13 LLMs were scored by a human evaluator.
