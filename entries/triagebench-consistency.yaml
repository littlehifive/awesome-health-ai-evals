id: triagebench-consistency
name: TriageBench
kind: benchmark
year: 2026
summary: A counterfactual-consistency test for clinical LLM triage, which holds a symptom vignette fixed, swaps one irrelevant detail (gender, language, ZIP code), and measures how far the ER-referral decision moves (TriageGap).
