  notes: "Human evaluators (9 researchers: 5 postgraduate clinical psychology students in Australia, others with psychology degrees) role-played conditions such as depression, OCD, bereavement and PTSD, each including at least one of over 20 high-risk situations, in a double-blind setup with Chain-of-Utterances red-teaming. The paper refers to a Guideline but no download link or license was found. The first author's lead institution is Psyfy Inc. (USA, a company building the evaluated chatbot) with Stanford and Australian co-authors. The AutoGRAMS repo linked in the paper is the chatbot's framework, not an evaluation release."
