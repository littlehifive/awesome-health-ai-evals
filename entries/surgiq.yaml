  notes: "Questions were generated, verified, and filtered with Gemini 2.5 Flash from 7,216 textbook segments and 659 research papers (17,068 candidates before verification); three physicians audited 300 questions (92% correct answers, 90% clear). The paper describes a versioned public release but gives no URL or license that was found in the text, so license is null and open_data is unknown. Domains: General Surgery 53.2%, Neurosurgery 16.9%, Robotic 12.6%, Orthopedic 9.1%, Critical Care/Emergency 4.5%, Laparoscopic 3.8%. Authors are at MBZUAI (UAE)."
