  notes: "Built on the Antidote CasiMedicos dataset (HiTZ/casimedicos-exp). Gold explanations written by volunteer CasiMedicos doctors. r_7be250817c (partex-nv/MedExpQA_MedExpQA_train_eval) is an empty-card Hugging Face copy and is merged as a mirror. Lead institution country (Spain) is inferred from the HiTZ Center and Basque Government funding named in the paper; the translation method was not checked. r_77809dfa18 (shuyuej/Spanish-MedExpQA-Benchmark, Apache-2.0 tag, one-line card) is merged as a mirror: its file test.es.casimedicos.rag.json holds 125 Spanish items, matching the MedExpQA Spanish test split."
