  notes: "Read the repository README, data README, stats and sample rows; the paper (cited as AAAI 2026, Lu et al.) was not found on arXiv and not read, so venue and year come from the citation and repo creation date. The repo says dialogues derive from realistic doctor-patient dialogues and reports from PMC-Patients, and that users should follow the source datasets' licences (HealthBench and PMC-Patients named); code is MIT, no data licence stated. Lead institution country is inferred from the AQ-MedAI (Ant Group) organization and the first author's affiliation in a sibling paper, not stated in the repo. Sample rows are English. Records r_9c2a7d68a5 (AAAI abstract page, authors Lu, Liu, Zheng, Yang, Wang, Wang, Zhang; 60 licensed physicians validated it) and r_87d66302dc (github.com/Jianrong-Lu/MHB-Benchmark, Apache-2.0, holds only a README and LICENSE with the abstract and no data) were merged in; the AAAI landing page itself could not be fetched, so the paper was still not read."
