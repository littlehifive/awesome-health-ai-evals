  notes: "Read the Hub card, the GitHub README, and the ACL Anthology abstract; the paper full text was not read. The ACL paper (2026.acl-long.1365, Cocchieri, Ragazzi, Tagliavini, Moro) was linked from the card. No license is stated on the card (images come from MedXpertQA, which retains its own terms), so license is null. Some items include images (MedXpertQA-MM) but the model-input modality is coded text only because the schema has no image value. Lead country ITA from the disi-unibo-nlp organization and Anthology authors, not checked against affiliations. Scoring also includes self-reported confidence with ECE, Brier score, and AUROC (README)."
