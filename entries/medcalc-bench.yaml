  notes: "Borderline scope: inputs are patient notes but the task is clinician-facing medical calculation, so kept. Versions: v1.0, v1.1 and v1.2 on Hugging Face (ncbi); the cards say to use v1.2 and keep earlier ones for reproducibility. MedCalc-Bench Verified (nsk7153, GitHub nikhilk7153/MedCalc-Bench-Verified) is a re-audited update of v1.2 that the ncbi card points to as the latest version; treated as the same benchmark (10,538 train, 1,100 test, 55 one-shot). Licenses per cards: v1.2 and Verified CC-BY-SA-4.0; v1.0 tagged CC-BY-4.0. lingyi0101/MedCalc-Bench-Verified and PTPReasoning/MedCalc-Bench-v1.0 are third-party copies (records only, not linked). Rater countries not stated; physicians verified extractions."
