card:
  task: Read a masked clinical case in Portuguese or English and give the most likely diagnosis, a differential
    diagnosis list, recommended exams, or a treatment plan, with the diagnosis supplied for treatment planning.
  items_built: The authors used LLM prompts to extract published case reports into structured JSON records, then
    removed fields according to the task and supplied reference answers from the original reports. The released
    task sets contain 2,135 diagnosis and differential diagnosis cases, 851 exam recommendation cases, and 2,041
    treatment cases per language; differential diagnosis references were generated by a model with access to the
    full case.
  example: ''
  scoring: A diagnosis judge compares predictions with the published diagnosis for semantic correctness, and binary
    verdicts are averaged; differential diagnoses and exams are mapped to UMLS concept identifiers and compared
    with reference sets using precision, recall, and F1, with macro-F1 reported for exams. For treatment, three
    judges compare the proposed plan with the case and reference treatment, assign accuracy, completeness, and clarity
    scores, and produce a composite by averaging the three dimensions and dividing by five.
  judge: The paper names gpt-oss-120b for diagnosis, UMLS concept matching with SapBERT-XLMR for exams, and Qwen-2.5-72B,
    LLaMA 3.3 70B, and gpt-oss-120b for treatment.
  scale: 'Diagnosis: 0 or 1, averaged as accuracy; differential diagnoses and exams: precision, recall, and F1;
    treatment: 1-5 per dimension, with the composite divided by 5.'
  validation: ''
  score_meaning: Treatment accuracy measures whether the recommended interventions are clinically correct, completeness
    measures coverage of the reference treatment, and clarity measures whether the plan is organized and usable
    in clinical practice. Low clarity scores were associated with vague medical jargon and disorganized formatting.
  annotation_process: The diagnosis judge supplied a short justification for each verdict, and diagnosis evaluation
    covered 2,135 cases paired across Portuguese and English. The treatment judges were selected to represent different
    model architectures and training backgrounds to reduce judge-specific bias, and the panel generated 16,300 scores.
  results: o3-mini achieved the highest treatment accuracy, with a consensus mean of 0.766. DeepSeek-R1 and o3-mini
    both reached approximately 0.45 Recall@5 including the correct diagnosis in Portuguese and English.
  limitations: The authors identify possible memorization of published cases during pretraining and judge-dependent
    treatment scores, including a tendency to reward longer outputs with higher clarity scores.
  sources:
