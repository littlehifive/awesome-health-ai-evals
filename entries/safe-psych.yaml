  notes: "Gated access on Hugging Face with CC BY-NC 4.0 and extra terms, per the paper's appendix (card itself is gated and was not readable). Two psychiatrists re-annotated every note from the anonymized text only; their country is not stated. An LLM judge labels model responses as diagnose, clarify or abstain (macro-F1 0.84 against humans). The task is clinician decision support, not a patient-facing chatbot. Lead institutions: Politehnica Bucharest (Romania) first; SimulaMet (Norway) last."
