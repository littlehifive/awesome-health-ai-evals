  notes: "SPBench tests whether an LLM playing a standardized patient answers a physician's questions consistently with a case script. Eight criteria (query comprehension, case consistency, controlled disclosure, response completeness, logical coherence, language naturalness, conversational consistency, patient demeanor) are rated 1-5; GPT-4o scores all outputs and agreed with two clinicians on 30 samples (r = 0.79). The paper contains no data link or license, so open_data is unknown. The abstract and a table say 14 and 12 specialties; the body text says 14. The paper's main contribution is the EasyMED framework and a four-week crossover study; the benchmark is a secondary contribution."
