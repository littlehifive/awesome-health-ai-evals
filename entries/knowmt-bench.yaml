card:
  task: Answer a sequence of two to five questions using the model's own earlier responses as context, ending with
    a factual, complete long-form answer to the final question.
  items_built: The authors collected evidence-backed questions from K-QA, SEC FAQs, FinTextQA and manually annotated
    finance topics from Google Trends, with authoritative references checked by human experts. LLM-generated preceding
    questions underwent manual review for logical progression, preservation of the final question's intent and absence
    of answer leakage, producing 801 question sequences.
  example: ''
  scoring: The pipeline splits the final answer into atomic statements and checks each against the reference answer,
    while checking each manually verified reference fact against the generated answer, assigning entailment, contradiction
    or neutral labels. These labels yield factual precision, recall and F1, false-claim and misrepresentation rates
    and their F1, plus token costs per correct fact, contradicted fact and coverage of the reference facts.
  judge: Qwen2.5-32B-Instruct decomposes answers, and Qwen2.5-14B-Instruct assigns factual-consistency labels.
  scale: Entailment, contradiction or neutral per comparison; percentage-based factuality and hallucination metrics,
    plus tokens per fact.
  validation: On 100 randomly sampled generated answers, decomposition had 18.1% symmetric mean absolute percentage
    error in statement counts and a 5.9% omission rate. Across 1,687 inference pairs, the evaluator achieved 83.6%
    F1 against gold labels determined by majority vote among three annotators.
  score_meaning: Higher factual precision, recall and F1 indicate more correct and complete answers, while lower
    false-claim, misrepresentation and hallucination F1 scores indicate fewer factual errors. Lower D_f and D_R
    mean fewer tokens are needed to deliver correct information, while higher D_h means contradicted facts are more
    sparsely distributed through the answer.
