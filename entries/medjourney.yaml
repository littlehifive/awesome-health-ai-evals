  notes: "NeurIPS 2024 Datasets and Benchmarks paper from Tencent Youtu Lab with Zhejiang and Westlake universities. Classification and multiple-choice tasks use accuracy; summarization and generation tasks use BLEU and ROUGE-style NLG metrics, plus entity-level evaluation. New datasets were processed by professional doctors. Some tasks (dialogue summarization, doctor response generation) are clinician-support rather than patient-facing. The GitHub repo has a data directory (no license file); per-task sizes beyond a few examples were not collected."
