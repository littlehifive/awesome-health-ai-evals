id: stick-or-switch
name: stick-or-switch (SoS)
kind: eval_framework
year: 2026
summary: A multi-turn evaluation framework that splits a clinical multiple-choice answer space into sequential suggestions to measure whether an LLM keeps a correct answer (conviction) or moves to a correct suggestion (flexibility), applied to MedQA, MedMCQA and JAMA Clinical Challenges with 17 LLMs.
