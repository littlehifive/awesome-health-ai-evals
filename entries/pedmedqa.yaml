  notes: "Read the Hugging Face dataset card (size, age bands, CSV format, license, download links); the paper text was not reachable (publisher returned 403), so the screening abstract was the only paper source. The card lists four age groups under a heading that says five. Lead country CAN is from the Polytechnique Montreal repository record, not checked against author affiliations. The card reports GPT-4 Turbo accuracy of 78.1% pediatric versus 75.7% adult."
