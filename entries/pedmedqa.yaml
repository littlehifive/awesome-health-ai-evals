card:
  task: Choose the correct answer from four options, A-D, for each pediatric medical question.
  items_built: The authors curated 2,683 pediatric questions from MedQA and categorized them using the Munich Age
    Classification System. The listed categories are neonates (0-3 months), infants (over 3 months to 2 years),
    early childhood (over 2 to 10 years), and adolescents (over 10 to 17 years).
  example: ''
  scoring: Selected answers are compared with the supplied correct answers, and accuracy is the percentage of questions
    answered correctly, reported overall and by age group.
  judge: The supplied answer key determines correctness.
  scale: Each answer is correct or incorrect; final accuracy is reported as a percentage.
  validation: ''
  results: GPT-4 Turbo achieved 78.1% accuracy on PedMedQA (95% CI 77.8%-78.4%) versus 75.7% on AdultMedQA (95%
    CI 75.5%-75.9%). Pediatric age-group accuracy ranged from 74.6% for neonates to 81.9% for infants.
  limitations: ''
