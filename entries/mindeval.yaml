  notes: "Built by Sword Health with PhD-level licensed clinical psychologists (countries not stated); first author also lists Instituto Superior Tecnico (Portugal), which is the basis for lead_institution_countries. Judge scores correlate with four psychologists' ratings; a cohort of 10 psychologists wrote patient text to validate simulation realism; human data are released. The Apache-2.0 license is from the GitHub repo, whose master branch is now MindEval 2 (see the mindeval2 entry); the original MindEval is kept on the legacy branch. Release of the 50 original profiles was not separately confirmed."
