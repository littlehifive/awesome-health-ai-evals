  notes: "Successor to MedBench (medbench entry) from Shanghai AI Laboratory, with Fudan and a Shanghai health information center among the affiliations. Delivered as a secure platform with a rotating test pool, API submission or answer-upload modes; not a static dataset release, so open_data is unknown. The tracks include image and agent tasks that are partly out of scope; the text LLM track, including safety and ethics tasks, is in scope. About 20 percent of items were rated by 1,000 licensed professionals. Builder type government is an inference from the Shanghai Health Development Research Center affiliation."
