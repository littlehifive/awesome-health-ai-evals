card:
  task: Choose the correct answer to each Traditional Chinese clinical scenario question with four or five answer
    options.
  items_built: Emergency medicine examination committee members appointed by Taiwan's Ministry of Health and Welfare
    wrote the 1,719 questions and official answers, which were collected in yuhsintw/TW_ED_exam. Liang Hsun Huang
    cleaned the formatting, split options into separate fields and corrected an option label error, with preliminary
    manual formatting corrections but further checks still needed.
  example: 10 個月大的男童因躁動且意識改變而被父母送至急診。母親說男童自昨晚開始就發生嘔吐和腹瀉...試問，下列何者對此病童是最適當的處置？
