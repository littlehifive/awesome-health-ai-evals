  limitations: The authors state that multiple-choice questions cannot capture clinical complexity, coverage is
    limited to the exam syllabus, answers reflect guidelines at the time of the exam, formatting still needs cleaning,
    evaluation must handle mixed option counts, and Taiwan-specific content is unsuitable for other healthcare systems.
