  notes: "Authors are at Fudan University, Shanghai AI Laboratory, and Northwestern University. The paper reports 2,996 questions but evaluates 677 randomly selected ones; the Hugging Face card says 667 questions (a likely typo or different release), so the released size needs a check. Dataset license is a custom evaluation-only license (no training, fine-tuning, or distillation); code is Apache-2.0. Medical text generation is scored by humans; the other tasks by GPT-4o against checklists, with human-machine agreement analysis. Ten licensed physicians checked factual correctness of a sample (86% correct). Item sources are in Appendix B, which was not read; the clinician_written label is a partial fit. Two records: the paper and a conference talk or proceedings copy."
