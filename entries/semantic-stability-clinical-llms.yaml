id: semantic-stability-clinical-llms
name: Semantic stability of clinical LLMs (NLI-verified prompt variations)
kind: eval_framework
year: 2026
summary: An NLI-based semantic verification framework that builds meaning-preserving rewrites of 200 medical questions (from MedQA-USMLE and DiagnosisQA) to test whether LLM answers stay stable, with a clinician audit.
