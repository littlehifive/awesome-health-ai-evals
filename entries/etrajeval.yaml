  notes: "The paper appendix says only 60 test samples were provided at submission and the full set would follow; the GitHub repo holds ETrajEval/dataset/test_data_prompts.json, and I did not check its size. The repo README states Apache 2.0, but its license link points to SECURITY.md and no LICENSE file was seen. Project page https://ruochoxio.github.io/ETrajEval/. Lead institution is Peking University with Guangzhou Quwan Network Technology. Generated data was inspected by human reviewers; a separate human-annotated sentiment set (about 2,000 dialogues from Daily Dialog and CPED) was used to validate the emotion estimator."
