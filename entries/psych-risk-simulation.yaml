  notes: "MIT Media Lab. Conversations follow clinical staging models (3 to 5 stages by condition); the turn classifier prompt is in Appendix D and the 18 cases in Appendix E. No code, dataset, or repository link was found in the full text, so the scenarios may not be released (open_data set to described_only). Models tested: GPT-5, Llama-4-Maverick, Gemma 3 27B, and a community fine-tune, all without system prompts. Only the first half of the paper was read closely."
