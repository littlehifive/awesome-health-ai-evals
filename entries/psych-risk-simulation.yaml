id: psych-risk-simulation
name: Real-Case Informed Psychological Risk Simulation
kind: eval_framework
year: 2025
summary: A five-stage methodology that turns 18 documented cases of AI-linked psychological harm (addiction, anorexia, depression, homicide, psychosis, suicide) into 2,160 staged multi-turn scenarios and scores each LLM reply as improves, neutral, or worsens with an LLM classifier.
