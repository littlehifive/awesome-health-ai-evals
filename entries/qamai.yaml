year: 2024
summary: A six-item, 5-point rating tool (accuracy, clarity, relevance, completeness, sources, usefulness; total 6 to 30 with five quality grades) for clinicians to judge the quality of health information from AI chatbots, validated on 30 ChatGPT-4 head and neck surgery answers rated by 27 surgeons.
