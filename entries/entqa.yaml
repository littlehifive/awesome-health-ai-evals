id: entqa
name: EntQA
kind: eval_framework
year: 2025
summary: An entity-centric metric that extracts biomedical entities from patient backgrounds, questions, and LLM answers and scores entity coverage, tested on five medical QA benchmarks with seven Qwen 2.5 models.
