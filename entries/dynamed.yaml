card:
  task: Ask information-seeking questions about a patient's symptoms during a simulated medical consultation before
    making a decision.
  items_built: The framework is designed for simulated medical consultations between a Patient System and an Expert
    System. The authors also introduce MEDQACHAT, a synthetic medical conversation dataset, but the abstract does
    not describe its sources, size or checks.
  example: ''
