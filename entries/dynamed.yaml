  results: Across LlaMA-2-Chat 7B and 13B, GPT-3.5 and GPT-4, accuracy dropped by 10.1% on average when prompted
    to ask questions rather than answer directly from the same limited information. The authors' best model improved
    the GPT-3.5 Expert System's accuracy by 19.0%, but remained 10.0% below its accuracy with full information upfront.
  limitations: The authors state that substantial work remains to extend LLM assistants' information-seeking abilities
    in critical domains.
