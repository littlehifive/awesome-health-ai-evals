  notes: "Hugging Face card is inconsistent on license: the YAML tag says mit while the card text says CC BY-NC-SA 4.0, so license is left null. Answers come from verified physicians on the forums. ICD-11 category and question type tags were assigned by GPT-4o-mini. Med-Judge uses Gemini-Flash-2.5 and was validated against expert physicians. Forum answers were not written for the benchmark."
