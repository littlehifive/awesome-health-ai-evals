id: health-score
name: Health-SCORE
kind: eval_framework
year: 2026
summary: A set of generalized healthcare rubrics distilled by clustering HealthBench's instance-level physician-written criteria, with an adaptive rubric-selection step, used both to score open-ended medical LLM responses and as an RL reward or in-context guidance.
