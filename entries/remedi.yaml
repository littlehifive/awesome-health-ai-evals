  notes: "Pre-LLM resource (BERT, GPT-2, mT5 baselines); scored with F1, BLEU, and 0-2 human ratings on 300 sampled responses. 15 annotators with medical backgrounds labelled the dialogues. The GitHub repo shows an MIT license, but it was not stated for the data, so license is null. Data is on GitHub (base) and Google Drive (large). The arXiv preprint was read; a peer-reviewed version was not checked. Round 2 added the SIGIR 2022 record (r_e99960e0bc, DOI 10.1145/3477495.3531809), the published version of the same resource."
