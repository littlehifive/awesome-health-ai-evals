  notes: "NeurIPS 2025 paper. The underlying MIMIC data need PhysioNet credentialing, hence gated; the repo's license was not stated on the repo metadata. The paper is mainly a simulator whose realism is evaluated; it is positioned as a testbed for doctor LLMs, so it is borderline between tool and benchmark."
