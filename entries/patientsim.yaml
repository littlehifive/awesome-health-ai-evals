year: 2025
summary: An open-source persona-driven patient simulator for testing doctor LLMs in emergency-department consultations, with clinical profiles from MIMIC-IV and MIMIC-IV-ED and 37 persona combinations over personality, language proficiency, recall level and confusion level, checked for factual accuracy and persona consistency.
