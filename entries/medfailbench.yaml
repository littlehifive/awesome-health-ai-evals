  notes: "Single-author preprint (Maltepe State Hospital, Istanbul). The Hugging Face prompts card says the 222 rows must not be treated as the 44-case analysis set; only 40 cases have a populated safety-gate label. Scripts give provisional automated scores that need clinician review. The HF dataset goktugozkanmd/medfailbench-v02-results holds model response artifacts and is not listed as a link. Code is Apache-2.0, data CC-BY-4.0 per the paper. Rater country is the single reviewing clinician's hospital."
