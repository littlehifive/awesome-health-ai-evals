summary: "A short stakeholder-survey framework that scores LLM-generated lifestyle counselling from three perspectives (users, medical experts, developers) with five-point Likert statements, demonstrated on a Dutch cancer-survivor diary app (19 user ratings, 50 expert-rated responses)."
