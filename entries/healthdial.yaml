summary: 6,000 information-seeking spoken dialogues (1,500 each in Arabic, Chinese, English, and Spanish) grounded in 12,045 WHO knowledge snippets, with 163 hours of speaker-annotated user speech and baseline tasks for ASR, TTS, retrieval, and knowledge filtering.
