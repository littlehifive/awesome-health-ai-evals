  notes: "Record r_1a59c14968 is the Cambridge PhD thesis that contains HEALTHDIAL; the dataset paper (arXiv 2605.30107) was read for the facts and may sit in another candidate. Text and code are MIT; audio is under a custom non-commercial data use agreement; the HF card could not be fetched, so the HF license tag is unseen. Annotators wrote the user utterances (not clinicians); WHO snippets are not clinically validated. Baselines are WER/CER, retrieval recall, and exact-match filtering; a small TAM2 user study of a prototype system is also reported. The thesis also contains Multi3WOZ (not health)."
