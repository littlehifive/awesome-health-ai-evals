  notes: "The screening record is the GitHub repo hotdogisme/MedChain, a copy of the code that links the paper; the paper and ljwztc/MedChain (MIT code, 59 stars) are the main sources. Dataset license is from the Hugging Face card. Cases are de-identified records verified by doctors on iiYi (not real-time user queries, so real_user_queries is a loose fit); five physicians checked a 6,000-case sample (94.7% passed). Scoring is stage-specific: accuracy and IoU for referral, key-point scoring for the other stages; some stages use judge or text metrics (not fully read). The patient simulator is Gemma2-9B. Includes images, but modality is recorded as text only. Also proposes MedChain-Agent, a method. Lead countries: first author at City University of Hong Kong, last at Chinese University of Hong Kong. Round 2 added the NeurIPS proceedings record r_a1f9de59f6 (DOI 10.52202/085713-2498)."
