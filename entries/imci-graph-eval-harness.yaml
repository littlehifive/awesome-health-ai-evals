id: imci-graph-eval-harness
name: Graph-based evaluation harness (WHO IMCI)
kind: benchmark
year: 2025
summary: A harness that turns the WHO IMCI child-illness guidelines into a knowledge graph and generates multiple-choice questions by traversal (400+ questions, age-specific scenarios, distractors), covering symptom, condition, treatment, severity, and follow-up tasks.
