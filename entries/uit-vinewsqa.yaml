card:
  task: Read a Vietnamese health news article and answer its question by extracting a continuous span from the article.
  items_built: Trained crowd-workers who passed a reading comprehension test wrote 22,057 question-answer pairs
    from 4,416 VnExpress health news articles. The authors inspected 1,183 pairs, found 335 with errors, and required
    annotators to check and correct errors in questions, answers and span boundaries.
  example: '"Hút thuốc lá có hại như thế nào đối với con người?" (How harmful is smoking for humans?)'
  scoring: Predicted answers are compared with human reference answers after ignoring punctuation and white spaces;
    EM reports the proportion of exact matches. Token-overlap F1 is calculated against each reference, the highest
    F1 is retained for each question, and these scores are averaged across questions.
  judge: An automated evaluation system compares predictions with human-written reference answers.
  scale: Exact match per question and token-overlap F1; overall EM and macro-average F1 reported as percentages.
  validation: ''
  score_meaning: Answers with missing or extra words receive no exact-match credit but can receive partial F1 credit
    for overlapping words, even when a person would accept them as correct.
  annotation_process: Reference-answer annotators passed a reading-comprehension test and were trained on 200 questions.
    For the human-performance evaluation, three additional workers independently answered each development and test
    question, producing four answers per question including the original answer. Each answer was scored in turn
    against the other three references, and the four resulting performance scores were averaged.
  results: ALBERTBase_Uncased achieved the best test scores, with 65.26% EM and 84.89% F1. The human baseline exceeded
    it by 14.53 percentage points in EM and 10.90 percentage points in F1.
  limitations: The authors identify ambiguous questions with multiple valid answer spans and note that exact match
    rejects some answers with small boundary differences that could be accepted as correct.
