  notes: "Read the arXiv preprint (2006.11138, an earlier version of the same corpus with different reported counts; the 22,057 figure is from the journal abstract). Both say the corpus is publicly available on the UIT NLP group website (sites.google.com/uit.edu.vn/uit-nlp/datasets-projects) for research purposes; no license text was seen, so license is null. Source articles are from VnExpress. Task is extractive span-answer machine reading comprehension on news text rather than chatbot answering, so scope is borderline. item_provenance web_forum is the closest value for online news articles. Best model ALBERT: EM 65.26, F1 84.89."
