  notes: "Two releases in one paper (MentalBench-100k for response generation, MentalAlign-70k for judge reliability) plus an agreement framework (ICC-based). Seven attributes are rated on a 5-point scale and grouped into Cognitive Support Score and Affective Resonance Score. Human raters are three experts per rating according to the Hugging Face card; their countries are not stated. The EmoCare text was reprocessed with ChatGPT-4, so some contexts are AI-rephrased. License taken from the Hugging Face card."
