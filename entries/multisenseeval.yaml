summary: A six-axis framework (perceived susceptibility, severity and benefits, diagnostic accuracy, conversation flow and correctness, readability) for judging multi-turn mental health sensemaking conversations, with the MHSD set of 2,284 synthetic patient-LLM conversations built from MedQA mental health cases.
