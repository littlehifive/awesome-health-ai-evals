  size: "4,603 questions (3,696 five-option, 907 four-option) plus eight derived perturbation sets of about 3,400 to 4,000 questions each"
card:
  task: Choose the most likely diagnosis from the candidate options for each original or perturbed patient case
    and explain the answer.
  items_built: The authors filtered MedQA to retain 4,603 case-based diagnosis questions with four or five options,
    then generated eight datasets by changing or removing gender, age, symptoms or test results, excluding cases
    missing the required information. Four professional physicians and experts reviewed and corrected the answers
    in the derived datasets, and the authors added the options 'None of the above' and 'The question contains inconsistency'
    where a perturbation removed the correct answer or made the case inconsistent.
  example: ''
  scoring: Extracted answers are compared with the answer key to calculate accuracy, counting invalid or empty responses
    as wrong; original-dataset results are averaged over two trials. Sensitivity is measured by the accuracy change
    for cases whose correct answer stays the same and by accuracy for cases whose correct answer changes.
  judge: Answers are checked against answer keys reviewed and corrected by human doctors.
  scale: Correct or incorrect per question; percentage accuracy and percentage-point accuracy change.
  validation: Four professional physicians and experts reviewed and corrected the answer key of every derived-dataset
    question; no agreement statistics are reported.
  results: GPT-4 led on original DiagnosisQA with 78.95% accuracy, averaged over two trials. Across perturbed cases
    whose correct answer changed, it also led with 5.28% accuracy, answering 345 of 6,528 questions correctly.
  limitations: The authors note that MedQA-derived cases differ from actual electronic medical records because their
    information is expert-validated and highly relevant to solving the question.
  sources:
