card:
  task: Select one or more correct answers to mental health ethics questions and give free-form responses to ethically
    challenging scenarios in an Australian context.
  items_built: The authors combined 63 official National Psychology Examination sample questions with questions
    generated by GPT-5 and Claude-Sonnet-4.5 from 392 principles in five APS, Ahpra and RANZCP documents, using
    prompts refined by one clinical psychologist and one psychiatrist. Cross-scoring by the two generating models
    retained questions meeting thresholds of 23/26 for multiple-choice and 9/10 for open-ended questions, leaving
    1,377 and 2,612 items respectively; experts also checked 20 sampled retained questions.
  example: ''
  scoring: Multiple-choice answer sets are compared with the answer key and averaged for exact match and partial
    credit, with half credit for a non-empty proper subset containing no incorrect options. GPT-5-mini checks open-ended
    responses for basic quality and eight ethical violation categories, reporting the proportions passing quality,
    passing quality with no violations, and having no violations among quality-passing responses; string matching
    and GPT-5-mini separately measure refusal rates.
  judge: Multiple-choice scoring uses the answer key; GPT-5-mini judges open-ended response quality, ethical violations
    and refusals.
  scale: 'Exact match: 0 or 1; partial credit: 0, 0.5 or 1; quality and violations: binary; aggregate scores and
    rates reported as percentages.'
  validation: ''
  score_meaning: In the released response annotations, 1 means a problem is present and 0 means it is absent; the
    quality label marks severe gibberish, repetition, or loss of coherence, rather than a quality pass. A jurisdictional
    violation means treating non-Australian laws, regulators, professional standards, or ethical guidelines as governing
    the Australian context without acknowledging their limits.
  annotation_process: The released response-annotation set contains 100 manually annotated research examples. The
    released file does not identify the annotators or report inter-annotator agreement.
  results: Qwen2.5-14B achieved the highest overall ethical rate at 84.76% and a conditional ethical rate of 84.96%
    across the 14 evaluated models.
  limitations: The authors identify reliance on an LLM judge, exclusion of models larger than 14 billion parameters,
    limited transfer beyond Australian regulations, and scenario design that does not explicitly account for population
    diversity.
