  notes: "Dataset card only; the ALLMTS (Automated LLM-based Medical Triage System) paper it was used in was not read or linked. Vignettes were drafted with an LLM, then reviewed and labelled by Nurse Editors of Schmitt-Thompson Clinical Content (a commercial triage-protocol publisher, so builder type is a judgment), confirmed by a second editor, and validated by five triage nurses (94.4% agreement). The card says over- and under-triage should be scored with the ordinal urgency_group. Commercial use requires permission. Builder country USA is inferred from the US conventions, not stated."
