  notes: "The paper's data-and-code statement points to an anonymous 4open.science repository that may expire; a permanent link was not seen. Questions are labeled by gpt-5 (Type A ill-formed, Type B dangerous, benign) with human-label alignment checked on a subset; LLM responses on a high-confidence corrupted subset are judged by gpt-5 for whether they flag the false assumption. Evaluated models include Meditron, OpenBioLLM, Llama 3, MedGemma, GPT-4o, GPT-5 and Claude Haiku 4.5. Main contribution is a data-collection study of how corrupted questions propagate. Name is descriptive; the paper gives the set no name."
