  notes: "Not publicly released: the abstract says it will be shared with accredited mental-health and suicide-prevention research institutions on reasonable request, hence gated. Scored by accuracy and macro precision, recall, and F1 over the six risk classes for PLMs and more than 40 LLMs. Labels: three trained psychology graduate students on a 300-item pilot (Fleiss kappa 0.57 to 0.73) then main annotation with expert adjudication; a silver-label set was also built with 17 open LLMs voting. Annotator countries are not stated. The system under test is a classifier, so intended users are unspecified."
