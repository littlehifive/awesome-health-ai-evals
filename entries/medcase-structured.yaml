  notes: "Borderline scope: structured EHR-style (FHIR) input, but the task is diagnostic reasoning, not documentation or coding. Bundles are synthetic and LLM-generated from the MedCaseReasoning narratives; the answer key is a separate file. The judge is Claude Sonnet 4.6 giving a binary clinical-equivalence decision. Presented at the ICML 2026 Structured Data for Health workshop, recorded as preprint. Adapted from MedCaseReasoning (Wu et al., 2025); add adapted_from once that benchmark has an entry id. The company (System Inc.) is a US health-AI startup per the paper's affiliation; no rater countries."
