id: psycollm-benchmark
name: PsycoLLM psychological counseling benchmark
kind: benchmark
year: 2024
summary: 3,863 Chinese multiple-choice questions plus 20 case-analysis scenarios with 100 open questions, drawn from public Chinese psychological counselor examinations and covering professional ethics, theory, and case analysis, scored by accuracy (and elastic accuracy for multi-answer items) and ROUGE, BLEU, and BERTScore.
