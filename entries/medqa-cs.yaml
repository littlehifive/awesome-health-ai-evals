  notes: The screening record is portwise-ai/BF-MedQA-CS, a GitHub copy of the original bio-nlp/MedQA-CS code (same README, titled MedQA-CS); it is a mirror and not listed in links. The paper (arXiv 2410.01553) was found via the repo README and read in part. Number of cases and rater countries were not stated in the parts read. The README warns that GPT-4-judge scores have drifted and that a Llama examiner is planned. The Hugging Face dataset bio-nlp-umass/MedQA-CS-Exam (record r_42812fa19e; card seen, license cc-by-nc-4.0, links to the GitHub project and the MedQA-CS-Student dataset, no item count on the card) belongs to this benchmark and is merged here.
