id: medqa-cs
name: MedQA-CS
kind: benchmark
year: 2024
summary: Clinical-skills benchmark built from USMLE Step 2 CS patient cases, in which an LLM acts as the medical student (history-taking dialogue, physical exam, closure, diagnosis and patient note) and is scored by an LLM examiner checked against three medical experts.
