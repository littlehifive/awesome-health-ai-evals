card:
  task: Write the next assistant response to a fixed mental-health conversation.
  items_built: The authors used Claude Opus 4.8 to screen 5,000 synthetic HealthBench conversations, then three
    licensed clinicians (1 MD, 1 LICSW, 1 LPC) selected items by majority vote in two blinded review rounds with
    concealed excluded controls and a Claude Sonnet 4.6 recall screen. The initial release contained 610 conversations,
    including 119 from HealthBench-Hard; version 2 added one mistakenly omitted control, bringing the total to 611.
  example: ''
  scoring: Each judge independently marks whether the response meets each original physician-authored HealthBench
    criterion, and the reference scorer divides points for met criteria by total positive points. The reported panel
    score averages the three judges equally within each conversation and then averages across conversations, clipped
    to 0 to 1; refusals are graded as returned.
  judge: GPT-4.1, Claude Haiku 4.5, and Gemini 2.5 Flash grade each response at temperature 0.
  scale: Boolean criterion verdicts; point-weighted response scores and a final panel mean clipped to 0 to 1.
  validation: The three judges' rankings of 20 models had Kendall correlations of 0.926 to 0.947. Replicating the
    published GPT-4.1 evaluation on all 1,000 HealthBench-Hard conversations produced 0.157 versus the published
    0.16, with no failed gradings.
  results: At initial release, kimi-k2.6 had the highest panel mean, 0.627 (95% CI 0.606 to 0.647), within a statistically
    tied group of five leading models. Claude-opus-5 had the highest Hard-subset mean, 0.415 (95% CI 0.366 to 0.463).
  limitations: The authors note residual missed conversations, reliance on machine translations for 123 non-English
    conversations, uneven category representation, unmatched inference compute across models, judge-reliability
    evidence limited to three judges in one specialty, and wide uncertainty on the 119-item Hard subset.
