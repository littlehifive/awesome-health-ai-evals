  notes: "Dataset card only; the accompanying paper is not yet available. Modality lists text only because the schema has no image value; 194 questions also use images. Licence is mixed: questions and annotations CC BY 4.0, code Apache-2.0, third-party article text and images keep original licences; the hub tag is 'other'. Set was selected adversarially against Gemini 3.1 Pro Preview and Claude Opus 5, and Gemini also served as judge, so the card warns of judge-specific selection bias. The screening record notes the text-only subset (163) is the in-scope part. Medical-Doctors-Last-Exam/mdle-zh (r_d12b457802) is a machine-translated Simplified Chinese version of the earlier 489-question v1.2.1 release (412 questions from 401 case reports, 216 with images, translated with Qwen3.5-27B without number or unit checks; test split, license tag other, n<1K, ungated), hosted under the same organization, so it is merged here rather than listed as a separate adaptation. The English source was also published as txz32102/pediamed-mdle-challenge."
