  notes: 'Borderline scope: the task is span extraction from leaflets (information extraction) framed as LLM question answering for patients, so a human may want to check whether it counts as biomedical NLP. License CC-BY-4.0 is from the Hugging Face card (the card also says License: More Information Needed); the paper PDF carries a separate CC BY-NC-SA 4.0 repository tag that I did not treat as the dataset license. Leaflets derive from the D-LeafIT corpus (the code link is that corpus repo); the CALAMITA paper is a 2024 challenge description with no model results. Annotators have different linguistic backgrounds; their countries are not stated.'
