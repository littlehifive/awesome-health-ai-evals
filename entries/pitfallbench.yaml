card:
  task: Generate the next parent utterance after paired skilled and problematic clinician moves in PitfallBench,
    and generate all parent turns against a fixed clinician script in DialogueBench.
  items_built: Pediatric serious-illness communication clinicians compiled ten pitfalls and authored curriculum
    templates used to generate 1,000 PitfallBench items, which were screened and regenerated using a clinician-refined
    acceptance criterion. DialogueBench's 152 gold dialogues were selected from a synthetic substrate generated
    across eight LLM families, six disease categories, three trainee proficiency levels and 12-28 turns, using automated
    rubric screening followed by clinician realism review.
  example: ''
  scoring: For PitfallBench, an LLM classifies each response as challenge_signal, reward_signal or neither; paired
    contingency accuracy is the fraction of items producing challenge_signal for the pitfall and reward_signal for
    its skilled alternative. For DialogueBench, independent LLM judges score each parent turn for grounding and
    topic consistency using three-call median voting per dimension; the reported composite averages PitfallBench
    accuracy with grounding rescaled to 0-1.
  judge: Claude-model judges assign scores, with two independent LLM judges for DialogueBench; GPT-5, DeepSeek R1
    and Qwen3 also re-score key PitfallBench conditions.
  scale: 'PitfallBench paired accuracy: 0-1; DialogueBench: 1-3 per parent turn per dimension; composite: 0-1.'
  validation: Item-screening reviewer-clinician agreement reached 95% on 50 stratified items, five per pitfall.
    DialogueBench judges were calibrated against ratings from 11 pediatric clinicians, and three non-Claude judges
    preserved the ranking of the key PitfallBench conditions.
  score_meaning: Conversational Grounding measures responsiveness to the clinician's latest turn, while Topic Consistency
    measures whether the parent maintains a coherent concern. A simulator that always escalates or always cooperates
    fails one half of the PitfallBench pair.
  annotation_process: For PitfallBench item screening, an independent LLM reviewer from a different model family
    than the generator applied a written acceptance criterion, and pediatric SIC clinicians inspected a stratified
    sample of its decisions. Disagreements led to revisions of the criterion and generation prompts; failed items
    were regenerated and screened again, and the final criterion was applied to all released items. DialogueBench
    selection began with automated threshold screening on the two scoring dimensions, followed by pediatric SIC
    clinician review of surviving dialogues for clinical realism using the same acceptance criterion.
  results: SIC-Agents performed best, with PitfallBench accuracy of 0.78 ± 0.03 and DialogueBench grounding of 2.96
    ± 0.02 over three independent seeds, and a reported composite of 0.88.
  limitations: The authors report criterion-level rather than exhaustive per-item expert validation, synthetic dialogues
    without direct validation against real conversation distributions, no evaluation of trainee learning or clinical
    impact, and untested generalization beyond one English-language curriculum and expert panel.
