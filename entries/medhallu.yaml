summary: 10,000 PubMedQA-derived medical question-answer pairs, each with a ground-truth answer and an LLM-generated hallucinated answer labeled by hallucination type and difficulty (easy, medium, hard), for testing whether models can detect medical hallucinations; scored by precision, recall and F1.
