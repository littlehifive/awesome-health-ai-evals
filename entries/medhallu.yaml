  notes: "EMNLP 2025, University of Texas at Austin lead. MIT license is stated on the UTAustin-AIHealth/MedHallu dataset card (PubMedQA is also MIT per the paper). Other Hugging Face copies in the record (Harish1227/MedHallu, Lizong/MedHallu, Manoharareddy/MedHallu, sumeet12356/MedHallu) are mirrors. Certops/med-hallucination-detection-unfiltered and the Certops/medhallu-twins-* sets are a third party's derivatives (see medhallu-twins-rewritten) and are not linked here. Hallucinated answers were generated and filtered by LLMs; the 1,000-item labeled split is described as high-quality, not human-written."
