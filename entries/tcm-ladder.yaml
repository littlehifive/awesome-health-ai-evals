  notes: "Abstract states the datasets and leaderboard are public at tcmladder.com; no license was found in the parts read. The data are also meant for training (the authors fine-tuned models on a subset), so only the evaluation split is a benchmark. Modality is recorded as text only because the schema has no image option; the benchmark also includes herb images, tongue images, pulse audio and video. Published at NeurIPS 2025 (Datasets and Benchmarks, DOI prefix 10.52202). First and last authors are at the University of Missouri; a co-corresponding author is elsewhere. 5,000 text QA pairs were written by licensed TCM practitioners and cross-checked by two physicians. Ladder-Score was not examined in detail."
