  notes: "v1 (ACL 2019, Vilares and Gomez-Rodriguez) and v2 (arXiv 2511.15355, Correa-Guillen, Gomez-Rodriguez, Vilares) are merged because the same group extends the same exam-based dataset. v1 English is human-checked machine translation (adequacy and fluency rated); v2 English, Italian, Galician and Russian are LLM translations selected by a back-translation pipeline. About 14% of medicine questions refer to images; images are included in the data but not used in the papers' experiments. v1 split: 2,657 train, 1,366 dev, 2,742 test (supervised setting). License MIT is from the dvilares/head_qa and alesi12/head_qa_v2 Hugging Face cards; EleutherAI/headqa mirror says license: other and is not listed. v2 dataset ID taken from the paper; a v1 project page link (aghie.github.io) no longer resolves."
