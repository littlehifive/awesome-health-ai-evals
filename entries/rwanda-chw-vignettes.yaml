  notes: "Paper is Nature Health 2026 (preprint on medRxiv 2025, doi 10.1101/2025.08.26.25333975). Data availability: the 524 benchmark questions with answers and individual ratings are on Figshare; the full 5,609-vignette set is held by the Rwanda Biomedical Centre and shared with researchers on request. Five LLMs (Gemini-2-Flash, GPT-4o, o3-mini, DeepSeek R1, Meditron-70B) and 20 clinicians (6 senior nurses, 14 GPs) answered; 11 criteria rated on a 5-point Likert scale by clinician evaluators, in English and Kinyarwanda. Lead institution countries not checked beyond Rwanda-based Digital Umuganda and C4IR Rwanda; funded by the Gates Foundation."
