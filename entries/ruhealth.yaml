  notes: "Read the Zenodo record and the GitHub README of the analysis-code companion; the paper (Scientific Reports, under review) was not available. Zenodo notes data files are CC BY 4.0 and code is MIT. Claims were built through a multi-stage validation pipeline with three source-backed medical experts and six physicians; their countries are not stated. Labels are true, false, or disputed, scored by accuracy and macro-F1. The model-prediction files in the archive are this study's outputs, not part of the benchmark."
