card:
  task: Classify each health claim as true, false, or disputed.
  items_built: The 108 claims underwent linguistic screening for clarity and single-proposition phrasing, independent
    veracity assessment by six physicians, and source-backed annotation by three medical experts whose searches
    were screen-recorded. A medical journalist refined the claims, a meta-reviewer made the final adjudication,
    and validated English translations were provided.
  example: ''
  scoring: Predicted labels are compared with the final adjudicated labels to calculate per-model accuracy and macro-F1,
    overall and separately by language; non-parseable outputs are excluded. Confidence intervals use a statement-clustered
    bootstrap.
  judge: Scoring compares predictions with the answer key finalized by a meta-reviewer.
  scale: True, false, or disputed per claim; aggregate accuracy and macro-F1.
