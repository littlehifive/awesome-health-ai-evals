  notes: "Single author at EPFL (Switzerland). The paper states both benchmarks are released openly for research; the Hugging Face dataset pages returned 401 when I checked, so the links are taken from the paper and access was not verified. Per-item licenses vary by source (AfriMed-QA is CC BY-NC-SA 4.0) and sit in per-source manifests, so license is null. The judge-calibration file re-scopes HealthBench's physician meta-evaluation labels. The GitHub repo holds construction code only (the README says artifacts are not tracked in Git); a second repo, nmrenyi/mamaretrieval, is cited for retrieval. Retrieval track is IR-style (hit rate, MRR), so the automatic_metric label covers it."
