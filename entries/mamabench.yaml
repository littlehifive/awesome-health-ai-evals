card:
  task: Answer maternal, neonatal, child, and reproductive-health questions in multiple-choice or free-text form
    for mamabench, or retrieve guideline passages answering each clinical query for mamaretrieval.
  items_built: The author assembled mamabench from MedMCQA, MedQA-USMLE, AfriMed-QA, Kenya Clinical Vignettes, the
    Women's Health Benchmark, and two HealthBench source sets, using existing specialty labels or an LLM scope classifier
    and removing unscorable multiple-choice items. For mamaretrieval, Qwen3.6-27B-FP8 generated 3,185 answerable
    queries from 4,540 sampled guideline chunks, and Qwen3.5-397B-A17B-FP8 assigned 230,964 relevance labels to
    the union of six retrievers' top-20 results per query.
  example: '"What are the alternative dosages for iron and folic acid supplementation?"'
  scoring: Mamabench compares multiple-choice answer letters with the answer key and uses an LLM judge to assess
    physician-written criteria for rubric-graded responses. Mamaretrieval labels each query-chunk pair as D_1 ×
    (D_2 + D_3 + D_4), treats scores of at least 3 or at least 5 as relevant, and reports Hit Rate@k and MRR, the
    mean reciprocal rank of the first relevant passage across queries.
  judge: Mamabench uses answer keys and a consumer-selected LLM rubric judge; mamaretrieval uses Qwen3.5-397B-A17B-FP8
    at temperature 0.
  scale: Multiple-choice accuracy; rubric criteria met or not met; retrieval relevance 0-6, with lenient ≥3 and
    strict ≥5 thresholds, summarized by Hit Rate@k and MRR.
  validation: The retrieval judge agreed with Claude Opus 4.7 on 59 of 62 pairs at the lenient threshold and 53
    of 62 at the strict threshold. A 100-query pooling audit raised estimated lenient coverage from about 0.49 to
    about 0.99 when expanded to five retrievers' top-20 results; mamabench provides 6,853 physician-labelled criterion
    triples over 872 prompts for consumers to calibrate their rubric judge.
  results: ''
  limitations: The authors report no large-scale midwife validation, overlap between rubric-calibration and consensus-test
    prompts, clean single-chunk retrieval queries that favor dense retrievers, incomplete pooled relevance labels,
    and English-only coverage tied to a Zanzibar nurse-midwife setting.
