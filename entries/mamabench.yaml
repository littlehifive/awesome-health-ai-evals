summary: Two maternal, neonatal, child, and reproductive health benchmarks for nurse-midwife RAG assistants, a 25,949-item scope-filtered QA set from seven sources (multiple-choice, short-answer, rubric-graded) and 3,185 queries with graded relevance labels over a 63,650-chunk guideline corpus.
