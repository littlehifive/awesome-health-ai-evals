id: chars
name: Chatbot Rating Scale (CHARS)
kind: eval_framework
year: 2025
summary: A 25-item, three-factor rating scale (Design, Interactive User Experience, Functionality) for the quality of health and social care chatbots, developed by Delphi and validated with 979 raters scoring 36 health and mental health chatbots.
readme_section: frameworks
