  notes: "Research Square preprint, not peer reviewed. Participant data are not public (available on reasonable request). The CC BY 4.0 notice on the preprint covers the paper, not data, so license is null. Ethics approval came from the Federal Capital Territory Health Research Ethics Committee (Nigeria); author affiliations were not read, so lead_institution_countries is UNKNOWN. Raters were health professionals, researchers, and end users, so expert_human_rating is the nearest eval_methods label. This is a user-experience scale for chatbot apps rather than a check of answer correctness."
