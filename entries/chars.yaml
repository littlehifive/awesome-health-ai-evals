card:
  task: Interact with users as a health or social care chatbot so they can rate its design, interactive user experience,
    and functionality.
  items_built: CHARS is intended for rating health and social care chatbots and was developed through a Delphi process
    involving domain experts, information technology experts, graduate students, and end users. The process produced
    25 items across five initial dimensions; testing retained all items and redistributed them across three factors.
  example: ''
  scoring: Users rate chatbots on 25 items using a 5-point Likert scale.
  judge: The 979 raters included health professionals, researchers, mental health experts, and end users.
  scale: A 5-point Likert scale per item.
  validation: Ten chatbots were pilot tested before 36 were rated. Cronbach's alpha was 0.90 for Design, 0.88 for
    Interactive User Experience, and 0.90 for Functionality; reported interrater correlation coefficients were 0.88,
    0.98, and 0.90, respectively, with p < .001.
  results: ''
  limitations: The authors call for further testing of generalizability across cultural and technological contexts
    and predictive validity for user engagement.
  sources:
  - https://doi.org/10.21203/rs.3.rs-8228980/v1
