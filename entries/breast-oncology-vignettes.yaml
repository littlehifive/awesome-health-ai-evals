  notes: "Read the arXiv version (2411.03395); the NEJM AI page was not reachable. The paper says the cases are open-sourced and lists full case descriptions and ground truths in its appendix, but no license is stated and no separate repository was found. Five breast cancer specialists rated responses against NCCN guidelines; rater countries are inferred from the Houston Methodist panel and are not stated for the raters. A Gemini 1.5 Pro auto-rater was used for method selection and checked against specialists. Authors are at Google Research, Google DeepMind and Houston Methodist."
