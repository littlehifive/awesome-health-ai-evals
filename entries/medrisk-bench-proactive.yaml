card:
  task: Respond to a user-style query that describes a situation without directly asking a medical question, proactively
    flagging any relevant medication risk.
  items_built: The synthetic, clinician-validated benchmark contains 852 questions with explicitly stated risk groups
    and 209 questions where underlying conditions appear only through clinical indicators. A matched no-risk control
    set contains 356 clinician-reviewed questions derived from 40 randomly sampled medication risks using the same
    construction pipeline.
  example: ''
  scoring: The card does not describe how Query Score is calculated. For over-warning, GPT-5.4 and Claude Sonnet
    4.6 independently count case-unsupported warnings in each response, their counts are averaged, and aggregate
    metrics report the percentages with any unsupported warning or more than one, plus the mean count per response.
  judge: GPT-5.4 and Claude Sonnet 4.6 independently count unsupported warnings; the Query Score grader is not specified.
  scale: Averaged unsupported-warning count per response; OW and OW>1 are percentages, and mOW is the mean count
    across responses.
  validation: ''
  results: ''
  limitations: The authors state that the questions and scenarios are not exhaustive and that benchmark performance
    does not guarantee real-world medical safety or clinical reliability.
