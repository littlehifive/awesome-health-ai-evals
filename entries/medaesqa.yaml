card:
  task: Answer each health question with evidence-supported sentences, citing up to three PubMed references per
    sentence and no more than 30 documents per answer.
  items_built: The authors selected the 40 most popular, previously unseen questions submitted by self-identified
    non-clinicians to MedlinePlus, and medical informatics experts added topics, narratives and structured question
    frames. A medical information expert wrote reference answers from PubMed titles and abstracts; TREC 2024 participants
    supplied 30 machine-generated answers per question, which clinicians assessed for answer acceptability, assertion
    relevance and citation support.
  example: ''
  scoring: Clinicians judge whether each answer at least partially answers the question, classify each assertion's
    relevance and assess each cited document's relationship to it; answer accuracy is the percentage of the 40 answers
    judged acceptable for each method. Other metrics measure assertion and citation proportions, document retrieval
    precision and recall, and completeness against required aspects pooled across systems and grouped into 10 clusters
    using sentence embeddings.
  judge: Clinicians employed by Centaur Labs assign labels by majority vote of at least three annotators per judgment.
  scale: Binary answer acceptability and four-category assertion and evidence labels; reported metrics include accuracy,
    precision, recall and citation rates.
  validation: Agreement, defined as the percentage of annotators choosing the majority label, was 90.37% for acceptable
    answers and 76.06% for unacceptable answers.
  results: Eleven of the 30 methods achieved 100% answer accuracy, and M17 achieved the highest answer precision
    at 90.23%. M24 achieved the best Sentence Transformer completeness scores, with 40.25 under the supported-and-required
    setting and 42.75 under the required-plus-borderline setting.
  limitations: The authors state that restricting supporting evidence to PubMed titles and abstracts may inhibit
    real-world usability.
