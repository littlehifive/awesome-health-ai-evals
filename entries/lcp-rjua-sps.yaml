summary: An automatic evaluation paradigm for LLM clinical capability built on an LLM-specific clinical pathway (LCP), standardized patients, and retrieval-augmented evaluation, instantiated as RJUA-SPs, 45 standardized urology patients supporting single-turn QA, diagnostic reasoning, and multi-turn diagnostic dialogue.
