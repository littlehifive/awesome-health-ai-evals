card:
  task: Answer clinical questions from patient information, recommend tests and examinations, or conduct a multi-turn
    patient consultation ending with a diagnosis and treatment plan.
  items_built: Clinical physicians selected 45 common urological diseases and used real patient communications,
    diagnoses, treatment information, and objective findings to create 45 standardized patient records through expert-level
    transcription. Each record underwent at least three rounds of manual calibration and validation involving a
    urology expert, algorithm engineers, and a medical expert team checking completeness, clinical authenticity,
    terminology, dialogue, reasoning, and diagnosis.
  example: '"I am experiencing frequent urination recently, what should I do?"'
  scoring: The retrieval-augmented evaluator compares diagnoses, treatments, and recommended tests and examinations
    with reference information retrieved from standardized patient records to calculate accuracy. For dialogue,
    it also checks information collected, inquiry order, reasonable test requests, and consultation rounds against
    the records and clinician references; the excerpts do not specify how these scores are combined.
  judge: An automated retrieval-augmented evaluator assigns the scores.
  scale: Accuracy for diagnosis, treatment, and test and examination recommendations; six clinical capability measures
    for dialogue.
  validation: ''
  score_meaning: 'More consultation rounds do not necessarily mean better performance: ChatGLM3 took more rounds
    because it asked many ineffective questions. Clinicians averaged 8.39 consultation rounds, providing a reference
    for interpreting the models'' dialogue lengths.'
  annotation_process: Each standardized patient record underwent at least three rounds of manual calibration and
    validation. One urology expert first calibrated the medical logic, algorithm engineers then tuned the model,
    and a team of medical experts performed a second validation. These checks covered clinical authenticity, specialist
    terminology, question-and-answer exchanges, reasoning, and diagnostic correctness.
  results: GPT-4 achieved the highest reported diagnostic reasoning accuracy for test and examination recommendations
    at 20.15%; the other evaluated models scored below 20%.
  limitations: ''
