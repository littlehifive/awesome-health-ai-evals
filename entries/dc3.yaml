  notes: "A 2019 information-retrieval and text-classification resource (not built for LLM chatbots), included because it is a small diagnostic-case set with ground-truth diagnoses. Case text is not redistributed because NEJM holds the copyright; a Python script downloads the public case challenges into JSON, and relevance judgments are in trec_eval format (open_data open for the script and judgments). Relevance labels are inferred from NER matches of diagnoses in PubMed abstracts, not manual judgments. No license stated in the paper."
