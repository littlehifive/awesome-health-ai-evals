id: dc3
name: DC3
kind: benchmark
year: 2019
summary: 31 very difficult diagnostic case challenges from the New England Journal of Medicine (Massachusetts General Hospital, 2013 to 2018) with temporally ordered physician notes, confirmed diagnoses as UMLS CUIs, and inferred dense relevance judgments over 27 million PubMed abstracts, for clinical decision support.
