  notes: "The paper also introduces Dr. CaBot, a diagnostic agent. The benchmark is private with a public leaderboard at cpcbench.com where researchers submit models. The paper says a subset (case presentation and differential sections, licensed from NEJM) will be released upon publication, so open_data is unknown. Some tasks use images (NEJM Image Challenge, visual QA); most are text. Most tasks use the 377 CPCs from 2015 to 2025 that have a differential diagnosis section."
