card:
  task: Given a clinical case, case segment, image or question, produce the requested differential diagnosis, testing
    plan, diagnostic evidence, literature search result or multiple-choice answer.
  items_built: The authors processed 7,102 NEJM CPCs and 1,021 Image Challenges; ten physicians, comprising five
    board-certified internal medicine attendings and five residents, each annotated 20 case reports with double
    annotation, then used these annotations to develop and validate automated annotation with o3-mini. o4-mini generated
    1,851 text questions and 1,914 image questions from case text and captions, and two physicians independently
    checked 50 random examples from each question set.
  example: '"Which morphological change is shown in Panel A?"'
  scoring: For differential diagnoses, a physician-validated LLM judge determines whether the published final diagnosis
    appears first or within the top ten predictions, and accuracy is reported across cases. Multiple-choice answers
    use exact match with the answer key, while GPT-4.1 evaluates alignment between proposed and actual diagnostic
    tests.
  judge: A physician-validated LLM judge grades diagnoses, GPT-4.1 grades testing plans, and exact match grades
    multiple-choice answers.
  scale: Correct or incorrect for top-1, top-10 and multiple-choice outcomes; percentage accuracy across items.
  validation: The diagnosis judge achieved 86% accuracy and 89% F1 against 1,467 differentials annotated by three
    physicians; the testing-plan judge achieved 84% accuracy and 83% weighted F1 against 112 scores from two physicians.
    In question review, both reviewers judged one text question (2%) invalid; one image question (2%) was invalid
    and two (4%) were trivial.
  results: On 377 contemporary CPCs, o3 led differential diagnosis generation with 60% top-1 and 84% top-10 accuracy.
    In a prior study of 302 CPCs, 20 internal medicine physicians with unrestricted electronic search achieved 24%
    top-1 and 45% top-10 accuracy.
  limitations: The authors note that unknown model training data may contain CPCs and their answers, and that highly
    curated, information-dense educational cases do not represent real-life diagnosis.
