card:
  task: Answer validated board-style medical multiple-choice questions generated by other models.
  items_built: Leading models from the OpenAI, Grok, Gemini, Claude, Kimi, and DeepSeek families generated challenging
    board-style medical multiple-choice questions, and an ensemble of the participating models judged their validity
    before inclusion in the exams.
  example: ''
  scoring: Evaluators score responses to other models' quizzes and aggregate exam accuracy. Question generation
    is evaluated separately by the percentage of generated questions judged valid.
  judge: An ensemble of participating LLMs judges question validity; the response evaluators are not specified.
  scale: Question validity rate and mean exam accuracy, reported as percentages.
  validation: ''
  score_meaning: ''
  annotation_process: ''
  results: 'Mean exam accuracies ranged from 85.7% to 91.7%, with no statistically significant differences between
    frontier models and no best model named. Mean physician accuracy was 85.6% (95% CI: 79.4%-91.7%), with no statistically
    significant difference from LLM accuracy.'
