summary: A three-stage evaluation-to-enhancement framework for therapeutic chatbots using a seven-dimension therapeutic competency rubric, expert think-aloud review, multi-LLM enhancement mapping and blinded A/B validation, piloted on a Korean-English mental health chatbot.
