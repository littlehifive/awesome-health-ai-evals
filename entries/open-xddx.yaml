  notes: "Dataset (Open-XDDx.xlsx) is in the Dual-Inf GitHub repository; the paper says data are in the supplementary files. No dataset license stated (the article itself is CC BY 4.0). Notes come from diagnosis exercises with multiple-choice options removed; three physicians annotated (two per note, a third resolved disagreements), at the University of Minnesota. Explanations are scored with BERTScore and METEOR, plus manual review of 100 cases. The same paper proposes the Dual-Inf prompting method, which is not part of the benchmark."
