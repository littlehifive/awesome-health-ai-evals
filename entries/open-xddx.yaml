name: Open-XDDx
kind: benchmark
year: 2024
summary: 570 clinical notes derived from USMLE-style exercises across nine specialties, each annotated by physicians with a set of differential diagnoses and the supporting interpretation (symptom reasons), for evaluating LLM interpretable differential diagnosis.
