  notes: "The paper says the dataset and MRAG-Toolkit will be released under CC BY-4.0 upon acceptance, but no download link was found, so license is null and open_data unknown. Closed-form tasks use accuracy or F1; long-form QA uses a GPT-4 judge in a pairwise Elo arena along four axes (usefulness, readability, knowledge, reasoning), with medical experts annotating part of the matches. Information extraction and link prediction tasks are partly biomedical NLP and sit at the edge of scope. First author affiliation is DataSelect AI (Shanghai); last author is at the University of Hong Kong, so lead country CHN covers both."
