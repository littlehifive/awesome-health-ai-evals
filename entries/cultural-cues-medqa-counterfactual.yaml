  notes: "University of Toronto (HIVE lab). A clinician verified that gold answers stay invariant; a rubric applied by an LLM judge (kappa 0.76 against humans) flags culture-referential reasoning in explanations. The repo has a Data folder, prompts, and scripts but no license file was identified. How the cultural edits were written (by hand or by an LLM) was not confirmed. The Data folder holds final_augment_test_questions.json and model outputs. A small, bias-focused extension of MedQA, similar to DiversityMedQA."
