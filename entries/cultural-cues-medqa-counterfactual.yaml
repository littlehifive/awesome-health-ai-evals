id: cultural-cues-medqa-counterfactual
name: Counterfactual Cultural Cues MedQA
kind: benchmark
year: 2026
summary: 1,650 counterfactual variants of 150 MedQA test questions with culture-related identifier tokens and contextual cues for three groups (Indigenous Canadian, Middle-Eastern Muslim, Southeast Asian) plus a neutral control, with clinician-verified invariant gold answers.
