  notes: Data published on PhysioNet (DOI 10.13026/zzax-sy62); the paper calls it publicly accessible. I could not load the PhysioNet page, so the access terms are unchecked and may be credentialed. The dataset license is not stated in what I read (the article itself is CC-BY-4.0). Lead institutions inferred as USA from the US-based authors (Soni, Demner-Fushman). Uses the EHR as evidence, so it is borderline against the EHR-documentation exclusion, but the task is answering patients' questions. Other repositories named archehr-qa-2026 are later shared-task editions and are not covered here.
