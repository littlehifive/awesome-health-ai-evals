card:
  task: Answer each patient's question using only the supplied clinical note excerpt, citing the sentence numbers
    that support the answer.
  items_built: Experts curated 134 cases using patient questions from public health forums and clinical notes from
    MIMIC-III and MIMIC-IV. Clinicians reworded the questions and wrote reference answers, and note sentences were
    manually labeled as essential, supplementary, or not relevant to answering the question.
  example: Why was cardiac catheterization recommended to the patient?
  scoring: Factuality measures overlap between the cited note sentences and the ground-truth evidence, while Relevance
    measures textual and semantic similarity between the generated answer and the clinician-written reference answer.
