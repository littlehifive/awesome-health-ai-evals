  notes: "Answers come from r/AskDocs authors with a moderator-verified physician flair. A GPT-4o judge scores each response 0, 0.5, or 1 against the physician answer; the paper also defines turn-level degradation, Conversational Consistency Score, and Error Propagation Rate. The five models tested were GPT-5, GPT-4o, Claude Haiku, Gemini 2.5 Flash, and Llama 3.3 70B. r_801739860c (arXiv 2607.12884, Evaluating LLMs on Misconceptions in Multi-Turn Medical Conversations) is a follow-up from the same authors that reuses the dataset with a misconception-correction rubric; r_61e5dc7d04 is a Northeastern repository DOI (10.17760/d20868106) that returned 403 and was not read. The Hugging Face card is gated (manual approval, research-use data use agreement); the license is the cc-by-nc-4.0 card tag."
