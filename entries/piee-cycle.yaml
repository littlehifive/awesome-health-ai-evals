id: piee-cycle
name: PIEE cycle
kind: eval_framework
year: 2025
summary: A four-stage red-teaming framework (Planning and Preparation, Information Gathering and Prompt Generation, Execution, Evaluation) for stress-testing LLMs in clinical decision-making with jailbreak, social-engineering, and distractor attacks, scored on true and false positive rates, hallucination, bias, and an ethical-safety Likert scale.
