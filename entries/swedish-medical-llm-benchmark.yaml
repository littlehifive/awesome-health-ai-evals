  notes: "PubMedQA-Swedish was translated from English PubMedQA with GPT-4 plus human review, so its original items come from PubMed abstracts rather than Sweden. SMDT is adapted from Swedish clinical exams for doctors (image questions omitted); SE-EM and SE-GM come from Swedish specialist exam material (the paper text read here gives no further source detail). Scoring is exact-match accuracy with a question-weighted overall SMLB score. r_37cb0ccbee is the KTH doctoral thesis (Moell) that also reports the benchmark; it was matched only by its abstract. The data availability statement points to the GitHub repo; no license file was found (the license API returned 404), so license is null. Authors are at KTH (Sweden) and ETH Zurich (Switzerland). The Swedish exam MCQ uploads on Hugging Face (see swedish-medical-exams-mcq) may overlap with SMDT; this was not checked."
