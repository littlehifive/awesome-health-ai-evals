id: rare-disease-phenopacket-benchmark
name: Rare-disease phenopacket LLM benchmark
kind: benchmark
year: 2024
summary: 5,213 solved rare genetic disease case reports (378 diseases) from phenopacket-store, converted to differential-diagnosis prompts and scored automatically by ontology-based matching of the model's ranked diagnoses, with Exomiser as a non-LLM baseline.
