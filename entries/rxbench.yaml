card:
  task: Answer single-choice and multiple-choice prescription-review questions, or review patient and prescription
    details to classify errors and recommend interventions.
  items_built: The authors selected content from prescription-review training textbooks for clinical pharmacists
    and mapped items to 14 error categories defined using guidelines, clinical practice standards and regulatory
    documents. Three senior pharmacists with over five years of prescription-review experience and one principal
    pharmacist with over ten years independently checked items and reference answers, resolved discrepancies through
    discussion, and excluded incomplete, outdated, duplicate or clinically irrelevant items.
  example: ''
  scoring: Choice answers are compared with reference answers to calculate accuracy and, for multiple-choice items,
    precision, recall and F1. Short answers receive error-type classification F1, Python-calculated Macro Recall
    of pharmacist-defined intervention points and BERTScore against reference interventions, combined into a weighted
    total whose weights are not given in the excerpts; incorrect error-type classification makes the total zero.
  judge: Automated reference-answer scoring uses Python for intervention-point recall and BERTScore for semantic
    similarity.
  scale: Accuracy and F1 for choice tasks; weighted short-answer total, with zero for incorrect error-type classification.
  validation: ''
  results: Gemini-2.5-pro-preview-05-06 led multiple-choice accuracy at 0.639 and short-answer error-type F1 at
    0.487. Pharmacist short-answer F1 scores were 0.312 for principal pharmacists, 0.321 for senior pharmacists
    and 0.240 for pharmacists.
  limitations: ''
