id: chatbot-compassion-quotient
name: Chatbot Compassion Quotient (CCQ)
kind: eval_framework
year: 2025
summary: A tool for rating how compassionate chatbot answers are, built from nine healthcare scenarios (such as delivering difficult news and easing frustration) that raters score on a 5-point Likert scale; piloted by comparing ChatGPT, Claude, and healthcare professionals.
