  notes: "Read the full arXiv text and the GitHub README. Access is partial: the README says the 1,586 NCCN-derived items are not redistributed (NCCN copyright) and are regenerable with the released pipeline, while model outputs and clinician adjudication data are under CC-BY-NC-4.0 (code is Apache-2.0); the GitHub API reports the repository license as NOASSERTION. open_data is left unknown for that reason; a human should check what is downloadable. Two board-certified oncologists adjudicated a 225-item sample (weighted kappa 0.939 and 0.790). Authors are at Hong Kong, Fudan, and Zhejiang affiliations. The README cites an npj Digital Medicine 2026 version under a different title."
