  notes: Benchmark is a secondary contribution of "Dialogue is Better Than Monologue", whose main contribution is dialogue-based fine-tuning. The paper text I read had no code or dataset link and gives no benchmark size, so open_data is unknown. Metrics are multi-hop and single-wise accuracy. Item countries are inferred from the USMLE and JAMA sources, not stated by the authors. Evidence-ranking sentences are produced from source questions; how much is LLM-generated was not checked.
