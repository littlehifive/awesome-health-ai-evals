  notes: "Questions generated with QwQ-32B, then 1,122 reduced to 986 after review by two medical-ethics scholars. Subjective answers are scored by a fine-tuned QwQ scorer (88.5% reported agreement). The Data Availability Statement says the dataset is available from the corresponding author on reasonable request, so open_data is gated; no public link or license was found. Eight LLMs evaluated, including Chinese models. Intended users are inferred from the consultation framing."
