  notes: "From NIH National Library of Medicine with university partners. The GitHub repo (ncbi-nlp/MedGuard) holds the generated datasets, code, and seed examples under a public-domain notice, but no SPDX license is declared, so license is null. Equity and Confidentiality questions require users to obtain MIMIC-III from PhysioNet and regenerate them with the provided code. Rater countries are inferred from the physician co-authors' affiliations (Howard University, Albert Einstein College of Medicine, Universidad de Chile), which is a weak basis. Question generation method (LLM-assisted vs manual) was not confirmed in detail; the PubMed record is the 2025 journal-indexed version of arXiv 2411.14487. Venue may be peer_reviewed if the journal version is confirmed."
