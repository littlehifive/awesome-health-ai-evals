  notes: "The paper's main contribution is the Verily Mental Health Guardrail, evaluated on this dataset and on a 794-message mental-health subset of NVIDIA Aegis 2.0 (CC-BY-4.0, not part of this entry). The arXiv preprint (2510.12083) uses the earlier name Verily behavioral health safety filter. Eight crisis categories: abuse, neglect, eating-disorder behaviors, psychosis, self-harm, suicide, substance misuse, violence toward others, plus mixed presentations. Data statement in the preprint: available upon researcher request, so open_data is gated; no license stated. Scored as a classification task against clinician labels rather than model reply quality."
