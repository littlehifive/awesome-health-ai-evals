card:
  task: Answer Spanish questions about CEN-CINAI public health procedures, technical norms, and clinical criteria
    with a yes/no answer, a concise response of 1-3 sentences, or an explanation, comparison, or synthesis.
  items_built: The dataset was developed through a professional practicum at the Instituto Tecnológico de Costa
    Rica in collaboration with CEN-CINAI's UIVCD unit, using seven official institutional documents to construct
    300 question-answer pairs. One domain expert from UIVCD reviewed and validated all pairs.
  example: '"¿El Instrumento de detección debe devolverse siempre al establecimiento cuando tiene algún error, por
    mínimo que sea?" Reference answer: "No".'
