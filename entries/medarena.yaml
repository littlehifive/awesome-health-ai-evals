  notes: "Stanford-led, with Doximity as a verification partner. Year 2025 is the platform's general release (March 2025); the preprint is dated 2026. About one third of queries were factual recall; roughly 20% were multi-turn. The paper does not say whether queries or preferences are released. Records r_1bf3ff6dac (junwei-lu/MedArena, a QA visualization repo) and r_31c519400a (bytemonkk/MedArena, a LoRA fine-tuning comparison) are unrelated projects with the same name and are not part of this entry."
