  notes: "Merged record r_2cab545484: the arXiv paper 2505.19562 was first titled FairMedQA (4,806 counterfactual question pairs from 801 vignettes) and is now titled AMQA; same dataset. Paper scanned for metrics, data and code availability; the paper's own comparison shows larger accuracy gaps than the CPV benchmark (which is not public). Original notes: GitHub README and Hugging Face card were read first. Variants are produced by a multi-agent LLM pipeline and reviewed by humans. Metrics are individual fairness (consistency across variants), group fairness (accuracy gap between groups), and McNemar tests. Lead institution country (UK) is inferred from the Hugging Face organization name Showing-KCL."
