  notes: Rubrics were written by 262 physicians with practice experience in 60 countries; the country list is in a figure only, so rater_countries is omitted. MIT is the license on the Hugging Face dataset and the simple-evals code. Record r_6f416a0039 also carries mindbench-ai/healthbench-psych, a derived dataset that is not part of HealthBench. Third-party copies of HealthBench merged here as records only, with no links added (bofenghuang/healthbench-pediatric and healthbench-hard-pediatric are pediatric-tagged subsets; neuralleap/healthbench-regular is an oss_eval jsonl; varun500/healthbench-train-test-split is the 1,000-row physician-labelled completion set split 800/200). The healthbench-psych entry covers the mental-health subset. Also merged as records only, namely benjamin920101/healthbench_medication_filtered (empty card, Apache-2.0 tag, 2,221 rows; a medication-filtered subset) and varun500/healthbench_oss_eval (5,000 rows with the original schema, a copy of the oss_eval set).
