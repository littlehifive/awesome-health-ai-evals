id: clinical-genai-verification-paradigms
name: Verification paradigms for clinical generative AI
kind: eval_framework
year: 2024
summary: "A conceptual framework of 11 'verification paradigms' (for example quiz and vignette, expert consensus, false-myth, rare-case simulation, historical data comparison, real-time monitoring) for checking whether generative AI outputs in clinical decision-making are evidence-based."
