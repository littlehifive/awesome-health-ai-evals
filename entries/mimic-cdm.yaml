  notes: "r_2d62acdd7c is the medRxiv preprint and r_b2433e5e42 the Nature Medicine version of the same work. Built on MIMIC-IV, so the cases are EHR records rather than live queries (real_user_queries is the closest provenance label). Access: the README says MIMIC-IV access must be requested, and the derived dataset on PhysioNet is listed as Credentialed Access; no license name was seen. Reader study: four hospitalists (Germany and USA) diagnosed 100 patients. The repository also hosts a leaderboard (Hugging Face space)."
