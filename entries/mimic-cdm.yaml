id: mimic-cdm
name: MIMIC-CDM
kind: benchmark
year: 2024
summary: 2,400 real emergency-department patient cases from MIMIC-IV with four abdominal pathologies, used in a simulated environment where an LLM gathers information (exam, labs, imaging) and then gives a diagnosis and treatment plan, scored on diagnostic accuracy, guideline adherence, and instruction following.
