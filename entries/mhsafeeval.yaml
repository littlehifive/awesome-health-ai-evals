  notes: "Accepted at ACL 2026 Findings (per the repo README). The taxonomy was refined with three licensed counselling and psychology experts; their countries are not stated, so rater_countries is omitted. An LLM judge was checked against two expert annotators (agreement 77.9 to 86.8 percent, Cohen's kappa 0.33 to 0.39). The paper says code and data are on GitHub; the repo listing shows code and config but no separate dataset file, and no license file was detected. First author at Hanyang University (Korea), last author at Singapore Management University."
