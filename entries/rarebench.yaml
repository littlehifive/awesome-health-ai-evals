card:
  task: Given a patient record or phenotype list, extract standardized phenotypes, screen for ALS, PNH or MSA, or
    rank candidate diagnoses in the common-versus-rare and rare-disease differential diagnosis tasks.
  items_built: The authors combined 1,122 publicly available cases with confirmed diagnoses from RAMEDIS, MME, HMS
    and LIRICAL with PUMCH records, using 87 cases for extraction, 33 for screening and 527 for common-versus-rare
    comparison. They removed cases with uncertain or imprecise diagnoses or fewer than three phenotypes; PUMCH doctors
    checked records for personal information, and only the 75 PUMCH cases used for the physician comparison were
    publicly released.
  example: ''
  scoring: Extracted phenotypes and standardized entities require exact matches to references, while general entity
    extraction accepts equivalent meanings; extraction is reported as precision, recall and F1, and screening as
    recall. Diagnostic rankings are compared with confirmed diagnoses to calculate the proportion of cases with
    the correct disease in the top 1, 3 or 10 predictions and the median rank of the correct diagnosis across cases.
  judge: Reference matches and confirmed diagnoses determine scores; the source does not identify who judges meaning-equivalent
    entity extractions.
  scale: Extraction precision, recall and F1; screening recall; diagnostic hit@1, hit@3, hit@10 and median rank.
  validation: ''
  score_meaning: Lower median rank indicates better diagnostic performance, with the correct disease appearing nearer
    the top of the prediction list.
  annotation_process: ''
  results: On the 75-case physician comparison, GPT-4 given phenotypes achieved 52.0% top-1 recall and 82.7% top-10
    recall. The 50 specialist physicians from 23 Chinese Class-A tertiary hospitals achieved 44.7% and 52.4%, respectively,
    with external assistance, with four physicians assigned to each case.
  limitations: The authors identify limited interpretability, prediction errors and training-data biases, and the
    need to establish generalization to new clinical settings.
