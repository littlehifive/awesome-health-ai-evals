  notes: "Released as part of the RiskAgent paper (an agent system), so the benchmark is secondary to the method; the README says MedRisk is used for training as well as testing. The Hugging Face card (MIT license) lists only 1,232 test samples per version (quantitative, qualitative), while the paper reports 12,352 total. How questions were generated from calculators (LLM versus template) was not checked in detail. Lead institution is the University of Oxford. Record r_f4bb794183 (the Hugging Face dataset) was first extracted by a parallel agent as the same benchmark and merged here."
