card:
  task: Starting with limited patient information, ask a simulated patient follow-up questions as needed and choose
    the final answer to a medical multiple-choice question.
  items_built: The authors parsed MEDQA patient records into age, gender, chief complaint, and additional evidence,
    withholding the additional evidence for follow-up questions. They applied the same conversion to 140 CRAFT-MD
    dermatology records, including 100 collected from an online question bank and 40 created by expert clinicians.
  example: ''
  scoring: Expert accuracy is the percentage of final multiple-choice answers that match the correct answers, with
    the number of follow-up questions reported as conversation efficiency. Patient factuality averages the percentage
    of atomic response statements supported by the record, while relevance averages embedding similarity between
    responses and reference statements on synthetic questions generated from those statements.
  judge: Expert answers are checked against the answer key; Patient responses receive automated factuality and embedding-similarity
    scores.
  scale: Correct or incorrect per final answer; overall percentage accuracy and number of follow-up questions, plus
    average Patient factuality percentage and semantic similarity.
  validation: The authors manually annotated Patient responses to validate the automated factuality and relevance
    metrics, but the supplied text gives no agreement figures.
  results: ''
  limitations: The authors identify scarce datasets with sufficient patient detail, reliance on a paid Patient API,
    restriction to multiple-choice answers, and potential social and cultural biases in models, datasets, and prompts.
