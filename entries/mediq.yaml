  notes: "NeurIPS 2024 Datasets and Benchmarks paper. A simulated Patient system answers the Expert model's questions from the full record; Patient reliability is scored for factuality and relevance, and Expert accuracy is the multiple-choice accuracy after interaction. The HF dataset holds medqa dev and test conversation files (CC-BY-4.0 per card). r_a2e7471faa (MEDIQ Bilingual Hindi-English chatbot log dataset, Zenodo) was grouped into the same candidate but is a different resource and is not part of this entry."
