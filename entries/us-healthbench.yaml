  notes: "Single author (William Alston, Alston Analytics LLC; country not listed), released on Zenodo and GitHub (Apache-2.0 per Zenodo). The README lists dimensions accuracy, grounding, safety, uncertainty, clarity, multilingual consistency; the Zenodo abstract says five. The README warns that 28.0% of items have contradictory duplicates and 17.1% (74.9% of Spanish) are text-corrupted, so the item set should not be used for scoring. item_provenance llm_generated is an inference from the 'template-generated' wording in the paper title and README. builder_types academic is a guess for an independent author; a human should check the paper's declared affiliation."
