  notes: "Records: the arXiv preprint (r_f696e607bc) and the Knowledge-Based Systems article (r_6d98fc6c76), treated as the same benchmark. Raw EMRs (11,900 collected) were filtered and annotated by three student inspectors and one medical expert (20 percent sample review until 95 percent batch accuracy); 1,989 cases lacked diagnostic results and answers were annotated. Key points for criteria were extracted with GPT-4, so key-point scoring probably involves an LLM; exact metric details were not checked. No data link or license was found in the text read, so open_data is unknown. Country of raters is inferred from the Chinese team; the paper does not state it."
