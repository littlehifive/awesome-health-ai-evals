  notes: "Beth Israel Deaconess / Harvard Digital Psychiatry lead (John Torous last author). The released items are the question set plus audited responses and citations; the instrument is a citation-source typology and classifier, not answer-quality scoring. License CC-BY-4.0 is from the Hugging Face card; the code repo is AGPL-3.0 per GitHub. Question authorship (clinician_written) is an assumption from the author team; the paper does not say who wrote the questions. This is an audit study that releases reusable instruments, so a human may prefer to exclude it."
