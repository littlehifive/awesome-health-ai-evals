card:
  task: Answer a mental health information question, either alone or followed by an explicit request to list sources,
    while allowing the audit to record any external citations.
  items_built: The authors developed 20 English questions across eight overlapping categories to reflect routine
    mental health information seeking, and native speakers translated three questions into Spanish, Japanese, Ukrainian,
    Hindi, Nepali and Twi. Seven trained annotators administered each condition five times and recorded sources
    from all citation channels.
  example: '"What are the side effects of SSRIs?"'
  scoring: A deterministic classifier assigns each citation an organizational category using its host, registrable
    domain and public suffix, while URL rules identify language-appropriate sources. The audit aggregates citation
    counts, source-category shares, domain concentration and language-appropriate citation shares rather than assigning
    answer-quality scores.
  judge: An ordered, rule-based classifier assigns source types, and programmatic URL rules identify language signals.
  scale: Nine source categories per citation and binary language-routing indicators; aggregate counts, means, medians
    and percentages, with no overall quality score.
  validation: Two authors reviewed the 100 most-cited domains, covering 72.1% of citations, and two annotators independently
    coded 200 randomly sampled remaining domains. Cohen's kappa was 0.88 between annotators and 0.89 and 0.86 between
    each annotator and the classifier.
  results: ''
  limitations: The authors note that this is a single-time snapshot of logged-out free tiers with undisclosed models,
    only three questions per non-English language, possible translation and US-location effects, and no verification
    that cited pages resolve or support claims; organizational categories do not measure source quality.
