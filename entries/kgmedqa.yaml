card:
  task: Answer biomedical questions requiring Boolean answers, multiple-choice selections, error identification
    or correction, free-form answers, or conjunctive or disjunctive reasoning.
  items_built: The tool automatically generates question-and-answer datasets from knowledge-graph triples to test
    knowledge and from paths to test reasoning. It aligns natural language with graph structures and was used to
    test ten LLMs across two biomedical knowledge graphs.
  example: ''
  scoring: Scripts calculate accuracy for Boolean QA, multiple-choice QA and error identification, and embedding
    similarity for error correction. Free-form QA and conjunctive and disjunctive reasoning are evaluated using
    MRR, Hit@1, Hit@10 and accuracy.
  judge: Automated evaluation scripts assign scores, using sentence-transformers/all-mpnet-base-v2 for semantic
    embeddings in the paper.
  scale: Accuracy, embedding similarity, mean reciprocal rank, Hit@1 and Hit@10, depending on the task.
