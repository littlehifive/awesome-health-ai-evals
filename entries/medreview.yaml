  notes: "From the GitHub README only (the npj Digital Medicine paper, PMC11383939, was not opened). The README's MIT license covers the repository; it does not say whether it covers the Cochrane text. The paper is mainly about fine-tuning open models for evidence summarization, and MedReview serves as both training and test data, so it is borderline for scope (evidence summarization for researchers rather than health Q&A). A human should confirm it stays in. Authors are at Columbia University, NIH, and other US institutions per the README citation; first and last affiliations not checked."
