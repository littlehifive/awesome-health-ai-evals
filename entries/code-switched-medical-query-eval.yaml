  notes: "Single dataset card, no paper. Scoring is one rater's 0 to 2 scale (0 missed or dangerous, 1 vague or under-triaged, 2 appropriate) with no inter-rater check; severity labels are the author's judgment, not a clinician's. The card has no license field. Very small and exploratory; the card is titled for one model (Qwen2.5-1.5B-Instruct), so it is closer to a worked example than a reusable benchmark."
