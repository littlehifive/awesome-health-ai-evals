  notes: "Scientific Data descriptor. Real clinician-patient consultations recorded at Beijing Anding Hospital, transcribed with a three-stage annotation protocol, with emotion annotations and clinician-annotated HAMD-17 scores. Hosted on Science Data Bank (10.57760/sciencedb.27818); license not seen. Primarily a training and evaluation dataset for depression detection and severity assessment models, with baseline experiments, not a chatbot-response benchmark."
