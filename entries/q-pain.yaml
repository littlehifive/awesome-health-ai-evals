  notes: "The paper says the dataset is on PhysioNet under CC BY-SA 4.0 (the DOI is the PhysioNet record). Contexts are acute non-cancer, acute cancer, chronic non-cancer, chronic cancer, and post-operative pain. Scoring compares the probability of a yes/no treatment answer across race-gender subgroups for GPT-2 and GPT-3. Two physicians checked a random sample of vignettes. Lead authors are at Stanford, last author at Harvard."
