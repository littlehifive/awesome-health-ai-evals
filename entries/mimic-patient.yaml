  notes: "Introduced inside the DynamiCare paper, which is mainly a multi-agent method; the benchmark is the dataset plus the evaluation protocol. No code or dataset link was found in the text I read. Source data is MIMIC-III, which needs credentialed PhysioNet access. Predicted diagnoses are mapped to ICD-9 via the BioPortal API and counted correct on a 3-digit match. 100 patient Q&A logs were rated by three medical students for truthfulness and relevance."
