id: mimic-patient
name: MIMIC-Patient
kind: benchmark
year: 2025
summary: Simulated patients built from MIMIC-III intensive-care admissions (a few thousand, at most 2,597 valid admissions) for multi-round, open-ended diagnosis, where LLM doctor agents query a patient agent and are scored on top-k diagnosis hit rate and recall against ICD-9 codes.
