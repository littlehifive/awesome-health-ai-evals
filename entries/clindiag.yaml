  notes: "Research Square preprint (CC BY 4.0 for the paper). The GitHub repo (Apache-2.0) contains Clindiag_Benchmark.zip, so open_data is set to open; MIMIC-derived cases may carry PhysioNet terms that were not checked. A doctor agent and a provider agent simulate the encounter; scoring uses five 1-5 metrics plus BLEU, ROUGE-L, and BERTScore. Who gave the 1-5 ratings was not confirmed (GPT-4o was used for case quality screening). The paper also presents ClinDiag-GPT (not an entry)."
