id: clear
name: CLEAR
kind: eval_framework
year: 2023
summary: A five-item Likert tool (Completeness, Lack of false information, Evidence support, Appropriateness, Relevance) for scoring the quality of health information from AI chatbots, pilot-tested by 32 health professionals and applied to five health queries across four chatbots.
