id: innovative-moment-assessment
name: IMA (Innovative Moment Assessment)
kind: eval_framework
year: 2025
summary: A therapy-centric framework that scores LLM-led narrative-therapy dialogues by tagging client utterances with six Innovative Moment types across two levels and computing an IM salience metric, released with the INT therapist simulator and the 1,300-dialogue NTConv set.
