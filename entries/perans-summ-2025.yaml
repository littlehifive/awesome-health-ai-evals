  notes: "Borderline scope: this is a summarization shared task on consumer health forum answers rather than a chatbot evaluation, so a human should decide whether to keep it. Built on PUMA (Naik et al., 2024), which was available on request; the paper does not give a license or direct download link, and the codabench competition page is the only access point named. Lead institution countries not extracted because the PDF text did not show affiliations. Metrics: macro and weighted F1, strict and proportional span matching, ROUGE, BERTScore, METEOR, BLEU, AlignScore, SummaC."
