  notes: Health is only part of the benchmark (physical health and mental health categories out of 8; the paper's text I read did not give their counts). The preprint says the data would be made public but gives no link, and I did not look for one. open_data is therefore a guess. Authors are at King Abdulaziz University and ASAS AI. The item_provenance value clinician_written is a loose fit for manually written questions; the authors are not stated to be clinicians.
