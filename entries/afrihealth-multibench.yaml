  notes: 'Added by hand on 2026-11-25 from the Global Health AI Benchmarks site, an initiative of The Agency Fund
    and Endless Health, so it has no screening record. Facts come from the benchmark''s page on that site and the
    team''s report PDF. The site says the complete datasets stay with each organisation. The report names the benchmark
    Intron AfriHealth MultiBench. The site counts 19 languages and its list omits Yoruba, although Yoruba appears
    in the speech-to-text and translation tables and in 100 spoken questions; 20 are listed here, with Pedi and
    Tswana written as Sepedi and Setswana to match other entries. Access: the site says translation data is open,
    speech-to-text data partly open and spoken questions private; the report gives the licence only as ''CC 4.0''
    and says approved subsets will go on Hugging Face. The source corpora on Hugging Face (intronhealth/afrivox-translate
    and intronhealth/med-convo-nig, both gated; intronhealth/afrispeech-dialog, open) are not listed as links because
    the benchmark subset itself was not found, so open_data is gated and license is null. The spoken questions come
    from Intron''s CHEW question collection in Nigeria, which the nigbench entry also draws on; the sources do not
    say how the two sets overlap. The rater-agreement figures are from the initiative''s about page.'
