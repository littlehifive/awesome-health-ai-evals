card:
  task: 'Three tasks on audio from African health workers: write clinical speech down as text, translate speech
    in an African language into English, and answer a clinical question asked out loud.'
  items_built: Every recording is real speech from a working health worker. The 3,200 speech-to-text clips (about
    10 hours, 250 speakers) come from Intron's production monitoring, Afrispeech Dialogue and Med-Conv-Nig. The
    1,600 translation clips (about 5 hours, 120 speakers) come from AfriVox Translate. The 398 spoken-question recordings
    (385 questions, about 15.6 hours) were sent by Nigerian community health extension workers through Intron's
    app, and a health worker wrote a reference answer for each. Native-speaking medical professionals wrote the
    reference transcripts and translations, and every translation was reviewed twice. Personal details were removed
    by an automatic filter and then checked by hand.
  example: A woman brought in her child of two years with the complaint of ear pain. There is discharge in the ear,
    there is pain, it has been going on for ten days. The child cannot sleep at night and the mother is worried.
    She has not given any medication to the child. What is the diagnosis and what prescription should I give to
    the mother?
  scoring: Speech to text is scored by word error rate and character error rate, each with and without text normalisation.
    Translation is scored by BLEU, chrF and AfriCOMET against the English a person wrote. Answers to spoken questions
    are rated by a human panel on 13 items from 1 to 5, including factuality, appropriateness for a community health
    worker in Africa, adequacy, clinical reasoning, empathy, uncertainty, hallucination, local relevance and harm.
  judge: Automatic metrics for speech to text and translation. For spoken questions, a panel of Nigerian community
    health extension workers and medical professionals, all native speakers with clinical training. No LLM judge
    is used.
  scale: Error rates from 0% upward (lower is better, and above 100% is possible); BLEU and chrF from 0 to 100;
    AfriCOMET from -1 to 1; panel ratings from 1 to 5, where higher is better on 9 items and lower is better on
    4 (hallucination, local relevance, harm and poor question quality).
  validation: The panel also scored the health worker's reference answers and a set of deliberately poor answers.
    The poor answers scored 1.89 on factuality, against 4.18 for the health worker's answers and 4.77 for the best
    model, so the scale separates bad answers from good ones. The initiative's summary reports 47 raters giving
    14,739 ratings, with exact agreement 47% of the time on whether advice suited a rural clinic and 95% on whether
    it could cause harm.
  score_meaning: 'On factuality a 5 means the facts are right; a model loses marks by, for example, getting the
    diagnosis wrong. On hallucination, local relevance and harm a 1 is the best score: no made-up clinical claims,
    no care that is unavailable locally, and no advice that could do harm.'
  annotation_process: Each labeller had a written checklist saying what every score means and went through training
    sessions before scoring. They scored each model's answer and the health worker's answer on the same 13 scales.
    Model scores are published for 9 of the 13 items, on the 172 of 385 questions whose details were recorded.
  results: On speech to text across 17 languages, Intron Sahara (24.4% word error rate) and Meta OmniLLM (26.8%)
    were strongest; Azure Speech averaged 21.2% but only on the 7 languages it supports. The best word error rate
    was 5.5% in French and 6.8% in Swahili but 47.7% in Akan. Gemini-3-Flash led translation, with the top BLEU
    in all 16 languages (19.27 on average). On spoken questions, Claude 4 Sonnet, DeepSeek-R1 and GPT-4.1 scored
    4.69 to 4.77 on factuality, above the health worker's reference answers at 4.18.
  limitations: Every spoken question came from Nigerian community health extension workers and covers Nigerian languages
    only. More recordings come from English-speaking West and East Africa than elsewhere. Language switching mid-sentence
    was written down inconsistently, error rates count spelling differences as mistakes in languages without settled
    spelling, BLEU is harsh on languages that build long words, and the human checking does not cover all languages
    evenly.
