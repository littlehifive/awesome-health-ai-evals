card:
  task: ''
  items_built: The framework is intended for stakeholders assessing or selecting healthcare chatbots, including
    clinical documentation, diagnosis and scheduling tools. The authors extracted 356 questions from 11 frameworks,
    removed 35 redundant or irrelevant questions, assessed face and construct validity, and reached consensus on
    categorization before merging and rephrasing them into 271 questions.
  example: '"Is the retention rate tracked?"'
  scoring: The framework assigns no scores to individual questions and defines no aggregate score. Stakeholders
    contextualize responses and choose construct weights according to their intended use.
  judge: ''
  scale: Yes/no questions; no assigned points or final metric.
  validation: ''
  score_meaning: ''
  annotation_process: ''
  results: ''
  limitations: The authors state that the framework needs prospective validation in different contexts and may need
    additional dimensions as the technology evolves.
