  notes: "Three tasks (BA, DDT, DCT) ask the model to confirm or exclude a named diagnosis from a 448-feature structured ICU record; scoring is accuracy plus pair-aware robustness metrics. Appendix A says the artifacts will be released under MIT for non-commercial research, but no download link was found, so license is null and open_data is unknown. Underlying MIMIC-IV data are credentialed (PhysioNet). Total item counts for DDT and DCT were not found. Input is structured EHR features rather than free text, so scope fit is borderline."
