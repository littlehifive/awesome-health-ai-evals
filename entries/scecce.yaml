card:
  task: Answer each first-person patient question about atrial fibrillation in a single-turn text exchange.
  items_built: Cardiologists selected 33 questions from frequently asked questions recorded at Zhongshan Hospital's
    arrhythmia specialty outpatient clinic and rewrote them in first-person, everyday language, covering definition,
    diagnosis, treatment and diet. Three board-certified, actively practising cardiologists compiled standard reference
    answers using current clinical guidelines.
  example: ''
  scoring: Three cardiologists independently compared each response with the reference answer and applied the six
    SCECCE criteria, resolving scoring disagreements through discussion. Criterion points were summed per response
    and across all 33 questions, with unanswered questions assigned zero; response means and medians were also reported.
  judge: Three board-certified, actively practising cardiologists rated responses while blinded to which model produced
    them.
  scale: Four criteria score up to 2 points each and two score 0 or 1; totals range from 0 to 10 per response and
    0 to 330 per model.
  validation: 'Inter-rater agreement was measured using a two-way mixed-effects intraclass correlation coefficient
    for absolute agreement: ICC exceeded 0.8 for Safety, Correctness, Error and Completeness, and exceeded 0.5 for
    Conciseness and Elaboration.'
  results: Ernie bot 3.5 had the highest total score, 299 out of 330, and 87.9% of its responses were rated correct.
    Overall score differences among the seven models were not statistically significant (p = 0.08).
  limitations: The authors state that the framework lacks external validation beyond atrial fibrillation, uses partly
    subjective conciseness and elaboration ratings, treats safe refusals and failures alike, and tests a small,
    controlled, single-turn question set that excludes complex clinical scenarios and real-world patient outcomes.
