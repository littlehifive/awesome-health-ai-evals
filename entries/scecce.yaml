  notes: The paper is a cross-sectional comparison whose reusable parts are the SCECCE rubric (Table 1) and the 33-question list in supplementary material 1, which was not opened. Questions were clinic FAQs rewritten by cardiologists into first-person lay phrasing; item_provenance is a judgment. Language is inferred as Chinese from the Chinese chatbots tested; the paper does not state it outright for the questions. Cardiologists rated responses against expert-compiled standard answers.
