id: t2dm-physician-rubric
name: T2DM five-dimension physician rating rubric
kind: eval_framework
year: 2026
summary: A 120-point physician rubric (Accuracy, Safety, Clarity, Integrity, Action Orientation) built from 784 patient queries in China and applied to 66 curated type 2 diabetes questions answered by four AI models and rated by seven physicians.
