id: medic-bias-error-pipeline
name: MEDIC (statistically significant biases and errors demo)
kind: eval_framework
year: 2025
summary: Open pipeline that generates patient-style mental-health prompts (3.2M prompts, 29K answers, 684K evaluations) and scores answers for hallucination, omission, and treatment category with several LLM judges, to test demographic bias and judge agreement.
