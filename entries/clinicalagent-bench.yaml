  notes: "Introduced in the ReflecTool paper (Shanghai Jiao Tong University and Shanghai AI Laboratory), which also proposes the ReflecTool agent method; the Hugging Face card is a one-line pointer to the GitHub repo. Heavily a re-packaging of existing benchmarks, and several tasks are outside this catalog's scope (medical image VQA, EHR SQL over MIMIC-III and eICU); the text-QA and calculation tasks are in scope. The arXiv ID 2410.17657 comes from the repo README, not from the screening record. The Hugging Face dataset also includes images. Total item count and per-task sizes were not read."
