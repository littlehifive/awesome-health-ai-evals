id: clinicalagent-bench
name: ClinicalAgent Bench (CAB)
kind: benchmark
year: 2024
summary: A benchmark of 18 tasks in five dimensions (knowledge and reasoning, multimodal, numerical analysis, data understanding, trustworthiness) for tool-augmented clinical agents, assembled from existing public medical datasets and scored by accuracy.
readme_section: knowledge_exam
