card:
  task: Follow each clinical instruction using the supplied text, medical images, records or documents to produce
    an answer, calculation or data analysis.
  items_built: The authors assembled existing public medical datasets and grouped them by the capabilities required
    of clinical agents. Named sources include MedQA, MMLU, BioASQ, PubMedQA, VQA-RAD, SLAKE, OmniMedQA, MedCalc,
    EHRSQL, MIMIC-III, eICU, MedMentions, emrQA and LongHealthQA.
  example: ''
  scoring: Predicted answers are evaluated against ground-truth answers using accuracy. Results are reported for
    individual tasks and as averages within dimensions.
  judge: ''
  scale: Percentage accuracy per task, with dimension averages.
  validation: ''
  results: ''
  limitations: The authors state that CAB does not fully capture the complexity of evolving clinical scenarios and
    needs ongoing updates, and that its collected medical tools do not perfectly match the evaluation tasks.
