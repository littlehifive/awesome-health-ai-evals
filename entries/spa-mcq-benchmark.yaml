  notes: A JMIR Research Protocols paper, so the benchmark is described but the results come later. The abstract says it will be released; the full text says data are available from the corresponding author on reasonable request, hence gated. I found no public link. The protocol also uses CMB-style metrics for open-ended answers, which I did not check in detail. Co-authors include a company (Dataa Robotics).
