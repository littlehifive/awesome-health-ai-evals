  notes: Only the abstract and affiliations were read. The PMC record mentions supplementary material but a public question set was not confirmed, so open_data is a guess. Raters were 5 patients per disease and 5 rheumatologists, using forced-rank preference and Likert scales; rater country DEU is inferred from the single-center study. Closer to a one-off study than a reusable benchmark; a human should decide whether to keep it.
