card:
  task: Answer clinical questions in which patient attributes such as age, gender, and location have been changed.
  items_built: GPT-4o converted knowledge-graph triplets from EquityMedQA's TRINDS subset, DiversityMedQA, and Nurse
    Bias clinical vignettes into patient contexts, and an Attacker LLM generated questions by changing selected
    attributes while holding others constant. GPT-4.1, GPT-4o, LLaMA-3, and Mistral-7B checked question quality;
    the answer-validity analysis used 84 perturbed Nurse Bias questions.
  example: ''
  scoring: Judge LLMs score implicit bias in question-answer pairs based on associations between demographic attributes
    and diseases, with average bias scores reported by demographic dimension and target-judge pairing. Separate
    checks compare generated questions with their originals on three quality criteria, compare answers with Nurse
    Bias diagnoses using BERTScore, and assess reasoning consistency using GPTScore.
  judge: Bias judges include GPT-4o, Mistral-7B, and LLaMA-3.2-3B; question-quality judges are GPT-4.1, GPT-4o,
    LLaMA-3, and Mistral-7B.
  scale: 'Question quality: 1 to 5, higher is better; bias: average scores, higher means more bias detected; answer
    similarity: BERTScore F1, precision, and recall.'
  validation: Fifteen postgraduate students familiar with generative AI compared answers with and without multi-hop
    reasoning across five Nurse Bias clinical scenarios.
  score_meaning: For question quality, 1 means poor quality and 5 means best quality.
  annotation_process: 'The bias assessment used 20 randomly selected question-answer pairs across three conditions:
    original questions, perturbed questions answered without multi-hop reasoning, and perturbed questions answered
    with multi-hop reasoning. Generated answers to 84 perturbed questions were automatically compared with the original
    Nurse Bias diagnoses using BERTScore. In the human survey, each scenario contained four question-answer sets
    arranged as two pairs, and participants used the supplied ground-truth diagnosis to choose the pair that revealed
    more biases.'
  results: On DiversityMedQA, LLaMA-3.1-8B judged by LLaMA-3.2-3B increased from 0.383 on original questions to
    0.747 with multi-hop reasoning for combined age, gender, and location bias. The framework revealed average increases
    of 0.2 to 0.4 bias-score points over original questions in complex demographic settings.
  limitations: ''
