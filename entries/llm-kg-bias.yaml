id: llm-kg-bias
name: LLM-KG-Bias
kind: eval_framework
year: 2025
summary: "A knowledge-graph and agentic-LLM framework that generates demographically perturbed clinical questions (age, gender, location) from seed medical QA sets and scores a medical LLM's answers for implicit bias using multi-hop reasoning and LLM judges."
