  notes: "Full text was not reachable (EAI landing page and abstract plus the GitHub README and Hugging Face card were read). The full dataset requires a signed end-user license agreement emailed to the owner, so open_data is gated; only 10-example samples are public. The Hugging Face card carries an MIT tag but access is under the EULA, so license is custom. The README counts 10,066 manually collected records alongside the GPT-4o and GPT-4o-mini generated sets, which does not match the paper's 10,000. Paper also evaluates BERT models, 7-9B LLMs, and RAG with agentic chunking. Questions were written by psychology students; the paper says validation was by mental hospitals in Vietnam."
