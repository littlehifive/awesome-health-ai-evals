card:
  task: Judge each of five model-generated answers to a German clinical question as Correct, Incorrect, or Abstain
    when unable to judge confidently.
  items_built: The authors filtered 44,185 peer-reviewed Ankizin v5 flashcards to 26,598 single-cloze items, generated
    answers with five models, and selected 3,800 items using an 80:20 split between items with no lexical match
    and those with at least one match. Nine practising neurologists rated a shared 200-item core and two physicians
    rated each remaining item, with a tenth physician, a paediatrician, adjudicating conflicting correctness ratings.
  example: ''
  scoring: Each answer receives a correctness label based on medical accuracy and completeness; physician consensus
    uses a majority of non-abstaining ratings, excluding unresolved ties. Evaluator labels are compared with physician
    consensus on the 200-item core using percent agreement, Cohen's kappa and PABAK, while answer-generation accuracy
    is the proportion of responses labelled Correct.
  judge: Nine LLM evaluators are assessed against nine practising neurologists and a tenth physician, a paediatrician,
    who adjudicates disagreements.
  scale: Correct, Incorrect, or Abstain per answer; aggregate accuracy, percent agreement, Cohen's kappa, PABAK
    and abstention rate.
  validation: On the 200-item core, mean pairwise physician Cohen's kappa was 0.61 and mean Krippendorff's alpha
    was approximately 0.60. The leave-one-out physician ceiling was kappa 0.709; Gemini 3 Flash reached 0.694 with
    a bootstrapped 95% confidence interval of 0.619 to 0.754.
  score_meaning: Percent agreement measures absolute agreement, Cohen's kappa adjusts for chance agreement, and
    PABAK corrects distortions caused by class imbalance; kappa values of 0.61-0.80 are interpreted as substantial
    agreement. Subjective difficulty is coded as Easy = 0, Medium = 1 and Hard = 2, then averaged across physicians,
    so higher scores indicate greater perceived difficulty.
  annotation_process: All nine primary physicians independently rated the five answers for each of the 200 core
    items, while two physicians rated each of the remaining 3,600 items; no discussion or calibration occurred between
    raters. For conflicting Correct-Incorrect ratings without abstentions, the tenth physician independently re-evaluated
    all five answers for that item and also rated the entire core set. Each of the nine LLM evaluators assessed
    all 3,800 items; physicians received a reference answer for orientation, not as an absolute grading key.
  results: Gemini 3 Flash was the best evaluator, with Cohen's kappa of 0.694 against physician consensus, compared
    with the leave-one-out physician ceiling of 0.709. Frontier evaluators issued definitive correctness labels
    in every case despite having an abstention option.
  limitations: The authors state that wide confidence intervals limit interpretation of physician-level alignment,
    the human gold standard has inherent variability, and automated judges exhibit overconfidence and preference
    for answers from their own model family.
  sources:
