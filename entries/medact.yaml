  notes: "Open synthetic replication of the NOHARM action-level framework (Wu et al., 2025), whose cases are closed. Published at the ACL GEM workshop. Scoring applies NOHARM's rules (Safety, Completeness, Restraint, Overall) with no judge. Rubric labels are GPT-4o synthetic consensus ratings, not physician annotations. The paper says all cases, rubrics and code are released on GitHub, but the repo README is only a title line and no license is stated; the repo contents were not inspected, so open_data rests on the paper's statement."
