card:
  task: Transcribe Chinese healthcare dialogue audio or generate an agent reply to a healthcare query from its transcript.
  items_built: The authors collected interactions during internal beta testing of a full-duplex healthcare assistant,
    using de-identified data supplied by Ant Group; the methods report 5,805 dialogues with 1,161 held out, while
    the results describe 1,805 dialogues. LLM screening and manual checks covered privacy, healthcare relevance,
    transcript accuracy and speaker roles, with human and LLM validation.
  example: ''
  scoring: ASR transcripts are compared with references using word and character edit-error rates and HC-WER, which
    averages concept-sequence error rates across four healthcare categories; combined-role results average user
    and agent scores equally. GPT-5 compares replies pairwise, counting wins as 1 and ties as 0.5, and scores replies
    against references with G-Eval; reported results include mean rubric scores, win, tie and failure percentages,
    and conversation-bootstrap 95% confidence intervals.
  judge: ASR uses edit-distance comparisons with reference transcripts, and GPT-5 judges response quality.
  scale: ASR error percentages; G-Eval ratings from 1 to 5 averaged across replies; PairEval win, tie and any-failure
    percentages.
  validation: ''
  results: Claude-Opus-4.1 and Qwen3-30B-A3B tied for the highest G-Eval overall mean at 4.1/5, both with 95% confidence
    intervals of 3.9-4.2. Gemini-2.5-Pro had the highest PairEval win score at 52.3% (95% CI 49.5-55.0).
  limitations: The dataset card states that the public subset differs in size and coverage from the internal benchmark,
    lacks full validation and test coverage, and contains TTS-resynthesized audio rather than original recordings.
