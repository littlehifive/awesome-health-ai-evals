  notes: "Primarily an ASR corpus; included because it also evaluates LLM agent replies to spoken healthcare queries (GPT-5 judge, pairwise PairEval and reference-based 1-5 G-Eval rubric covering overall, correctness, safety). The Hugging Face card lists Apache-2.0, but the GitHub README says full access needs approval and a research-only data use agreement with no redistribution, so open_data is gated. Session counts differ between abstract (5,805) and results section (1,805 dialogs). First and last authors are at Hong Kong Polytechnic University; data supplied by Ant Group (China)."
