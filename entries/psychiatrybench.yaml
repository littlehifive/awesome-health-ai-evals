card:
  task: Answer psychiatric knowledge and case-based questions by giving diagnoses, treatment and management plans,
    follow-up responses, or selections from multiple-choice and extended-matching options.
  items_built: Licensed psychiatrists manually selected and annotated 5,188 items from expert-authored psychiatric
    textbooks and casebooks. Ambiguous, overly simple, and redundant items were removed, and the remaining questions
    were reviewed for clinical validity, content balance, and diagnostic diversity before formatting and answer
    styles were standardized.
  example: ''
  scoring: Closed-answer tasks use accuracy, exact label-set matches, and frequency-weighted F1; extended-matching
    sets receive the proportion of correct subanswers averaged across sets, while separately presented subquestions
    receive binary scores averaged across subquestions, with multiple answers scored as incorrect. Open-ended answers
    are compared with expert reference answers by Llama 3.3 70B for clinical reasoning, correctness, and completeness,
    and the similarity scores are averaged across instances.
  judge: Automatic comparison with reference answers grades closed-answer tasks, and Llama 3.3 70B grades open-ended
    responses.
  scale: Binary correctness or partial credit for closed-answer items; 0 to 100 similarity per open-ended answer,
    averaged across instances; classification uses subset accuracy and weighted F1.
  validation: ''
  score_meaning: Overall Consistency measures how often correctness stays the same across full and separated question
    formats, including answers that are wrong in both. Format Agreement Rate measures the share answered correctly
    in both formats among those answered correctly in at least one, so higher values mean correct answers are more
    stable across formats.
  annotation_process: The authors tested two judging prompts, one generated by GPT-4.5 and one by Gemini 2.0 Pro,
    using Llama 3.3 70B as the judge. They selected the Gemini-generated, logic-driven few-shot prompt for its greater
    consistency and reliability, then applied the same rubric to every output-reference pair.
  results: ''
  limitations: The authors note evaluator bias and circularity from using an evaluated model as judge, the need
    for independent psychiatrist validation, and a static, adult-outpatient focus that does not test longitudinal
    clinical interaction or clinician responses to model suggestions.
