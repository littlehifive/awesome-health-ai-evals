id: auto-multiturn-consultation-eval
name: Automatic evaluation framework for multi-turn medical consultations
kind: eval_framework
year: 2023
summary: A pipeline in which an LLM doctor consults a ChatGPT-simulated patient over several turns and then answers a USMLE-style question, scored by information coverage (ROUGE) and final-task accuracy, on three reformulated USMLE test sets.
