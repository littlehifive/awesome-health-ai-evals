  notes: "The paper's main contribution is a training method (HiMed-8B, decaying scaffolding reward RL) plus a large training corpus; only the benchmark components are described here. HiMed-Trad items were generated by LLMs from OCR-ed source passages (MCQ, QA, dialogue formats) and audited by experts; HiMed-West is machine-translated with NLLB and a medical lexicon. Paper states released data comply with CC-BY 4.0 or Apache 2.0, but no per-dataset license was seen, so license is null. Repo shows a Data/ folder with all benchmark files. Eight bilingual annotators from two countries did human evaluation; countries not named."
