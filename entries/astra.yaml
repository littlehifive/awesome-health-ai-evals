card:
  task: Read a complete user-AI therapist conversation and label whether each of eight user or therapist risk behaviors
    is present.
  items_built: Three licensed clinicians with talk therapy experience and experience reviewing real user-AI therapist
    transcripts wrote 100 synthetic conversations, varying length, subtle versus overt risks, and the number of
    risk categories present. Two independent raters labeled each conversation, and a third adjudicated disagreements
    to establish reference labels.
  example: ''
  scoring: Predicted presence-or-absence labels are compared with human consensus labels for each conversation and
    risk category. Accuracy, sensitivity, specificity, positive and negative predictive values, F1, and Cohen κ
    are calculated by category for each prompt iteration and the combined sample; transcript-level error rates are
    also reported.
  judge: GPT-5-Chat (August 7, 2025 snapshot) assigns risk labels; reference labels come from one licensed clinician
    and one supervised research assistant, with a third rater adjudicating disagreements.
  scale: Binary presence or absence per category per conversation; category-level classification metrics and transcript-level
    error rates.
  validation: Human raters achieved κ=0.78 on the first 10 transcripts, and 49 of 800 ratings (6.1%) required adjudication.
    Agreement between ASTRA and human consensus ranged from κ=0.79-1.00 in iteration 1 and κ=0.65-1.00 in iteration
    2.
  score_meaning: AI therapist self-harm and harm-to-others flags cover encouraging or supporting harm as well as
    failing to respond appropriately; the second prompt expanded harm to others to include inadequate responses
    to ongoing abuse or neglect involving minors. Flirting and use for entertainment or general fact finding count
    as inappropriate because the tool is intended for mental health care.
  annotation_process: The two raters coded each transcript independently using the same curated prompt given to
    ASTRA; the research assistant's supervising clinician was not involved in writing the transcripts. The initial
    agreement check led to no additional training or changes. The first prompt was evaluated on 50 transcripts,
    then revised to include harm to minors and evaluated on 50 additional transcripts.
  results: ASTRA using GPT-5-Chat achieved category accuracy of 0.92-1.00 in iteration 1 and 0.90-1.00 in iteration
    2, with perfect agreement on user self-harm. Across 100 conversations, 78% had no labeling errors across the
    eight categories.
  limitations: The authors cite the small synthetic sample, uncertain generalizability to real conversations, limited
    power to detect bias, and probabilistic outputs that may differ across runs or models, and state that these
    findings do not establish readiness for real-world deployment.
