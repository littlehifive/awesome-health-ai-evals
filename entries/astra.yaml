id: astra
name: ASTRA (Automated Safety Testing and Reporting Application)
kind: eval_framework
year: 2026
summary: An LLM-based external monitor that flags eight clinician-defined risk behaviors (self-harm, harm to others, flirting, misuse, and inappropriate AI therapist responses) across whole AI mental health conversations, validated on 100 clinician-written synthetic transcripts.
