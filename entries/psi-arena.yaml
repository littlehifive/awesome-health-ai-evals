card:
  task: Conduct a 25-round psychological counseling conversation with each simulated client.
  items_built: The authors used GPT-4o to extract psychological profiles from real client conversations in PsyQA,
    generating 10,000 profiles across 100 topics under nine themes. They manually selected one high-quality profile
    per topic to construct 100 simulated clients.
  example: ''
  scoring: GPT-4o scores each dialogue from client, supervisor, and counselor perspectives using three scales; scores
    are averaged across sessions for each scale and combined into an overall mean. Scale-specific pass rates use
    totals above 42, 24, and 35 respectively, and the overall pass rate counts only sessions that pass all three
    scales.
  judge: GPT-4o assigns scores in the roles of client, supervisor, and counselor.
  scale: 'Client: 16 dimensions scored 0-4, total 64; supervisor: 8 scored 0-4, total 32; counselor: 9 scored 0-5,
    total 45; reported metrics are mean scores and pass rates.'
  validation: Two psychology graduate students ranked 30 dialogues from four models on all three scales and reached
    consensus after discussion. The authors report high consistency with automated rankings, especially on the client
    scale, but provide no numerical agreement statistic in the supplied text.
  results: Claude-3.5-Sonnet achieved the highest overall pass rate, 84%, with the psychological counselor prompt,
    compared with 37% using the default prompt.
  limitations: The authors state that simulated clients cannot fully capture human emotional dynamics or cultural
    diversity, biases may arise, accountability for harmful advice remains unclear, and AI cannot replace human
    therapists' empathy, intuition, and ethical judgment.
