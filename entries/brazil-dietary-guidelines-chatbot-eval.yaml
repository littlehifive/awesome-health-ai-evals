id: brazil-dietary-guidelines-chatbot-eval
name: Brazilian Dietary Guidelines Chatbot Evaluation Instruments
kind: eval_framework
year: 2026
summary: Portuguese instruments for judging whether AI chatbots' nutrition advice matches the Dietary Guidelines for the Brazilian Population, including a 21-statement knowledge questionnaire (GAB-1, 16 validated items), a citizen interaction guide, and two scoring instruments with answer keys (9 binary indicators of food-industry narratives; 14 alignment indicators).
