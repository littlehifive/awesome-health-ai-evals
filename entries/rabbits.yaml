  notes: "The paper says the full dataset is deliberately not released to limit contamination; models are scored through a Hugging Face leaderboard (AIM-Harvard/rabbits-leaderboard) and a forked lm-evaluation-harness in the GitHub repo, so open_data is closed.  2,271 generic drugs map to 6,961 brands in RxNorm; two physician authors reviewed the swaps. MMLU and PubMedQA were dropped for having under 100 matching items. The paper does not say which MedQA language subsets were used; the US origin is assumed from the English drug names."
