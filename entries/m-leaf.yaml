summary: A multidimensional evaluation framework for medical LLM applications with eight pillars (clinical task fidelity, interaction quality, safety and risk, robustness, transparency, calibration, and others), each with metrics and protocols on a 0 to 5 scale, piloted on 100 Slovenian vignettes comparing GPT-4o and HomeDOCtor.
