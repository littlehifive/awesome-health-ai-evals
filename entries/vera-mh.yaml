  notes: "Merged from three papers: concept paper (arXiv 2510.15297), the description paper (arXiv 2605.13318), and the JMIR AI human-validation study (arXiv 2602.05088; six Spring Health clinicians rated 90 simulated conversations, clinician IRR 0.77, LLM judge vs clinician consensus 0.81). Developed by Spring Health (a mental health care company) with a Yale author. License is a bespoke permissive text (MIT-like with a no-endorsement clause) in the GitHub LICENSE file; GitHub reports NOASSERTION. Repo v2.0 adds a harm-from-others (HFO) target and a bring-your-own-rubric mechanism. The earlier validation study used only ten personas. Persona and rubric files are in the repo (data/SI)."
