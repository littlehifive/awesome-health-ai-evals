id: vera-mh
name: VERA-MH
kind: benchmark
year: 2025
summary: "A multi-turn safety evaluation for mental health chatbots: an LLM role-plays 100 clinician-designed suicide-risk personas (plus a harm-from-others target in v2.0) in 30-turn conversations with the chatbot, and an LLM judge scores each transcript on a five-dimension clinical rubric."
