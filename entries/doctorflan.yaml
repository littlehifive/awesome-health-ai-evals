id: doctorflan
name: DoctorFLAN (DoctorFLAN-test and DotaBench)
kind: benchmark
year: 2024
summary: Chinese doctor-assistant medical dataset of about 92K Q&A items over 22 clinical workflow tasks and 27 specialties, with a 550-item single-turn test set (DoctorFLAN-test) and a 74-conversation three-turn benchmark (DotaBench), scored by GPT-4 and human clinicians.
