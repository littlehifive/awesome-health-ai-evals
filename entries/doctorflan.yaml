  notes: Records are the arXiv preprint and its npj Health Systems journal version. MIT license and the 91,771 train and 550 test counts are from the Hugging Face card; that card has no description and I did not see DotaBench in it, so check whether DotaBench itself is released. Training data is part of the same release, but the benchmark pieces are the test sets. How items were authored (clinicians vs LLM-generated and revised) was not read in detail. Evaluation uses GPT-4 as judge (rating prompts in the appendix) plus six clinicians for DoctorFLAN-test. Authors are at CUHK Shenzhen and the Shenzhen Research Institute of Big Data.
