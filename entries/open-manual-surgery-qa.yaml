card:
  task: Answer self-contained surgical questions derived from the Open Manual of Surgery in Resource-Limited Settings.
  items_built: Mistral Small 3.1 24B generated over 16,000 question-answer pairs from surgical manual text fragments,
    reduced to 14,529 through substring filtering and checks by the same model for clarity, completeness and grounding.
    Two reviewers, one a practicing clinician, inspected 1,000 initial pairs to identify filtering rules and another
    1,000 after filtering, finding no ambiguous questions in the second sample.
  example: ''
  scoring: Mistral Small 3.1 24B compares each generated response with the reference answer, marking it correct
    only if it is factually consistent, complete and relevant. Accuracy is the percentage of top-1 responses judged
    correct.
  judge: Mistral Small 3.1 24B grades responses using three few-shot examples.
  scale: Correct or incorrect per response; overall top-1 accuracy as a percentage.
  validation: One human, blinded to the model grader's decisions, assessed 100 responses using the same criteria,
    with 50 sampled from each grading outcome. Human and model judgments had a Cohen's kappa of 0.9.
  score_meaning: ''
  annotation_process: ''
  results: DeRetSyn with Llama-3.2-3B and fallback achieved the highest accuracy at 63.0%, compared with 42.5% for
    GPT-4o without retrieval.
  limitations: The authors identify possible evaluation circularity from generating questions from the retrieval
    corpus, potential bias toward factual questions rather than complex reasoning, ambiguity or ethical judgment,
    and the absence of prospective or interactive clinical evaluation.
