  notes: "The paper is mainly a system paper (the DeRetSyn agentic RAG assistant); the benchmark is a contribution listed in the paper. QA pairs were generated with Mistral Small 3.1 24B from the manual, filtered by substring rules and an LLM, and spot-checked by two reviewers (one a practicing clinician; 1,000 pairs, then 1,000 more with no ambiguous items found). The paper says data will be released on publication; the GitHub repo (CC0-1.0 per the repository license) holds code and eval results but no QA file was found in its tree, so open_data is unknown. Sole author is at Intuitive Surgical (USA), so builder type industry_lab is a judgment. Also reports results on PubMedQA and medical exam sets that are not part of this benchmark."
