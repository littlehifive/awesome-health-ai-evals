  notes: "Introduced inside the ACL 2026 paper on Med-CoReasoner, a reasoning method that is not part of the benchmark. Two native bilingual reviewers per language, except Yoruba; about 12 physicians or senior medical students in total. Long-form answers are scored by GPT-4o on a 5-point scale across five dimensions. The GitHub README describes the included MultiMed-X files as sample data (Japanese and Swahili files seen), so completeness of the release is unconfirmed; no license stated. Lead institutions are the University of Tokyo (first author) and Yale (last listed affiliation), taken from the author affiliation block."
