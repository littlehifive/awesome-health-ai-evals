  notes: "Only three of six domains (medicine, pharmacology, psychology) are health related; per-domain counts were not checked, so the health share of the 3,000 prompts is unknown. The benchmark targets misuse and refusal of hazardous scientific requests, not patient-facing health advice. HF card is gated (manual approval, non-commercial research use, license tag 'other'). The repo README now describes SOSBench as a safety overrefusal benchmark and notes a v2 harness; the paper (ICLR 2026) frames it as harmful-response rate. Judge is an LLM; model rubric details not read. Accepted at ICLR 2026 per the README; venue marked peer_reviewed on that basis."
