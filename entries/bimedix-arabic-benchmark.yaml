card:
  task: Answer Arabic medical multiple-choice questions, including choosing yes, no, or maybe from a biomedical
    abstract for PubMedQA items.
  items_built: The authors translated 7,045 English evaluation questions from six medical MMLU subjects, MedMCQA,
    MedQA and PubMedQA using ChatGPT to translate, score and iteratively revise the Arabic text. A medical professional
    fluent in Arabic manually checked all translations below a quality threshold and a random subset of high-scoring
    translations.
  example: ''
  scoring: The EleutherAI evaluation framework measures accuracy by comparing selected answers with the reference
    answers.
  judge: Answers are scored automatically using the EleutherAI evaluation framework.
  scale: Correct or incorrect per question; accuracy across questions.
  validation: ''
  results: Bilingually trained BiMediX performed best across all Arabic benchmark categories, with an average absolute
    accuracy gain of 10 percentage points over Jais-30B.
  limitations: ''
