id: bimedix-arabic-benchmark
name: BiMediX Arabic medical benchmark
kind: benchmark
year: 2024
summary: Arabic translations of nine English medical multiple-choice sets (six MMLU medical subjects, MedMCQA, MedQA, PubMedQA), made with a semi-automated ChatGPT translation pipeline with medical-professional checking and scored by accuracy.
