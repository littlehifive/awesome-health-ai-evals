  notes: "AAAI 2025 paper (MIT, Michigan, Harvard, Federal University of Sao Paulo, University of the Philippines and others). The paper says a sample is on Hugging Face and the full version will be released on PhysioNet; the dataset card was not readable (login error), so access and license are unrecorded. The paper also proposes CLARA, a debiasing method, which is not part of the benchmark. Benchmark is framed around LMIC languages (for example Filipino, Hindi)."
