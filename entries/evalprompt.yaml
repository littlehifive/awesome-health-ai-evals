summary: 94 USMLE Step 1 sample questions rewritten as open-ended self-diagnosis prompts, with a sentence-dropout robustness test (152 variants), where expert and nonexpert assessors grade ChatGPT answers as correct, partially correct, incorrect, or ambiguous.
