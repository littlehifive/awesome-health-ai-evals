  notes: "Read the paper PDF. Data is CC BY 4.0 and code Apache-2.0 per the paper's footnote; the HF card tag also reads cc-by-4.0 and is not gated. The authors call the 71-question probe a probe, not a benchmark, and the retrieval set is only 50 questions, so this is a small release attached to a system paper. Builder type implementer_ngo is a judgment (a company that deploys the chatbot). Who wrote the 50 questions is not stated; item_provenance is a best reading of the paper (real questions from the QA campaign, plus golden set). The 8 languages are served zero-shot; the released golden set is Thai. Wellness tourism and traditional medicine are the domain, not clinical care."
