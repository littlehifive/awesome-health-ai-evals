  notes: "r_7bf3bc8157 is a follow-up stress evaluation (shuffled answer order, ten LLMs) by the first author, arXiv 2509.18234, merged here. r_e2e66d93d5 is the GitHub repo (Apache-2.0 per GitHub and the paper's data-sharing statement). Exams from 2021 were not available. Questions with four options were padded with an NA option. The paper also fine-tunes medgemma-4b-it on the data. Lead countries: first author at Emory (USA), last author at Barcelona Supercomputing Center (ESP)."
