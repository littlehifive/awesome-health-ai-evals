  notes: "Primarily a model paper (the Diabetica LLM family, fine-tuned from Qwen); the benchmarks are a secondary contribution. The record year follows the arXiv preprint (2024); the paper was later a workshop paper at SCI-FM, ICLR 2025. The evaluation folder in the GitHub repo contains a data directory. The MIT license is the repository's; the benchmark data license was not checked separately. Authors are at Chinese institutions (the author block was not read in full); rater_countries CHN is inferred from the physicians who wrote the rules and should be verified. Companion SFT datasets (WaltonFuture/Diabetica-SFT) are training data and not part of this entry."
