  notes: "The Hugging Face card gives license 'other' and the paper's data-availability section says the public release applies source-specific redistribution limits (original RadioRAG question stems are not redistributed). The safety annotation layer was added by one board-certified radiologist (author T.T.N.). SaFE-Scale, the accompanying framework, varies model size, evidence quality, retrieval, context, and inference compute across 34 LLMs; it is described here but not a separate entry. Radiology image question answering is out of scope; this set is text only."
