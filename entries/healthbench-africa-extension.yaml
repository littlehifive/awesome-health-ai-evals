  items_built: The card lists 500 train examples sampled from HealthBench's 5,000 prompts, with prompts and responses
    translated using gpt-4o-mini and adapted culturally and linguistically while retaining the original expert-defined
    rubrics. Human validation by native speakers and domain experts is optional and does not yet cover all samples.
