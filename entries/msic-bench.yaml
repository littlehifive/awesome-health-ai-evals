  notes: "Two domain experts wrote and consensus-validated all questions; rater country is taken from the corresponding author's affiliation (West China Hospital, Sichuan University) because the paper does not state where the experts are based. Language is not stated explicitly (prompts and examples are English). Each question is evaluated in multiple-choice and open-ended form; open-ended responses were rated manually by the two experts for accuracy, honesty, and error composition. The repository (MIT license for the repo; no separate data license seen) holds the question files as .xlsx. Authors also built MSICKB, a knowledge base used for the RAG conditions."
