  notes: "Record r_cf807de47e and r_d5c80a97eb in the same candidate group are a different project (the Medieval expert-evaluation framework from Hong Kong and Shenzhen) and are in medieval-expert-eval. Models classify statements into four quadrants (true or false by knowledge grounding, supported or unsupported by the patient context); scoring is accuracy, macro-F1, per-quadrant F1, hallucinated support rate, and truth inversion rate. The paper says code and data are publicly available but gives only an anonymous review link; MIMIC-IV itself needs credentialed access, and I saw no license or access statement for the released data. Items are built from discharge summaries and coded tables, so the evaluation is of EHR-grounded reasoning rather than chatbot conversation; scope fit is borderline. The paper also proposes CoRFu fine-tuning, which is not part of this entry."
