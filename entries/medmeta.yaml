card:
  task: Write a meta-analysis conclusion from its title and, when provided, abstracts of primary studies.
  items_built: The authors crawled 14.2 million PubMed papers, restricted publication dates to 2018-2025, and used
    Gemini Flash 2.5 to classify titles and abstracts into medical specialties. Filtering and sampling across publication
    years produced 81 meta-analyses covering 24 specialties and 2,250 primary studies.
  example: ''
  scoring: Three LLM judges compare each generated conclusion with the reference conclusion using a shared rubric,
    and their scores are averaged; reported results are mean scores across meta-analyses. BERTScore separately measures
    semantic similarity to the reference, reported as mean F1.
  judge: Gemini 2.5 Pro, O4 mini, and Qwen3 235B assign the automated rubric scores.
  scale: Conclusion quality from 0 to 5, averaged across judges and items; mean BERTScore F1.
  validation: Nine trained annotators with medical backgrounds evaluated a random subset of 20 meta-analyses, with
    three independent raters per conclusion. Across Gemma 27B and MedGemma 27B in two settings, human-LLM Pearson
    correlations were 0.65-0.81 (p < 0.01), with mean biases of +0.10 to +0.31 points and no statistically significant
    systematic bias.
  score_meaning: Higher conclusion-quality scores indicate better quality, with 5 the highest score; the excerpt
    does not define individual score levels. A high BERTScore can reflect strong wording and semantic overlap with
    the reference even when the conclusion is factually incorrect.
  annotation_process: The automated judges used temperature 0.0 with reasoning mode enabled. Human evaluation used
    a Latin Square design to minimize bias, and all annotators completed a training session before scoring.
  results: The highest reported score was 3.17 out of 5 with oracle retrieval; the provided text does not name the
    model.
  limitations: The authors note that abstracts can omit full-text nuances, human validation covered only nine annotators
    and a subset of models and settings, and the benchmark covers only 81 meta-analyses and 24 specialties.
