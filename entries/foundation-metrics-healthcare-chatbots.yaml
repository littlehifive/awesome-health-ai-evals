id: foundation-metrics-healthcare-chatbots
name: Foundation Metrics for Healthcare Conversations
kind: eval_framework
year: 2023
summary: A proposed taxonomy of metrics for judging generative-AI healthcare chatbots, covering accuracy, trustworthiness (safety, privacy, bias, interpretability), empathy, and performance (usability, latency, memory), with metric definitions and measurement approaches.
