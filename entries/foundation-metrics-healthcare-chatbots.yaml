card:
  task: Respond to healthcare questions or hold healthcare conversations for evaluation from the intended user's
    perspective.
  items_built: The framework is intended for healthcare chatbot responses and conversations, with evaluations adapted
    to user, domain, and task types. The authors developed it by reviewing existing language-model evaluation metrics
    and benchmarks and proposing user-centered metrics; healthcare-specific benchmarks and case studies are left
    for future work.
  example: ''
  scoring: The proposed framework uses automatic benchmark-based methods and human ratings of individual answers
    or complete sessions. It calls for individual metric scores, category scores, and a total score reflecting category
    priorities, but does not specify a common aggregation formula.
  judge: Proposed judges include human annotators, healthcare professionals, intended users such as patients, and
    automatic evaluation methods.
  scale: No common scoring scale is specified; SSI is the average of Sensibility, Specificity, and Interestingness.
  validation: ''
  results: ''
  limitations: The authors identify correlations and trade-offs between metrics, incomplete coverage by existing
    benchmarks, subjective human ratings requiring diverse domain experts, and score changes caused by user, domain,
    task, prompting, and inference settings.
