id: cape-psychotherapy-chatbots
name: CAPE (Conversational Agent for Psychotherapy Evaluation)
kind: eval_framework
year: 2025
summary: An eight-section yes/no checklist framework for scoring psychotherapy chatbot quality (background, therapeutic orientation, alliance, conversational capabilities, outcome tracking and crisis handling, privacy and safety, accessibility, training data transparency), applied to four GPT-store chatbots with two depression personas.
