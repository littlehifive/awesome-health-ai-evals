card:
  task: Select answers and write responses about syndrome differentiation and treatment for clinical cases, and
    answer selected-response questions on TCM knowledge, medical ethics, and content safety.
  items_built: TCM experts assembled 300 clinical cases from clinical practice and classical case records, while
    300 general questions came from public medical examinations, authoritative question banks, and expert-designed
    ethics and safety scenarios. Samples were deduplicated, cleaned, and anonymized where needed, with answers and
    options checked through expert annotation, mutual cross-validation, and independent third-party review.
  example: ''
  scoring: 'Selected-response questions use three rounds with randomized option order: single-selection answers
    count as correct only when correct in all three rounds, while multiple-selection scores divide correctly selected
    options by the number of correct options plus incorrectly selected options, then average across rounds. An LLM
    compares written responses with reference answers using expert-designed prompts and assesses reasoning completeness
    and accuracy, while a reward model scores prescription-syndrome compatibility.'
  judge: Scores come from answer-key comparison, an unnamed LLM judge, and a prescription-syndrome reward model
    fine-tuned from Qwen3-14B.
  scale: 'Single-selection: correct or incorrect; multiple-selection: 0 to 1, averaged over three rounds; judge
    and reward scales and overall aggregation are not specified.'
