  notes: "Read the paper PDF and the GitHub README. Source mix per the paper: MedQA 1,273, MedMCQA 4,183, PubMedQA 500, BioASQ 618, MMLU medical 1,089. Translation validated by back-translation on 500 questions (ROUGE-L F1 0.75); the paper does not say who translated (apparently machine translation with checks). The MIT license shown is the GitHub repository license; the data card is not separate and each source set keeps its own terms. The repo ships benchmark_ru_translated.csv (Roman Urdu); whether the Perso-Arabic Urdu version is in the repo was not checked."
