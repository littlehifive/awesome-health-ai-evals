  notes: "Borderline scope: three of the four use cases are clinical documentation tasks (letter of medical necessity, report summary, consult note summary), which the plan puts out of scope, while the medical decision-making task and the safety and hallucination measures are in scope. Measures were built with a needs assessment of 8 radiation oncologists; rated by radiation oncology physicians (the paper says independent raters are future work). A data sharing statement exists on the journal site but was not opened; the cases are de-identified clinical data, so the item set is probably not public. Paper is CC BY-NC-ND 4.0."
