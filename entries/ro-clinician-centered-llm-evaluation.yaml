summary: "Use-case-specific Likert measures of safety and usability (comprehensiveness, accuracy and hallucination, readability, citation accuracy and others) for LLM outputs on four radiation oncology tasks (letters of medical necessity, radiology report and consult note summaries, medical decision-making), applied to ChatGPT, Gemini and Copilot with physician raters."
