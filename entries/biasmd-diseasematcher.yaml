id: biasmd-diseasematcher
name: BiasMD and DiseaseMatcher
kind: benchmark
year: 2024
summary: Two LLM-generated datasets from one paper, BiasMD (6,007 question-answer pairs testing demographic bias in health answers) and DiseaseMatcher (32,000 two-patient symptom-matching questions over 700 diseases), both scored by accuracy.
