  notes: One entry for two datasets because they share one paper. BiasMD covers disability, race and ethnicity, socioeconomic status, religion or belief, and sexuality, and is scored by percent of unbiased answers (plain accuracy, no LLM judge). DiseaseMatcher pairs two patients (3-6 symptoms each plus a demographic attribute) and classes answers as correct, indecisive, incorrect, or withheld because of demographics. Hugging Face datasets are auto-gated with Apache-2.0 per the HF API. The paper also releases the EthiClinician model, which is not part of this entry.
