id: biasmd-diseasematcher
name: BiasMD and DiseaseMatcher
kind: benchmark
year: 2024
summary: Two LLM-generated datasets from one paper, BiasMD (6,007 question-answer pairs testing demographic bias in health answers) and DiseaseMatcher (32,000 two-patient symptom-matching questions over 700 diseases), both scored by accuracy.
readme_section: safety
links:
  paper: https://arxiv.org/abs/2410.06566
  arxiv: "2410.06566"
  huggingface: [PardisSzah/BiasMD, PardisSzah/DiseaseMatcher]
  code: https://github.com/HIVE-UofT/Detecting-Bias-and-Enhancing-Diagnostic-Accuracy
license: Apache-2.0
open_data: gated
geography:
  item_languages: [English]
  item_origin_countries: [GLOBAL]
  item_origin_note: Items are synthetic (BiasMD from few-shot prompting of GPT-4, GPT-3.5 Turbo and Mixtral-8x7B; DiseaseMatcher from the ChatDoctor Autonomous disease and symptom list); no country origin stated.
  localization: native
  lead_institution_countries: [CAN]
  subsets:
    - {name: BiasMD, languages: [English], countries: [GLOBAL], localization: native}
    - {name: DiseaseMatcher, languages: [English], countries: [GLOBAL], localization: native}
