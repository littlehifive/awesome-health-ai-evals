  notes: "The paper states the full dataset is not released, to keep it usable as an external benchmark; a larger second version is planned. r_d2729e9783 is the earlier ESMO Real World Data and Digital Oncology conference abstract (indexed under an unrelated PET/CT title) for the same 100-case benchmark; r_5331e9f07b is the medRxiv preprint. Case-level text is pathology only, with no whole-slide images. Models were rated Correct, Partly correct, No diagnosis, or Wrong by consensus; the paper names LLM-as-judge as future work."
