  notes: "Publisher page (IOS Press) was blocked, so the paper's full text was not read; facts come from the Crossref abstract, the GitHub repo (triplets.csv and an appendix PDF with the prompts and metric table), and the paper's DOI record. The repo has no README and no license file; the paper itself is CC-BY-NC 4.0 per Crossref, which does not necessarily cover the data. Lead country GBR is assumed from the repo owner and NICE topic; author affiliations were not read. Appendix tables report ROUGE, METEOR, and BERTScore; the abstract mentions clinical utility and guideline adherence. The clinician check applied to the generated content, not necessarily to every item."
