  notes: "Paper (PSB 2025 proceedings) full text was not reachable (publisher blocks bots); facts come from the PubMed abstract and the GitHub repo. The repo (MIT license) holds src/benchmarkQandA.py with the 30 questions (Q1-Q30) and code that computes reference answers from a CGM dataframe; no data files are in the repo. Scoring method is inferred from the abstract and code (answers are computed, so accuracy is checked automatically), not read from the paper. Lead author Healey (MIT), last author Kohane (Harvard Medical School). HF dataset ehagey/LLM_Healthcare_Benchmarking is probably the same author's but is empty (README absent, no files) and is not listed here."
