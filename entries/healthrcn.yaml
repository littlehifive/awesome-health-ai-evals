  notes: "The paper's main contribution is the HRDE method; the dataset and evaluation set are secondary, so this is a borderline entry. The evaluation set (data/dev_data) and fine-tuning set are in the GitHub repo; the full HealthRCN is on Hugging Face (link taken from the repo README). The Hugging Face card (redirects to apocryphal/HealthRCN) lists license apache-2.0 and language zh. Rumor labels come from the scraped data; accuracy and F1 score the label, and GPT-4 rates relevance, reliability, and richness of explanations."
