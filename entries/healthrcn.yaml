id: healthrcn
name: HealthRCN
kind: benchmark
year: 2024
summary: A Chinese health-rumor dataset of 1.12 million rumors scraped from health websites, released with a 2,500-sample evaluation set (rumor, not rumor, not health-related) and GPT-4-scored explanation quality, introduced with the HRDE retrieval-augmented detector.
