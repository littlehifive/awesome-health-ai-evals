id: timed-q
name: TIMed-Q
kind: benchmark
year: 2025
summary: 500 high-frequency patient medical questions across five domains (100 each), used to measure whether LLM answers include a medical disclaimer; introduced in a 2022-2025 longitudinal study of disclaimers.
readme_section: safety
