  notes: "Domains are symptom management and treatment, acute emergencies, medication safety and interactions, mental health, and diagnostic test interpretation. Scoring is presence of a medical disclaimer, detected by regular expressions plus manual review. The paper says the questions are in Supplementary File 1 but gives no data-availability statement or repository link, so open_data is left unknown and no license is recorded. The same study also tests mammogram, chest X-ray, and dermatology image tasks, which are out of scope and not part of this entry. A physician reviewed the questions. Lead institutions taken from the first and last author affiliations (UBC; Stanford)."
