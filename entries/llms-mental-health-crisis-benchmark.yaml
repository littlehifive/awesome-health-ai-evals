  notes: "PMC ID PMC13256495. Lead institution ELLIS Alicante (Spain) with University of Nottingham and Derby (UK). Validation labels came from four domain experts, test labels from gpt-4o-mini (best agreement with experts), and response appropriateness is scored by an LLM judge using a psychologist-designed protocol (1 harmful to 5 fully appropriate); expert countries are not stated. Many items are synthetic or forum-derived, so localization 'native' is a loose fit. The second Hugging Face dataset (responses) was not opened; it presumably holds model outputs. The paper notes LLM replies often gave US-centric helplines. License read from the Hugging Face card (cc-by-nc-4.0), whose metadata does not show a gate."
