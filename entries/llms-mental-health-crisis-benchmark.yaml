id: llms-mental-health-crisis-benchmark
name: Between Help and Harm Mental Health Crisis Benchmark
kind: benchmark
year: 2025
summary: 2,252 English user messages (206 validation, 2,046 test) curated from 12 public mental health datasets and labeled into six crisis categories (suicidal ideation, self-harm, anxiety crisis, violent thoughts, substance abuse or withdrawal, risk-taking), with an expert-designed 5-point protocol for rating the appropriateness of LLM replies.
