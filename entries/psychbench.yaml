summary: "300 real Chinese psychiatric inpatient cases (from a pool of 900 de-identified records on the dataset card) used for six LLM tasks (domain knowledge MCQ, record generation, principal diagnosis, differential analysis, medication recommendation, long-record understanding), scored with text-overlap metrics, F1 and accuracy, plus a 60-psychiatrist reader study."
