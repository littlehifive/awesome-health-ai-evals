  notes: "Zenodo release (CC-BY-4.0 data, MIT code) and GitHub reproduction kit for a physician-rated study of chatbot answers; the accompanying paper is not linked from the record, so the title of the study comes from the Zenodo description. Released files include prompts.csv, responses.csv, ratings.csv, and checklist_items.csv. Lead institution country (Israel) comes from the first author's listed affiliation (Clalit Health Services). Chatbots queried in April and May 2026 (ChatGPT, Claude, Gemini, DeepSeek). The set is small (21 scenarios) and was built for a single study; included because prompts, ratings, and a checklist are released for reuse."
