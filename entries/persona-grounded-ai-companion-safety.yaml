id: persona-grounded-ai-companion-safety
name: Persona-Grounded AI Companion Safety Evaluation
kind: eval_framework
year: 2026
summary: An end-to-end framework that simulates multi-turn conversations between clinically validated personas (depression, anxiety, PTSD, eating disorder, incel identity) and AI companion apps across 25 high-risk scenarios, then labels harm with an LLM; applied to Replika to yield 1,674 annotated persona-Replika utterance pairs.
