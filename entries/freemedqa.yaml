  notes: "Read the Methods and Discussion in the PMC full text (Scientific Reports, NYU authors). The paper says the FreeMedQA datasets are under Supplementary Materials, so open_data is set to open from that statement; the supplement files were not opened and no license was seen. No GitHub or Hugging Face release found. GPT-4o filtered MultiMedQA questions (31.32% removed) and regular expressions rewrote MC stems to free response; free-response answers are judged by GPT-4o. A 350-question subset was also answered by medical students. Which MultiMedQA subsets were included was not checked."
