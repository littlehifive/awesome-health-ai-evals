  notes: "Over-refusal is detected by keyword matching; safe-completion rate is judged by Grok-4 (cross-checked with two other judges on 1,000 items). Seven categories: biological/chemical harm, drug abuse, health privacy, medical misinformation, mental abuse, self-harm, unqualified medical advice. 16 annotators validated the seed categories; their countries are not stated. Accepted to ACL 2026 Findings per the dataset card; venue is set to peer_reviewed on that basis. The 31,920 total comes from the paper and card; the subset sizes on the card sum to 11,000 (Easy 5K, Medium 5K, Hard 1K), so the rest of the set is not described by those subsets."
