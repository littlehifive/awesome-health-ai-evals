  notes: "Authors at Chengdu University of Traditional Chinese Medicine (College of Nursing). Methods are an adapted LLM Word Association Test, a Relative Decision Test, and paired-prompt analysis, scored by bias scores and odds ratios rather than a rubric. The repository carries the data, query scripts, and analysis code under the MIT license; the license applies to the repository, not necessarily the prompt sets. item_provenance is unknown: the paper says datasets were guided by NCCC bias domains but does not say who wrote the term lists."
