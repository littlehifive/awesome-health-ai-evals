  notes: "Full text read via paperclip (arXiv version). Apache-2.0 is the GitHub repository license; the paper's data-availability statement points to the repo for supplementary tables and code, and the repo has an eval_data folder (e1_wp.json to e10_wp.json and a worst_at_k folder), but whether the 2,069 items are released in it was not checked, so open_data is unknown. Authors include employees of Medlinker (Beijing); the paper does not state the physicians' countries, so rater_countries is omitted. The GitHub README says 40 physicians, the paper says 32. Scoring uses DeepSeek-R1 as the judge, checked against oncology physicians (macro-F1 on 411 criteria). Items are single-turn text."
