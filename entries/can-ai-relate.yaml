id: can-ai-relate
name: Can AI Relate (mh-eval)
kind: benchmark
year: 2024
summary: 12,513 Reddit mental health posts with 70,429 peer responses from 26 subreddits, plus GPT-4 responses, used to measure equity in empathy across inferred patient demographics and adherence to motivational interviewing, with a 50-post clinician evaluation by two psychologists.
