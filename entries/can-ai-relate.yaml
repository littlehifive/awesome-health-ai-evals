card:
  task: Write a supportive response to a Reddit post seeking mental health help.
  items_built: The authors collected posts and peer responses through the Reddit API and randomly selected 50 posts
    for blinded clinician evaluation, masking demographic information in the posts and responses. For demographic
    auditing, they used GPT-4-inferred attributes to select 253 posts labeled Black, 58 Asian, 47 White and 520
    with unknown race.
  example: ''
  scoring: Fine-tuned RoBERTa classifiers score three empathy dimensions, and differences in demographic group means
    are tested with t-tests. Clinicians separately rate three empathy dimensions and Cultivating Change Talk, with
    scores averaged across samples and clinicians.
  judge: Automatic judges are three fine-tuned RoBERTa classifiers; human judges are two licensed clinical psychologists
    specializing in adult depression, anxiety disorders and CBT.
  scale: 'Empathy: 0-2 per dimension; Cultivating Change Talk: five-point scale; reported means and demographic-group
    differences.'
  validation: Clinician agreement on empathy was Cohen's κ = 0.25-0.42. On a held-out 10% sample, the classifiers
    achieved macro F1 scores of 80.5%, 87.3% and 92.7% for binary identification of emotional reactions, interpretations
    and explorations, respectively.
  score_meaning: Empathy scores of 0, 1 and 2 mean none, weak and strong empathy, respectively. Higher Cultivating
    Change Talk scores indicate more active encouragement of the seeker's own language in favor of change and confidence
    in making that change.
  annotation_process: The clinicians rated 50 randomly sampled Reddit posts, each paired with either a peer response
    or a GPT-4 response and presented in random order through Qualtrics. They answered four questions per pair;
    identifying demographic information was masked or removed, and individual response sources were hidden, although
    clinicians were told that some responses could be AI-generated. At the end, each clinician estimated the percentage
    of responses generated by AI.
  results: GPT-4 scored 3.08 and 3.13 on Cultivating Change Talk for the two clinicians, compared with 2.08 and
    2.31 for human peer responses, reported as a 48% improvement. Responses to Black posters had 2%-13% lower empathy
    than responses to the unknown-race control group.
  limitations: The authors identify quality-of-care scores as imperfect proxies for patient outcomes, limited coverage
    of bias and systemic inequality, and small numbers of samples and clinical evaluators.
