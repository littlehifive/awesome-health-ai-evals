card:
  task: Answer a clinical question typed by an auxiliary nurse midwife about high-risk pregnancy, in Hindi or Telugu
    mixed with English.
  items_built: '1,010 questions were sampled from production use of ARMMAN''s chatbot for auxiliary nurse midwives
    in Uttar Pradesh and Telangana between January and March 2026. They come from six topics that make up more than
    80% of what nurse midwives ask: general antenatal care, general high-risk pregnancy, anaemia, pregnancy-induced
    hypertension, gestational diabetes and fever in pregnancy. Questions shorter than 10 characters were left out.
    Each question has its own answer checklist, written by the judge model from answers the clinicians had marked.'
  example: Pw ko iron calcium kitni deni h (How much iron and calcium should a pregnant woman be given?)
  scoring: Each answer gets a yes or no on factual correctness, completeness and clarity, judged against a checklist
    written for that question. The score on each dimension is the share of answers marked yes.
  judge: gpt-5.4 as an LLM judge, which reads the question, the answer and that question's checklist and returns
    a verdict with its reasoning. Four clinicians (2 gynaecologists, a doctor and a nurse trainer with public health
    experience) labelled a sample of 100 question-answer pairs.
  scale: Yes or no on each of 3 dimensions.
  validation: Two clinicians labelled each of 100 question-answer pairs, 50 per language. They agreed on factual
    correctness 100% of the time in Hindi and 90% in Telugu, on completeness 96% and 76%, and on clarity 84% and
    80%. The team read 50 questions and checklists per language by hand, rewrote the judge's instructions, and after
    the full run softened the checklist or the judge where it was stricter than the clinicians.
  score_meaning: 'A no on completeness means the answer left out something the question''s checklist says must be
    there, even a gap a clinician would accept. The team calls the benchmark harsh: it fails answers for small omissions
    and almost never passes an answer that is wrong. It started with seven criteria and cut them to three because
    they overlapped.'
  annotation_process: The clinicians worked from written guidelines. Each sampled pair was scored by two clinicians,
    who added a comment whenever they marked an answer down. Those judgements were turned into the per-question
    checklists the judge uses.
  results: The production chatbot (gpt-4.1) scored 73.83% on factual correctness, 42.08% on completeness and 86.63%
    on clarity. Most failures were omissions, usually the signs that mean the woman needs to see a doctor, which
    the clinicians did not count as serious mistakes.
  limitations: Only typed questions were included, which may leave out nurse midwives who are less comfortable typing
    and prefer to send voice notes.
  sources:
  - https://globalhealthbench.org/armman/
  - https://globalhealthbench.org/reports/armman.pdf
  extracted: '2026-11-25'
