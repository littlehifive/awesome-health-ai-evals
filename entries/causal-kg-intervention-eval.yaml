id: causal-kg-intervention-eval
name: Causal knowledge graph grounding evaluation framework
kind: eval_framework
year: 2026
summary: A graph-centered framework that scores LLM intervention reasoning in healthcare (intervention accuracy, causal edge F1, adverse-effect F1, evidence accuracy, unsupported-claim rate) under four grounding conditions, piloted on 80 synthetic cardiovascular scenarios.
