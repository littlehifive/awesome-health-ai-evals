card:
  task: Classify whether and how synthetic medical advice diverges from medication guideline documents, given a
    patient profile, the relevant documents, and the advice.
  items_built: An LLM generated advice that either conflicts with or aligns with text extracted from 93 medication
    guideline documents, paired with patient personas. The dataset contains 8,435 training samples and 2,110 test
    samples, with each split balanced across five label classes.
  example: ''
  scoring: The evaluation notebook compares predicted divergence labels with the ground-truth Synth Type labels
    and computes macro F1, precision, recall, a confusion matrix, and a classification report. It also computes
    binary metrics for divergence versus no divergence.
  judge: The evaluation notebook compares model predictions with the ground-truth Synth Type labels.
  scale: Five-class classification with macro F1, precision, and recall; binary divergence versus no divergence
    metrics.
