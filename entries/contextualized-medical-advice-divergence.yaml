  notes: "Read the Zenodo record. Zenodo marks the record access as restricted, so open_data is gated (request needed); the license shown is CC-BY-4.0. Authors are listed as Anonymous. Reference advice is LLM-generated to conflict with, or match, advice extracted from real medication documents (the source of those documents is not named). The task is classifying divergence (macro F1, binary divergence vs none), with baselines for zero-shot, chain-of-thought, LoRA, RAG and multi-agent debate; the card says a paper is to be cited but its title is cut off. Zenodo publication date reads 2025-05-25, the DOI suggests early 2026; year 2026 is a guess."
