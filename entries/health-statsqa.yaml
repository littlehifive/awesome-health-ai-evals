  notes: "The dataset is auto-gated on Hugging Face, so the card body could not be read; facts come from the public card metadata and description snippet. Gate terms: CC BY-NC-SA 4.0 with automatic approval for matching organisational emails. The card says the source data is under GODL-India and tags it hmis and table-question-answering. The repo has an evaluate.py, but the scoring method was not seen, The public card shows evaluate.py scoring accuracy against gold answers computed by code from HMIS and Rural Health Statistics tables (closed-book and oracle conditions; answer types include choice and number), so exact-match accuracy is confirmed; answers are generated by code from public tables. The publisher judicialmind appears to be a company; builder_types, item_provenance, and lead country are unverified. No paper."
