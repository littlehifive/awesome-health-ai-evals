  notes: "Two papers from Shanghai AI Laboratory describe the same project: the AAAI 2024 paper (40,041 questions, 701 annotated EHR cases scored by accuracy, BLEU/ROUGE, and expert rating) and the Big Data Mining and Analytics 2024 paper (300,901 questions, cloud platform with dynamic evaluation where answers and ground truth stay server-side). No dataset download link or license was found in the paper text I scanned, so open_data is unknown; test labels appear to be held on the platform. Later versions are separate entries, medbench-v4 and medbench-v5."
