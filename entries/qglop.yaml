id: qglop
name: QGLOP
kind: eval_framework
year: 2024
summary: A four-domain scoring tool (accuracy/comprehensiveness, bias, currency, tone; each scored 0 to 4, total 16) for rating LLM-written patient education handouts, applied to 51 ChatGPT-3.5 neuro-ophthalmology handouts across 17 conditions.
