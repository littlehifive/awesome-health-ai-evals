  notes: "r_cd66b090de is the npj Mental Health Research version (same authors, eleven models instead of twelve); I confirmed it only from the abstract and author list. The repo's MIT license is the code license and its README asks users to read a data-usage policy, plus the upstream datasets keep their own terms. Record r_5a17e055c0 (MCTSr-Zero) names a different, unreleased 16-dimension counseling-dialogue benchmark also called PsyEval; it is not merged and no release link was found. Emotional-support quality is rated with a designed metric; the paper text I read did not make clear whether humans or an LLM rated it. psycheval is a separate benchmark."
