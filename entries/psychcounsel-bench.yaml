id: psychcounsel-bench
name: PsychCounsel-Bench
kind: benchmark
year: 2025
summary: About 2,252 English single-answer multiple-choice questions modeled on the U.S. National Counselor Examination (NCE), covering counseling methods, abnormal and developmental psychology, and ethics, scored by accuracy against a roughly 70% passing threshold.
