summary: 1,245 orthopedics and sports-medicine questions (multiple choice and open-ended) from Chinese specialist exam banks and 203 real cases at eight hospitals, covering knowledge recall, note and image interpretation, diagnosis, and treatment planning, for LLMs and vision-language models.
