  notes: Merged the paper record into the earlier GitHub-only entry. Several tasks (image interpretation, diagnosis and treatment from images) need radiology images, which are out of scope; text-only runs replace images with radiology reports. A human should decide whether to keep it. Open-ended answers are scored by GPT-4o against ground truth (three runs) with 120 items double-rated by two orthopedic physicians. Ground truth written by seven orthopedic and sports-medicine experts.
