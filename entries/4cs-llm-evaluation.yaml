id: 4cs-llm-evaluation
name: 4Cs of language model evaluation
kind: eval_framework
year: 2023
summary: A four-criterion rubric (correct, concise, comprehensive, comprehensible; 1-5 scale) for rating LLM health advice, applied to 123 patient prompts on four cardiovascular topics in English and Danish.
