card:
  task: Respond to a patient's prompt asking for cardiovascular health information or advice.
  items_built: The authors constructed 123 prompts about myocardial infarction, peripheral arterial disease, varicose
    veins and cardiovascular prevention, with at least five prompts for each combination of topic and six classes
    defined by language, description depth and health literacy. The classes used English or Danish and low or high
    description depth and health literacy, excluding low description depth combined with high health literacy.
  example: ''
  scoring: Experts rate each response against the four criteria using rubric descriptions, with each score reviewed
    by at least two authors and settled by consensus. Scores are reported separately for each criterion as distributions
    and averages, including averages by topic and prompt class.
  judge: Medical professionals score correctness and comprehensiveness; communication and patient-perspective experts
    score conciseness and comprehensibility.
  scale: Each criterion is rated from 1 to 5; criterion averages and score distributions are reported.
  validation: At least two authors reviewed each score and reached consensus to ensure inter-rater reliability;
    no numerical agreement statistic is reported.
  results: ChatGPT using GPT-4 received scores generally between 3 and 4 out of 5 across the 123 responses, with
    conciseness generally the weakest criterion. Higher-health-literacy prompts generally produced better responses,
    and Danish responses scored better on all four criteria.
  limitations: The authors did not include patients in assessing prompt-response pairs and limited the exploration
    to four cardiovascular topics.
