card:
  task: Complete a short healthcare workflow episode by responding to new information or an interruption with an
    allowed action, while preserving relevant facts, grounding claims, and escalating or handing off when required.
  items_built: The framework specifies episodes built from de-identified or synthetic artifacts, with an initial
    context, a state-changing event, allowed actions, reference decisions, and a scoring rubric; it does not release
    test items. Two qualified annotators independently prepare reference decisions using an episode guide, and a
    third reviewer resolves disagreements.
  example: '"Consider a patient message reporting worsening shortness of breath after a recent medication change."'
  scoring: 'Outputs are compared with atomic reference annotations: required facts retained or revised, claims linked
    to admissible sources, and correct handoff fields, with penalties for contradictions, stale facts, and unsupported
    citations. Escalation is scored using sensitivity, specificity, and a predeclared utility that rewards correct
    decisions and penalizes missed and unnecessary escalation; results are reported separately by task class and
    evidence level rather than as one leaderboard score.'
  judge: Two qualified annotators create reference labels, and a third reviewer adjudicates disagreements; the output
    scorer is not specified.
  scale: Fractions of required facts, sourced claims, and correct handoff fields, with penalties; escalation sensitivity,
    specificity, and cost-weighted utility; separate scores rather than one overall metric.
  validation: ''
  score_meaning: The utility score assigns a larger penalty to missed escalation than to unnecessary escalation
    when missed escalation is judged more harmful. Strong simulated-workflow scores support claims only about the
    defined episodes, not clinical outcomes, time saved, or deployment value.
  annotation_process: The reference annotators work independently using an episode guide, and the protocol calls
    for retaining both the final label and the disagreement type. The escalation cost matrix must be declared before
    evaluation and reviewed by the task's clinical governance group.
  results: ''
  limitations: The protocol does not reproduce institutional implementation or measure clinical outcomes, time saved,
    clinician workload, patient safety, or adoption, which require prospective workflow studies.
