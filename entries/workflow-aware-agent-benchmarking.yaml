id: workflow-aware-agent-benchmarking
name: Workflow-Aware Benchmarking for Healthcare NLP Agents
kind: eval_framework
year: 2026
summary: "An episode-level evaluation protocol for healthcare LLM agents with a five-field episode schema and four task templates (documentation update, evidence retrieval, patient messaging, triage handoff), scored on state continuity, evidence traceability, and escalation decisions."
