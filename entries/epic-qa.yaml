  notes: "Scientific Data descriptor from NLM, Allen Institute for AI, and NIST, used in the TAC 2020 EPIC-QA community evaluation. A retrieval and passage-extraction benchmark (scored with a novelty-aware NDCG variant) that predates chat-style LLM evaluation, included as a health QA benchmark. Data is on OSF (10.17605/OSF.IO/VNYK8); the Reddit documents must be rebuilt with a script. The OSF license name was not retrievable, so license is null. The paper's counts of 87 and 60 questions come from the Data Records section."
