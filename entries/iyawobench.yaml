id: iyawobench
name: IyawoBench
kind: benchmark
year: 2026
summary: 200 synthetic clinical vignettes for febrile illness triage in Nigerian primary care, generated from statistics of 1,200 real encounters at 19 health centres in Oyo State, labelled TREAT HERE, REFER TODAY, or REFER NOW and scored by triage accuracy and safety (v2.0 adds failure-mode and cost-based metrics).
