  notes: "Merges v1.0 (arXiv 2605.23465) and v2.0 (arXiv 2607.29085, same 200 vignettes with new metrics: Escalation Bias Index, Expected Deployment Cost, three named failure modes). Vignettes were generated programmatically, not by an LLM prompt, so llm_generated is the nearest provenance code. Triage labels were assigned by the first author from WHO IMCI, WHO malaria, Surviving Sepsis, and Nigerian treatment guidelines, without independent physician review (stated limitation). Authors are at Iyawo Health, which built the source platform; the first author is the platform founder. The v1 paper says data are available on request but also points to the GitHub repo, which holds v1 CSV/JSON files and a README stating CC BY 4.0. The v2 paper gives a different, nonexistent GitHub username (anthonioladimeji111-coder), so the working repo link is the v1 paper's. Rater countries and lead country are inferred from the Ibadan, Nigeria affiliation."
