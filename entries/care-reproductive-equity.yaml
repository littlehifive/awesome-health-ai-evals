id: care-reproductive-equity
name: CARE (Capability Approach for Reproductive Equity)
kind: eval_framework
year: 2026
summary: A capability-approach framework with a design lens and an evaluation lens for judging whether sexual and reproductive health chatbots expand users' capabilities, demonstrated on 34 queries per tool across SRH chatbots, general LLMs, and search AI features and coded for credibility and reasoning.
