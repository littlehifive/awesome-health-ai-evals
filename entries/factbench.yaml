  notes: "Biomedical literature tasks rather than patient-facing health questions, so scope is borderline. The repository holds code (an adapted FActScore) and no license file was seen; no released item set of its own. Lead country is Germany (Technical University of Munich) from the author affiliations. Scores are atomic-fact support rates from NLI (DeBERTa), CoT (FActScore+ with GPT-4o mini) and unanimous voting of both."
