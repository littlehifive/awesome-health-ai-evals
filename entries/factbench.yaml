id: factbench
name: FActBench
kind: eval_framework
year: 2025
summary: A fact-checking evaluation suite for LLM-generated medical text that breaks outputs into atomic facts and checks them with NLI and chain-of-thought methods on four tasks (summarization, lay summarization, RAG, open-ended answers), validated against medical annotators.
