id: causal-sensitivity-score
name: Causal Sensitivity Score (CSS)
kind: eval_framework
year: 2026
summary: A pre-registered counterfactual metric that mutates oncology tumor-board cases along five clinical dimensions (12 interventions) and scores 0, 0.5, or 1 on whether a model's treatment recommendations update in the correct direction, tested on 224 cases.
