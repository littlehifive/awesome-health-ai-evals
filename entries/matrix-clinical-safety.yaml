id: matrix-clinical-safety
name: MATRIX
kind: benchmark
year: 2025
summary: A safety evaluation framework for clinical history-taking dialogue agents with a library of 17 patient input types, 28 expected behaviors, and 40 hazardous scenarios, an LLM hazard judge (BehvJudge), a simulated patient (PatBot), and the 240-dialogue HazMAT validation set.
