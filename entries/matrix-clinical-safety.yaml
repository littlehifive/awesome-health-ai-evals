  notes: "Ufonia Limited and University of York. The paper states 'we release all datasets, dialogue libraries, and evaluation tools' but gives no link in the text I read, so open_data stays unknown. Ten UK clinicians labeled 24 HazMAT cases; BehvJudge with Gemini 2.5 Pro reached F1 0.96. Specialties include cataracts, heart failure, IBD, ENT, UTI, hernia, gynecology, COPD, and bone health. Country labels are inferred from UK clinicians, UK ethics approval, and NHS partners."
