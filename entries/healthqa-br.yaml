  notes: "Single author, listed as an independent researcher; the card says funding came from Brazil's Ministry of Health (DECIT), CNPq, and the Gates Foundation, so builder type is left unknown. Questions were parsed from public exam PDFs and deduplicated. Revalida is the licensing exam for foreign-trained physicians; Enare is the national residency entrance exam run by Ebserh. Accuracy is the only metric. The card also frames the set around Brazil's public health system (SUS)."
