  notes: "Read the Zenodo record and its README (no paper was found; the README mentions an accompanying paper). The Zenodo metadata says CC-BY-4.0 but the README says CC BY NC 4.0; the stricter one is recorded. The README cites DOI 10.5281/zenodo.22308076 as the versioned snapshot. Queries are participant-written to scenario prompts, not from a deployed service; gold answers were written and scored by one Tamil-speaking final-year MBBS student against WHO, ICMR, NICE and similar guidelines (kappa 0.81 safety and 0.76 accuracy on a 20% double-annotated subsample). All gold answers score 2/2, so the rubric (accuracy 0-2, safety 0-2, disclaimer) is meant for scoring model outputs. Authors are at St. Joseph's Institute of Technology; the country (India) is inferred from the institution name."
