  notes: "Released under a Data Use Agreement via a research-only access portal (no redistribution to non-signatories, no use for training generative models); license is recorded as custom. Inputs include patient-uploaded medical images alongside text, so the task is multimodal even though modality is limited to text and voice in this schema. Rubrics are initialized by an LLM and refined by physicians (countries not stated). First author is at Shanghai Jiao Tong University and most authors at JD Health; other authors are in Singapore and the US."
