summary: Three benchmark sets for personal-health LLMs on wearable data (sleep-medicine and fitness exam MCQs, 857 expert-annotated sleep and fitness case studies, and sleep-quality prediction), scored by MCQ accuracy, expert rubrics, and automatic metrics.
