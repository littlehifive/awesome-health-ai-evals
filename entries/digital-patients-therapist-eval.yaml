id: digital-patients-therapist-eval
name: Digital-patient evaluation of LLM therapists
kind: eval_framework
year: 2025
summary: "An evaluation platform in which LLM-driven digital patients (96 profiles varying in age, gender, problem, and cooperation) hold text therapy sessions with an LLM therapist and then fill in session-satisfaction and working-alliance questionnaires, used to score motivational-interviewing therapist LLMs."
