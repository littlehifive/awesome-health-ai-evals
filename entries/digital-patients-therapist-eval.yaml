  notes: "Published in npj Mental Health Research (Reichman University). The paper says the digital-patient platform is made available but gives no link, and the data-availability statement only cites MI-TAGS and Alexander Street transcripts, so open_data is unknown. Validated against one MI clinician and two raters using poor, average, and expert therapist agents. Also compares BLEU, ROUGE, METEOR, BERTScore, and MAUVE and finds them insufficient."
