id: pretexeval
name: PretexEval
kind: eval_framework
year: 2024
summary: A framework that generates reliable and structurally diverse true/false test samples from any medical knowledge base using predicate equivalence transformations, applied to MedLAMA and DiseK to test 12 LLMs' medical factual knowledge.
