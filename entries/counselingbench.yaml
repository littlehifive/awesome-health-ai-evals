  notes: "Georgia Tech lead with Columbia and Tower Health co-authors. Competency labels come from two annotators with a third, a US licensed mental health counselor, breaking ties on 767 disagreements; the first two annotators' countries are not stated. The paper also evaluates models' written justifications (RQ3) with reasoning metrics; how much of that uses an LLM judge was not checked in detail. Exam mock-question copyright status is not discussed in what was read. The record year is 2024 (arXiv); the peer-reviewed version is NAACL Findings 2025."
