  notes: "Read the arXiv HTML version. The instrument was built from maternal- and public-health literature and reviewed by an MBBS/MPH maternal-health expert and a counsellor with an MSc in psychology. Models answer the survey conditioned on demographic profiles, and alignment is measured as distance to the human response distribution. A downstream part generates culturally conditioned dialogues, rated for quality by experts. The paper says code for scoring, LLM survey responses and dialogue generation is on GitHub, but the link text carried no recoverable URL, so no code link is listed. Whether the human survey responses are released was not found. Authors are at IIIT-Delhi."
