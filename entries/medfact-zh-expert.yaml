  notes: "Paper read in full text from the ACL Anthology PDF (GEM 2026). Built by Xunfei (iFlytek) Healthcare Technology. A filter cut 27,116 candidate texts to 6,405, then three licensed medical professionals annotated veracity, error span, and correction. The paper says the dataset is distributed under a restrictive license that bars clinical or patient-facing use and gives a project page (iflytek-medical-southchina.github.io/MedFact), but no download link was seen, so open_data is unknown and license is custom. The arXiv paper of the same name (medfact-llm-claims-zh) is a different benchmark."
