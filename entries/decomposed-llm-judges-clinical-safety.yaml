card:
  task: Answer a health question, with the response assessed against hazard-based clinical safety rubrics.
  items_built: The framework was developed for clinical safety evaluation and tested on a women's health chatbot
    using 12,193 real-world and synthetic question-answer pairs. Its rubrics were initially derived from a hazard
    log, expanded from observed failures, and refined and evaluated using those pairs.
  example: ''
  scoring: Each of 25 LLM judges applies a hazard-based rubric to question-answer pairs, producing outputs used
    to derive hazard-level ordinal risk estimates and acceptability classifications. Fail-class recall, precision,
    and macro-F1 are measured against a reference standard.
  judge: Twenty-five LLM judges apply the rubrics; their model names are not stated.
  scale: Hazard-level ordinal risk estimates and acceptability classifications; fail-class recall, precision, and
    macro-F1.
  validation: The multi-judge and reference-standard risk estimates were identical and yielded the same acceptability
    classifications for all four in-scope hazards.
  results: The multi-judge approach achieved 95.3% fail-class recall at 61.1% precision, compared with 24.9% recall
    at 58.7% precision for human annotation and 69.1% recall at 47.3% precision for the combined judge. Calibration
    increased multi-judge macro-F1 from 72.9% to 86.7%.
  limitations: ''
