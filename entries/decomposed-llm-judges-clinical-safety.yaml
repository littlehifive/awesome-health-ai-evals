id: decomposed-llm-judges-clinical-safety
name: Decomposed LLM-as-Judges Clinical Safety Evaluation
kind: eval_framework
year: 2026
summary: A framework of 25 hazard-based rubrics, each applied by its own LLM judge, to produce auditable risk estimates for ISO 14971 risk management, tested on 12,193 real and synthetic question-answer pairs from a women's health chatbot.
