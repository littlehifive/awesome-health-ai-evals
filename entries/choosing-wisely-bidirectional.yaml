id: choosing-wisely-bidirectional
name: Choosing Wisely Bidirectional Benchmark
kind: benchmark
year: 2026
summary: 225 standardized primary-care scenarios built on 15 Choosing Wisely recommendations, each with restraint-appropriate and matched action-appropriate versions, scored by an LLM judge to test whether a model knows when to recommend a test, drug, or referral and when to withhold it.
