  notes: From the OSF project description and file list via API (README, data dictionary, changelog, license, code_data_v1.01.zip are public; zip not opened). Data and docs are CC BY 4.0, code MIT. Authors, institutions, and scenario authorship are not stated in what was read. Choosing Wisely recommendations are the evidence basis (assumed from the title; the campaign's country is not stated in the source). Record r_98f014590d is the Annals of Internal Medicine paper (doi 10.7326/annals-26-01667), whose abstract describes the same 225 scenarios (15 recommendations, 10 restraint plus 5 action each) and 4,050 responses from six commercial LLMs; only its abstract was read.
