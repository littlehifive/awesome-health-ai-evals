name: Mental health chatbot safety benchmark (Park et al.)
kind: benchmark
year: 2024
summary: 100 expert-reviewed mental health benchmark questions with ideal responses plus five 10-point guideline questions for rating chatbot safety, tested on a GPT-3.5-turbo chatbot and compared against LLM-judge, agentic, and embedding-similarity scoring.
