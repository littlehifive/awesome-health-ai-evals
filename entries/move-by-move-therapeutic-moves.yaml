id: move-by-move-therapeutic-moves
name: Therapeutic Moves ontology (Move by Move)
kind: eval_framework
year: 2026
summary: An ontology of ten therapeutic moves grounded in the MULTI-60 inventory, validated with five licensed psychologists and applied by an LLM judge to label how LLMs conduct psychotherapy in human counseling transcripts and simulated model-led sessions.
