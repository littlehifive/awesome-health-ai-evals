  notes: "Chinese-language README (read in translation). A personal repo that ships code and aggregate metrics only; the underlying datasets are not redistributed. The README warns that MentalManip and CBT-Bench are CC BY-NC, that PsySUICIDE needs a separate agreement for for-profit use, and that EATD and IMHI texts are sensitive, so the data are not open through this repo. Protocols for MDD-5k (ICD grouping) and CBT-Bench (top-1 hit) are defined by this suite, not the original papers. The repo shows no license. Borderline as a harness over existing benchmarks; kept as an evaluation framework."
