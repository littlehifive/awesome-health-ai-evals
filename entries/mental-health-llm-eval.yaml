summary: A zero-shot evaluation harness that runs an LLM over 19 tasks drawn from eight public mental-health benchmarks (CPsyExam, EmoBench, IMHI, PsySUICIDE, MentalManip, CBT-Bench, MDD-5k, EATD) and reports accuracy, F1 and confidence intervals.
