  notes: "Two settings, Specialist Turn and Board Simulation, judged by Qwen3.8-27B against reference responses with clinical-equivalence and conclusion-alignment rubrics (plus ROUGE-L and BERTScore); three M.D. experts audited the ground truth (447 QA pairs). Inputs include presentation slides with radiology and pathology images, so the benchmark is partly multimodal. Data release: the paper says the released data holds author annotations plus source URLs and timestamps, but no download link was seen, so open_data is unknown. Author affiliation countries were not visible in the HTML read. item_provenance uses real_user_queries as the closest value for real recorded clinician discussions."
