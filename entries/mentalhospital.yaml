  notes: "Items are standardized-patient simulations built from psychiatric EHRs, so the task is clinical-encounter evaluation of an LLM doctor, not EHR documentation. Access per Appendix C: environment code, scripts, rubrics, and MentalEval evaluator weights are to be released publicly; de-identified cases only through controlled research access (hence gated). No link was found in the text. The language of the cases is not stated. MentalEval is a set of five trained evaluators (QWK 0.944 with experts); 22 clinicians rated fidelity."
