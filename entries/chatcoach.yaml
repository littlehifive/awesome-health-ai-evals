  notes: Data and code are said to be at the GitHub repo; its contents were not inspected and no license was found. The test set was annotated by 2-3 medical professionals or knowledgeable students, who kept 291 of 500 conversations. Automatic metrics compare GPT-4-extracted terminology errors against the human annotations. The paper also proposes the ChatCoach system and GCoT prompting. Author institutions were not captured.
