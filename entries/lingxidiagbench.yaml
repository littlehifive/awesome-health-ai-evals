  notes: "Dataset license (CC-BY-NC-4.0) is from the Hugging Face card, which also carries an extra_gated_prompt license-agreement block, so open_data is set to gated even though the API reported the dataset as not gated; verify. The repository license field is not detected by GitHub, though the README badge says Apache 2.0. Whether the real LingxiDiag-Clinical data is released was not confirmed. The README says the paper was accepted to KDD 2026; the arXiv copy still carries placeholder ACM text. Two licensed psychiatrists reviewed samples of the synthetic data. Authors from EverMind AI and Shanghai Mental Health Center."
