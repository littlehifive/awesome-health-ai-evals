  notes: "Benchmark is released inside the EvoNote code repository (data/ folder, 1,200 rows); the GitHub repo has no license file and the paper only says released resources should follow platform policies under research-oriented access, so license is null. Images and videos are represented by supplied captions, not media. Scoring uses a human-validated hierarchical LLM utility judge, pairwise comparison against human notes, and a multi-gate helpfulness judge (GPT-4.1 prompts plus a Lingshu-7B classifier); the repo does not ship the paper-level evaluation code. Lead institution country (Singapore) inferred from the grant acknowledgements; I did not read the affiliations line."
