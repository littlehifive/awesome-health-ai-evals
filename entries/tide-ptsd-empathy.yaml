  notes: "Reference responses are from Claude 3.5 Sonnet, so scoring (cosine similarity to the reference) measures closeness to a frontier model, not to clinician answers; a licensed clinical psychologist co-designed the personas and reviewed the data. A human study with US participants rated perceived empathy on a 1-5 scale (lay raters, not clinicians). The dataset is also used for fine-tuning, so it is partly a training set. The Hugging Face dataset is auto-gated (card shows license cc-by-nc-4.0); the paper's data availability statement also states CC BY-NC 4.0. Rater country USA is from the paper's US participant regions."
