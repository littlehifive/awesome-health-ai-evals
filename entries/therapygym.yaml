  notes: "Fidelity uses the Cognitive Therapy Rating Scale (11 skills, 0-6) as an automated pipeline; safety is a multi-label scheme (e.g., failing to address harm or abuse). Also used as an RL training environment. The abstract says TherapyJudgeBench is released, but no download link, license or repository was found in the paper text or on the project site, so open_data is unknown. Therapists who labeled are co-authors; their country is not stated. Pass 2 should capture the CTRS and safety axes."
