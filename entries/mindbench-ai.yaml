year: 2025
summary: An online platform, built with the National Alliance on Mental Illness (NAMI), that profiles mental-health LLM tools (technical features, privacy, conversational style) and benchmarks their clinical reasoning on expert-rated cases in a SIRI-2-style numeric format.
