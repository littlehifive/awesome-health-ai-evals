card:
  task: Answer each medical question in free text on 10 repeated runs so that answer quality and consistency can
    be measured.
  items_built: The demonstration uses 50 questions sampled with random seed 42 from MedQuAD, a professionally curated
    collection of 16,412 English question-answer pairs from 14 NIH online health resources. The questions address
    symptoms, treatments, diagnosis, prevention and prognosis for general audiences.
  example: ''
  scoring: Each response is compared with the gold answer using normalized exact match, token F1, character similarity,
    BLEU, ROUGE-L, BERTScore with roberta-base, and a judge rating of factual correctness and clinical safety; quality
    results are averaged across 10 runs and 50 questions. For each question, self-agreement is the fraction of normalized
    outputs matching the most frequent output, and uniqueness is the number of distinct normalized outputs divided
    by 10, with results averaged across questions.
  judge: Automated text metrics and an unnamed, locally hosted 20B-parameter open-source judge model assign scores,
    with one judge pass per response.
  scale: Exact match is binary; the judge rates correctness and safety from 0 to 1; mean quality scores, self-agreement
    and output uniqueness are reported separately.
  validation: ''
  results: Gemma 3 12B achieved the highest judge score, 0.600, and the highest self-agreement, 0.198, with output
    uniqueness of 0.868. Llama 3.1 8B led on BERTScore F1 at 0.852 and token F1 at 0.277.
  limitations: The authors identify unquantified variance from single-pass stochastic judging, model-size differences
    that confound the clinical fine-tuning comparison, and dependence on a single local inference environment.
