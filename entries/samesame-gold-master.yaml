  notes: 'Added by hand on 2026-11-25 from the Global Health AI Benchmarks site, an initiative of The Agency Fund
    and Endless Health, so it has no screening record. Facts come from the benchmark''s page on that site and the
    team''s report PDF. The site says the complete datasets stay with each organisation. The Gold Master is data/knowledge_base.json
    in the public GitHub repository (seen on 2026-11-25), so open_data is open. The code is GPL-3.0; the report
    says a Creative Commons licence for the dataset is still being finalised, so license is null. The benchmarks
    index gives 824 messages and the benchmark page 1,359 as of August 2026; the set grows. The repository README
    groups levels into bands differently from the site (3 as moderate, 4 and 5 as high, 6 to 8 as critical); the
    site''s bands are used here. The repository also has an optional LLM judge for safety and communication quality
    of responses, which the site''s results do not use. The site calls the added messages generated and the report
    calls them synthetic; llm_generated is the nearest code. Scope: this tests risk classification of user messages,
    not answers. Lead institution and rater countries are taken from the statement that the Gold Master was built
    in South Africa.'
