  notes: "medRxiv preprint. Cases are structured clinical features (vitals, rapid tests, labs, exposures) from the Sentinel initiative's partner clinics, described to LLMs as tabular data or summaries; LLMs are compared with random forest and XGBoost. The paper says the dataset will be released after de-identification and governance review (open_data recorded as closed for now); an evaluation harness is released, and variable details are archived on Zenodo 10.5281/zenodo.17065617. Item language is not stated (English assumed). The count is derived from the paper's group sizes. Lead institution countries are from the Broad Institute and Redeemer's University affiliations seen in the author list."
