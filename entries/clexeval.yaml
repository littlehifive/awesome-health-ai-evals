summary: A human-in-the-loop framework that tests LLM clinical reasoning on rare diagnostic cases under four levels of progressive information masking, with 200 reasoning traces from 40 cases scored by 5,600 expert annotations (RARECASE-2000 holds all 500 cases at 4 levels).
