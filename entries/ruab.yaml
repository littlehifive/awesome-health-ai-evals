  scale: Safety-detection recall.
  validation: ''
  results: Across seven models from OpenAI, Anthropic, and xAI, safety detection consistently degraded on Roman
    Urdu inputs, with particularly pronounced drops for passive suicidal ideation. Instruction-tuned and reasoning-capable
    models showed improved robustness.
