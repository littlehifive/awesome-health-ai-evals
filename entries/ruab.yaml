card:
  task: Detect whether each English, mixed Roman Urdu, or purely transliterated Roman Urdu input contains safety-relevant
    intent.
  items_built: The authors created 400 distinct safety-relevant intents, each expressed in three semantically aligned
    language variants, yielding 1,200 inputs across passive suicidal ideation, psychological distress, threat or
    intimidation, and coercion or emotional manipulation. Three bilingual Urdu-English speakers reviewed the items.
  example: ''
  scoring: Models are evaluated using recall-based safety metrics.
