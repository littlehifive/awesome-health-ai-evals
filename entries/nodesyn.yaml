  notes: "The paper is mainly a data-generation methodology (taxonomy generator plus evidence grounding); the benchmark part is the Medical Advice and Self-Harm datasets, which the repo ships as CSVs (paper/ and prototype/). The abstract and repo README use NodeSyn; the arXiv text uses NodeSynth. Rubrics: a three-tier Refusal and Disclosure rubric for medical advice and a three-tier safety rubric for self-harm, applied by a Gemini auto-rater (validated against humans per the abstract). Apache-2.0 is the repository license, not a dataset-specific license. Dataset row counts were not read. A human should check whether this belongs as a benchmark or as an evaluation framework."
