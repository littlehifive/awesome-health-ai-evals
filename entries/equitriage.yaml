  notes: "The paper calls EQUITRIAGE a fairness audit framework; it is a one-off audit that may not be intended as a reusable benchmark. The arXiv page says code and analysis scripts will be available upon publication, and the underlying data is PhysioNet credentialed access (MIMIC); no release of the vignettes themselves was seen, so open_data is unknown. Hypotheses and thresholds were pre-registered. Human-triage ground truth is the MIMIC ESI label."
