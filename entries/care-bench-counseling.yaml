id: care-bench-counseling
name: CARE-Bench (psychological counseling)
kind: benchmark
year: 2025
summary: 500 simulated client profiles built from real Chinese counseling cases and played by an LLM under psychologist-written principles, used to test counselor LLMs over multi-turn dialogue scored by three psychological scales (WAI, BLRI, CCS-R).
