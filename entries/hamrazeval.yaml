summary: A two-part LLM-judge framework for Persian person-centered-therapy dialogues, scoring six general conversation metrics (1 to 10) and a 12-item mini Barrett-Lennard Relationship Inventory for therapist empathy, positive regard, and congruence, introduced with the HamRaz dataset.
