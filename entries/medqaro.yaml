  notes: "Questions are physician-written and paraphrased, answered against real patient epicrises (binary, extractive, and reasoning questions). Scored with F1, exact match, BLEU, and METEOR; four 7B-8B LLMs were tested zero-shot and fine-tuned. The dataset is hosted on a Proton Drive link given in the GitHub README (no approval step seen). The model is read as clinician-facing: it answers questions about a patient record, not open consumer questions. Rater country is taken from the physician co-authors' Bucharest affiliations."
