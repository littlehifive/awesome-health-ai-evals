  notes: "Reconsidered after exclusion as not_found. Cards are empty schemas (question, options, answer; one train split). Sample questions cover oncology and paraneoplastic syndromes. The sets appear to be reproductions of the YourBench paper's generated benchmarks for a health domain, each from a different generator model (names say DeepSeek-R1, Gemini-3 mini or similar, o4-mini), but the cards do not say so. A fourth set, yourbench/reproduction_qwen235b_health (r_6c06abf7e5), was not part of this review. Source documents, license, and size of the g3_mini and o4mini sets not checked."
