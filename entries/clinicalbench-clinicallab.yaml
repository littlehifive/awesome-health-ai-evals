  notes: "The paper (NeurIPS 2025 Datasets and Benchmarks, per the DOI record) also proposes the ClinicalAgent method. Data are released only on application: users must sign the ClinicalBench Usage and Data Distribution License Agreement; the code is Apache-2.0. Cases were selected and reviewed by three senior clinicians and two AI researchers (all paper authors). Metrics include BLEU, ROUGE, BERTScore, department-routing accuracy, and a double-blind expert grading of 20 sampled cases. Author affiliations were not shown in the extracted text (work supported by Alibaba Group), so builder type and lead country are inferred from that."
