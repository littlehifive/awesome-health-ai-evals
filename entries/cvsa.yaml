card:
  task: Give short written answers to open-ended otolaryngology and head and neck surgery board examination questions.
  items_built: CVSA was developed from established assessment tools, including ACI, to assess open-ended clinical
    answers. Its initial evaluation used 21 past examination questions with model answers from the Royal College's
    official sample exam, reviewed by specialty educational leads; random spot checks checked that the content was
    not indexed online.
  example: ''
  scoring: Physicians assess whether explanations are relevant and internally consistent, classify factual validity
    against accepted evidence and specialist opinion, and flag potentially harmful statements. Accuracy points follow
    the answer key and are summed across questions, with the total reported as a percentage of 34 available points.
  judge: Two physicians, Cai Long and Alaa Alanazi, scored independently, and a third physician, David Cote, resolved
    major discrepancies.
  scale: Concordant or discordant; six validity categories; safety flags; answer-key points totaling 34, reported
    as a percentage.
  validation: ''
  results: ChatGPT-4 scored highest with an OHNS-specific prompt at 75.0%, compared with 69.1% without prompting
    and 72.1% on regenerated prompted answers. The stated examination pass threshold was 70%.
  limitations: The authors identify hallucinations as a potential patient safety risk and verbosity as a barrier
    to practical use.
  sources:
