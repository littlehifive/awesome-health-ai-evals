  notes: "Mostly a fine-tuning dataset; the evaluation part is a 200-question counseling set scored with 7 metrics by GPT-4 Turbo and Gemini Pro judges, which the paper says it curated (the HF card describes only the training data). The interview half was paraphrased and summarized with Mistral-7B and the synthetic half generated with GPT-3.5 Turbo, so both halves are model-written text. The paper links its code to ChiaPatricia/MentalChat16K; the screening record points to PennShenLab/MentalChat16K, which is listed. License is from the HF card. Kept as a benchmark because the paper presents it as one and includes an evaluation set."
