card:
  task: Write a helpful, empathetic counseling response to each user's description of a mental health concern.
  items_built: The authors curated 200 evaluation questions from Reddit and the Mental Health Forum to cover real-world
    counseling inquiries. The separate training data contains GPT-3.5 Turbo-generated conversations and interview
    transcripts paraphrased and summarized by Mistral-7B-Instruct-v0.2.
  example: ''
  scoring: GPT-4 Turbo and Gemini Pro 1.0 rate each response on seven counseling criteria and explain their ratings;
    the reported overall average combines all seven criteria from both judges, totaling 14 scores. Human evaluators
    separately rank seven model responses per question, and each model's ranks are averaged across 50 randomly sampled
    questions.
  judge: GPT-4 Turbo and Gemini Pro 1.0 assign ratings; one senior postdoc and three master's students with computer
    science and medical sciences expertise assign human rankings.
  scale: 'LLM ratings: 1 to 10 per criterion, averaged across seven criteria and two judges; human rankings: 1 (best)
    to 7 (worst), averaged across 50 questions.'
  validation: Four human evaluators ranked seven models' responses to 30 randomly selected questions, yielding a
    reported Cohen's kappa of 0.441. The authors report that human preferences were consistent with the LLM evaluations,
    without a numerical human-LLM agreement measure.
  score_meaning: Higher LLM ratings indicate better response quality on the counseling criteria.
  annotation_process: For statistical testing, the authors randomly selected 50 questions and ran five rounds of
    response generation for both base and fine-tuned models, with GPT-4 Turbo and Gemini Pro evaluating the outputs.
    The 50 questions used for human rankings were sampled with a fixed random seed of 42.
  results: ''
  limitations: The authors state that anonymization and splitting interviews into question-answer pairs can remove
    context, paraphrasing can introduce deviations or hallucinations, and automated ratings and subjective human
    rankings may miss real-world counseling effectiveness.
