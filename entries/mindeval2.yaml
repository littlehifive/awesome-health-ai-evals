id: mindeval2
name: MindEval2
kind: benchmark
year: 2026
summary: Longitudinal mental-health support benchmark with 50 synthetic members over 3 sessions each (shared memory across sessions), a tool-using patient simulator (MindSim), and psychologist-built rubrics (MHQR, 14 issues in six families) that an LLM judge applies to every counsellor turn.
