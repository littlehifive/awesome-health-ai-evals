  notes: "Successor to MindEval by the same Sword Health team, with NVIDIA, Instituto Superior Tecnico and Yale affiliations listed; scores are not comparable with MindEval 1. Clinical psychologists annotated counsellor turns to validate LLM judges. The paper says code, prompts, benchmark profiles and annotations are on the GitHub repo (profiles in data/profiles.jsonl); the repo license is Apache-2.0. The first author's affiliation country is not stated, so lead_institution_countries rests on the shared Portuguese affiliation. Read mostly the abstract, introduction, and the README rather than the whole 47-page paper."
