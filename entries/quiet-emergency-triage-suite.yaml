  notes: "Authors are from Certuma (USA), which sells the MedCanon runtime discussed in the paper; the study tests a governance prompt, not the runtime. The abstract says the apparatus was released as an open evaluation suite, but the data availability statement says all data are available on reasonable request, and no repository link was found in the text, so open_data is unknown. Ground truth tiers (EMERGENCY, URGENT, ROUTINE) come from LLM-simulated physician panels, a cross-family Gemini panel, and guideline anchors; no human adjudication. The suite has no official name; the id is descriptive."
