id: emoagent
name: EmoAgent
kind: eval_framework
year: 2025
summary: A multi-agent framework (EmoEval) that simulates users with depression, delusion, or psychosis chatting with character-based AI chatbots and measures changes in PHQ-9, PDI, and PANSS scores, paired with a mitigation module (EmoGuard).
