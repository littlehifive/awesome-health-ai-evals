  notes: "r_df0e0cdb68 is the French CORIA/TALN 2026 paper (HAL, CC BY 4.0), by Inria ALMAnaCH authors; r_d51718e8f4 is the tabib-eval GitHub repo (MIT) by the first author, an Inspect AI harness with three simulated worlds (hospital pharmacy, consultation, companion) using PARHAF synthetic patient reports and the ANSM thesaurus, merged here as the same project. The paper cites a repo named tabib-benchmark that returned 404; tabib-eval is the repo found. The cross-lingual protocol (B4) uses a second language not named in the parts read, so only French is listed. Paper tested seven local open-weight models of 2B to 9B parameters. Data (ANSM thesaurus) is redistributed under terms in the repo's DATA.md, not checked."
