  notes: "Read the Hugging Face dataset card and the arXiv abstract (which confirms the HF release and WWW 2026 acceptance); it states no license and names the paper as Mind the Ambiguity (WWW 2026). The arXiv ID 2601.17284 was matched by exact title and is not cited on the card. Sample rows viewed through the Hugging Face datasets server are English. Vague versions are generated by controlled rewriting; the paper's validation protocol was not read. Source exam sets are US and Indian exams (MedQA, MedMCQA) per their own entries."
