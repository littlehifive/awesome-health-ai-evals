card:
  task: Answer each simulated patient's urology question using the supplied clinical context, giving a diagnosis
    and recommended medical examinations.
  items_built: In collaboration with Shanghai Renji Hospital's urology department, the authors used LLMs such as
    GPT-3.5 to generate 2,132 QA pairs from structured virtual-patient conversations and clinical reports, adding
    reference contexts from guidelines, textbooks, PubMed literature and clinical experience. A clinical annotation
    team and the hospital's urology expert panel conducted a three-tier review of terminology, question-answer coherence,
    context relevance, supporting evidence, reasoning and diagnostic accuracy.
  example: ''
  scoring: Diagnosis and advice are compared with the ground truth using precision, recall and F1, with a final
    accuracy score weighted two-thirds for diagnosis and one-third for advice. Rouge-L measures overall response
    overlap with the reference answer using the longest common subsequence.
  judge: Automated F1 and Rouge-L calculations assign the scores.
  scale: F1 and Rouge-L range from 0 to 1; total F1 weights diagnosis two-thirds and advice one-third.
  validation: ''
  results: ChatGLM3-6B achieved the highest total F1, 0.346374, with diagnosis F1 of 0.500212 and advice F1 of 0.038699.
    GPT-3.5 achieved the highest Rouge-L, 0.233997.
  limitations: ''
