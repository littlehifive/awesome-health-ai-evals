  notes: "The paper also introduces ClinDiag-Framework (AutoGen doctor agent plus provider agent that answers only from the case record) and trains ClinDiag-GPT; only the benchmark and framework are catalogued. Diagnostic accuracy and some procedure metrics are judged by an LLM; six reader-rated metrics (gather completeness, reasoning accuracy, etc.) plus BLEU, ROUGE-L, BERTScore are reported. Item language is not stated explicitly; English is inferred from the MIMIC and case-report sources. The reference list cites a Zenodo deposit (10.5281/zenodo.18159952) and the text says framework code is on GitHub, but no data-availability statement or license was found in the text I read, so open_data is unknown and the GitHub link is not recorded."
