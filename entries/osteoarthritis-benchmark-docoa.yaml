  notes: "Item counts are from the paper and the GitHub README; the repository holds the four JSON files, prompts, test notebooks, and raw outputs, and its license is Apache-2.0 (from repository metadata). Whether objective accuracy is scored by exact match or an LLM is not clear from the parts I read; eval_methods lists only the human evaluation. Item language is English by inspection of the MOQA file; rater countries are inferred from the Sichuan University ethics approval and not stated explicitly. The paper also builds DocOA, an RAG assistant, which is a method and not part of the benchmark."
