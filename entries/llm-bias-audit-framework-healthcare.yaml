id: llm-bias-audit-framework-healthcare
name: Framework for bias evaluation of LLMs in healthcare
kind: eval_framework
year: 2025
summary: A five-step audit framework for hospitals to test clinical LLM outputs for accuracy and bias, from stakeholder engagement and synthetic-patient calibration to vignette-based experimental audits, with an example chronic kidney disease audit.
