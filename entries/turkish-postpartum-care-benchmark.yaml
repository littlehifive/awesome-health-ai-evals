  notes: "Read the Zenodo record and the deposit's README, LICENSE-DATA.txt, and gold_test_set.jsonl (CC BY 4.0 for data). The companion manuscript was not read, so the test-set size (21 lines in the jsonl) and how items were written are not confirmed from the paper. Primary metric is objective accuracy against must_include_any and must_exclude string criteria, with a dual-LLM-judge as secondary. The deposit is mainly a study data-availability record; a human may want to decide whether a 21-item set counts as a benchmark. Authors are at Aydin Adnan Menderes University (Turkey)."
