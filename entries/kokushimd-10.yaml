  notes: "Professions are medicine, dentistry, nursing, pharmacy, physical therapy, occupational therapy, public health nursing, midwifery, radiological technology, and optometry. Question types are single answer, multiple choice, numerical calculation, and blank. A multimodal split exists; the modality field lists text because that is the in-scope part. The 11,588 count comes from the screening record and was not re-checked in the paper text. The paper was read via its paperclip copy; the Hugging Face card gives the MIT license and the JA, EN, and mixed splits. First-author affiliation was not checked, so lead_institution_countries is taken from the author list (Kyoto, HKUST, XJTLU, Tokyo)."
