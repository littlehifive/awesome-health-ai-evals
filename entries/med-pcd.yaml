  notes: Based on the Hugging Face dataset card. It is the medical dataset of the Privacy-R1 paper (card says ACL 2026; arXiv 2510.16054 not read). Metrics are Privacy Leakage (fraction of PII units exposed to the remote model) and Quality Preservation against an LLM-generated gold response; how quality is scored was not checked. The task is about PII handling in multi-LLM pipelines rather than health content. Lead institution countries not determined.
