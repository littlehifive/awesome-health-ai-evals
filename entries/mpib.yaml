  notes: "Read the construction, artifact and judge sections. The public Hugging Face release is gated (auto approval per the hub API) and redacts payload strings in the indirect-injection items; unredacted payloads need controlled access. Licence from the hub tag. Instances are normalized from MedQA and PubMedQA, then attacks and poisoned documents are generated with an LLM (Qwen-2.5-72B-Instruct is used for scenario modeling and judging). The judge is selected against a 300-item set with human expert-validated labels."
