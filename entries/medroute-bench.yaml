  notes: "Only the Hugging Face card was read; no paper. It tests routing and refusal decisions (expected_route label per prompt, scored as route accuracy) and does not measure answer quality. Prompts were hand-written by the authors, and the largest split (2,353) was template-generated; the card lists Hinglish as a category (91 prompts). Built to evaluate the authors' own MedAssist system, and the card says the first split was used to tune it, so it is not an unbiased score. Self-harm and violence prompts are deliberately excluded."
