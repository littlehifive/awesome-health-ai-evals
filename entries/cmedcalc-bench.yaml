  notes: "Borderline scope: inputs are patient notes (EHR-like) but the task is clinician-facing medical calculation, so kept. Data are in the GitHub repo; the repo shows no license (GitHub API reports none); README says the benchmark data and evaluation toolkit are released. Three physicians verified cases; GPT-4o helped write rationales and judges chain-of-thought outputs. item_provenance real_user_queries is a loose fit: notes came from online platforms, which the paper does not name in the parts read. Authors at Tencent Jarvis Lab."
