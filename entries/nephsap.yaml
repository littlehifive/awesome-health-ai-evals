  notes: "The arXiv preprint (r_cb52faf113, with the Hugging Face dataset) and the NEJM AI paper (r_db241814e6) are the same study. Answers are scored by accuracy against the key; open-source models' explanations are also scored with word error rate, BLEU, and cosine similarity against ground-truth explanations. The Apache-2.0 license is from the Hugging Face card; the paper has no data-availability or license statement, and the questions originate from ASN's nephSAP, so the card license may not cover the underlying question text. The NEJM AI version was not read; its text was taken from the abstract only."
