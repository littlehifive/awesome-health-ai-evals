id: score-llm-evaluation
name: S.C.O.R.E.
kind: eval_framework
year: 2024
summary: A qualitative clinician-grading framework for health LLM outputs on five aspects (Safety, Consensus, Objectivity, Reproducibility, Explainability), later applied as a 3-point SCORE rubric to rate medication-enquiry answers from fine-tuned small LLMs.
