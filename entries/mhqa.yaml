  notes: "GPT-4o-mini turns abstracts into QA pairs, with post-hoc validation; question types are factoid, diagnostic, prognostic, and preventive. The paper says code and data are released at github.com/joshiprashanthd/mhqa, but that URL returned 404 on check, and no Hugging Face dataset for it was found, so open_data is unknown and no license was seen. The paper gives the pseudo-labeled count as about 56.1k in the abstract and 58.6k in the intro (the latter probably includes gold). Who verified the gold set is not stated in the parts read."
