  notes: "The repo holds bilingual case descriptions, simulated-patient rules, and scoring criteria. Its README says no reuse license is specified, so license is null. Scoring is by one board-certified neurosurgeon who also plays the patient, so there is a single rater. Eighteen models were evaluated in October 2025 and June 2026. Placed under safety because of the critical-mistake threshold, though it is also a clinical conversation benchmark. Lead country is from the author affiliations (Kagoshima, Japan)."
