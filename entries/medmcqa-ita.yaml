  notes: "The source paper is a model paper (Igea); MedMCQA-ITA is described there as an additional contribution. The paper says 12.5% of train and 47% of the evaluation set were discarded for translation errors, leaving about 169 thousand pairs, but the card shows the full split sizes, so the released size is unclear. The card states no license (the MedMCQA source is MIT). Author affiliations were not read."
