card:
  task: Answer Brazilian Portuguese questions about public health facilities, services, programs, and community
    impacts in named locations in Brazil's Federal District using SES-DF news articles.
  items_built: Claude Haiku 4.5 generated 933 question-answer pairs from SES-DF news articles, using Portuguese
    prompts designed with guidance from a public health expert to reflect inquiries from researchers, managers,
    and citizens. Filtering discarded empty questions or answers and required a source-article location name in
    each question through case-insensitive substring matching; 283 pairs failed the location check, leaving 650
    pairs split into 500 test and 150 validation items.
  example: Qual unidade de saúde da Asa Norte promoveu uma manhã de ações preventivas com testagem para HIV e ISTs
    em dezembro?
