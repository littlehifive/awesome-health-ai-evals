  notes: "Built from the dataset card only. The card cites a 2026 IJCAI-ECAI workshop paper (Borges et al., 'Integrating Large Language Models and Geospatial Data for Territory-Aware Public Health Surveillance') that I did not read. The card gives reference answers but no scoring method, so eval_methods automatic_metric is a placeholder to verify. Questions were required to name a location; 283 of 933 generated pairs were dropped on that check. Questions are LLM-generated, with prompt design guided by a public health expert."
