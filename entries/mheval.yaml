  notes: "Wrapper around existing benchmarks, each pinned to a commit and run from its original repo; it releases no new items. Created in September 2026 by slingshot-ai (country and organization type not stated in the README). The MIT license is the harness's own and does not cover the wrapped datasets. The README lists nine named benchmarks across the quality and safety tables. Borderline as a harness; kept as an evaluation framework."
