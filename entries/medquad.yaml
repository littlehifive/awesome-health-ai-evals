  notes: "Released with a question-entailment QA system; the test collection judges retrieved answers on the LiveQA scale (1 Incorrect to 4 Excellent). The GitHub README states no license (GitHub reports none) and says answers were removed from three MedlinePlus subsets for copyright, keeping URLs. Widely reused, including in LLM work (see gl-medquad, a Galician translation, and a stray Hugging Face rewrite set excluded as training data). Pre-LLM benchmark kept because of active reuse."
