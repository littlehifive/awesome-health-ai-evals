  notes: "Half of the dataset is climate change, which is out of health scope; only the mental-health part is relevant. The paper is mainly an evaluation study of ChatGPT, Bing Chat, and Bard (now Gemini); the released files are the true/false sets, the prompt sets, and expert assessment files. Quantitative scoring uses precision, recall, and confusion matrices; qualitative scoring uses domain-expert interviews and questionnaires (14 respondents across both domains). The repo license is GPL-3.0 but its README footer says All Rights Reserved; the paper is CC-BY. The repo tree was listed, but the question files were not opened. Lead institution is MBZUAI (first and last author)."
