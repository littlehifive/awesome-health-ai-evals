id: multi-tier-suicide-risk-rubric
name: Multi-Tier Rubric for Suicide-Risk State Transitions in Conversational AI
kind: eval_framework
year: 2026
summary: A methodology for scoring whether conversational AI recognizes clinically meaningful state transitions in multi-turn suicide-risk dialogue, using stage-aware scripted scenarios with per-turn reference annotations, a three-tier rubric, a deterministic Mechanical Severity Score, and blinded expert review.
