card:
  task: Answer a physician's point-of-care clinical question to support clinical decision-making.
  items_built: OpenEvidence sampled 3,600 physician queries across 36 specialties from June 7-14, 2026, excluding
    non-English and non-clinical decision-support questions and splitting sampling equally between queries with
    and without patient context. Claude Opus 4.6 lightly rewrote queries to remove identifiable information while
    retaining clinical content; the final set contains 620 questions across 30 specialties that received at least
    one physician rating.
  example: ''
  scoring: Physicians compare blinded, randomly ordered answer pairs independently on accuracy, clinical utility,
    source quality, verifiability and completeness using five preference options. For each dimension, a system's
    one-vs-rest win difference is its percentage of wins minus its percentage of losses across comparisons with
    other systems; the primary analysis uses text-only answers and excludes ratings completed in under 10 seconds.
  judge: 149 licensed, actively practicing U.S. physicians matched by specialty assign the primary ratings; GPT-5.5,
    Gemini 3.1 Pro and Claude Opus 4.8 provide parallel automated ratings.
  scale: Five-point pairwise preference scale from A much better to B much better, including a tie; final win difference
    in percentage points per dimension.
  validation: Physician agreement within one Likert unit was 74.1%-76.9% across dimensions; quadratic-weighted Cohen's
    kappa was 0.23-0.38 except for verifiability at 0.09. Average Kendall's tau with human rankings was −0.200 for
    GPT-5.5, 0.467 for Gemini 3.1 Pro, 0.267 for Claude Opus 4.8 and −0.067 for the model jury.
  results: OpenEvidence ranked highest on all five dimensions, with primary-analysis win differences of 25-39 percentage
    points, all with p < 0.001.
  limitations: The authors note single-week sampling from one platform, OpenEvidence's role in data collection,
    participation bias, incomplete reconstruction of clinical context, limited prompt engineering, changing model
    versions, and insufficient data for precise specialty-level estimates.
