  notes: "Dataset card only. Fully synthetic and template-generated by a 'synthetic_generation_pipeline_v1'; not clinically reviewed; one split, no train/test division. The card suggests classification-style evaluation (predict condition, urgency, or hallucination risk) and RAG or hallucination-detection testing, so eval_methods is an inference. The card lists four languages in the schema, but the example queries read as English; the language mix was not verified. Seven conditions (malaria, typhoid, hypertension, diabetes, asthma, migraine, food poisoning). Very low diversity; a human may want to drop this entry as a toy dataset."
