  notes: "The paper says the dataset and benchmark are public at the MedQDx GitHub repository; the repo has no license field visible through the API, so license is null. Metrics are zero-shot diagnostic accuracy, mean questions to correct diagnosis (cap of five), and BERTScore-based sequence efficiency against GPT-4.1-generated reference questions. Reference question sequences are LLM-generated, not clinician-written. r_c4504729db is a Crossref record titled 'Asking the Right Questions: Evaluating Diagnostic Dialogue with Q4Dx' (no URL), merged here as a duplicate of the same work."
