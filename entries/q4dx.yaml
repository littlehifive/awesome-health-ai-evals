card:
  task: Diagnose a patient from an initial description, asking a simulated patient up to five follow-up questions
    when information is incomplete and updating the diagnosis after each answer.
  items_built: The authors randomly sampled 100 disease-symptom pairings from SDPD and used GPT-4o-mini to generate
    patient narratives at three disclosure levels, checking symptom reduction with Jaccard similarity. GPT-4.1 generated
    reference question sequences through dialogues with a GPT-4o-mini patient that had access to the complete symptom
    set.
  example: ''
  scoring: ZDA is the percentage of initial top-ranked diagnoses that exactly match the case diagnosis from a predefined
    list; MQD averages the questions needed to first reach the correct diagnosis, assigning five to failures. ISE
    aligns model questions with GPT-4.1 reference questions to maximize cumulative BERTScore similarity, penalizing
    extra or missing questions.
  judge: Automated diagnosis matching and BERTScore-based sequence alignment assign scores against case labels and
    GPT-4.1-generated reference questions.
  scale: 'ZDA: percentage correct; MQD: mean question count capped at five; ISE: BERTScore-based sequence similarity.'
  validation: ''
  results: GPT-4.1 achieved 51% zero-shot diagnostic accuracy with full symptom disclosure and a mean of 2.4 questions
    to reach the correct diagnosis. The reported mean maximum question similarity across rounds was 0.657.
  limitations: The authors state that reference questioning sequences are LLM-generated rather than clinician-authored
    and support relative model comparison rather than establishing clinically optimal questioning.
