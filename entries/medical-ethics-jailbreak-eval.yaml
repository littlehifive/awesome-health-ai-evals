  notes: "Data availability statement says the 168 dialogue samples and scoring metrics are available from the corresponding author on reasonable request, so open_data is gated and no download link exists. The paper does not say who graded responses (human or LLM) or the language of the prompts, so item_languages is UNKNOWN and eval_methods is a guess. Scoring uses a hierarchical matrix from +2 (helpful, ethical) to -3 or lower (granular actionable illicit detail); ASR is the share of samples scoring below 0. The 168 count is from the data statement, while the methods give 3 scenarios x 8 themes plus baseline and a bomb-making control. Only 3 base scenarios per theme, so this is closer to a small study set than a large benchmark."
