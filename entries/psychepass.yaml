summary: A counseling-competence evaluation in which LLM therapists talk to 100 scripted simulated clients through five single-session-therapy stages that probe 12 competency dimensions, then are ranked by pairwise LLM-judged battles in a Swiss-system tournament with Elo ratings; tested on 12 LLMs.
