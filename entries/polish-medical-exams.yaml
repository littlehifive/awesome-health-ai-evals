  notes: "Questions were scraped from the Medical Examination Center (cem.edu.pl) pages; the Hugging Face cards say the authors do not own the rights and give no license (the card tags only language and task), so license is null. English LEK and LDEK versions were translated by medical experts at the exam center, not machine-translated. Questions with images and outdated questions were excluded. Compares LLMs with human examinee scores. Record r_9e55b9670c (arXiv 2405.01589, GPT-4 on 297 PES exams from 2018-2020 published by the Polish Supreme Medical Chamber) is an earlier study of the PES portion, merged here; it gives no separate dataset link and is not by a different benchmark."
