summary: 203 base mental healthcare decision-making questions (diagnosis, treatment, monitoring, triage, documentation) written by US psychiatrists, with expert preference ratings that capture ambiguity and patient-demographic variants for testing fairness, scored on multiple-choice and free-form consistency.
