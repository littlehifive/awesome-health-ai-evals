  notes: "The record title is 'Moving Beyond Medical Exams: A Clinician-Annotated Fairness Dataset of Real-World Tasks and Ambiguity in Mental Healthcare'; the dataset is named MENTAT. Triage and documentation questions have expert ratings (657 annotations from eight annotators on 57 questions) used to build preference scores; other questions use the question designer's intended answer. Free-form evaluation reuses earlier consistency code. License MIT is from the GitHub repository and the paper's availability statement. The record's year of 2026 is the venue year; first preprint was February 2025. Lead institution country is inferred from the clinicians' US practice, not from a stated affiliation list."
