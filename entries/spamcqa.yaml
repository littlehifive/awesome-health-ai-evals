  notes: "Merged with the 2023 Research Square preprint of the same protocol (doi 10.21203/rs.3.rs-3625354/v1, 122 questions at that stage) and the EULAR 2024 abstract (POS0495). A JMIR Research Protocols paper, so the benchmark is described but the results come later. The abstract says it will be released; the full text says data are available from the corresponding author on reasonable request, hence gated. I found no public link. The protocol also uses CMB-style metrics for open-ended answers, which I did not check in detail. Co-authors include a company (Dataa Robotics)."
