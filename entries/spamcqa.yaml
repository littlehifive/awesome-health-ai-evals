  notes: "Merged two records: the EULAR 2024 conference abstract (POS0495, Annals of the Rheumatic Diseases) and the Research Square study protocol (2023). Only abstracts and the preprint landing page were read; no dataset link, license, or access statement was seen. The protocol also plans fine-tuning a model (SpARobotGPT) on 80,000+ hospital cases and a Safety, Usability, and Smoothness (SUS) metric for generated answers, which are not part of the MCQ benchmark. Builder types include Dataa Robotics Co., Ltd. alongside the hospital and a university. The year is from the preprint; venue is preprint because the protocol is unreviewed and the conference abstract is an abstract only."
