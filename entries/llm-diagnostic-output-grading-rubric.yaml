id: llm-diagnostic-output-grading-rubric
name: LLM diagnostic output grading rubric (NEJM cases)
kind: eval_framework
year: 2024
summary: A grading rubric for LLM diagnostic outputs (correct diagnosis, differentials, hallucination, readability, explainability, incorrect statements, risk), tested on 10 NEJM case-series cases and 3 chatbots with 10 physician raters.
