  notes: "The paper says the Portuguese benchmark tool is available to the scientific community and that the exam questions are freely available online, but gives no repository link, so open_data is unknown. Single-letter answers are compared directly; free-text answers are classified by GPT-4 and Claude Opus (items without agreement were dropped). Models that gave incoherent output scored zero. A separate, larger Revalida/Enare set from a different team is in healthqa-br."
