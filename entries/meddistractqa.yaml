card:
  task: Choose the correct answer to each USMLE-style multiple-choice question while ignoring an embedded clinically
    irrelevant statement.
  items_built: Krithik Vishwanath developed the benchmark from MedQA questions, using GPT-4o to generate a unique
    distracting statement from clinical terms in a randomly selected incorrect answer choice. The statements use
    medical terms nonliterally or attribute medical details to an unrelated third party, and are inserted into the
    original questions.
  example: '"The patient''s zodiac sign is Cancer"'
  scoring: String-based matching on the model's chain-of-thought output determines whether its answer matches the
    correct answer. Accuracy is the fraction of questions answered correctly, and the change from baseline MedQA
    accuracy is reported in percentage points.
  judge: String-based matching against the correct answer assigns scores.
  scale: Correct or incorrect per question; percentage accuracy and percentage-point change from baseline MedQA.
  validation: ''
  results: ''
  limitations: The authors state that MedQA multiple-choice questions do not cover the full range of clinical reasoning,
    distractions generated by one LLM may not capture real clinical discourse, and the correlation between baseline
    accuracy and robustness does not establish causality.
