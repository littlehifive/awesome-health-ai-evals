id: cvsc
name: CVSC (Concordance, Validity, Safety, Competency)
kind: eval_framework
year: 2023
summary: A scoring model (maximum 34 points) for open-ended medical board answers from LLMs, rating concordance, validity (hallucination), safety and competency; applied to 21 Royal College otolaryngology sample questions.
