  notes: "Single-author paper from Mashhad University of Medical Sciences. Adversarial queries were generated with Claude 3.5 Sonnet. Scoring is rule-based (hedging phrases, referral language, emergency cues, definitive-diagnosis penalty), not a judge model. Only Llama-3.3-70B and Llama-3.1-8B were evaluated. The GitHub repo (no license) holds code and appendix files (Appendix1_mentalchat_filtered.jsonl, a name that does not match the paper's description); whether the 300-query file itself is there was not confirmed, so open_data should be checked. A later, larger benchmark, pediatric-safety-bench-v2, is a separate entry."
