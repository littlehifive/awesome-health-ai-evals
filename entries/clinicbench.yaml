  notes: "Also published as 'Large Language Models in the Clinic: A Comprehensive Benchmark'. Eleven of the 17 datasets are existing ones (MedQA, MedMCQA, MMLU-Med, PubMedQA, MIMIC-CXR and IU-Xray summarization, NER, RE, document classification); the six new ones are Referral QA (1,057, GPT-4-generated QA from MIMIC-IV referral letters, expert-filtered), Treatment Recommendation (796, from ChatDoctor), Hospitalization Summarization (382), Patient Education (181), and Pharmacology QA and Drug Interaction for emerging drugs (213 and 200). Several tasks are imaging-report or biomedical NLP and fall outside this catalog's scope, but the benchmark is kept as one entry. Lead institution is the University of Oxford with Amazon co-authors; the human evaluation covers factuality, completeness, preference and safety. Rater countries are not stated. The new datasets inherit MIMIC data-use terms; the Apache-2.0 license is the GitHub repo's."
