card:
  task: Answer medical questions, recommend treatments, summarize clinical documents, write patient education, or
    extract and classify medical information, according to each item's task.
  items_built: The authors combined eleven existing datasets with six new datasets, including 1,057 referral questions
    generated by GPT-4 from MIMIC-IV referral letters and filtered by experts, and 796 treatment recommendation
    items from ChatDoctor. The other new datasets contain 382 hospitalization summarization items, 181 patient education
    items, 213 emerging-drug pharmacology questions, and 200 drug interaction items.
  example: '"Which of the following conditions does not show multifactorial inheritance? (A) Pyloric stenosis (B)
    Schizophrenia (C) Spina bifida (neural tube defects) (D) Marfan syndrome"'
  scoring: Automatic evaluation reports task-specific accuracy, F1, and ROUGE-L, with average dataset performance
    reported for reasoning and understanding in the few-shot analysis. For human evaluation, three medical experts
    blindly compare public-model outputs against GPT-4 on 100 hospitalization summaries and 100 patient education
    items, reporting win-plus-tie percentages for factuality, completeness, preference, and safety.
  judge: Automatic task metrics and three medical experts assign scores.
  scale: Task-specific accuracy, F1, and ROUGE-L; human comparisons use wins, ties, and losses, reported as win-plus-tie
    percentages.
  validation: ''
  score_meaning: Factuality concerns avoiding incorrect content, completeness concerns retaining important information,
    preference concerns outputs users prefer, and safety concerns avoiding harmful results such as harmful drug
    recommendations. A higher win-plus-tie percentage means the model more often matches or exceeds GPT-4 on the
    assessed criterion.
  annotation_process: ''
  results: GPT-4 outperformed the other evaluated LLMs on every dataset, including a reported 71.3 F1 on BC5-Disease
    versus 90.0 for the task-specific state of the art. All evaluated LLMs scored below 20% F1 on treatment recommendation.
  limitations: The authors did not evaluate newer models such as GPT-4o, Claude-3.5, and Qwen, and limited computing
    resources prevented studying instruction fine-tuning data effects on LLaMA-2-13B or 70B.
