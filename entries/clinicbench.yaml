id: clinicbench
name: ClinicBench
kind: benchmark
year: 2024
summary: "A benchmark of 17 datasets (over 20,000 test samples) across 11 clinical tasks (exam-style QA, referral QA, treatment recommendation, summarization, NER, relation extraction, emerging-drug QA), including six datasets the authors built, used to compare 22 LLMs zero-shot and few-shot, plus a clinician evaluation."
