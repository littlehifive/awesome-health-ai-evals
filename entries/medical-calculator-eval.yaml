  notes: "Dataset card only, no paper. Builder is Eka Care (Indian health-tech company); builder type is a guess and the card does not say how the vignettes were written, so item_provenance is a guess too. Card labels the 'Hinglish clinical' style as 810 items, 'Medical shorthand' 254, and 'Regional English' 2. The evaluated task is formula recall plus inline arithmetic, with JSON output scored as exact within tolerance. Distinct from cmedcalc-bench."
