  notes: "Questions are generated by LLMs from extracted version-to-version differences, verified by a second LLM, and written in NBME style with an up-to-date option, an outdated option, two distractors and an I-don't-know option. The questions file is checked into the GitHub repo (questions_2026_relaxed_4_option_augmented_verified.jsonl); the MIT license is the repository's and is not stated separately for the data. Authors from University of Virginia and NIH among others. No human physician verification was found in the parts read."
