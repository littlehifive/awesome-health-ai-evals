  notes: "Johns Hopkins lead (also NEJM Group, Penn). 16 LLMs tested; the main outcome is the diagnostic correction rate (disagree and give the correct diagnosis) and the ratio of correction to error detection. Responses were classified into three categories; the paper does not say who or what did the classification, so eval_methods is a guess. Access: the paper says a sample dataset and code are public on GitHub (no URL found in the text) and the full data are available on reasonable request with institutional approval, so open_data is recorded as gated. The demographic and context variants are explicitly not part of the public release."
