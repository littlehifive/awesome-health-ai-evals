id: reference-hallucination-score
name: Reference Hallucination Score (RHS)
kind: eval_framework
year: 2024
summary: A 0 to 11 score for the authenticity of citations produced by AI chatbots, checking seven reference items (title, journal, authors, DOI, date, link, relevance to prompt keywords), demonstrated on 6 chatbots given 10 medical prompts asking for 10 references each.
