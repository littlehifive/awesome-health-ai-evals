  notes: "Perturbations (gender swap or removal, uncertain or colloquial tone, multi-turn or summary format) were produced with Llama-3-8B. Clinician reads came from 36 U.S.-based medical students via Centaur Labs. License: human-written text is CC-BY-4.0 and model responses are CC-BY-NC-4.0 (HF card and paper). The scoring compares LLM and clinician yes/no answers rather than a fixed gold label; there is no single reference answer."
