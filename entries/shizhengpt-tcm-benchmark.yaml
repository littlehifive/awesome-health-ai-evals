  notes: "The paper is mainly a model paper (ShizhenGPT, a multimodal TCM LLM); only its evaluation sets are catalogued here. Text exams: 2024 TCM Pharmacist 480, 2024 TCM Physician 184, 2024 Assistant Physician 138, 2024 graduate entrance 147, 2025 graduate entrance 139 (counts from the HF card). The vision set needs image input and is outside the text-only chatbot scope; it is listed because it ships in the same release. A 90-case human preference evaluation by three licensed TCM practitioners is described but its cases were not seen as released. Paper also evaluates on public sets (MedQA, CMB, CMExam, CMMLU TCM subsets), not part of this entry. The HF Vision card is labeled 'text benchmark' by mistake. Lead institution country is the Chinese University of Hong Kong, Shenzhen."
