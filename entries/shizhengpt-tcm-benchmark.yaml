card:
  task: Select the correct answer to each Chinese TCM multiple-choice question, using text alone for the exam questions
    and an accompanying image for medicinal recognition and visual diagnosis questions.
  items_built: The authors compiled five national exam sections with 480 pharmacist, 184 physician, 138 assistant
    physician, 147 graduate entrance (2024), and 139 graduate entrance (2025) questions. They compiled 7,204 image
    questions from seven TCM atlases that were explicitly excluded from training.
  example: '请根据这张图片，判断它属于下面哪一种？ A: 巴戟肉 B: 盐巴戟天 C: 制白附子片 D: 生白附子片'
  scoring: Answers are evaluated for accuracy against the correct choices, with scores reported for each exam or
    visual category and an average across those sections.
  judge: ''
  scale: Correct or incorrect per question; percentage accuracy by section and an overall average.
  validation: ''
  score_meaning: In the separate human preference evaluation, win, tie and loss report the proportions of comparisons
    in which experts preferred ShizhenGPT's response, preferred neither response over the other, or preferred the
    baseline's response.
  annotation_process: Three licensed TCM practitioners participated in the separate human preference evaluation
    of 90 real-world TCM queries. For each query, ShizhenGPT and a baseline generated responses, which experts compared
    to select their preferred answer.
  results: Deepseek-R1-671B scored highest on the text exams, with an average of 84.0%. ShizhenGPT-32B scored highest
    on the vision benchmark, with an average of 63.6%.
  limitations: ''
