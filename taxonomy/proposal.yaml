# Proposer draft (lens: clinical informatics), built from search/work/cluster_digest.txt.
# 12 domains, 73 constructs. A cluster may appear under more than one construct when its
# terms mix qualities. Scoring-mechanic clusters (accuracy, F1, ROUGE, rubric totals) are
# mapped to the quality they are used to judge.

domains:
  - id: correctness
    name: Correctness and knowledge
    description: Whether the medical content of a response is true, current, in line with guidelines, and close to expert reference answers.
  - id: grounding
    name: Grounding, honesty and uncertainty
    description: Whether a response sticks to what its sources and evidence support, admits what it does not know, and holds a correct position under user pressure.
  - id: clinical_reasoning
    name: Clinical reasoning and decisions
    description: How well the model makes the clinical judgments evaluations ask of it (diagnosis, management, triage, test selection, calculation, labelling) and how sound its reasoning is.
  - id: consultation
    name: Consultation and dialogue conduct
    description: How the model behaves over a multi-turn consultation, from gathering and clarifying information to remembering context and working efficiently.
  - id: safety
    name: Safety and harm avoidance
    description: Whether the model avoids advice that could hurt someone, recognizes emergencies and crises, routes people to care, and refuses or stays in scope appropriately.
  - id: helpfulness
    name: Helpfulness and content quality
    description: Whether a response is complete, relevant, useful, actionable, well-sized, personal to the user, and done as instructed.
  - id: communication
    name: Communication and language
    description: How clearly, readably, fluently and appropriately a response is written for its reader and in the reader's language.
  - id: relational
    name: Empathy and therapeutic relationship
    description: How the model relates to the person, including empathy, respect, listening, autonomy, healthy boundaries, and the quality of counseling or psychotherapy behavior.
  - id: equity_context
    name: Equity, inclusion and local fit
    description: Whether quality holds across groups, languages and cultures, avoids stigma, and fits the resources of the setting where the user lives.
  - id: ethics_privacy
    name: Ethics, privacy and accountability
    description: Whether the model protects personal information, acts in line with medical ethics, and is transparent, auditable and compliant.
  - id: robustness
    name: Consistency and robustness
    description: Whether outputs stay stable across repeated runs, harmless input changes, and deliberate adversarial attacks.
  - id: operational
    name: Evaluation method and operational properties
    description: Properties of the evaluation or the deployed system rather than of a single response, such as rater agreement, cost and latency, usability, retrieval, and measured effects on users.

constructs:
  # ---------------- correctness ----------------
  - id: exam_knowledge
    name: Medical knowledge on exam-style items
    domain: correctness
    definition: Answers closed-form knowledge questions (multiple-choice, true/false, short exam items) correctly. Covers accuracy, exact-match and F1 scoring on such items.
    clusters: [k001, k021, k024, k087, k124, k195, k295, k326, k353, k369, k375, k521, k555, k600, k610, k1062, k1071, k1216, k1447, k1973]
    example_terms: ["MCQ Accuracy (coeval)", "Accuracy (afrimed-qa)", "Medical Knowledge (MK) (llmeval-med)", "Multiple-choice exact match (movebench)"]

  - id: factual_accuracy
    name: Factual accuracy of free-text content
    domain: correctness
    definition: Statements in a free-text answer are medically correct and consistent with established knowledge and scientific consensus, with no false claims.
    clusters: [k008, k012, k019, k025, k027, k030, k037, k045, k053, k076, k079, k096, k138, k153, k180, k185, k189, k207, k218, k277, k281, k332, k343, k346, k365, k390, k400, k403, k424, k460, k480, k512, k550, k595, k602, k637, k722, k744, k760, k798, k850, k1007, k1015, k1043, k1085, k1099, k1696, k1996]
    example_terms: ["Correctness (afrimed-qa)", "Clinical correctness (clinical-llm-redteam-em)", "Factuality (almanac-clinicalqa)", "Factual Error (dosebench)"]

  - id: guideline_adherence
    name: Guideline and standard-of-care concordance
    domain: correctness
    definition: Recommendations agree with relevant clinical guidelines, protocols and standards of care, including national or local protocols when the evaluation specifies them.
    clusters: [k045, k081, k139, k239, k295, k334, k372, k404, k443, k452, k623, k713, k734, k925, k926, k934, k1217, k1554, k1783, k1974, k1975]
