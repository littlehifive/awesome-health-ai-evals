  - id: reference_similarity
    name: Similarity to reference text
    domain: correctness
    definition: How closely generated text matches an expert reference answer, summary or rationale in wording or meaning, as scored by overlap or embedding metrics such as ROUGE, BLEU or BERTScore. A proxy for content fidelity, not a direct judgment of correctness.
