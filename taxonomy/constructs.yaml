domains:
- id: correctness
  name: Correctness and knowledge
  description: Whether the medical content of a response is true, current, in line with guidelines, and close to expert reference answers.
- id: grounding
  name: Grounding, honesty and uncertainty
  description: Whether a response sticks to what its sources and evidence support, admits what it does not know, and holds a correct position
    under user pressure.
- id: clinical_reasoning
  name: Clinical reasoning and decisions
  description: How well the model makes the clinical judgments evaluations ask of it (diagnosis, management, triage, test selection, calculation,
    labelling) and how sound its reasoning is.
- id: consultation
  name: Consultation and dialogue conduct
  description: How the model behaves over a multi-turn consultation, from gathering and clarifying information to remembering context and working
    efficiently.
- id: safety
  name: Safety and harm avoidance
  description: Whether the model avoids advice that could hurt someone, recognizes emergencies and crises, routes people to care, and refuses
    or stays in scope appropriately.
- id: helpfulness
  name: Helpfulness and content quality
  description: Whether a response is complete, relevant, useful, actionable, well-sized, personal to the user, and done as instructed.
- id: communication
  name: Communication and language
  description: How clearly, readably, fluently and appropriately a response is written for its reader and in the reader's language.
- id: relational
  name: Empathy and therapeutic relationship
  description: How the model relates to the person, including empathy, respect, listening, autonomy, healthy boundaries, and the quality of counseling
    or psychotherapy behavior.
- id: equity_context
  name: Equity, inclusion and local fit
  description: Whether quality holds across groups, languages and cultures, avoids stigma, and fits the resources of the setting where the user
    lives.
- id: ethics_privacy
  name: Ethics, privacy and accountability
  description: Whether the model protects personal information, acts in line with medical ethics, and is transparent, auditable and compliant.
- id: robustness
  name: Consistency and robustness
  description: Whether outputs stay stable across repeated runs, harmless input changes, and deliberate adversarial attacks.
- id: real_world_use
  name: Real-world use and effect
  description: 'How the system works for people in practice: usability and workflow fit, and measured effects on users'' behaviour and health.'
- id: operational
  name: Evaluation method and system performance
  description: 'Properties of the evaluation or of the system rather than of a single response: rater and judge reliability, cost and latency,
    and retrieval.'
