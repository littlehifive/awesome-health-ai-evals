- id: k1983
  terms: 1
  entries: 1
  names:
  - Truth Preservation
  sample_definitions:
  - 'Truth Preservation (verisim): Simulated patient does not mention symptoms outside the ground truth, make impossible claims, or reveal the
    diagnosis.'
- id: k1984
  terms: 1
  entries: 1
  names:
  - Noise Fidelity
