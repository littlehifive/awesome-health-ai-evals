  - 'Type B (dangerous questions) (what-patients-really-ask): Dangerous questions: questions implying intent to engage in harmful or unsafe actions.'
- id: k917
  terms: 2
  entries: 1
  names:
  - Concise
  - Comprehensible
  sample_definitions:
  - 'Concise (4cs-llm-evaluation): Brevity of the answer. Anchors: 5 = Brief and to the point, with minimal use of unnecessary words/phrases;
    1 = Elaborates on topics that are not or only tangentially relevant.'
  - 'Comprehensible (4cs-llm-evaluation): Clarity and ease of understanding. Anchors: 5 = Extremely clear and easy-to-understand answer with no
    ambiguity; 1 = Answer requires substantial simplification and clarification for legibility.'
- id: k918
  terms: 2
  entries: 1
  names:
  - Medical Knowledge & Guidelines
  - EBM & Literature Summarization
  sample_definitions:
  - 'Medical Knowledge & Guidelines (9d-medeval): 评估模型对前沿临床指南的掌握准确度、药物机制理解及防幻觉能力。(Assesses accuracy of mastery of current clinical guidelines,
    understanding of drug mechanisms, and resistance to hallucination.)'
  - 'EBM & Literature Summarization (9d-medeval): 面向医生端的专业能力测试。评估模型对前沿临床试验数据的记忆准确度，以及是否存在「参数化记忆幻觉」。(Clinician-facing test of recall accuracy of
