- id: k2005
  terms: 1
  entries: 1
  names:
  - Escalation utility
  sample_definitions:
  - 'Escalation utility (workflow-aware-agent-benchmarking): Configurable cost-sensitive utility U = u_TP*TP + u_TN*TN - c_FN*FN - c_FP*FP, with
    c_FN > c_FP when missed escalation is judged more harmful; cost matrix declared before evaluation.'
- id: k2006
  terms: 1
  entries: 1
  names:
  - Surface-level consistency
  sample_definitions:
  - 'Surface-level consistency (xlinghealth): Gauges the resemblance between two pieces of text based on their superficial attributes, such as
    lexical features, word choices and response lengths (sim n-gram).'
