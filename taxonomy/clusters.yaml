    or nonexistent.'
  - 'Erroneous date of publication (reference-hallucination-score): The publication date is missing or inaccurate.'
  - 'Erroneous web link of the paper (reference-hallucination-score): The link to the paper is missing or directs to a different paper or an error
    page.'
