    against physician majority-vote gold labels.'
  - 'Visit (in-person clinical visit decision) (sense-and-sensitivity-triage): Binary triage decision of whether an in-person clinical visit is
    needed.'
  - 'Resource (medical resource allocation decision) (sense-and-sensitivity-triage): Binary triage decision of whether medical resources should
    be allocated.'
- id: k909
  terms: 3
  entries: 1
