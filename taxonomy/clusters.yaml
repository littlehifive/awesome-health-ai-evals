  - 'Erroneous authors'' names (reference-hallucination-score): Authors'' names are wrong or missing in the reference (major hallucination item).'
  - 'Erroneous digital object identifier (reference-hallucination-score): DOI is missing or inaccurate (major hallucination item).'
- id: k906
  terms: 3
  entries: 1
  names:
  - pacing (evolved)
