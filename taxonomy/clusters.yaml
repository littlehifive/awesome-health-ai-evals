- id: k2003
  terms: 1
  entries: 1
  names:
  - Handoff completeness
  sample_definitions:
  - 'Handoff completeness (workflow-aware-agent-benchmarking): Scored as the fraction of required routing fields that are present and correct.'
- id: k2004
  terms: 1
  entries: 1
  names:
  - Escalation sensitivity
  sample_definitions:
  - 'Escalation sensitivity (workflow-aware-agent-benchmarking): Escalation is evaluated as a decision against a reference label, reported as
