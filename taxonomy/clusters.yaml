  - 'Agreement with fabricated claims (uphill): Percentage of responses that agree, disagree, or are neutral toward fabricated claims.'
- id: k1981
  terms: 1
  entries: 1
  names:
  - Mistranslation of Critical Instruction
  sample_definitions:
  - 'Mistranslation of Critical Instruction (us-healthbench): The Spanish (or English) version of the answer materially changes the meaning of
    a health instruction.'
- id: k1982
  terms: 1
  entries: 1
  names:
  - Informativeness
  sample_definitions:
