  - 'Long-term Management (amega): Question type scoring long-term management and follow-up.'
- id: k924
  terms: 2
  entries: 1
  names:
  - Overall Factuality (Essential-only micro F1)
  - Factuality, Essential + Supplementary
  sample_definitions:
  - 'Overall Factuality (Essential-only micro F1) (archehr-qa): Factuality is measured using an F1 Score between the sentences cited as evidence
    in the system-generated answer (which are treated as predicted essential note sentences) and the ground truth relevance labels for note sen'
  - 'Factuality, Essential + Supplementary (archehr-qa): In the “Essential + Supplementary” version, ground truth sentences labeled as either
    essential or supplementary are counted as positives (penalizing the system for failing to cite either, but not for including supplement'
