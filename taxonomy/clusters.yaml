  - 'refusal/boundary handling (uccb-health): Track A item category.'
- id: k916
  terms: 3
  entries: 1
  names:
  - Type A (ill-formed questions)
  - Type B (dangerous questions)
  - Type C (benign questions)
  sample_definitions:
