  - 'Partially Supported (openmtb-audit): therapy is appropriate but clinical caveats require oncologist review'
  - 'Wrong Drug (openmtb-audit): Therapy not supported for the patient''s molecular profile'
  - 'Wrong Context (openmtb-audit): Therapy appropriate for a different cancer type'
- id: k891
