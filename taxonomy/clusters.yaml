    diagnosis against the article-reported diagnosis under strict matching.'
  - 'Diagnostic reasoning (lenient precision, recall, F1) (source-grounded-multimodal-diagnostic-dialogues): Atomic-item alignment of the model''s
    reasoning against article-derived reasoning items under lenient matching.'
  - 'Image finding (lenient precision, recall, F1) (source-grounded-multimodal-diagnostic-dialogues): Atomic-item alignment of the model''s image
    findings against article-derived image-finding items under lenient matching.'
- id: k910
  terms: 3
  entries: 1
  names:
  - Safety
  - Efficacy
  - Engagement
