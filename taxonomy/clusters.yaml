  - 'Recall (tcm-pr-cot-syndrome-recognition): Structural parsing metric on parsed syndrome labels against gold labels.'
  - 'F1 score (tcm-pr-cot-syndrome-recognition): Structural parsing metric on parsed syndrome labels against gold labels.'
