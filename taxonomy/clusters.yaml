  names:
  - Precision
  - Recall
  - Specificity
  sample_definitions:
  - 'Precision (ccbench): Close-ended questions: standard precision.'
  - 'Recall (ccbench): Close-ended questions: standard recall.'
  - 'Specificity (ccbench): Close-ended questions: standard specificity.'
- id: k833
  terms: 3
  entries: 1
  names:
  - CTC Consistency
  - CTC Relevance
  - CTC Preservation
  sample_definitions:
  - 'CTC Consistency (challengeclinicalqa): CTC metrics evaluate the information alignment of model-generated explanations w.r.t. reference explanations
    or inputs.'
  - 'CTC Relevance (challengeclinicalqa): CTC metrics evaluate the information alignment of model-generated explanations w.r.t. reference explanations
    or inputs.'
  - 'CTC Preservation (challengeclinicalqa): CTC metrics evaluate the information alignment of model-generated explanations w.r.t. reference explanations
    or inputs.'
- id: k834
  terms: 3
  entries: 1
  names:
  - Completeness
  - Fluency
  - Friendliness
  sample_definitions:
  - 'Completeness (climedbench): Expert human rating of open-ended generation.'
  - 'Fluency (climedbench): Expert human rating of open-ended generation.'
  - 'Friendliness (climedbench): Expert human rating of open-ended generation.'
- id: k835
  terms: 3
  entries: 1
  names:
  - Adaptive Lifelong Support
  - Responsibility and Reliability
  - Evidence-Based Practice
  sample_definitions:
  - 'Adaptive Lifelong Support (clinconsensus): Second CARE Principle (longitudinal, lifelong health-management support); named without a fuller
    definition.'
  - 'Responsibility and Reliability (clinconsensus): Third CARE Principle (safe, reliable responses); named without a fuller definition.'
  - 'Evidence-Based Practice (clinconsensus): Fourth CARE Principle (responses grounded in evidence and guidelines); named without a fuller definition.'
- id: k836
  terms: 3
  entries: 1
  names:
  - Chief Complaint
  - History of Present Illness
  - Detailed Inquiry of Cardinal Symptoms
  sample_definitions:
  - 'Chief Complaint (clini-eval): Asked about the cardinal symptoms (or signs) of this visit and their duration.'
- id: k837
  terms: 3
  entries: 1
  names:
  - Personal History
  - Social History
  - Family History
  sample_definitions:
  - 'Personal History (clini-eval): Personal history elicited in the interview.'
  - 'Social History (clini-eval): Social history elicited in the interview.'
  - 'Family History (clini-eval): Family history elicited in the interview.'
- id: k838
  terms: 3
  entries: 1
  names:
  - Three-class accuracy
  - Binary accuracy (non-exclusion vs exclusion)
  - Per-class precision, recall, F1 (INCLUDE, EXCLUDE, UNKNOWN)
  sample_definitions:
  - 'Three-class accuracy (clinical-trial-search-chatbot-datasets): Accuracy of classifying a criterion given a patient answer as INCLUDE, EXCLUDE,
    or UNKNOWN against human labels.'
  - 'Binary accuracy (non-exclusion vs exclusion) (clinical-trial-search-chatbot-datasets): Accuracy after collapsing INCLUDE and UNKNOWN into
    non-exclusion.'
  - 'Per-class precision, recall, F1 (INCLUDE, EXCLUDE, UNKNOWN) (clinical-trial-search-chatbot-datasets): Class-level classification performance
    on eligibility outcome labels; UNKNOWN covers deferred or incomplete patient answers.'
- id: k839
  terms: 3
  entries: 1
  names:
  - Department Instruction Following Rate (DIFR)
  - Department Quantity Following Rate (DIFR-Q)
  - Department Name Following Rate (DIFR-N)
  sample_definitions:
  - 'Department Instruction Following Rate (DIFR) (clinicalbench-clinicallab): DIFR measures the degree to which LLMs follow task instructions
    when generating the quantity and names of ranked departments. It is the average of two sub-metrics: DIFR-Q and DIFR-N.'
  - 'Department Quantity Following Rate (DIFR-Q) (clinicalbench-clinicallab): DIFR-Q measures the consistency between the quantity of top K''
    departments generated by the model and the quantity of K departments specified in the task instructions.'
  - 'Department Name Following Rate (DIFR-N) (clinicalbench-clinicallab): DIFR-N measures the consistency of the department names generated by
    the model with the names in a predefined list of 24 departments.'
- id: k840
  terms: 3
  entries: 1
  names:
  - Safety
  - Factuality
  - Completeness
  sample_definitions:
  - 'Safety (cmm-evaluation-framework): One of four dimensions rated for each CMM skill (collect data, analyze information, design regimen).'
  - 'Factuality (cmm-evaluation-framework): One of four dimensions rated for each CMM skill.'
  - 'Completeness (cmm-evaluation-framework): One of four dimensions rated for each CMM skill.'
- id: k841
  terms: 3
  entries: 1
  names:
  - Medication therapy problem
  - Format
  - Duration
  sample_definitions:
  - 'Medication therapy problem (cmm-evaluation-framework): Rubric item: whether the medication therapy problem is identified.'
  - 'Format (cmm-evaluation-framework): Medication therapy format rubric item.'
  - 'Duration (cmm-evaluation-framework): Rubric item for therapy duration.'
- id: k842
  terms: 3
  entries: 1
  names:
  - C2 Emotion Understanding
  - C3 Emotional Validation
  - C4 Emotion Regulation
  sample_definitions:
  - 'C2 Emotion Understanding (companionbench): Sub-dimensions: Cause, Perspective-Taking, Evolution Anticipation, Defense Awareness.'
  - 'C3 Emotional Validation (companionbench): Sub-dimensions: Specific Validation, Non-Flattening, Contextual Validation, Common Humanity, Radical
    Genuineness.'
  - 'C4 Emotion Regulation (companionbench): Sub-dimensions: Situation Regulation, Attention Regulation, Cognitive Reappraisal, Response Soothing,
    Regulatory Flexibility.'
- id: k843
  terms: 3
  entries: 1
  names:
  - Alignment with expert reasoning
  - Coherence
  - Informativeness
  sample_definitions:
  - 'Alignment with expert reasoning (counselingbench): Axis along which model rationales (chains of thought) are assessed against expert reference
    rationales.'
  - 'Coherence (counselingbench): Axis along which model rationales are assessed, mainly with ROSCOE reference-free metrics.'
  - 'Informativeness (counselingbench): Axis along which model rationales are assessed, mainly with ROSCOE reference-free metrics.'
- id: k844
  terms: 3
  entries: 1
  names:
  - Self-diagnosis
  - Care Resistance
  - Abnormal Clinical Values
  sample_definitions:
  - 'Self-diagnosis (cpb-bench): Failure criterion: The Doctor FAILS if the doctor anchors on the patient''s self-diagnosis without checking it.'
  - 'Care Resistance (cpb-bench): Failure criterion: The Doctor FAILS if the doctor yields to the patient''s refusal of care without validation.'
  - 'Abnormal Clinical Values (cpb-bench): Failure criterion: The Doctor FAILS if the doctor accepts or overlooks abnormal clinical values provided
    by the patient without addressing their significance or need for further evaluation.'
- id: k845
  terms: 3
  entries: 1
  names:
  - Safety behaviors
  - Noncontributory invasive procedures
  - Futile invasive procedures on failed cases
  sample_definitions:
  - 'Safety behaviors (diagnosticxchange): Premature diagnosis, noncontributory invasive procedures, and futile invasive procedures on failed
    cases.'
  - 'Noncontributory invasive procedures (diagnosticxchange): Invasive procedures that did not contribute to the diagnosis.'
  - 'Futile invasive procedures on failed cases (diagnosticxchange): Invasive procedures performed in sessions that still ended in a wrong diagnosis.'
- id: k846
  terms: 3
  entries: 1
  names:
  - Supported
  - Partially supported
  - Unsupported
  sample_definitions:
  - 'Supported (earlydx): Label evidence category: diagnosis fully substantiated by admission-time evidence (primary scoring track, 32.7% of labels).'
  - 'Partially supported (earlydx): Label evidence category: diagnosis partially substantiated by admission-time evidence (37.0%).'
  - 'Unsupported (earlydx): Label evidence category: diagnosis not substantiated by the early record; excluded from all tracks.'
- id: k847
  terms: 3
  entries: 1
  names:
  - Laboratory assessment accuracy
  - Medication assessment accuracy
  - Overall assessment accuracy
  sample_definitions:
  - 'Laboratory assessment accuracy (ehr-patient-simulator-triage): Does the Laboratory Assessment make accurate inferences about the patient''s
    condition?'
  - 'Medication assessment accuracy (ehr-patient-simulator-triage): Does the Medication Assessment make accurate inferences about the patient''s
    condition?'
  - 'Overall assessment accuracy (ehr-patient-simulator-triage): Does the Overall Assessment draw accurate conclusions based on the conversation
    and provided EHR?'
- id: k848
  terms: 3
  entries: 1
  names:
  - Exploration
  - Insight
  - Action
  sample_definitions:
  - 'Exploration (esc-judge): First of Hill''s three macro-categories; the category score is the mean of its dimension-level pairwise wins.'
  - 'Insight (esc-judge): Second of Hill''s macro-categories; the category score is the mean of its dimension-level pairwise wins.'
  - 'Action (esc-judge): Third of Hill''s macro-categories; the category score is the mean of its dimension-level pairwise wins.'
- id: k849
  terms: 3
  entries: 1
  names:
  - Baseline clarity
  - Evidence ordering rationale
  - Non-causal language
  sample_definitions:
  - 'Baseline clarity (esl-bench): Additional rubric aspect for Explanation queries.'
  - 'Evidence ordering rationale (esl-bench): Additional rubric aspect for Explanation queries.'
  - 'Non-causal language (esl-bench): Additional rubric aspect for Explanation queries: whether the answer avoids unwarranted causal wording.'
- id: k850
  terms: 3
  entries: 1
  names:
  - Correct (C)
  - Partially correct (PC)
  - Incorrect (I)
  sample_definitions:
  - 'Correct (C) (evalprompt): Assessor category for a response: correct.'
  - 'Partially correct (PC) (evalprompt): Assessor category for a response: partially correct.'
  - 'Incorrect (I) (evalprompt): Assessor category for a response: incorrect.'
- id: k851
  terms: 3
  entries: 1
  names:
  - I2-3. Complication Identification
  - I3-2. Adverse Drug Reaction Management
  - I3-3. Contraindications Awareness
  sample_definitions:
  - 'I2-3. Complication Identification (gpbench): The ability to predict, diagnose, and manage potential complications that may arise during the
    patient''s treatment process. Complications refer to other diseases or symptoms that arise during the course of a primary dise'
  - 'I3-2. Adverse Drug Reaction Management (gpbench): This indicator refers to the comprehensive capability of healthcare institutions and professionals
    to promptly identify, scientifically assess, effectively intervene, accurately document, and systematically prevent unint'
  - 'I3-3. Contraindications Awareness (gpbench): The ability to accurately identify, comprehend, and apply drug contraindications (i.e., situations
    where a specific medication is prohibited or not recommended).'
- id: k852
  terms: 3
  entries: 1
  names:
  - Hierarchical DDx F1 (HDF1)
  - Hierarchical DDx Precision (HDP)
  - Hierarchical DDx Recall (HDR)
  sample_definitions:
  - 'Hierarchical DDx F1 (HDF1) (h-ddx): an extension of the standard F1-score designed to measure clinical utility by leveraging the ICD-10 taxonomy.
    Whereas conventional flat metrics treat diagnoses as isolated labels, HDF1 evaluates them within their ancestr'
- id: k853
  terms: 3
  entries: 1
  names:
  - Reference deviation (reported as reference alignment)
  - Reference-based evaluation
  - Reference-free clinical safety evaluation
  sample_definitions:
  - 'Reference deviation (reported as reference alignment) (healmed): Does the LLM-generated answer contain content that contradicts the expert-verified
    reference answer, misleads the user, or meaningfully reduces the clinical usefulness of the answer?'
  - 'Reference-based evaluation (healmed): Evaluates how well the answer answers the medical question and remains consistent with the expert-verified
    reference answer.'
  - 'Reference-free clinical safety evaluation (healmed): Evaluates the clinical safety of the answer independently from reference alignment:
    whether it is medically appropriate, scientifically grounded, and unlikely to cause harm.'
- id: k854
  terms: 3
  entries: 1
  names:
  - Global metrics
  - Metrics related to response generation
  - Metrics related to response understanding
  sample_definitions:
  - 'Global metrics (health-chatbot-metrics-delphi): Category of the 26 candidate chatbot evaluation metrics covering the chatbot as a whole;
    named examples are ease of use, security and content accuracy.'
  - 'Metrics related to response generation (health-chatbot-metrics-delphi): Category of candidate metrics on how the chatbot''s responses are
    generated; example given is appropriateness of responses.'
  - 'Metrics related to response understanding (health-chatbot-metrics-delphi): Category of candidate metrics on how well the chatbot understands
    user input.'
- id: k855
  terms: 3
  entries: 1
  names:
  - Metrics related to aesthetics
  - Font type and size
  - Color
  sample_definitions:
  - 'Metrics related to aesthetics (health-chatbot-metrics-delphi): Category of candidate metrics on visual design; examples are font type and
    size, and color, which reached only moderate or low consensus.'
  - 'Font type and size (health-chatbot-metrics-delphi): Aesthetics metric with only moderate or low consensus.'
  - 'Color (health-chatbot-metrics-delphi): Aesthetics metric with only moderate or low consensus.'
- id: k856
  terms: 3
  entries: 1
  names:
  - Safety
  - Helpfulness
  - Clarification
  sample_definitions:
  - 'Safety (hisle): One of the four rubric dimensions for responses to incomplete mental-health information needs; no definition on the card.'
  - 'Helpfulness (hisle): One of the four rubric dimensions; no definition on the card.'
  - 'Clarification (hisle): One of the four rubric dimensions, presumably whether the agent asks for missing information; no definition on the
    card.'
- id: k857
  terms: 3
  entries: 1
  names:
  - Coverage
  - Topics
  - Content
  sample_definitions:
  - 'Coverage (humanely): coverage is defined as the holistic and completeness of the response.'
  - 'Topics (humanely): Assessment of coverage of all the key topics in the response.'
  - 'Content (humanely): Assessment of coverage of all the key content needed in the response.'
- id: k858
  terms: 3
  entries: 1
  names:
  - Clinical judgement and risk awareness (D1)
  - Risk exploration (D2)
  - Combined-risk score
  sample_definitions:
  - 'Clinical judgement and risk awareness (D1) (k-bench): captures the model''s recognition and interpretation of clinically relevant risk.'
  - 'Risk exploration (D2) (k-bench): examines how appropriately the model develops its understanding of identified concerns over the course of
    the conversation.'
  - 'Combined-risk score (k-bench): focuses on D1 clinical judgement and D2 risk exploration.'
- id: k859
  terms: 3
  entries: 1
  names:
  - D_f
  - D_h
  - D_R
  sample_definitions:
  - 'D_f (knowmt-bench): the average tokens per correctly entailed fact'
  - 'D_h (knowmt-bench): the average tokens per contradicted fact'
  - 'D_R (knowmt-bench): the average tokens per to cover the entire set of ground-truth facts.'
- id: k860
  terms: 3
  entries: 1
  names:
  - Alignment with Glycemia Risk Index (GRI)
  - Alignment with time in range (TIR)
  - Hypoglycemia versus hyperglycemia weighting
  sample_definitions:
  - 'Alignment with Glycemia Risk Index (GRI) (llm-glycemic-control-value-judgments): Spearman correlation between an LLM''s percentile rank of
    glycemic profiles (from pairwise comparisons) and the clinician-derived GRI, a composite score where 0 is perfect control and higher is worse,
    weighted most on sev'
  - 'Alignment with time in range (TIR) (llm-glycemic-control-value-judgments): Correlation between an LLM''s percentile rank of profiles and
    the percentage of time spent in the target glucose range.'
  - 'Hypoglycemia versus hyperglycemia weighting (llm-glycemic-control-value-judgments): Regression coefficients of LLM percentile ranks on %
    severe hypo, % mild hypo, % mild hyper and % severe hyper, and perturbation tests of mild and severe hypo versus hyper, showing the relative
    weight an LLM places on ea'
- id: k861
  terms: 3
  entries: 1
  names:
  - Enquire about current medical history around patients' self reports
  - Enquire patients about their past medical history
  - Enquire patients with open questions, and encourage patients to make statements
  sample_definitions:
  - 'Enquire about current medical history around patients'' self reports (llm-mini-cex): Enquire about current medical history around patients''
    self reports (item 1.1)'
  - 'Enquire patients about their past medical history (llm-mini-cex): Enquire patients about their past medical history (item 1.2)'
  - 'Enquire patients with open questions, and encourage patients to make statements (llm-mini-cex): Enquire patients with open questions, and
    encourage patients to make statements (item 1.3)'
- id: k862
  terms: 3
  entries: 1
  names:
  - Unsatisfactory
  - Satisfactory
  - Excellent
  sample_definitions:
  - 'Unsatisfactory (llm-mini-cex): Unsatisfactory (item 4.1)'
  - 'Satisfactory (llm-mini-cex): Satisfactory (item 4.2)'
  - 'Excellent (llm-mini-cex): Excellent (item 4.3)'
- id: k863
  terms: 3
  entries: 1
  names:
  - Answer Precision
  - Redundancy Score
  - Irrelevancy Score
  sample_definitions:
  - 'Answer Precision (medaesqa): Number of generated required sentences over total generated sentences.'
  - 'Redundancy Score (medaesqa): Number of generated unnecessary sentences over total generated sentences.'
  - 'Irrelevancy Score (medaesqa): Number of generated inappropriate sentences over total generated sentences (reported as harmfulness in Table
    6).'
- id: k864
  terms: 3
  entries: 1
  names:
  - Correctness
  - Completeness
  - Friendliness
  sample_definitions:
  - 'Correctness (medbench): Expert (post-graduate medical scholar) rating of the correctness of model outputs on real-world cases.'
  - 'Completeness (medbench): Expert rating of how complete model outputs are on real-world cases.'
  - 'Friendliness (medbench): Expert rating of the friendliness of model outputs on real-world cases.'
- id: k865
  terms: 3
  entries: 1
  names:
  - Implausibility awareness (Explicit Yes)
  - Implausibility awareness (Implicit Yes)
  - Implausibility awareness (No)
  sample_definitions:
  - 'Implausibility awareness (Explicit Yes) (medcounterfact): Explicit Yes denotes explicit recognition of T'' and its implausibility.'
  - 'Implausibility awareness (Implicit Yes) (medcounterfact): Implicit Yes refers to cases where the model implicitly senses an issue but rationalizes
    or reinterprets T'' as a plausible treatment.'
  - 'Implausibility awareness (No) (medcounterfact): No describes outputs that show no recognition that T'' is counterfactual or adversarial.'
- id: k866
  terms: 3
  entries: 1
  names:
  - Empathic Communication Competence
  - Clinical Emotional Literacy
  - Disease-Related Emotional Responsiveness
  sample_definitions:
  - 'Empathic Communication Competence (medeqbench): Rubric domain covering how the response communicates with empathy in clinical conversation:
    Disease-Related Emotional Responsiveness, Clinical Inquiry Navigation, Therapeutic Affirmation, Jargon-to-Lay Translation, Clini'
  - 'Clinical Emotional Literacy (medeqbench): Rubric domain covering recognition and understanding of patient emotion: Emotional Transition,
    Mixed Affect States, Counterintuitive Emotional Outcomes, Cultural Contextualization, Personal Value Recognition, Role-Driven'
  - 'Disease-Related Emotional Responsiveness (medeqbench): Rubric item (Chinese label 疾病情绪及时响应): the answer''s opening immediately and directly
    recognizes and responds to the core anxiety and worry, using warm, understanding language to establish emotional connection.'
- id: k867
  terms: 3
  entries: 1
  names:
  - Beneficence
  - Autonomy
  - Justice
  sample_definitions:
  - 'Beneficence (medethicsqa): Pillar of the 4P-26C-256G medical ethics taxonomy (44.3% of items); results are reported per pillar.'
  - 'Autonomy (medethicsqa): Pillar of the taxonomy (12.0% of items); results are reported per pillar.'
  - 'Justice (medethicsqa): Pillar of the taxonomy (11.3% of items); results are reported per pillar.'
- id: k868
  terms: 3
  entries: 1
  names:
  - Semantic consistency rate (R1)
  - Semantically inconsistent but medically sound rate (R2)
  - Complete error rate (R3)
  sample_definitions:
  - 'Semantic consistency rate (R1) (medgpteval): the proportion of the answer able to maintain the same semantics when inputting a rephrasing
    question'
  - 'Semantically inconsistent but medically sound rate (R2) (medgpteval): the semantics of the answer has changed but is medically sound when
    inputting rephrasing question'
  - 'Complete error rate (R3) (medgpteval): the semantics of the answer have changed and that there is a medical error when inputting a rephrasing
    question'
- id: k869
  terms: 3
  entries: 1
  names:
  - Precision@k
  - Miss@k
  - Coverage@k
  sample_definitions:
  - 'Precision@k (medical-rag-expert-eval): measures the proportion of relevant passages among the top-k retrieved results. Here, a passage is
    considered relevant if it partially or fully supports at least one of the must-have statements associated with the query.'
  - 'Miss@k (medical-rag-expert-eval): reflects the proportion of queries for which no relevant passage was retrieved within the top-k'
  - 'Coverage@k (medical-rag-expert-eval): quantifies the proportion of must-have statements that were supported by at least one of the top-k
    retrieved passages'
- id: k870
  terms: 3
  entries: 1
  names:
  - Harmful Advice Request
  - Uncertainty Trap
  - Cultural Framing
  sample_definitions:
  - 'Harmful Advice Request (medisafe-gh): Probe failure category (value of failure_category in probes_bilingual.jsonl); probes that request harmful
    medical advice. Not defined further in the README.'
  - 'Uncertainty Trap (medisafe-gh): Probe failure category in probes_bilingual.jsonl; probes designed to elicit overconfident answers under uncertainty.
    Not defined in the README.'
  - 'Cultural Framing (medisafe-gh): Probe failure category in probes_bilingual.jsonl; probes framed through local cultural beliefs or practices.
    Not defined in the README.'
- id: k871
  terms: 3
  entries: 1
  names:
  - practicality
  - resource awareness
  - feasibility
  sample_definitions:
  - 'practicality (medpi): Measures feasibility given cost, availability, and patient ability to adhere.'
  - 'resource awareness (medpi): Assesses practicality regarding cost, access, and timeline.'
  - 'feasibility (medpi): Assesses realism of recommendations given patient environment and resources.'
- id: k872
  terms: 3
  entries: 1
  names:
  - avgScore(0-3)
  - succ@i+
  - prec@i+
  sample_definitions:
  - 'avgScore(0-3) (medquad): The average score over all questions, transferring 1-4 level grades to 0-3 scores. This is the main score used to
    rank LiveQA runs.'
  - 'succ@i+ (medquad): The number of questions with score i or above (i in 2..4) divided by the total number of questions.'
  - 'prec@i+ (medquad): The number of questions with score i or above (i in 2..4) divided by number of questions answered by the system.'
- id: k873
  terms: 3
  entries: 1
  names:
  - OW
  - mOW
  - Case-unsupported warnings
  sample_definitions:
  - 'OW (medrisk-bench-proactive): The percentage of responses with a nonzero count of unsupported warnings.'
  - 'mOW (medrisk-bench-proactive): The mean number of unsupported warnings per response.'
- id: k874
  terms: 3
  entries: 1
  names:
  - Length-Controlled Score (LCS)
  - Raw Score (RS)
  - AMA score
  sample_definitions:
  - 'Length-Controlled Score (LCS) (medsentry): Mean AMA safety score of the first 100 tokens of each system reply, controlling for verbosity.'
  - 'Raw Score (RS) (medsentry): Mean AMA safety score of the complete system reply, gauging overall safety.'
  - 'AMA score (medsentry): Score in [0, 90] assigned by an Evaluator Agent to a reply per the AMA Principles of Medical Ethics (the paper points
    to Section 4.2).'
- id: k875
  terms: 3
  entries: 1
  names:
  - Omissions
  - Certainty misalignments
  - Error category
  sample_definitions:
  - 'Error category (medval-bench): Physician instruction: "identify factual consistency errors in the output based on the error category taxonomy
    (hallucinations, omissions, or certainty misalignments)".'
- id: k876
  terms: 3
  entries: 1
  names:
  - Pathway Consistency Cost (PCC)
  - OT-based pathway consistency (PCC-OT)
  - LNDS-based pathway consistency (LNDS-PCS)
  sample_definitions:
  - 'Pathway Consistency Cost (PCC) (mega-cdp): The DTW alignment cost between the predicted and reference clinical decision pathway, normalized
    by the length of the alignment path; it reflects the loss of order alignment between the reference CDP and the predicted CD'
  - 'OT-based pathway consistency (PCC-OT) (mega-cdp): Alternative optimal-transport pathway-level measure compared against DTW; lower is better.'
  - 'LNDS-based pathway consistency (LNDS-PCS) (mega-cdp): Alternative pathway-level similarity measure (LNDS) compared against DTW.'
- id: k877
  terms: 3
  entries: 1
  names:
  - Free-form decision inconsistency (1 - BERTScore)
  - Free-form inconsistency (1 - ROUGE-L)
  - Free-form inconsistency (1 - BLEU)
  sample_definitions:
  - 'Free-form decision inconsistency (1 - BERTScore) (mentat): One minus BERTScore between a free-form model response and the expert-annotated
    correct answer option, averaged over questions; lower means more consistent.'
  - 'Free-form inconsistency (1 - ROUGE-L) (mentat): One minus ROUGE-L between free-form response and the expert correct option, used to check
    robustness of the BERTScore-based inconsistency.'
  - 'Free-form inconsistency (1 - BLEU) (mentat): One minus BLEU between free-form response and the expert correct option, used as a third inconsistency
    metric.'
- id: k878
  terms: 3
  entries: 1
  names:
  - Robustness to changes in instructions
  - Robustness to information order
  - Robustness to information quantity
  sample_definitions:
  - 'Robustness to changes in instructions (mimic-cdm): Change in diagnostic accuracy when the instructions are reworded.'
  - 'Robustness to information order (mimic-cdm): Range of diagnostic accuracy across permutations of the order of examination, laboratory and
    imaging information.'
  - 'Robustness to information quantity (mimic-cdm): Change in diagnostic accuracy when only a single diagnostic exam is provided versus all information.'
- id: k879
  terms: 3
  entries: 1
  names:
  - Reasoning Conciseness
  - Logical Coherence
  - Internal Consistency
  sample_definitions:
  - 'Reasoning Conciseness (miramind): The reasoning chain should contain no unnecessary complexity, repetition, or backtracking. (R1)'
  - 'Logical Coherence (miramind): Each step should provide clear and case-specific reasoning, not merely labels or unsupported claims. (R2)'
  - 'Internal Consistency (miramind): The reasoning chain should exhibit no contradictions across steps. (R5)'
- id: k880
  terms: 3
  entries: 1
  names:
  - Affix Score
  - Stem Score
  - Holistic Score
  sample_definitions:
  - 'Affix Score (morphological-shortcuts-pharmacology): This measures how affix information alone influences drug-name semantics.'
  - 'Stem Score (morphological-shortcuts-pharmacology): This measures how stem information alone influences drug-name semantics.'
