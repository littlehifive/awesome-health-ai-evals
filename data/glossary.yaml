# Glossary of technical terms about evaluating health chatbots and health language models.
# Written for a general reader: researchers, implementers in low- and middle-income countries,
# funders and curious visitors. `short` is under 25 words and works as a tooltip; `long` adds
# one or two plain sentences. `see_also` lists ids in this file. `catalog` links to a site
# route only where a filter or page exists. `source` is given only where the citation is certain.
terms:
  # Kinds of evaluation
  - id: benchmark
    term: Benchmark
    short: A fixed set of test items plus a scoring method, shared so different models can be compared on the same test.
    long: >-
      MedQA, built from multiple-choice exam questions, is a well-known example. A high score shows
      the model can pass that test, which is different from being safe to deploy in a clinic.
    see_also: [evaluation-framework, leaderboard, held-out-test-set, benchmark-card]
    catalog: {label: "Benchmarks in the catalog", href: "#/catalog?kind=benchmark"}
  - id: evaluation-framework
    term: Evaluation framework
    short: A set of criteria or a method for judging health answers, which can be applied to any test questions.
    long: >-
      HealthBench's physician-written criteria are one example: they can grade answers to new
      questions as well as its own. Frameworks suit teams that want to judge their own chatbot's
      conversations.
    see_also: [benchmark, rubric, consensus-criteria]
    catalog: {label: "Evaluation frameworks in the catalog", href: "#/catalog?kind=eval_framework"}
    source: {title: "HealthBench: Evaluating Large Language Models Towards Improved Human Health (Arora et al., 2025)", url: "https://arxiv.org/abs/2505.08775"}
  - id: leaderboard
    term: Leaderboard
    short: A public ranking of models by their scores on one or more benchmarks.
    long: >-
      Leaderboards push developers to tune models for the test rather than for real users. A model
      at the top of an exam leaderboard may still give unsafe advice about a sick child, so read
      what was measured before trusting the rank.
    see_also: [benchmark, contamination, saturation, confidence-interval]
    source: {title: "Holistic Evaluation of Language Models (Liang et al., 2022)", url: "https://arxiv.org/abs/2211.09110"}
  - id: evaluation-harness
    term: Evaluation harness
    short: Software that runs a model on a benchmark and computes its scores automatically and repeatably.
    long: >-
      A shared harness means two teams get the same score for the same model. Small differences in
      prompts or settings can shift scores by several points.
    see_also: [reproducibility, prompt-sensitivity, benchmark]
  - id: red-teaming
    term: Red-teaming
    short: Deliberately trying to make a model fail or behave unsafely, to find weaknesses before real users do.
    long: >-
      Red teamers write prompts meant to provoke harmful answers, such as a request for a lethal
      drug dose. In health, red teams often include clinicians who know which failures are
      dangerous.
    see_also: [adversarial-testing, refusal-abstention, sycophancy]
    catalog: {label: "Entries that score resistance to adversarial attack", href: "#/c/adversarial_robustness"}
  - id: adversarial-testing
    term: Adversarial testing
    short: Testing with inputs built to trip the model up, such as false premises, typos or pressure to change an answer.
    long: >-
      An example is a question that assumes a wrong diagnosis. The aim is to measure how a model
      behaves at its worst.
    see_also: [red-teaming, robustness-perturbation, sycophancy]
    catalog: {label: "Entries that score resistance to adversarial attack", href: "#/c/adversarial_robustness"}
  - id: held-out-test-set
    term: Held-out test set
    short: Test items kept apart from any data used to train or tune the model, so scores reflect new material.
    long: >-
      If a model saw the test questions during training, its score measures memory. Many
      benchmarks built from public exam questions no longer meet this standard, because those
      questions are now in web training data.
    see_also: [contamination, benchmark, synthetic-items]
  - id: arena-pairwise
    term: Arena or pairwise preference
    short: Two models answer the same prompt and a person or judge model picks the better one; rankings come from many votes.
    long: >-
      Pairwise comparison avoids asking raters for absolute scores, which people find hard to give
      consistently. The preferred answer is not always the safer one, so some studies add a
      separate safety check.
    see_also: [win-rate, llm-judge, expert-rating]
    source: {title: "Judging LLM-as-a-judge with MT-Bench and Chatbot Arena (Zheng et al., 2023)", url: "https://arxiv.org/abs/2306.05685"}
  - id: datasheet-model-card
    term: Datasheet and model card
    short: Standard documentation for a dataset (datasheet) or a model (model card) stating what it is for and where it was tested.
    long: >-
      A datasheet records why a dataset was built, who is in it and what it should not be used
      for; a model card does the same for a model. Many catalog entries lack this documentation.
    see_also: [benchmark-card, reproducibility, content-validity]
    source: {title: "Datasheets for Datasets (Gebru et al., 2018)", url: "https://arxiv.org/abs/1803.09010"}
  - id: benchmark-card
    term: Benchmark card
    short: "A short structured summary of a benchmark: what it measures, for whom, how it was built and its known limits."
    long: >-
      Checklists such as BetterBench apply the datasheet idea to benchmarks themselves, asking
      whether items are documented, scoring is reproducible and validity was checked. Entry pages
      in the catalog record similar facts.
    see_also: [datasheet-model-card, construct-validity, reproducibility]
    source: {title: "BetterBench: Assessing AI Benchmarks, Uncovering Issues, and Establishing Best Practices (Reuel et al., 2024)", url: "https://arxiv.org/abs/2411.12990"}

  # Item formats
  - id: multiple-choice-question
    term: Multiple-choice question
    short: A question with a fixed set of options and one correct answer, scored automatically.
    long: >-
      Multiple-choice items are cheap to score, which is why exam-style benchmarks dominate the
      catalog. They test recall and say nothing about whether a model can explain a diagnosis to
      a worried parent.
    see_also: [exact-match, usmle, open-ended-answer]
    catalog: {label: "Entries scored by multiple choice or exact match", href: "#/catalog?methods=mcq_exact_match"}
  - id: open-ended-answer
    term: Open-ended answer
    short: A free-text response with no fixed correct option, such as an explanation or a piece of advice.
    long: >-
      Most real chatbot use is open-ended: "my baby has a fever, what should I do?" There is no
      single right wording, so scoring needs a reference answer, a rubric, a judge model or human
      raters.
    see_also: [rubric, llm-judge, reference-answer, expert-rating]
  - id: clinical-vignette
    term: Clinical vignette
    short: A short written case describing a patient, used to ask what a model would diagnose, order or advise.
    long: >-
      A vignette might read: "A two-year-old with three days of fever, fast breathing and chest
      indrawing is brought to a rural clinic." Vignettes are tidier than real consultations, where
      information arrives in pieces and some of it is wrong.
    see_also: [simulated-patient, multiple-choice-question, usmle]
  - id: consumer-health-question
    term: Consumer health question
    short: A question as a member of the public would ask it, in plain words and often with details missing.
    long: >-
      Consumer questions are messy by design: "is it ok to give my kid paracetamol and ibuprofen
      together?" They test whether a model understands lay language and answers at the right
      level.
    see_also: [real-user-queries, readability-health-literacy, open-ended-answer]
    catalog: {label: "Entries built for patients and the public", href: "#/catalog?users=patient_public"}
  - id: multi-turn-conversation
    term: Multi-turn conversation
    short: An evaluation that scores a whole exchange of several messages.
    long: >-
      Multi-turn tests check whether a model asks follow-up questions, remembers earlier answers
      and changes its advice when new facts appear. A model that gives good single answers can
      still lose track by the fifth turn.
    see_also: [simulated-patient, real-user-queries, osce]
    catalog: {label: "Entries scored on simulated conversations", href: "#/catalog?methods=simulated_multi_turn"}
  - id: simulated-patient
    term: Simulated patient
    short: A scripted or LLM-played patient who talks with the model under test, so the exchange can be repeated and scored.
    long: >-
      The simulated patient has a hidden case, such as age, symptoms and history, which the model
      must draw out. The weakness is that simulated patients behave more consistently than real
      people do.
    see_also: [multi-turn-conversation, osce, synthetic-items]
    catalog: {label: "Entries scored on simulated conversations", href: "#/catalog?methods=simulated_multi_turn"}
  - id: osce
    term: OSCE
    short: Objective Structured Clinical Examination, a medical school exam with standardized patients at stations, now adapted to test AI.
    long: >-
      In a human OSCE, an examiner scores history taking, examination, communication and the plan
      against a checklist. AI OSCEs reuse this format: the model talks with a simulated patient and
      is marked on the same checklist, so the process is scored as well as the final answer.
    see_also: [simulated-patient, multi-turn-conversation, rubric]
  - id: synthetic-items
    term: Synthetic (LLM-generated) items
    short: Test questions or cases written by a language model rather than by people or taken from real records.
    long: >-
      Synthetic items are fast and cheap and avoid privacy problems, but they mirror the
      generating model's blind spots and can repeat its errors as "correct" answers. Good practice
      is to have clinicians review a sample before use.
    see_also: [real-user-queries, contamination, content-validity]
  - id: real-user-queries
    term: Real-user queries
    short: Questions taken from real people using a deployed chatbot, search engine or helpline.
    long: >-
      Real queries show what people actually ask, including spelling, slang, local drug names and
      mixed languages. They need consent and de-identification, and they reflect who already uses
      the service rather than everyone who needs it.
    see_also: [consumer-health-question, synthetic-items, multi-turn-conversation]
    catalog: {label: "Entries scored on real users' conversations", href: "#/catalog?methods=real_user_data"}

  # Scoring
  - id: exact-match
    term: Exact match
    short: The answer counts as correct only if it matches the reference exactly, after simple cleanup such as case and spacing.
    long: >-
      Exact match suits multiple-choice letters, numbers and short facts. It fails on free text,
      where "give ORS and zinc" and "oral rehydration solution plus zinc" would score differently.
    see_also: [accuracy, multiple-choice-question, f1]
    catalog: {label: "Entries scored by multiple choice or exact match", href: "#/catalog?methods=mcq_exact_match"}
  - id: accuracy
    term: Accuracy
    short: The share of items answered correctly, usually reported as a percentage.
    long: >-
      Accuracy hides which items were wrong: a model with 85 percent accuracy may fail every
      question about pregnancy. Comparing accuracy across benchmarks is unsafe, since difficulty
      and the number of options differ.
    see_also: [exact-match, baseline, confidence-interval]
  - id: f1
    term: F1
    short: A score that balances precision (how many claimed items are right) and recall (how many right items were found).
    long: >-
      F1 runs from 0 to 1 and is used when an answer has several parts, such as a list of
      diagnoses, or in extraction tasks such as finding conditions in a clinical note. A model
      that lists everything scores high on recall but low on precision, and F1 penalizes both.
    see_also: [accuracy, exact-match, clinical-note-ehr]
  - id: bleu-rouge
    term: BLEU and ROUGE
    short: Formulas that score how much an answer's words and phrases overlap with a reference answer.
    long: >-
      BLEU comes from machine translation and ROUGE from summarization. Both are blind to meaning:
      a correct answer phrased differently scores low, and a wrong answer that reuses the
      reference's words scores high.
    see_also: [bertscore, reference-answer]
    catalog: {label: "Entries scored by automatic text metrics", href: "#/catalog?methods=automatic_metric"}
    source: {title: "BLEU: a Method for Automatic Evaluation of Machine Translation (Papineni et al., 2002)", url: "https://aclanthology.org/P02-1040/"}
  - id: bertscore
    term: BERTScore
    short: A similarity score that compares the meaning of an answer and a reference using a language model's word representations.
    long: >-
      BERTScore improves on word-overlap metrics by matching words with similar meaning, so
      "fever" and "high temperature" can count as close. It still rewards similarity to one
      reference rather than correctness, and it cannot tell that a single wrong dose makes an
      otherwise similar answer dangerous.
    see_also: [bleu-rouge, reference-answer]
    catalog: {label: "Entries scored by automatic text metrics", href: "#/catalog?methods=automatic_metric"}
    source: {title: "BERTScore: Evaluating Text Generation with BERT (Zhang et al., 2020)", url: "https://arxiv.org/abs/1904.09675"}
  - id: reference-answer
    term: Reference answer
    short: A model answer, usually written by a clinician, that metrics or raters compare the model's output against.
    long: >-
      A reference that follows one country's guideline will penalize a correct answer for another.
      Many benchmarks use a single reference, although most health questions have several valid
      answers.
    see_also: [bleu-rouge, bertscore, rubric, clinical-guideline]
  - id: rubric
    term: Rubric
    short: A written list of what a good answer must contain or avoid, used to score answers consistently.
    long: >-
      For a question about a child's fever, lines might be: names the danger signs, advises care
      today if breathing is fast, does not recommend aspirin. Rubrics can be general (one set for
      all questions) or written per item.
    see_also: [rubric-criterion, llm-judge, consensus-criteria, evaluation-framework]
    catalog: {label: "Entries scored by an LLM judge with a rubric", href: "#/catalog?methods=rubric_llm_judge"}
  - id: rubric-criterion
    term: Rubric criterion
    short: A single line of a rubric, one specific thing to check, often with points for meeting or failing it.
    long: >-
      HealthBench scores each conversation against physician-written criteria, each with a
      positive or negative point value. A concrete criterion like "advises going to a facility
      today" is easier to judge than "is empathetic".
    see_also: [rubric, inter-rater-reliability, red-flags-emergency]
    source: {title: "HealthBench: Evaluating Large Language Models Towards Improved Human Health (Arora et al., 2025)", url: "https://arxiv.org/abs/2505.08775"}
  - id: llm-judge
    term: LLM-as-judge
    short: A language model scores or ranks another model's answers, usually following a rubric or comparing two answers.
    long: >-
      Judge models make large-scale scoring of open-ended answers affordable, but they are known
      to favor longer answers, their own style and the first of two options, and can miss clinical
      errors an expert would catch. Reporting how closely the judge agrees with human experts is
      now expected practice.
    see_also: [rubric, judge-human-agreement, arena-pairwise, expert-rating]
    catalog: {label: "Entries scored by an LLM judge with a rubric", href: "#/catalog?methods=rubric_llm_judge"}
    source: {title: "Judging LLM-as-a-judge with MT-Bench and Chatbot Arena (Zheng et al., 2023)", url: "https://arxiv.org/abs/2306.05685"}
  - id: likert-scale
    term: Likert scale
    short: A rating on a fixed ordered scale, such as 1 to 5, for a quality like accuracy or empathy.
    long: >-
      Raters read the scale points differently, so the same answer may get a 3 from one doctor
      and a 5 from another. Describing each point in words and reporting agreement between raters
      helps.
    see_also: [expert-rating, inter-rater-reliability, empathy]
  - id: win-rate
    term: Win rate
    short: The share of head-to-head comparisons in which a model's answer was preferred over another model's.
    long: >-
      A 60 percent win rate means the model's answer was chosen in 6 of 10 comparisons. It depends
      on the opponent, so 90 percent against a weak model says little about safety for real users.
    see_also: [arena-pairwise, llm-judge]
  - id: expert-rating
    term: Expert rating
    short: Clinicians or other subject experts read the model's answers and score them.
    long: >-
      Expert rating is slow and costly, and experts disagree more than one might expect, so
      studies report how many raters were used and how often they agreed. Who counts as an expert
      matters: a rural nurse and a hospital specialist may judge the same answer differently.
    see_also: [likert-scale, inter-rater-reliability, human-baseline]
    catalog: {label: "Entries scored by expert raters", href: "#/catalog?methods=expert_human_rating"}
  - id: consensus-criteria
    term: Consensus criteria
    short: Scoring criteria agreed by a panel of experts, often through a formal process such as Delphi rounds.
    long: >-
      A panel proposes, rates and revises criteria until most agree, for example on what a
      maternal-health chatbot must always say about bleeding in pregnancy. The result still
      reflects who sat on the panel.
    see_also: [rubric, content-validity, expert-rating]

  # Reliability and validity
  - id: inter-rater-reliability
    term: Inter-rater reliability
    short: How often different raters give the same score to the same answer.
    long: >-
      If two clinicians disagree on whether an answer is safe, the score depends on who was asked.
      Low agreement signals that the rubric is vague or the quality is contested; it is reported
      as percent agreement or with statistics such as Cohen's kappa.
    see_also: [kappa-alpha, judge-human-agreement, rubric-criterion]
    catalog: {label: "Entries that report evaluator agreement", href: "#/c/evaluator_reliability"}
  - id: kappa-alpha
    term: Cohen's kappa and Krippendorff's alpha
    short: Statistics for rater agreement that correct for the agreement expected by chance alone.
    long: >-
      Values near 1 mean strong agreement; near 0 means no better than two raters marking "safe"
      at random. Kappa handles two raters; alpha handles any number of raters, missing ratings and
      different kinds of scale.
    see_also: [inter-rater-reliability, judge-human-agreement]
  - id: judge-human-agreement
    term: Judge-human agreement
    short: How closely a judge model's scores match scores from human experts on the same answers.
    long: >-
      Evaluators score a sample with both humans and the model and compare. High average
      agreement can hide failure on the items that matter most, such as rare emergencies, so good
      reports break it down by category.
    see_also: [llm-judge, inter-rater-reliability, kappa-alpha]
    catalog: {label: "Entries that report evaluator agreement", href: "#/c/evaluator_reliability"}
  - id: construct-validity
    term: Construct validity
    short: Whether a test actually measures the quality it claims to measure.
    long: >-
      A benchmark may call its score "clinical safety" while really measuring recall of exam
      facts. The catalog maps each benchmark's own terms to shared constructs so readers can see
      what was scored.
    see_also: [content-validity, contamination, benchmark-card]
    catalog: {label: "Browse the constructs", href: "#/constructs"}
  - id: content-validity
    term: Content validity
    short: Whether the test items cover the full range of situations the evaluation claims to represent.
    long: >-
      A "maternal health" benchmark with no questions about bleeding after birth has weak content
      validity. Checks include mapping items against guidelines or against what real users ask.
    see_also: [construct-validity, synthetic-items, consensus-criteria]
  - id: contamination
    term: Contamination
    short: Test questions that were present in a model's training data, so scores overstate its ability.
    long: >-
      Public exam questions and popular benchmarks are on the web, which is where training data
      comes from. A sign is a very high score on an old benchmark and a much lower one on fresh
      questions of the same type.
    see_also: [held-out-test-set, saturation, synthetic-items]
  - id: saturation
    term: Saturation
    short: When leading models all score near the top of a benchmark, so it can no longer tell them apart.
    long: >-
      Many exam-style medical benchmarks are saturated, with top models scoring above 90 percent.
      A saturated benchmark still catches weak models but says nothing about which strong model
      to deploy.
    see_also: [leaderboard, contamination, low-resource-setting]
  - id: baseline
    term: Baseline
    short: A reference score to compare against, such as random guessing, a simple method or an older model.
    long: >-
      On a four-option question, random guessing gives 25 percent, so 40 percent is only a modest
      gain. Reports without a baseline are hard to interpret.
    see_also: [human-baseline, accuracy]
  - id: human-baseline
    term: Human baseline
    short: The score that people, often clinicians or students, achieve on the same test, for comparison with the model.
    long: >-
      The details matter: were the humans experts or students, under time pressure, with or
      without reference books? "Beats doctors on exam questions" rarely carries over to real
      consultations, where the task is different.
    see_also: [baseline, expert-rating]
  - id: confidence-interval
    term: Confidence interval
    short: A range around a score showing how much it might change if the test were run again with different items.
    long: >-
      A benchmark with 100 questions gives a rough estimate: 80 percent could easily be 72 or 88
      on another sample. Two models whose intervals overlap should not be ranked against each
      other.
    see_also: [accuracy, reproducibility, leaderboard]
  - id: robustness-perturbation
    term: Robustness and perturbation
    short: Whether scores hold up when inputs change slightly, such as typos, rephrasing, another language or reordered options.
    long: >-
      Perturbation tests take an existing item and vary it in ways that should not change the
      right answer. A model that answers correctly in English and wrongly in Swahili is fragile.
    see_also: [adversarial-testing, prompt-sensitivity, reproducibility]
    catalog: {label: "Entries that score robustness to input variation", href: "#/c/perturbation_robustness"}
  - id: reproducibility
    term: Reproducibility
    short: Whether another team can rerun the evaluation and get the same result.
    long: >-
      Reproducibility needs the items, the scoring code, the prompts and the model version. Many
      entries describe a test without releasing it, which makes their results impossible to check.
    see_also: [evaluation-harness, confidence-interval, datasheet-model-card]
  - id: prompt-sensitivity
    term: Zero-shot, few-shot and prompt sensitivity
    short: How a model is asked affects its score; zero-shot gives no examples and few-shot puts worked examples in the prompt.
    long: >-
      The same model can score several points higher or lower depending on wording and
      instructions such as "think step by step". For a deployed chatbot, the score that matters is
      the one under the prompt it will actually use.
    see_also: [evaluation-harness, robustness-perturbation]

  # Behaviours judged
  - id: hallucination
    term: Hallucination
    short: False or invented content stated confidently, such as a drug that does not exist or a made-up guideline.
    long: >-
      Evaluations count unsupported claims, often by having a judge or expert check each
      statement. Fluent writing makes hallucinations hard for a lay user to spot.
    see_also: [grounding, expressed-uncertainty, llm-judge]
    catalog: {label: "Entries that score avoidance of fabrication", href: "#/c/hallucination_avoidance"}
  - id: grounding
    term: Grounding
    short: Whether an answer sticks to its sources, such as a guideline, a retrieved document or the user's own words.
    long: >-
      Grounding evaluations check that each claim is supported by the provided material. A
      grounded answer can still be wrong if the source is wrong or out of date for that country.
    see_also: [hallucination, clinical-guideline, pubmed-abstract]
    catalog: {label: "Entries that score faithfulness to sources", href: "#/c/source_faithfulness"}
  - id: sycophancy
    term: Sycophancy
    short: The model's tendency to agree with the user or drop a correct answer under pressure.
    long: >-
      If a user says "are you sure?", a sycophantic model abandons its correct advice. Tests push
      back after a right answer and check whether the model holds firm.
    see_also: [adversarial-testing, expressed-uncertainty, red-teaming]
    catalog: {label: "Entries that score resistance to sycophancy", href: "#/c/sycophancy_resistance"}
  - id: refusal-abstention
    term: Refusal and abstention
    short: When a model declines a request or says it does not know, instead of answering.
    long: >-
      Some requests should be refused, such as how to overdose, and some questions should get
      "I can't tell from this; please see a clinician." Where a safe refusal ends and an unhelpful
      one begins is where benchmarks disagree most.
    see_also: [over-refusal, expressed-uncertainty, red-teaming]
    catalog: {label: "Entries that score refusal of harmful requests", href: "#/c/appropriate_refusal"}
  - id: over-refusal
    term: Over-refusal
    short: Refusing or hedging on safe, legitimate health questions out of excess caution.
    long: >-
      A model that answers "please consult a doctor" to every question about paracetamol dosing is
      useless to a community health worker with no doctor nearby. Tests present benign questions
      that look risky and count needless refusals.
    see_also: [refusal-abstention, community-health-worker, lmic]
    catalog: {label: "Entries that score avoiding over-refusal", href: "#/c/over_refusal_avoidance"}
  - id: red-flags-emergency
    term: Red flags and emergency escalation
    short: Whether the model recognizes danger signs and tells the user to seek urgent care.
    long: >-
      Red flags are symptoms that need immediate attention, such as a child who cannot drink.
      Evaluators plant these in questions and check that the model escalates clearly and early;
      missing one is usually scored as a severe failure.
    see_also: [triage, safety-netting, rubric-criterion]
    catalog: {label: "Entries that score emergency recognition and escalation", href: "#/c/emergency_escalation"}
  - id: empathy
    term: Empathy
    short: Whether the model acknowledges the user's feelings and situation as well as the medical facts.
    long: >-
      Empathy is usually scored by raters or a judge model on a scale, and raters disagree. Warm,
      vague language may score high on empathy and low on usefulness, so good evaluations score
      both.
    see_also: [likert-scale, expert-rating, readability-health-literacy]
    catalog: {label: "Entries that score empathy", href: "#/c/empathy"}
  - id: readability-health-literacy
    term: Readability and health literacy
    short: Whether an answer can be understood by its intended reader, including people with limited schooling.
    long: >-
      Readability formulas estimate the school grade needed to read a text; health literacy asks
      whether the reader can act on it. An answer at university reading level fails most of the
      public.
    see_also: [consumer-health-question, localization, empathy]
    catalog: {label: "Entries that score readability", href: "#/c/readability"}
  - id: bias-fairness
    term: Bias and fairness
    short: Whether answer quality or safety differs by the user's sex, ethnicity, language, location or other group.
    long: >-
      Fairness tests give the same case with different patient details and compare the answers.
      Documented problems include lower accuracy in African languages, and benchmarks disagree on
      what fair means.
    see_also: [localization, robustness-perturbation, low-resource-setting]
    catalog: {label: "Entries that score fairness across groups", href: "#/c/demographic_fairness"}
  - id: expressed-uncertainty
    term: Expressed uncertainty and calibration
    short: Whether the model's confidence matches how often it is right, and whether it says when it is unsure.
    long: >-
      A well-calibrated model that says "I'm fairly sure" is right most of those times. Expressed
      uncertainty is judged in the text: does the answer flag what it does not know?
    see_also: [hallucination, refusal-abstention, sycophancy]
    catalog: {label: "Entries that score uncertainty and abstention", href: "#/c/uncertainty_communication"}
  - id: safety-netting
    term: Safety-netting
    short: Advice on what to watch for and when to seek care, given alongside the main answer.
    long: >-
      Clinicians end many consultations with safety-netting: "if the fever lasts more than three
      days, or he becomes drowsy, go to the clinic." Evaluations check whether the chatbot does
      the same, which matters where the next clinical contact may be far away.
    see_also: [red-flags-emergency, triage, primary-care]
    catalog: {label: "Entries that score safety-netting and follow-up", href: "#/c/safety_netting"}

  # Medical sources
  - id: usmle
    term: USMLE
    short: The United States Medical Licensing Examination, the source of many widely used medical question benchmarks.
    long: >-
      MedQA and later benchmarks drew on USMLE-style questions, and "passes the USMLE" became a
      common claim. The questions reflect US practice and most are now in training data, so scores
      say little about use in a clinic in Malawi or Nepal.
    see_also: [medical-licensing-exam, multiple-choice-question, contamination]
    catalog: {label: "Entries that score exam-style medical knowledge", href: "#/c/exam_knowledge"}
    source: {title: "United States Medical Licensing Examination (official site)", url: "https://www.usmle.org/"}
  - id: medical-licensing-exam
    term: Medical licensing exam
    short: A national exam doctors must pass to practice, often reused as a source of test questions in other countries and languages.
    long: >-
      Benchmarks draw on exams from China, India, Spain, Brazil, Nigeria, Japan and elsewhere,
      which gives a cheap test of knowledge in that language and health system. They still test
      exam skill rather than consultation skill, and exam boards may restrict reuse of their
      questions.
    see_also: [usmle, multiple-choice-question, localization]
    catalog: {label: "Entries that score exam-style medical knowledge", href: "#/c/exam_knowledge"}
  - id: clinical-guideline
    term: Clinical guideline
    short: A published recommendation on how to manage a condition, from a body such as WHO or a national ministry of health.
    long: >-
      Evaluations compare answers with the guideline for the user's country, for example a
      national malaria treatment protocol. Guidelines differ across countries and change over
      time, so the reference must match the setting and the date.
    see_also: [grounding, localization, reference-answer]
    catalog: {label: "Entries that score guideline concordance", href: "#/c/guideline_adherence"}
  - id: clinical-note-ehr
    term: Clinical note and EHR
    short: Text written by health workers about a patient, taken from an electronic health record (EHR) and used as test input.
    long: >-
      Tasks include summarizing a note or extracting diagnoses. Real notes raise privacy concerns,
      so many benchmarks use MIMIC, a de-identified US intensive-care dataset, and few come from
      health systems outside high-income countries.
    see_also: [synthetic-items, f1, real-user-queries]
  - id: pubmed-abstract
    term: PubMed abstract
    short: The summary of a research paper indexed in PubMed, the main database of biomedical literature, used as a source of questions.
    long: >-
      Benchmarks such as PubMedQA ask whether an abstract supports a yes-or-no research question,
      which tests reading of scientific text rather than advising patients. The literature leans
      toward studies from high-income countries.
    see_also: [open-ended-answer, grounding, clinical-guideline]

  # Settings
  - id: lmic
    term: LMIC
    short: Low- and middle-income country, by the World Bank's income groups, where most of the world's people live.
    long: >-
      LMIC covers the World Bank's low, lower-middle and upper-middle income groups, from Burundi
      to Brazil, so the catalog also records each country. Few benchmarks are written in or for
      LMICs, although shortages of health workers make that where chatbots may matter most.
    see_also: [world-bank-income-group, low-resource-setting, localization]
    catalog: {label: "Entries with questions from or for LMICs", href: "#/catalog?origin=lmic"}
  - id: world-bank-income-group
    term: World Bank income group
    short: The World Bank's yearly grouping of countries into low, lower-middle, upper-middle and high income by national income per person.
    long: >-
      The groups are reset each July from gross national income per person, and countries move
      between them. The label hides a lot: Nigeria and India are both lower-middle income with
      very different health systems.
    see_also: [lmic, low-resource-setting, who-region]
    catalog: {label: "Entries from low-income countries", href: "#/catalog?income=low"}
    source: {title: "World Bank Country and Lending Groups", url: "https://datahelpdesk.worldbank.org/knowledgebase/articles/906519-world-bank-country-and-lending-groups"}
  - id: who-region
    term: WHO region
    short: One of the World Health Organization's six regions, such as Africa, South-East Asia or the Eastern Mediterranean.
    long: >-
      The six regions are Africa, the Americas, South-East Asia, Europe, the Eastern Mediterranean
      and the Western Pacific. They follow WHO's administrative structure, so Egypt and Pakistan
      sit in the Eastern Mediterranean and India in South-East Asia.
    see_also: [world-bank-income-group, clinical-guideline]
    catalog: {label: "Map of where benchmarks come from", href: "#/map"}
    source: {title: "WHO regional offices", url: "https://www.who.int/about/who-we-are/regional-offices"}
  - id: community-health-worker
    term: Community health worker
    short: A trained lay health worker who serves their own community, often the first contact for care in rural areas.
    long: >-
      Community health workers check on pregnant women, treat common childhood illness and refer
      danger signs, usually with short training and a protocol to follow. Chatbots for them must
      give protocol-level guidance, and few benchmarks test this.
    see_also: [primary-care, lmic, triage, over-refusal]
    catalog: {label: "Entries built for community health workers", href: "#/catalog?users=chw"}
  - id: primary-care
    term: Primary care
    short: First-contact, general health care, such as a clinic, health center or general practitioner.
    long: >-
      Most health questions people ask a chatbot are primary care questions, such as fever or
      contraception, yet most benchmarks draw on hospital specialist exams. Primary care
      evaluation asks whether a model handles common problems and knows when to refer.
    see_also: [community-health-worker, triage, consumer-health-question]
  - id: triage
    term: Triage
    short: Sorting patients by urgency, such as who needs emergency care now, who can wait, and who can be managed at home.
    long: >-
      Evaluations give cases with known urgency and check whether the model's advice matches.
      Both under-triage (missing an emergency) and over-triage (sending everyone to hospital) are
      scored.
    see_also: [red-flags-emergency, safety-netting, primary-care]
    catalog: {label: "Entries that score acuity classification", href: "#/c/acuity_classification"}
  - id: localization
    term: Localization and cultural adaptation
    short: Changing a benchmark or chatbot to fit a place, including its language, drugs, guidelines, foods, beliefs and health system.
    long: >-
      A localized test uses local drug names and prices, the national protocol and the facilities
      that exist; translation alone is not localization. The catalog distinguishes benchmarks
      written for a setting, adapted to it, or only translated.
    see_also: [lmic, clinical-guideline, bias-fairness, low-resource-setting]
    catalog: {label: "Entries that score fit to local resources and setting", href: "#/c/local_context_fit"}
  - id: low-resource-setting
    term: Low-resource setting
    short: A place with few health workers, drugs, tests or facilities, or a language with little digital text to train on.
    long: >-
      In health, low-resource means a facility without a laboratory or a specialist; in language
      technology, it means a language with little text to train on, such as Hausa. Many users
      face both, and evaluations should say which they test.
    see_also: [lmic, localization, bias-fairness, saturation]
    catalog: {label: "Entries from low-income countries", href: "#/catalog?income=low"}
