# Definitions for the site's Glossary page and its (i) tooltips. build_site.py copies this
# into the site data. `short` shows in tooltips; `long` adds detail on the Glossary page.
groups:
  - id: origin
    name: Where the questions come from
  - id: judged
    name: What gets judged
  - id: scoring
    name: How answers are scored
  - id: source
    name: Access and source
  - id: confidence
    name: How sure we are

terms:
  # Where the questions come from
  - id: lmic
    group: origin
    term: LMIC
    short: A low- or middle-income country, by the World Bank's income groups.
    long: >-
      LMIC covers the World Bank's low, lower-middle and upper-middle income groups. The site uses
      the classification current on 25 October 2026, saved in the repository so labels don't shift
      between builds. Upper-middle is also shown on its own, because large upper-middle producers,
      mostly China, would otherwise hide gaps elsewhere.
    see_also: [income-group, origin]
  - id: income-group
    group: origin
    term: Income group
    short: The World Bank income group of the countries an entry's questions come from.
    long: >-
      Low, lower-middle, upper-middle or high income. An entry with questions from several countries
      can sit in several groups.
    see_also: [lmic]
  - id: region
    group: origin
    term: Region
    short: One of WHO's six regions.
    long: >-
      Africa, the Americas, South-East Asia, Europe, the Eastern Mediterranean and the Western
      Pacific. WHO's grouping differs from the World Bank's in places; Egypt, for example, is in
      the Eastern Mediterranean region rather than Africa.
  - id: origin
    group: origin
    term: Origin
    short: One label that sums up where an entry's questions were written and whether they were made for that place.
    long: >-
      Every entry gets exactly one. LMIC means at least some questions were written in or for a
      low- or middle-income country. The other values are adapted for an LMIC, translated but not
      adapted, high-income, no specific country, and not stated.
    see_also: [origin-lmic, origin-adapted, origin-translated, origin-high, origin-global, origin-unstated]
  - id: origin-lmic
    group: origin
    term: LMIC (origin)
    short: At least some questions were written in or for a low- or middle-income country.
    see_also: [lmic, origin]
  - id: origin-adapted
    group: origin
    term: Adapted for an LMIC
    short: Questions written elsewhere, then changed to fit a low- or middle-income setting.
    long: >-
      Typical changes are local drug names, units, guidelines or disease patterns. A plain
      translation doesn't count; that's "Translated, not adapted".
    see_also: [origin]
  - id: origin-translated
    group: origin
    term: Translated, not adapted
    short: Questions translated into a language used in a low- or middle-income country, with no other changes.
    long: >-
      These test whether a model copes with the language, not whether its advice fits the local
      health system.
    see_also: [origin]
  - id: origin-high
    group: origin
    term: High-income
    short: All of the questions come from high-income countries.
    see_also: [origin]
  - id: origin-global
    group: origin
    term: No specific country
    short: The questions were written to be general, not tied to any country.
    see_also: [origin]
  - id: origin-unstated
    group: origin
    term: Not stated
    short: The source doesn't say where the questions come from.
    long: >-
      This is the largest group. It often means the questions were generated by an LLM or pulled
      from the web without a record of where they came from.
    see_also: [origin]
  - id: country
    group: origin
    term: Country
    short: Countries where the questions were written.
    long: >-
      The people who rated answers and the team that built the entry can be based elsewhere; entry
      pages list those separately.
  - id: language
    group: origin
    term: Language
    short: Languages the questions are written in.
  - id: localization
    group: origin
    term: Made for this setting?
    short: Whether the questions were written for the place they come from, adapted from another source, or translated.

  # What gets judged
  - id: benchmark
    group: judged
    term: Benchmark
    short: Test questions or cases plus a way to score a model's answers, released or described so others can reuse them.
  - id: framework
    group: judged
    term: Evaluation framework
    short: A rubric or set of criteria for judging a model's health answers, with or without its own test questions.
    long: HealthBench's five axes and QUEST are examples. One-off studies that release nothing reusable are not included.
  - id: main-focus
    group: judged
    term: Main focus
    short: The one category each entry is filed under.
    long: >-
      Knowledge and exam questions, open-ended answers and conversation, safety, mental health,
      languages and regions, voice, or evaluation frameworks. An entry has exactly one, so it is a
      rough sort; use the other filters for detail.
  - id: health-area
    group: judged
    term: Health area
    short: The health topics an entry's questions cover.
  - id: term
    group: judged
    term: Term
    short: A quality an entry scores answers on, in the source's own words, such as "Completeness" or "Emergency referrals".
    long: >-
      Agents copied each term with its definition from the paper, dataset card or README, word for
      word where the source gives one. There are 5,950 terms across 818 entries.
    see_also: [term-level, construct]
  - id: term-level
    group: judged
    term: Kind of term
    short: What the source calls a term, such as an axis, dimension, criterion, metric, category or principle.
    long: >-
      Sources nest their terms. HealthBench, for example, has themes, and each theme has criteria.
      Entry pages show this nesting as the source describes it.
  - id: construct
    group: judged
    term: Construct
    short: A quality of a model's answer or behavior that evaluations judge, such as factual accuracy or empathy.
    long: >-
      Each benchmark uses its own terms. To compare them, the terms were clustered and grouped into
      76 constructs in 13 domains. A term can map to more than one construct. The grouping was done
      with LLM help and is exploratory, not an agreed standard.
    see_also: [domain, term, match]
  - id: domain
    group: judged
    term: Domain
    short: A group of related constructs, such as Safety and harm avoidance. There are 13.
    see_also: [construct]
  - id: match
    group: judged
    term: How closely a term matches
    short: How a benchmark's own term relates to the construct it was matched to.
    long: Same idea, narrower, broader, or overlaps. See each one below.
    see_also: [match-same, match-narrower, match-broader, match-partial]
  - id: match-same
    group: judged
    term: Same idea
    short: The source's term means what the construct means.
  - id: match-narrower
    group: judged
    term: Narrower
    short: The term covers one part of the construct.
    long: >-
      For example, "tells the user to call emergency services" is a narrower form of emergency
      escalation. Most matches are narrower, because benchmarks tend to score specific behaviors.
  - id: match-broader
    group: judged
    term: Broader
    short: The term covers this construct and more besides.
  - id: match-partial
    group: judged
    term: Overlaps
    short: The term overlaps the construct but also measures something else.
  - id: disagree
    group: judged
    term: Benchmarks disagree
    short: Benchmarks disagree on what a good answer looks like here, so their scores aren't comparable without reading each definition.
    long: >-
      Three constructs carry this flag: appropriate test use and cost of care, scope boundaries, and
      fairness across groups. For example, some benchmarks treat "consult a professional" as always
      safe, while others penalize it as an empty deflection.

  # How answers are scored
  - id: methods
    group: scoring
    term: How it's scored
    short: How a model's answers are judged.
    see_also: [mcq, metric, llm-judge, expert, simulated, real-users]
  - id: mcq
    group: scoring
    term: Multiple choice or exact match
    short: The model picks an option or gives a short answer that is checked automatically.
  - id: metric
    group: scoring
    term: Automatic text metric
    short: Answers are compared with a reference answer by a formula, such as BLEU, ROUGE or BERTScore.
  - id: llm-judge
    group: scoring
    term: LLM judge with a rubric
    short: Another language model scores each answer against a rubric.
  - id: expert
    group: scoring
    term: Expert rating
    short: Clinicians or other experts read and rate the answers.
  - id: simulated
    group: scoring
    term: Simulated conversation
    short: The model talks with a simulated patient or user over several turns.
  - id: real-users
    group: scoring
    term: Real users' conversations
    short: Answers are scored on conversations with real people using a deployed chatbot.
  - id: users
    group: scoring
    term: Who it's for
    short: Who the chatbot being tested is meant to serve.
    long: Patients and the public, community health workers, nurses and midwives, pharmacists, clinicians, or medical students.
  - id: provenance
    group: scoring
    term: How the questions were made
    short: Where the test questions came from.
    long: >-
      Real user questions, written by clinicians, exam questions, generated by an LLM, taken from an
      earlier dataset, web forums, or research literature. An entry can use several.

  # Access and source
  - id: data-access
    group: source
    term: Data access
    short: Whether you can get the test data.
    long: >-
      Open means anyone can download it. Request access means sign-up or approval first. Not
      released means the authors keep it private. Described only means the paper describes the set
      but shares no data.
  - id: builders
    group: source
    term: Who built it
    short: The kind of organization behind the entry.
    long: Academic, industry lab, implementer or NGO, government, or multilateral agency.
  - id: venue
    group: source
    term: Published as
    short: Peer-reviewed paper, preprint, or grey literature such as reports, dataset cards and websites.
  - id: family
    group: source
    term: Adaptation family
    short: An original benchmark plus the translations and adaptations others built from it.
    long: MedQA has the largest family, with 21 adaptations. The catalog groups a family under its original by default.
  - id: signals
    group: source
    term: Citations, downloads and stars
    short: Citations from OpenAlex, downloads from Hugging Face and stars from GitHub, as of the build date.
    long: They show how much attention an entry gets, not how good it is.
  - id: featured
    group: source
    term: Featured
    short: A short hand-picked list of widely used or LMIC-grounded entries to start with.

  # How sure we are
  - id: confidence
    group: confidence
    term: How sure we are
    short: How confident the extraction is, high, medium or low.
    long: >-
      Low usually means an agent couldn't read the full text or the source was vague. Check the
      source before relying on any single fact.
  - id: full-text
    group: confidence
    term: Full text read
    short: Whether an agent read the full paper, dataset card or README, not just the abstract.
  - id: llm-assisted
    group: confidence
    term: LLM-assisted
    short: Language models screened the search results, extracted the facts and drafted the constructs.
    long: >-
      Expect some errors. Every entry links to its source file in the repository, and corrections
      are welcome as GitHub issues.
