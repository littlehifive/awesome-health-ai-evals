# Help text for the website's own labels: filter names, tags, and coded values. Shown as a
# popover when a reader hovers or taps a label with a dotted underline. build_site.py ships this
# as meta.labels. Domain terms (LLM-as-judge, rubric, LMIC and so on) live in glossary.yaml.
# `short` is the popover text; `long` adds a sentence when the popover has room; `term` is the
# glossary id to link to when one fits.

labels:
  # Filters: what it tests
  - id: main-focus
    name: Main focus
    short: The one category each entry is filed under.
    long: >-
      Knowledge and exam questions, open-ended answers and conversation, safety, mental health,
      languages and regions, voice, or evaluation frameworks. Each entry has exactly one, so use
      the other filters for detail.
  - id: health-area
    name: Health area
    short: The health topics an entry's questions cover, up to four per entry.
  - id: users
    name: Who it's for
    short: Who the chatbot being tested is meant to serve.
    long: Patients and the public, community health workers, nurses and midwives, pharmacists, clinicians, or medical students.
    term: community-health-worker
  - id: construct
    name: What it judges
    short: A quality of a model's answer or behaviour that evaluations score, such as factual accuracy or empathy.
    long: >-
      Each benchmark uses its own terms, so they were matched, with LLM help, to 76 shared
      constructs in 13 domains. A term can match more than one construct, and the matching is
      exploratory.
  - id: domain
    name: Domain
    short: One of 13 groups of related constructs, such as Safety and harm avoidance.
  - id: term
    name: Scoring term
    short: A quality an entry scores answers on, in the source's own words, such as "Completeness" or "Emergency referrals".
    long: >-
      Agents copied each term with its definition from the paper, dataset card or README, word for
      word where the source gives one.
  - id: term-level
    name: Kind of term
    short: What the source calls a term, such as an axis, dimension, criterion, metric, category or principle.
    long: Sources nest their terms. HealthBench, for example, has themes, and each theme has criteria.

  # Filters: where the questions come from
  - id: origin
    name: Origin
    short: Where an entry's questions were written, and whether they were made for that place.
    long: >-
      Each entry gets exactly one. The values are LMIC, adapted for an LMIC, translated but not
      adapted, high-income, no specific country, and not stated.
    term: lmic
  - id: origin-lmic
    name: LMIC
    short: At least some questions were written in or for a low- or middle-income country.
    term: lmic
  - id: origin-adapted
    name: Adapted for an LMIC
    short: Questions written elsewhere, then changed to fit a low- or middle-income setting.
    long: >-
      Typical changes are local drug names, units, guidelines or disease patterns. A plain
      translation doesn't count; that's "Translated, not adapted".
    term: localization
  - id: origin-translated
    name: Translated, not adapted
    short: Questions translated into a language used in a low- or middle-income country, with no other changes.
    long: >-
      These test whether a model copes with the language. Whether its advice fits the local
      health system is a separate question.
  - id: origin-high
    name: High-income
    short: All of the questions come from high-income countries.
  - id: origin-global
    name: No specific country
    short: The questions were written to be general, with no particular country in mind.
  - id: origin-unstated
    name: Not stated
    short: The source doesn't say where the questions come from.
    long: >-
      This is the largest group. It often means the questions were generated by an LLM or pulled
      from the web without a record of where they came from.
  - id: income-group
    name: Income group
    short: The World Bank income group of the countries an entry's questions come from.
    long: Low, lower-middle, upper-middle or high income. An entry with questions from several countries can sit in several groups.
    term: world-bank-income-group
  - id: region
    name: Region
    short: One of WHO's six regions, for the countries the questions come from.
    term: who-region
  - id: country
    name: Country
    short: Countries where the questions were written.
    long: The people who rated answers and the team that built the entry can be based elsewhere; entry pages list those separately.
  - id: language
    name: Language
    short: Languages the questions are written in.
  - id: localization
    name: Made for this setting?
    short: Whether the questions were written for the place they come from, adapted from another source, or translated.
    term: localization

  # Filters: how it works
  - id: kind
    name: Benchmark or framework
    short: Benchmarks ship test questions and a scoring method; frameworks are rubrics or criteria, with or without their own questions.
    term: benchmark
  - id: benchmark
    name: Benchmark
    short: Test questions or cases plus a way to score a model's answers, released or described so others can reuse them.
    term: benchmark
  - id: framework
    name: Evaluation framework
    short: A rubric or set of criteria for judging a model's health answers, with or without its own test questions.
    term: evaluation-framework
  - id: methods
    name: How it's scored
    short: The ways a model's answers are judged, of which an entry can use several.
  - id: mcq
    name: Multiple choice or exact match
    short: The model picks an option or gives a short answer that is checked automatically.
    term: exact-match
  - id: metric
    name: Automatic text metric
    short: Answers are compared with a reference answer by a formula, such as BLEU, ROUGE or BERTScore.
    term: bleu-rouge
  - id: llm-judge
    name: LLM judge with a rubric
    short: Another language model scores each answer against a rubric.
    term: llm-judge
  - id: expert
    name: Expert rating
    short: Clinicians or other experts read and rate the answers.
    term: expert-rating
  - id: simulated
    name: Simulated conversation
    short: The model talks with a simulated patient or user over several turns.
    term: simulated-patient
  - id: real-users
    name: Real users' conversations
    short: Answers are scored on conversations with real people using a deployed chatbot.
    term: real-user-queries
  - id: provenance
    name: How the questions were made
    short: Where the test questions came from.
    long: >-
      Real user questions, written by clinicians, exam questions, generated by an LLM, taken from an
      earlier dataset, web forums, or research literature. An entry can use several.

  # Filters: access and source
  - id: data-access
    name: Data access
    short: Whether you can get the test data.
    long: >-
      Open means anyone can download it; request access means sign-up or approval first. Not
      released means the authors keep it private; described only means the paper describes the set
      but shares no data.
  - id: builders
    name: Who built it
    short: The kind of organization behind the entry.
    long: Academic, industry lab, implementer or NGO, government, or multilateral agency.
  - id: venue
    name: Published as
    short: Peer-reviewed paper, preprint, or grey literature such as reports, dataset cards and websites.
  - id: family
    name: Adaptation family
    short: An original benchmark plus the translations and adaptations others built from it.
    long: MedQA has the largest family. The catalog groups a family under its original by default.
  - id: signals
    name: Citations, downloads and stars
    short: Citations from OpenAlex, downloads from Hugging Face and stars from GitHub, as of the build date.
    long: They measure attention rather than quality.
  - id: featured
    name: Featured
    short: A short hand-picked list of widely used or LMIC-grounded entries to start with.

  # Matching terms to constructs
  - id: match
    name: How closely a term matches
    short: How a benchmark's own term relates to the construct it was matched to.
    long: Same idea, narrower, broader, or overlaps.
  - id: match-same
    name: Same idea
    short: The source's term means what the construct means.
  - id: match-narrower
    name: Narrower
    short: The term covers one part of the construct.
    long: >-
      For example, "tells the user to call emergency services" is a narrower form of emergency
      escalation. Most matches are narrower, because benchmarks tend to score specific behaviours.
  - id: match-broader
    name: Broader
    short: The term covers this construct and more besides.
  - id: match-partial
    name: Overlaps
    short: The term overlaps the construct but also measures something else.
  - id: disagree
    name: Benchmarks disagree
    short: Benchmarks disagree on what a good answer looks like here, so their scores aren't comparable without reading each definition.
    long: >-
      Three constructs carry this flag: appropriate test use and cost of care, scope boundaries, and
      fairness across groups. For example, some benchmarks treat "consult a professional" as always
      safe, while others penalize it as an empty deflection.

  # Sources
  - id: full-text
    name: Full text read
    short: Whether an agent read the whole paper, dataset card or README, or only the abstract.
  - id: llm-assisted
    name: LLM-assisted
    short: Language models screened the search results, extracted the facts and drafted the constructs.
    long: Expect some errors. Every entry links to its source file in the repository, and corrections are welcome as GitHub issues.

# One plain sentence per match type, used where a mark needs explaining (for example in Compare).
relationship_sentences:
  same: This term means the same as the construct.
  narrower: This term covers one part of the construct.
  broader: This term covers the construct and more besides.
  partial: This term overlaps the construct but also measures something else.
