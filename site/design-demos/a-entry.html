<!--
  a-entry.html
  Direction A: Angled Fluid Gradient (reference: Stripe). Picked by roulette from the style library.
  Logic: one multi-colour fluid gradient band as the hero background, pure white content below, near-black text,
  section edges cut at an angle with clip-path, a rational CSS Grid body, and one slow gradient drift (off under
  prefers-reduced-motion). On the entry and catalog pages the gradient is only a pale angled wash behind the title block.

  Design read: a public reference catalog for health researchers and implementers, with a Stripe-like
  angled-gradient language, built with native CSS.
  Dials: layout variance medium (angled band on home, calm grids elsewhere); motion low (hover plus one 32 s drift);
  density medium on the catalog and the entry page.

  Fonts: Hanken Grotesk (headings and body) from Google Fonts; Inter and the system sans as fallbacks.
  Accent: #0B7285 deep teal, for links, buttons, focus rings and selected states on all three pages (#5EC4CD in dark).
  Gradient: ink blue #0B2A4A, sea blue #0D4668, teal #0F7F93, sea green #1FAE8C, with a warm sand #F2DFB9 light.
  Radius system: 4 px chips, tags and inputs; 8 px buttons, cards and panels; 14 px the hero map card and the filter sheet.

  Why it fits: a reference catalog needs white, grid-aligned, typographically quiet surfaces, and this direction keeps
  every content surface exactly that. The gradient gives the site one warm, recognisable signature (ink to teal to sand,
  the colours of water, land and public-health maps rather than the usual purple glow) without any decoration. The angled
  edge marks the hand-off from the single expressive moment to the rational body, so entry and catalog pages read as
  documentation, not as a landing page.
-->

  const lab = (map, v) => (L[map] && L[map][v]) || v;
  const labs = (map, arr) => (arr || []).map(v => lab(map, v));

  const lc = s => (s.length > 1 && s[1] === s[1].toLowerCase()) ? s.charAt(0).toLowerCase() + s.slice(1) : s;
  const joinAnd = a => a.length <= 1 ? a.join('') : a.length === 2 ? a.join(' and ') : a.slice(0, -1).join(', ') + ', and ' + a[a.length - 1];
  const fmtDate = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }); };
  const hf = (E.links.huggingface || [])[0];
  const hfUrl = hf ? 'https://huggingface.co/datasets/' + hf : null;

  // Title block
  document.title = E.name + ' | awesome health ai evals';
  document.getElementById('crumbSection').textContent = lab('section', E.section);
  document.getElementById('crumbName').textContent = E.name;
  document.getElementById('title').textContent = E.name;
  document.getElementById('meta').innerHTML = [lab('kind', E.kind), String(E.year), lab('origin', E.origin), E.featured ? 'Featured' : null]
    .filter(Boolean).map(s => `<span>${esc(s)}</span>`).join('');
  document.getElementById('lede').textContent = E.summary;
  const acts = [];
  if (E.links.paper) acts.push(`<a class="btn btn-secondary btn-sm" href="${esc(E.links.paper)}">Paper</a>`);
  if (hfUrl) acts.push(`<a class="btn btn-secondary btn-sm" href="${esc(hfUrl)}">Dataset (Hugging Face)</a>`);
  if (E.links.code) acts.push(`<a class="btn btn-secondary btn-sm" href="${esc(E.links.code)}">Code</a>`);
  if (E.links.website) acts.push(`<a class="btn btn-secondary btn-sm" href="${esc(E.links.website)}">Website</a>`);
  acts.push(`<button class="btn btn-primary btn-sm" type="button">Compare</button>`);
  document.getElementById('actions').innerHTML = acts.join('');

  // Details panel
  const where = () => {
    const names = (E.country_names || []).filter(n => n && n !== 'Unknown');
    const sub = [...labs('income', E.income), ...labs('regions', E.regions)];
    return { names, sub };
  };
  const w = where();
  const details = [
    ['Type', lab('kind', E.kind)],
    ['Year', String(E.year)],
    ['Size', E.size],
    ["How it's scored", labs('methods', E.methods).join(', ')],
    ["Who it's for", labs('users', E.users).join(', ')],
    ['Languages', (E.languages || []).join(', ')],
    ['Where the questions come from', w.names.length ? esc(w.names.join(', ')) + (w.sub.length ? `<span class="sub">${esc(w.sub.join(', '))}</span>` : '') : null, true],
    ['Health areas', labs('health_areas', E.health_areas).join(', ')],
    ['Data access and license', [lab('open_data', E.open_data), E.license].filter(Boolean).join(', ')],
    ['Built by', esc(labs('builders', E.builders).join(', ')) + ((E.lead_country_names || []).length ? `<span class="sub">${esc(E.lead_country_names.join(', '))}</span>` : ''), true],
  ];
  document.getElementById('details').innerHTML = details.filter(r => r[1]).map(([k, v, raw]) =>
    `<div class="row"><dt>${esc(k)}</dt><dd>${raw ? v : esc(v)}</dd></div>`).join('');

  // Sections
  const sections = [];
  const facts = rows => `<dl class="facts">${rows.filter(r => r[1]).map(([k, v, raw]) => `<dt>${esc(k)}</dt><dd>${raw ? v : esc(v)}</dd>`).join('')}</dl>`;

  const users = labs('users', E.users).map(lc), areas = labs('health_areas', E.health_areas).map(lc);
  sections.push(['purpose', "Purpose and who it's for", `
    ${facts([['Intended users', labs('users', E.users).join(', ')], ['Health areas', labs('health_areas', E.health_areas).join(', ')], ['Main focus', lab('section', E.section)]])}
    <p class="note">${esc(E.name)} is meant for ${esc(joinAnd(users))}, and covers ${esc(joinAnd(areas))}. In this catalog its main focus is ${esc(lc(lab('section', E.section)))}.</p>`]);

  const subsets = (E.subsets || []).map(s => s.name + (s.languages && s.languages.length ? ' (' + s.languages.join(', ') + ')' : '')).join('; ');
  sections.push(['contents', "What's in it", `
    ${facts([
      ['Size', E.size],
      ['How the questions were made', labs('provenance', E.provenance).join(', ')],
      ['Languages', (E.languages || []).join(', ')],
      ['Where the questions come from', w.names.length ? esc(w.names.join(', ')) + (w.sub.length ? `<span class="sub">${esc(w.sub.join(', '))}</span>` : '') : null, true],
      ['Subsets', subsets || null],
      ['Made for this setting?', lab('localization', E.localization)],
    ])}
    ${E.origin_note ? `<p class="note"><b>Note on origin.</b> ${esc(E.origin_note)}</p>` : ''}`]);

  const relName = r => lab('relationship', r);
  const termCard = t => `
    <article class="term">
      <div class="term-head"><h4 class="term-name">${esc(t.term)}</h4><span class="tag">${esc(cap(t.level))}</span></div>
      <blockquote class="term-def">${esc(t.definition)}${t.definition_verbatim === false ? '<span class="para">Paraphrased</span>' : ''}</blockquote>
      <div class="term-where"><span>Appears in ${esc(t.location)}</span>${t.scale ? `<span>Scale: ${esc(t.scale)}</span>` : ''}</div>
      <div class="term-constructs">${(t.constructs || []).map(c => `<a class="cchip" href="#" title="${esc(c.domainName)}"><span class="cn">${esc(c.name)}</span><span class="rel">${esc(relName(c.relationship))}</span></a>`).join('')}</div>
    </article>`;
  const top = E.terms.filter(t => !t.parent);
  const groups = {};
  E.terms.filter(t => t.parent).forEach(t => { (groups[t.parent] = groups[t.parent] || []).push(t); });
  const raters = (E.rater_country_names || []).filter(Boolean);
  sections.push(['scoring', 'How answers are judged', `
    ${facts([['Scoring methods', labs('methods', E.methods).join(', ')], ['Raters based in', raters.length ? raters.join(', ') : null]])}
    <h3>Scoring terms</h3>
    <p class="terms-intro">${nf(E.terms.length)} terms, quoted from the source and matched to the catalog's constructs. Each chip names the construct and how closely the source's term matches it.</p>
    <div class="terms">${top.map(termCard).join('')}</div>
    ${Object.entries(groups).map(([parent, ts]) => `
      <div class="term-group">
        <h3>${esc(cap(parent))}</h3>
        <p class="group-note">${nf(ts.length)} terms listed under "${esc(parent)}" in the source.</p>
        <div class="terms">${ts.map(termCard).join('')}</div>
      </div>`).join('')}`]);

  sections.push(['access', 'Access and license', facts([
    ['Data access', lab('open_data', E.open_data)],
    ['License', E.license],
    ['Hugging Face dataset', hf ? `<a href="${esc(hfUrl)}">${esc(hf)}</a>` : null, true],
    ['Code', E.links.code ? `<a href="${esc(E.links.code)}">${esc(E.links.code.replace(/^https?:\/\//, ''))}</a>` : null, true],
  ])]);

  const sig = E.signals || {};
  sections.push(['builders', 'Who built it', facts([
    ['Builder type', labs('builders', E.builders).join(', ')],
    ["Lead institutions' countries", (E.lead_country_names || []).join(', ')],
    ['Published as', lab('venue', E.venue)],
    ['Citations', sig.citations != null ? `${nf(sig.citations)} (${esc(sig.citations_source || '')}), as of ${esc(fmtDate(sig.updated))}` : null, true],
    ['Hugging Face downloads', sig.hf_downloads != null ? `${nf(sig.hf_downloads)}, as of ${esc(fmtDate(sig.updated))}` : null, true],
    ['GitHub stars', sig.github_stars != null ? `${nf(sig.github_stars)}, as of ${esc(fmtDate(sig.updated))}` : null, true],
  ])]);

  if ((E.family || []).length) sections.push(['related', 'Related entries', `
    <p class="note" style="margin:0 0 12px">Adaptations and extensions of ${esc(E.name)} in this catalog.</p>
    <ul class="family">${E.family.map(f => `<li><a href="#">${esc(f.name)}</a><span class="year num">${esc(f.year)}</span><span class="tag">${esc(lab('origin', f.origin))}</span></li>`).join('')}</ul>`]);

  const srcRows = [];
  if (E.links.paper) srcRows.push(['Paper', `<a href="${esc(E.links.paper)}">${esc(E.links.paper.replace(/^https?:\/\//, ''))}</a>${E.links.arxiv ? `<span class="ident">arXiv ${esc(E.links.arxiv)}</span>` : ''}${E.links.doi ? `<span class="ident">DOI ${esc(E.links.doi)}</span>` : ''}`]);
  if (hfUrl) srcRows.push(['Dataset card', `<a href="${esc(hfUrl)}">${esc(hfUrl.replace(/^https?:\/\//, ''))}</a>`]);
  if (E.links.code) srcRows.push(['Code', `<a href="${esc(E.links.code)}">${esc(E.links.code.replace(/^https?:\/\//, ''))}</a>`]);
  if (E.links.website) srcRows.push(['Website', `<a href="${esc(E.links.website)}">${esc(E.links.website.replace(/^https?:\/\//, ''))}</a>`]);
  if ((E.termsSources || []).length) srcRows.push(['Scoring terms copied from', E.termsSources.map(u => `<a href="${esc(u)}">${esc(u.replace(/^https?:\/\//, ''))}</a>`).join('<br>') + (E.termsExtracted ? `<span class="ident">on ${esc(fmtDate(E.termsExtracted))}</span>` : '')]);
  srcRows.push(['Catalog files', `<a href="${REPO}/blob/main/entries/${esc(E.id)}.yaml">entries/${esc(E.id)}.yaml</a><br><a href="${REPO}/blob/main/terms/${esc(E.id)}.yaml">terms/${esc(E.id)}.yaml</a>`]);
  sections.push(['sources', 'Sources', `
    <p class="src-lede">Facts on this page were taken from the documents below on ${esc(fmtDate(E.extracted))}.${E.read_full_text ? ' The full text was read.' : ''}</p>
    <dl class="sources">${srcRows.map(([k, v]) => `<div class="src-row"><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('')}</dl>
    <div class="src-actions"><a class="btn btn-secondary btn-sm" href="${REPO}/issues/new?title=${encodeURIComponent('Mistake in ' + E.name)}">Report a mistake</a></div>
    ${E.notes ? `<details class="disclosure"><summary>Notes from extraction</summary><p>${esc(E.notes)}</p></details>` : ''}`]);

  document.getElementById('main').innerHTML = sections.map(([id, title, body]) => `<section id="${id}" aria-labelledby="h-${id}"><h2 id="h-${id}">${esc(title)}</h2>${body}</section>`).join('');
  document.getElementById('toc').innerHTML = sections.map(([id, title]) => `<li><a href="#${id}">${esc(title)}</a></li>`).join('');

  // Header: menu and theme toggle
  const head = document.getElementById('head'), toggle = document.getElementById('navToggle');
  toggle.addEventListener('click', () => { const open = head.classList.toggle('open'); toggle.setAttribute('aria-expanded', String(open)); });
  const root = document.documentElement, tb = document.getElementById('theme');
  tb.addEventListener('click', () => {
    const dark = root.getAttribute('data-theme') === 'dark' || (!root.hasAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'light' : 'dark'); tb.setAttribute('aria-pressed', String(!dark));
  });
})();
</script>

</body>
</html>
