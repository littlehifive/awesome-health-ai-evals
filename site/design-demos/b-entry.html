<title>HealthBench, awesome health ai evals</title>
<!--
  Direction B (b-entry.html): transfer the design system of one excellently designed analogue site to our pages, our words and our data.

  Reference: Our World in Data (ourworldindata.org). Verified on 2026-10-26 by reading the live homepage, the /data search page, the grapher data page for life expectancy, and the live stylesheet at /assets/owid.css.
  Its system: type is Lato for everything (body 13 to 18 px, letter-spacing .01em, weights 400, 700, 900) with Playfair Display 600 and 700 for h1, h2 and chart titles; the nearest open-source fonts are those same two, both on Google Fonts. Colour: white background; a navy family for text and links (text #1d3d63, link blue #426591, muted blue #577291, rules and fills #dbe5f0 and #ebeef2, pale panels #f0f4fa, greys #5b5b5b and #767676); a dark navy site header (#002147) with white text; vermillion #ce261e kept for the donate button only; maps use binned sequential scales with a horizontal legend and charts use a muted multi-hue palette. Grid: 12 columns with 24 px gutters, 1280 px of inner width inside a 1420 px wrapper with 80 px side padding (16 px on phones). Its data catalog (/data) is a full-width search box with topic and country filters and result rows that show a chart thumbnail, title and subtitle. Its data pages open with a title block, then a pale-blue key-data box of key and value rows (source, date range, unit, last updated), then ruled sections (FAQ, Data sources with per-source key data and retrieval dates, How to cite, Related research, Related charts, Download) built from collapsible expanders. Density is high and motion is nil. Signature elements: Playfair titles over Lato text, thin rules instead of boxes, square buttons (radius 0, padding 8.5 px by 24 px, 14 px Lato), 4 px radius on small controls, small uppercase Lato 900 kickers with .1em tracking, dotted underlines on terms that have a definition on hover, and a chart frame with title, subtitle, legend and source line.

  Design read: a public reference catalog for health researchers and implementers, with Our World in Data's scholarly, ruled language, built with native CSS.
  Dials: layout variance low (one 12-column grid, varied spans), motion low (hover and focus only, prefers-reduced-motion respected), density medium-high.

  Fonts: Playfair Display 600 and 700 for h1, h2, chart titles and the wordmark; Lato 400, 700 and 900 (plus italic 400) for everything else. Loaded from Google Fonts in this mockup; the real site will self-host.
  Accent: #426591 (the reference's link blue), used for links, primary and outline buttons, focus rings, active controls and the active filter chip. The map scale runs #ebeef2, #dbe5f0, #a4b6ca, #6f8bb0, #426591, #1d3d63 for 0, 1, 2 to 5, 6 to 15, 16 to 50, and 51 or more entries, so the darkest bin is the text colour.
  Radius system: 0 on buttons, panels, cards, chart frames and tables (rules, not rounded boxes); 4 px on inputs, tags, chips and icon buttons; nothing else. No shadows.

  Why it fits: a catalog of evaluation evidence by country is the same kind of object as a data site: numbers that have to be read, compared and cited, by people who are not designers. The reference's language (serif titles, sans facts, thin rules, one blue, the map as the key chart, key-value boxes, sources with dates) reads as a reference work rather than a product. It also scales from a 390 px phone to a 1440 px laptop with one grid, and its dark header gives a small personal site a settled identity without a logo.
-->

<style>
/* Tokens. Light values on :root; dark values twice, for the system preference and for the toggle. */
:root{
  --bg:#ffffff;
  --bg-alt:#f0f4fa;
  --bg-fill:#ebeef2;
  --surface:#ffffff;
  --text:#1d3d63;
  --text-2:#5b5b5b;
  --text-3:#6e6e6e;
  --rule:#dbe5f0;
  --rule-2:#e7e7e7;
  --accent:#426591;
  --accent-hover:#355174;
  --accent-soft:#e7f2ff;
  --on-accent:#ffffff;
  --header-bg:#002147;
  --header-text:#ffffff;
  --map-0:#ebeef2;
  --map-1:#dbe5f0;
  --map-2:#a4b6ca;
  --map-3:#6f8bb0;
  --map-4:#426591;
  --map-5:#1d3d63;
  --map-stroke:#ffffff;
  --focus:#426591;
  --radius:0;
  --radius-s:4px;
  --font-serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --font-sans:Lato,"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1726;--bg-alt:#15213a;--bg-fill:#1b2944;--surface:#121d31;
    --text:#e6edf6;--text-2:#b9c5d6;--text-3:#97a7bc;
    --rule:#2a3a55;--rule-2:#24324a;
    --accent:#8fb4e3;--accent-hover:#b4cdef;--accent-soft:#1c2d4a;--on-accent:#0e1726;
    --header-bg:#081425;--header-text:#ffffff;
    --map-0:#1b2944;--map-1:#2a3f61;--map-2:#3d5a85;--map-3:#5a7fb0;--map-4:#8fb4e3;--map-5:#cfe0f5;--map-stroke:#0e1726;
    --focus:#8fb4e3;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1726;--bg-alt:#15213a;--bg-fill:#1b2944;--surface:#121d31;
  --text:#e6edf6;--text-2:#b9c5d6;--text-3:#97a7bc;
  --rule:#2a3a55;--rule-2:#24324a;
  --accent:#8fb4e3;--accent-hover:#b4cdef;--accent-soft:#1c2d4a;--on-accent:#0e1726;
  --header-bg:#081425;--header-text:#ffffff;
  --map-0:#1b2944;--map-1:#2a3f61;--map-2:#3d5a85;--map-3:#5a7fb0;--map-4:#8fb4e3;--map-5:#cfe0f5;--map-stroke:#0e1726;
  --focus:#8fb4e3;color-scheme:dark;
}

/* Base */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--font-sans);letter-spacing:.01em;font-feature-settings:"liga","kern","calt","lnum"}
body.sheet-open{overflow:hidden}
a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{color:var(--accent-hover)}
h1,h2,h3,h4{font-family:var(--font-serif);color:var(--text);margin:0;letter-spacing:0}
h1{font-size:40px;font-weight:700;line-height:1.15}
h2{font-size:26px;font-weight:700;line-height:1.25}
h3{font-size:20px;font-weight:600;line-height:1.3}
h4{font-size:17px;font-weight:600;line-height:1.35}
p{margin:0 0 1em}
ul{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
i.ph{line-height:1}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1360px;margin:0 auto;padding-left:40px;padding-right:40px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:1/-1}
.muted{color:var(--text-2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: no-preference){
  a,.btn,.icon-btn,.ck,.seg button,.views button{transition:background-color .15s,color .15s,border-color .15s}
}

/* Site header: dark navy bar, white wordmark, one-line nav at desktop, hamburger below 900 px */
.site-header{background:var(--header-bg);color:var(--header-text);position:relative;z-index:30}
.bar{display:flex;align-items:center;gap:28px;min-height:64px}
.wordmark{font:700 21px/1 var(--font-serif);color:#fff;text-decoration:none;white-space:nowrap}
.wordmark:hover{color:#fff;text-decoration:underline}
.nav{display:flex;align-items:center;gap:2px;margin-right:auto}
.nav a{display:block;padding:6px 10px;color:#fff;font-size:15px;text-decoration:none;border-bottom:2px solid transparent}
.nav a:hover{color:#fff;text-decoration:underline}
body[data-page="catalog"] .nav a[data-route="catalog"]{border-bottom-color:#fff}
.tools{display:flex;align-items:center;gap:4px;margin-left:auto}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;color:#fff;font-size:21px;text-decoration:none;border-radius:var(--radius-s)}
.icon-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.icon-btn:focus-visible{outline-color:#fff}
.menu-btn{display:none}
@media (max-width: 900px){
  .wrap{padding-left:16px;padding-right:16px}
  .bar{gap:10px}
  .wordmark{font-size:18px}
  .icon-btn{width:34px;height:34px;font-size:20px}
  .tools{gap:0}
  .menu-btn{display:inline-flex}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:0;margin:0;padding:8px 16px 16px;background:var(--header-bg);border-top:1px solid rgba(255,255,255,.18)}
  .site-header.nav-open .nav{display:flex}
  .nav a{padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.12);font-size:17px}
  .grid>.c3,.grid>.c4,.grid>.c5,.grid>.c7,.grid>.c8,.grid>.c9{grid-column:1/-1}
  h1{font-size:30px}
  h2{font-size:23px}
}

/* Buttons and tags. Buttons are square (radius 0); tags and chips take the 4 px radius. */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 22px;border:1px solid transparent;border-radius:var(--radius);font:700 14px/1.5 var(--font-sans);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn-outline{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn-outline:hover{background:var(--accent-soft);color:var(--accent-hover)}
.btn-sm{padding:5px 12px;font-size:13px}
.btn .ph{font-size:16px}
.tag{display:inline-block;padding:1px 8px;border-radius:var(--radius-s);background:var(--bg-fill);color:var(--text);font:700 12px/1.6 var(--font-sans);white-space:nowrap}
.tag-origin{background:var(--accent-soft);color:var(--accent-hover)}
.tag-level{font-weight:400;color:var(--text-2)}
.actions{display:flex;flex-wrap:wrap;gap:12px}

/* Chart frame: title, subtitle, figure, binned legend, source line */
.chart{margin:0;border:1px solid var(--rule);background:var(--surface);padding:16px 20px 12px}
.chart-title{font:600 18px/1.3 var(--font-serif);margin:0 0 2px}
.chart-sub{font-size:13.5px;line-height:1.45;color:var(--text-2);margin:0 0 10px}
#map{min-height:120px}
#map svg{width:100%;height:auto}
.country{fill:var(--map-0);stroke:var(--map-stroke);stroke-width:.5}
.country:hover{stroke:var(--text);stroke-width:1}
.b1{fill:var(--map-1)}.b2{fill:var(--map-2)}.b3{fill:var(--map-3)}.b4{fill:var(--map-4)}.b5{fill:var(--map-5)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;font-size:12.5px;color:var(--text-2)}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:11px;border:1px solid var(--rule)}
.chart-source{margin:10px 0 0;padding-top:8px;border-top:1px solid var(--rule);font-size:12px;color:var(--text-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chart-fallback{font-size:14px;color:var(--text-2);padding:40px 0;text-align:center}

/* Home */
.hero{padding:44px 0 36px}
.hero-text{display:flex;flex-direction:column;justify-content:center;gap:18px;padding-right:16px}
.lede{font-size:19px;line-height:1.5;color:var(--text);margin:0}
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.counter{padding:22px 24px;border-left:1px solid var(--rule)}
.counter:first-child{border-left:0;padding-left:0}
.counter b{display:block;font:700 34px/1.1 var(--font-serif)}
.counter span{display:block;margin-top:6px;font-size:14px;line-height:1.4;color:var(--text-2)}
.ways{padding:40px 0 56px}
.way{display:grid;grid-template-columns:3fr 7fr 2fr;column-gap:24px;align-items:baseline;padding:18px 0;border-top:1px solid var(--rule)}
.way:last-child{border-bottom:1px solid var(--rule)}
.way h2{font-size:22px}
.way h2 a{color:var(--text);text-decoration:none}
.way h2 a:hover{color:var(--accent);text-decoration:underline}
.way p{margin:0;font-size:16px}
.way .n{text-align:right;font-size:14px;color:var(--text-2);white-space:nowrap}
@media (max-width: 900px){
  .hero{padding:28px 0 24px}
  .hero-text{padding-right:0;margin-bottom:24px}
  .counters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .counter{padding:16px}
  .counter:nth-child(odd){border-left:0;padding-left:0}
  .counter:nth-child(n+3){border-top:1px solid var(--rule)}
  .counter b{font-size:28px}
  .way{grid-template-columns:1fr;row-gap:4px}
  .way .n{text-align:left}
}

/* Footer */
.site-footer{margin-top:24px;background:var(--bg-alt);border-top:1px solid var(--rule);padding:28px 0 36px;font-size:14px;color:var(--text-2)}
.foot p{margin:0 0 8px}
.foot-links{display:flex;flex-wrap:wrap;gap:8px 24px}

/* Entry page: title block over an 8-column body, sticky 4-column rail; everything stacks below 900 px */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;padding:18px 0 0;font-size:13px;color:var(--text-2)}
.crumbs li+li::before{content:"/";margin-right:6px;color:var(--text-3)}
.doc-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding-bottom:48px}
.doc-title{grid-column:1/9;grid-row:1;padding:20px 0 28px}
.doc-rail{grid-column:9/13;grid-row:1/3;padding-top:20px}
.doc-body{grid-column:1/9;grid-row:2}
.rail-sticky{position:sticky;top:24px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 16px}
.doc-title .lede{font-size:18px;margin-bottom:18px}
.details{background:var(--bg-alt);border:1px solid var(--rule);padding:4px 18px 6px}
.details h2{font:700 14px/1.4 var(--font-sans);padding:10px 0 6px;border-bottom:1px solid var(--rule)}
.d-row{padding:10px 0;border-top:1px solid var(--rule)}
#details .d-row:first-child{border-top:0}
.d-key{font:700 12.5px/1.4 var(--font-sans);color:var(--text-2)}
.d-val{font-size:15px;line-height:1.45;margin-top:1px}
.d-sub{font-size:13px;color:var(--text-3);margin-top:1px}
.toc{margin-top:22px;padding:0 18px}
.toc h2{font:700 14px/1.4 var(--font-sans);margin-bottom:6px}
.toc a{display:block;padding:5px 0 5px 12px;border-left:2px solid var(--rule);font-size:14px;color:var(--text-2);text-decoration:none}
.toc a:hover{color:var(--accent)}
.toc a.on{border-left-color:var(--accent);color:var(--text);font-weight:700}
.doc{padding:30px 0;border-top:1px solid var(--rule)}
.doc:first-child{border-top:0;padding-top:0}
.doc h2{margin-bottom:14px}
.doc h3{margin:26px 0 10px}
.facts{display:grid;grid-template-columns:minmax(150px,1fr) 3fr;gap:9px 24px;margin:0 0 14px;font-size:15px;line-height:1.5}
.facts dt{font-weight:700;color:var(--text-2)}
.facts dd{margin:0;overflow-wrap:anywhere}
.ident{display:inline-block;margin-left:8px;font-size:12.5px;color:var(--text-3)}
.note{font-size:15px;line-height:1.55}
.term-intro{color:var(--text-2);font-size:15px}
.term-group{margin-top:4px;padding-left:18px;border-left:2px solid var(--rule)}
.term-group-label{font:700 13px/1.4 var(--font-sans);color:var(--text-2);margin:18px 0 0}
.term{padding:16px 0;border-top:1px solid var(--rule-2)}
.term-name{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font:700 16px/1.35 var(--font-sans)}
.term-def{margin:8px 0;padding:0 0 0 14px;border-left:3px solid var(--rule);font-size:15px;line-height:1.55}
.para{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--text-3)}
.term-meta{font-size:13px;color:var(--text-3);margin:0 0 8px}
.cx{display:flex;flex-wrap:wrap;gap:6px}
.cx li{display:inline-flex;align-items:stretch;border:1px solid var(--rule);border-radius:var(--radius-s);font-size:12.5px;line-height:1.5;overflow:hidden}
.cx .cx-name{padding:2px 8px;color:var(--text)}
.cx .cx-rel{padding:2px 8px;border-left:1px solid var(--rule);background:var(--bg-alt);color:var(--text-2)}
.fam li{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px;padding:8px 0;border-top:1px solid var(--rule-2)}
.fam .yr{color:var(--text-2);font-size:14px}
.disc{margin-top:16px;border:1px solid var(--rule)}
.disc summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer}
.disc summary::-webkit-details-marker{display:none}
.disc summary .ph{font-size:16px}
.disc[open] summary .ph{transform:rotate(90deg)}
.disc[open] summary{border-bottom:1px solid var(--rule)}
.disc .body{padding:12px 14px;font-size:14px;line-height:1.55;color:var(--text-2)}
.disc .body p{margin:0}
@media (max-width: 900px){
  .doc-title,.doc-rail,.doc-body{grid-column:1/-1;grid-row:auto}
  .doc-rail{padding-top:0;padding-bottom:28px}
  .rail-sticky{position:static}
  .toc{padding:0}
}
@media (max-width: 600px){
  .facts{grid-template-columns:1fr;gap:2px 0}
  .facts dd{margin-bottom:8px}
}

/* Catalog: 3-column filter rail, 9-column results; rail becomes a sheet below 900 px */
.page-head{padding:34px 0 22px}
.page-head .lede{max-width:70ch;margin-top:10px}
.cat-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;padding-bottom:56px}
.cat-rail{grid-column:1/4}
.cat-main{grid-column:4/13}
.facet{padding:14px 0 16px;border-top:1px solid var(--rule)}
.facet:first-child{border-top:0;padding-top:0}
.facet h2{display:block;margin:0 0 8px;font:700 14px/1.4 var(--font-sans)}
.facet h2 span{border-bottom:1px dotted var(--text-2);cursor:help}
.seg{display:flex;border:1px solid var(--accent);border-radius:var(--radius)}
.seg button{flex:1;padding:6px 4px;font-size:13px;line-height:1.4;color:var(--accent);border-left:1px solid var(--accent)}
.seg button:first-child{border-left:0}
.seg button .n{font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ck{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px;line-height:1.4;cursor:pointer}
.ck input{margin:0;width:15px;height:15px;accent-color:var(--accent);flex:none}
.ck .n{margin-left:auto;padding-left:8px;font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
.more-rows{display:none}
.facet.expanded .more-rows{display:block}
.linkbtn{font-size:13px;color:var(--accent);text-decoration:underline;text-underline-offset:2px;padding:4px 0}
.linkbtn:hover{color:var(--accent-hover)}
.more{border-top:1px solid var(--rule);padding:14px 0}
.more>summary{list-style:none;display:flex;align-items:center;gap:8px;font:700 14px/1.4 var(--font-sans);cursor:pointer}
.more>summary::-webkit-details-marker{display:none}
.more[open]>summary .ph{transform:rotate(90deg)}
.sub{border-top:1px solid var(--rule-2);margin-top:8px}
.sub>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px;cursor:pointer}
.sub>summary::-webkit-details-marker{display:none}
.sub[open]>summary .ph{transform:rotate(90deg)}
.sub .ck{padding-left:22px}
.search{display:block;margin-bottom:18px}
.search .lab{display:block;font:700 13px/1.4 var(--font-sans);color:var(--text-2);margin-bottom:4px}
.search .box{position:relative}
.search input{width:100%;padding:11px 14px 11px 42px;border:1px solid var(--rule);border-radius:var(--radius-s);background:var(--surface);font-size:16px}
.search input:focus{border-color:var(--accent)}
.search .ph{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--text-2)}
.res-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;padding:0 0 12px;border-bottom:1px solid var(--rule);margin-bottom:16px}
.res-count{font:700 16px/1.4 var(--font-sans)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 6px 2px 10px;border:1px solid var(--accent);border-radius:var(--radius-s);font-size:13px;line-height:1.5;color:var(--accent-hover);background:var(--accent-soft)}
.chip button{display:inline-flex;font-size:14px;color:inherit}
.res-right{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;margin-left:auto}
.field{display:flex;flex-direction:column;gap:2px}
.field .lab{font:700 12px/1.4 var(--font-sans);color:var(--text-2)}
.field select{padding:5px 8px;border:1px solid var(--rule);border-radius:var(--radius-s);background:var(--surface);font-size:13.5px}
.views{display:inline-flex;border:1px solid var(--accent);border-radius:var(--radius)}
.views button{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;color:var(--accent);font-size:18px;border-left:1px solid var(--accent)}
.views button:first-child{border-left:0}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.filters-btn{display:none}
.sheet-head{display:none}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.results[data-view="list"] .cards{display:none}
.results[data-view="cards"] .listwrap{display:none}
.card{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border:1px solid var(--rule);background:var(--surface)}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card h3{font-size:18px}
.card h3 a{color:var(--text);text-decoration:none}
.card h3 a:hover{color:var(--accent);text-decoration:underline}
.card .yr{font-size:13.5px;color:var(--text-2);white-space:nowrap}
.card .tags{display:flex;flex-wrap:wrap;gap:6px}
.card .sum{font-size:14.5px;line-height:1.5;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;line-height:1.45}
.card .meta b{font-weight:700;color:var(--text-2);margin-right:4px}
.card .foot{margin-top:auto;padding-top:4px}
.listwrap{overflow-x:auto;border:1px solid var(--rule)}
.list{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
.list th{text-align:left;padding:9px 10px;font:700 12.5px/1.4 var(--font-sans);color:var(--text-2);background:var(--bg-alt);border-bottom:1px solid var(--rule);white-space:nowrap}
.list td{padding:9px 10px;border-top:1px solid var(--rule-2);vertical-align:top}
.list td a{color:var(--text);font-weight:700;text-decoration:none}
.list td a:hover{color:var(--accent);text-decoration:underline}
@media (max-width: 900px){
  .page-head{padding:24px 0 16px}
  .cat-rail,.cat-main{grid-column:1/-1}
  .cat-rail{display:none}
  .cat-rail.open{display:block;position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:0 16px 40px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rule);margin-bottom:8px}
  .filters-btn{display:inline-flex;order:-1;width:100%;justify-content:center;margin-bottom:4px}
  .cards{grid-template-columns:1fr}
  .res-right{margin-left:0}
}
</style>
</head>
<body data-page="entry">
<header class="site-header">
  <div class="wrap bar">
    <a class="wordmark" href="b-home.html">awesome health ai evals</a>
    <ul class="nav" id="nav">
      <li><a href="b-catalog.html" data-route="catalog">Catalog</a></li>
      <li><a href="b-home.html#map-chart" data-route="map">Map</a></li>
      <li><a href="#/constructs" data-route="constructs">Constructs</a></li>
      <li><a href="#/compare" data-route="compare">Compare</a></li>
      <li><a href="#/glossary" data-route="glossary">Glossary</a></li>
      <li><a href="#/about" data-route="about">About</a></li>
    </ul>
    <div class="tools">
      <a class="icon-btn" href="https://github.com/littlehifive/awesome-health-ai-evals" aria-label="GitHub repository"><i class="ph ph-github-logo" aria-hidden="true"></i></a>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch to dark theme"><i class="ph ph-moon" aria-hidden="true"></i></button>
      <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav"><i class="ph ph-list" aria-hidden="true"></i></button>
    </div>
  </div>
</header>
<main id="main" class="wrap">
  <ul class="crumbs" aria-label="Breadcrumb">
    <li><a href="b-catalog.html">Catalog</a></li>
    <li><a href="b-catalog.html" id="crumb-section"></a></li>
    <li id="crumb-name" aria-current="page"></li>
  </ul>
  <div class="doc-grid">
    <div class="doc-title">
      <h1 id="title"></h1>
      <div class="meta-row" id="meta-row"></div>
      <p class="lede" id="lede"></p>
      <div class="actions" id="actions"></div>
    </div>
    <aside class="doc-rail">
      <div class="rail-sticky">
        <section class="details" aria-labelledby="details-h">
          <h2 id="details-h">Details</h2>
          <div id="details"></div>
        </section>
        <nav class="toc" aria-labelledby="toc-h">
          <h2 id="toc-h">On this page</h2>
          <div id="toc"></div>
        </nav>
      </div>
    </aside>
    <div class="doc-body" id="body"></div>
  </div>
</main>
<footer class="site-footer">
  <div class="wrap foot">
    <p>An exploratory catalog built with LLM help, not a systematic review. Found a mistake? <a href="https://github.com/littlehifive/awesome-health-ai-evals/issues">Report it on GitHub</a>.</p>
    <p class="foot-links"><a href="data/catalog.json">Download the data (JSON)</a><span>Code MIT, content CC BY 4.0</span></p>
  </div>
</footer>
<script src="data.js"></script>
<script>
// Shared helpers, theme toggle and mobile nav. Runs after data.js.
const L = DEMO.labels;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lab = (group, v) => (L[group] && L[group][v]) || v;
const labs = (group, arr) => (arr || []).map(v => lab(group, v));
const fmt = n => Number(n).toLocaleString('en-US');
const tag = (t, cls) => `<span class="tag${cls ? ' ' + cls : ''}">${esc(t)}</span>`;
const $ = id => document.getElementById(id);

(function theme() {
  const root = document.documentElement;
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  if (saved === 'dark' || saved === 'light') root.dataset.theme = saved;
  const btn = $('theme-btn');
  const isDark = () => root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  const sync = () => {
    const dark = isDark();
    btn.querySelector('i').className = dark ? 'ph ph-sun' : 'ph ph-moon';
    btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  };
  btn.addEventListener('click', () => {
    root.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
    sync();
  });
  sync();
})();

(function nav() {
  const header = document.querySelector('.site-header');
  const btn = $('menu-btn');
  btn.addEventListener('click', () => {
    const open = header.classList.toggle('nav-open');
    btn.setAttribute('aria-expanded', String(open));
  });
})();

(function entry() {
  const E = DEMO.healthbench;
  const REPO = 'https://github.com/littlehifive/awesome-health-ai-evals';
  const join = a => (a || []).filter(Boolean).join(', ');
  const joinAnd = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  const lc = s => /^[A-Z][a-z]/.test(s) ? s.charAt(0).toLowerCase() + s.slice(1) : s;
  const link = (href, text) => `<a href="${esc(href)}">${esc(text || href)}</a>`;
  const ident = (k, v) => v ? `<span class="ident">${esc(k)} ${esc(v)}</span>` : '';
  // rows: [key, value, isHtml]. Empty values are left out.
  const facts = rows => `<dl class="facts">${rows.filter(r => r[1]).map(r => `<dt>${esc(r[0])}</dt><dd>${r[2] ? r[1] : esc(r[1])}</dd>`).join('')}</dl>`;

  document.title = `${E.name}, awesome health ai evals`;
  $('crumb-section').textContent = lab('section', E.section);
  $('crumb-name').textContent = E.name;
  $('title').textContent = E.name;
  $('meta-row').innerHTML = [
    tag(lab('kind', E.kind)),
    tag(E.year),
    tag(lab('origin', E.origin), 'tag-origin'),
    E.featured ? tag('Featured') : '',
  ].join('');
  $('lede').textContent = E.summary;

  const hf = (E.links.huggingface || [])[0];
  const hfUrl = hf ? 'https://huggingface.co/datasets/' + hf : '';
  const acts = [];
  if (E.links.paper) acts.push(['Paper', E.links.paper, 'ph-file-text']);
  if (hfUrl) acts.push(['Dataset (Hugging Face)', hfUrl, 'ph-database']);
  if (E.links.code) acts.push(['Code', E.links.code, 'ph-code']);
  if (E.links.website) acts.push(['Website', E.links.website, 'ph-globe']);
  $('actions').innerHTML = acts.map(a => `<a class="btn btn-outline btn-sm" href="${esc(a[1])}"><i class="ph ${a[2]}" aria-hidden="true"></i>${esc(a[0])}</a>`).join('')
    + `<button class="btn btn-primary btn-sm" type="button"><i class="ph ph-plus" aria-hidden="true"></i>Compare</button>`;

  const whereSub = join([...labs('income', E.income), ...labs('regions', E.regions)]);
  const rows = [
    ['Type', lab('kind', E.kind)],
    ['Year', String(E.year)],
    ['Size', E.size],
    ["How it's scored", join(labs('methods', E.methods))],
    ["Who it's for", join(labs('users', E.users))],
    ['Languages', join(E.languages)],
    ['Where the questions come from', join(E.country_names), whereSub],
    ['Health areas', join(labs('health_areas', E.health_areas))],
    ['Data access and license', join([lab('open_data', E.open_data), E.license])],
    ['Built by', join(labs('builders', E.builders)), E.lead_country_names.length ? 'Lead institution in ' + join(E.lead_country_names) : ''],
  ];
  $('details').innerHTML = rows.filter(r => r[1]).map(r =>
    `<div class="d-row"><div class="d-key">${esc(r[0])}</div><div class="d-val">${esc(r[1])}</div>${r[2] ? `<div class="d-sub">${esc(r[2])}</div>` : ''}</div>`).join('');

  const secs = [];
  const users = labs('users', E.users), areas = labs('health_areas', E.health_areas);
  secs.push(['purpose', "Purpose and who it's for",
    facts([['Intended users', join(users)], ['Health areas', join(areas)], ['Main focus', lab('section', E.section)]])
    + `<p>${esc(E.name)} is listed under ${esc(lc(lab('section', E.section)))}. The catalog records it as made for ${esc(joinAnd(users.map(lc)))}, covering ${esc(joinAnd(areas.map(lc)))}.</p>`]);

  secs.push(['contents', "What's in it",
    facts([
      ['Size', E.size],
      ['How the questions were made', join(labs('provenance', E.provenance))],
      ['Languages', join(E.languages)],
      ['Countries', join(E.country_names) + (whereSub ? ` (${whereSub})` : '')],
      ['Subsets', (E.subsets || []).map(s => s.name + (s.languages && s.languages.length ? ` (${s.languages.join(', ')})` : '')).join('; ')],
      ['Made for this setting?', lab('localization', E.localization)],
    ])
    + (E.origin_note ? `<p class="note"><b>Note on origin.</b> ${esc(E.origin_note)}</p>` : '')]);

  const relLabel = r => lab('relationship', r).toLowerCase();
  const termHtml = t => `<article class="term">
    <h4 class="term-name">${esc(t.term)} ${tag(t.level, 'tag-level')}</h4>
    <blockquote class="term-def">“${esc(t.definition)}”${t.definition_verbatim === false ? '<span class="para">Paraphrased</span>' : ''}</blockquote>
    <p class="term-meta">${[t.location ? 'Appears in ' + esc(t.location) : '', t.scale ? 'Scale: ' + esc(t.scale) : ''].filter(Boolean).join(' · ')}</p>
    <ul class="cx" aria-label="Matched constructs">${(t.constructs || []).map(c => `<li><span class="cx-name">${esc(c.name)}</span><span class="cx-rel">${esc(relLabel(c.relationship))}</span></li>`).join('')}</ul>
  </article>`;
  const top = E.terms.filter(t => !t.parent);
  const parents = [...new Set(E.terms.filter(t => t.parent).map(t => t.parent))];
  let termsHtml = top.map(termHtml).join('');
  for (const p of parents) {
    const kids = E.terms.filter(t => t.parent === p);
    termsHtml += `<p class="term-group-label">Grouped in the source under “${esc(p)}” (${kids.length} terms)</p><div class="term-group">${kids.map(termHtml).join('')}</div>`;
  }
  secs.push(['judged', 'How answers are judged',
    facts([
      ['Scoring methods', join(labs('methods', E.methods))],
      ['Raters based in', join(E.rater_country_names)],
    ])
    + `<h3>Scoring terms</h3><p class="term-intro">${E.terms.length} terms, copied from the source listed under Sources and matched to the constructs they measure. Each match says whether the term is the same idea as the construct, narrower, broader, or overlapping.</p>${termsHtml}`]);

  secs.push(['access', 'Access and license',
    facts([
      ['Data access', lab('open_data', E.open_data)],
      ['License', E.license],
      ['Hugging Face dataset', hfUrl ? link(hfUrl, hf) : '', true],
      ['Code', E.links.code ? link(E.links.code) : '', true],
    ])]);

  const s = E.signals || {};
  secs.push(['builders', 'Who built it',
    facts([
      ['Built by', join(labs('builders', E.builders))],
      ['Lead institutions in', join(E.lead_country_names)],
      ['Published as', lab('venue', E.venue)],
      ['Citations', s.citations != null ? `${fmt(s.citations)} (${s.citations_source}), as of ${s.updated}` : ''],
    ])]);

  if (E.family && E.family.length) secs.push(['related', 'Related entries',
    `<p class="muted">Adaptations and extensions of ${esc(E.name)} in the catalog.</p><ul class="fam">${E.family.map(f =>
      `<li><a href="#/entry/${esc(f.id)}">${esc(f.name)}</a><span class="yr">${esc(f.year)}</span>${tag(lab('origin', f.origin), 'tag-origin')}</li>`).join('')}</ul>`]);

  secs.push(['sources', 'Sources',
    `<p>Facts on this page were taken from the documents below on ${esc(E.extracted)}.${E.read_full_text ? ' The full text was read.' : ''}</p>`
    + facts([
      ['Paper', E.links.paper ? link(E.links.paper) + ident('DOI', E.links.doi) + ident('arXiv', E.links.arxiv) : '', true],
      ['Dataset card', hfUrl ? link(hfUrl) : '', true],
      ['Code', E.links.code ? link(E.links.code) : '', true],
      ['Website', E.links.website ? link(E.links.website) : '', true],
      ['Scoring terms copied from', (E.termsSources || []).map(u => link(u)).join('<br>') + (E.termsExtracted ? ident('on', E.termsExtracted) : ''), true],
      ['Catalog files', `${link(`${REPO}/blob/main/entries/${E.id}.yaml`, `entries/${E.id}.yaml`)} and ${link(`${REPO}/blob/main/terms/${E.id}.yaml`, `terms/${E.id}.yaml`)} on GitHub`, true],
      ['Report a mistake', link(`${REPO}/issues`, 'Open an issue on GitHub'), true],
    ])
    + (E.notes ? `<details class="disc"><summary><i class="ph ph-caret-right" aria-hidden="true"></i>Notes from extraction</summary><div class="body"><p>${esc(E.notes)}</p></div></details>` : '')]);

  $('body').innerHTML = secs.map(x => `<section class="doc" id="${x[0]}" aria-labelledby="h-${x[0]}"><h2 id="h-${x[0]}">${esc(x[1])}</h2>${x[2]}</section>`).join('');
  $('toc').innerHTML = secs.map(x => `<a href="#${x[0]}" data-sec="${x[0]}">${esc(x[1])}</a>`).join('');

  const links = [...document.querySelectorAll('.toc a')];
  links[0].classList.add('on');
  if ('IntersectionObserver' in window) {
    const obs = new IntersectionObserver(es => {
      for (const e of es) if (e.isIntersecting) links.forEach(l => l.classList.toggle('on', l.dataset.sec === e.target.id));
    }, { rootMargin: '-10% 0px -70% 0px' });
    secs.forEach(x => obs.observe($(x[0])));
  }
})();
</script>
</body>
</html>
