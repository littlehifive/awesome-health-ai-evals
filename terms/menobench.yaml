entry: menobench
sources: [https://doi.org/10.5281/zenodo.20973599, https://zenodo.org/records/20973600/files/README.md, https://zenodo.org/records/20973600/files/DATA_DICTIONARY.md]
extracted: 2026-10-26
terms:
  - term: "Phase accuracy"
    level: dimension
    definition: "Correct STRAW phase(s) cited; distinction made where phases differ"
    definition_verbatim: true
    location: README Scoring rubric table; DATA_DICTIONARY Dimensions 1-8
    scale: "0-1 points (max 12 total)"
  - term: "Directional correctness"
    level: dimension
    definition: "Correct sign on effect; flipped direction = 0 (not partial credit)"
    definition_verbatim: true
    location: README Scoring rubric table; DATA_DICTIONARY Dimensions 1-8
    scale: "0-1 points (max 12 total)"
  - term: "Evidence tier accuracy"
    level: dimension
    definition: "Names correct study design and hierarchy position"
    definition_verbatim: true
    location: README Scoring rubric table; DATA_DICTIONARY Dimensions 1-8
    scale: "0-2 points (max 12 total)"
  - term: "Hedge calibration"
    level: dimension
