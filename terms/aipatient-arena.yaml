entry: aipatient-arena
sources:
- https://arxiv.org/abs/2606.17474
extracted: '2026-10-26'
terms:
- term: Medical interview questioning skills (QS)
  level: dimension
  definition: Quality of the model's questioning during the consultation; one of eight dimensions co-designed by attending physicians and medical AI experts.
  definition_verbatim: false
  location: Abstract; Results (Table 1, Fig. 2); Table 2 failure patterns
  scale: 1-5 score from predefined failure patterns (AI evaluator)
- term: Information coverage (IC)
  level: dimension
  definition: How much of the patient's clinically relevant information the model elicits during the consultation.
  definition_verbatim: false
  location: Abstract; Results (Table 1, Fig. 2); Table 2 failure patterns
  scale: 1-5 score from failure patterns
- term: Handling of ambiguous patient responses (HR)
  level: dimension
  definition: How the model responds to ambiguous or vague patient statements.
  definition_verbatim: false
  location: Abstract; Results (Table 1, Fig. 2); Table 2 failure patterns
  scale: 1-5 score from failure patterns
- term: Ethical and professional conduct (ET)
  level: dimension
  definition: Ethical and professional behavior of the model during the consultation.
  definition_verbatim: false
  location: Abstract; Results (Table 1, Fig. 2); Table 2 failure patterns
  scale: 1-5 score from failure patterns
- term: Clarity and transparency of clinical explanations (EX)
  level: dimension
  definition: Clarity and transparency of the model's explanations to the patient.
  definition_verbatim: false
  location: Abstract; Results (Table 1, Fig. 2); Table 2 failure patterns
  scale: 1-5 score from failure patterns
- term: Information integration (II)
  level: dimension
  definition: Integration of gathered information in the model's summary output.
  definition_verbatim: false
  location: Abstract; Results (Table 1, Fig. 2); Table 2 failure patterns
  scale: 1-5 score from failure patterns
- term: Diagnostic accuracy and reasoning (Dx)
  level: dimension
