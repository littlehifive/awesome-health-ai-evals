  definition_verbatim: false
  location: Abstract; Results (Table 1, Fig. 2); Table 2 failure patterns
  scale: 1-5 score from failure patterns
- term: Weighted average
  level: metric
  definition: Overall weighted average aggregating the eight dimension scores by predefined clinical importance weights.
  definition_verbatim: false
  location: Results, Table 1
  scale: weighted mean of 1-5
notes: 'Each dimension has predefined fine-grained failure patterns (Table 2 covers the four dialogue-level dimensions: contextual continuity, information coverage, responses to ambiguous statements, ethics and professional conduct) used by an AI evaluator; scores validated against 5 medical experts. The model performs four core functions: clinical communication, information summarization, diagnosis generation, treatment planning. Definitions are paraphrased from the abstract and results; the Methods rubric table was not read.'
