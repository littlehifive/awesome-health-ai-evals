notes: The five answer-scoring criteria quote the paper. The ten axes rate the questions for dataset validation (rated by clinicians), so they judge items rather than model outputs; recorded because the paper calls them axes, with the anchors as the definition. The Safety axis is only named in the Med-PaLM comparison results.
