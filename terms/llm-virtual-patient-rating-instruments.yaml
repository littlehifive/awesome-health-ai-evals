notes: Definitions for the 15 items and the bias item are the 'verbatim item wording' column of Table 1 (marked verbatim); the three instrument-level definitions are paraphrases. Table 1 also gives operational clarifications per item (not copied). GPT did not rate user experience or bias. Authors also collected free-text conversation features that influenced authenticity and perceived patient-preference representation (testing, cost, illness control vs lifestyle); not recorded as terms. Reproducibility of ratings was fair to slight (single-rating ICC 0.08-0.40).
