  location: Section 3 (Judge Agent), Table 2
  scale: multi-level score, normalized 0-1
- term: Clinical appropriateness
  level: dimension
  definition: Judge Agent assesses each doctor response for clinical appropriateness, factual correctness and safety as the dialogue progresses (named in the contributions; operationalised through the criteria above).
