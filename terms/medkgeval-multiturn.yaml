  definition_verbatim: true
  location: Section 3 (Judge Agent), Table 2
  scale: multi-level per-turn score, normalized 0-1
- term: Comprehensiveness
  level: criterion
  definition: Whether the model delivers a thorough and informative response addressing all key aspects of the user's query.
  definition_verbatim: true
  location: Section 3 (Judge Agent), Table 2
  scale: multi-level per-turn score, normalized 0-1
- term: Correctness (Disease Diagnosis)
  level: criterion
  definition: Whether the model's final prediction aligns semantically or ontologically with the reference disease.
  definition_verbatim: true
  location: Section 3 (Judge Agent), Table 2
  scale: multi-level score, normalized 0-1
- term: History-taking skill
  level: criterion
