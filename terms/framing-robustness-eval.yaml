notes: Thirteen items from codebook.json, scored by an LLM judge (deepseek-v4-flash) validated against 210 double-coded human ratings. The README also mentions deterministic text metrics (Tier 1) and a GoEmotions emotion classifier (Tier 2) as additional quantifications of communication style; their individual metric names were not read. Definitions are copied from the codebook's definition field; the codebook also gives examples per item.
