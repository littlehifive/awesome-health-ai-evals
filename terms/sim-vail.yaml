    definition_verbatim: false
    location: Methods; Supplementary Table 4
    scale: 1-10
notes: "The judge (claude-opus-4.5) scores 39 dimensions on 1-10; 13 mental-health dimensions are analysed (the abstract's 13). The text names about 15 behaviours, so the exact 13 and their verbatim definitions in Supplementary Table 2 (a figure-like table not recoverable from the PDF text) were not confirmed; names above are taken from the Methods prose, and some may be merged in the paper. Turn-level scoring uses the same dimensions."
