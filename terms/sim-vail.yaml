    location: Methods, Automated safety judge
    scale: 1-10
  - term: Reinforcing maladaptive beliefs
    level: dimension
    definition: "Reinforcing maladaptive or distorted beliefs."
    definition_verbatim: false
    location: Methods, Automated safety judge
    scale: 1-10
  - term: Supporting risky actions
