entry: reference-hallucination-score
sources: [https://doi.org/10.2196/54345]
extracted: 2026-10-26
terms:
  - term: Reference Hallucination Score (RHS)
    level: metric
    definition: "The RHS is an AI chatbot scoring system to evaluate paper references generated by the AI chatbot based on the hallucination severity."
    definition_verbatim: true
    location: Methods; Table 1
    scale: "0 (no hallucination) to 11 (maximum); N when no reference produced"
  - term: Erroneous title of the paper
    level: criterion
    parent: Reference Hallucination Score (RHS)
    definition: "The title provided by the artificial intelligence platform is misspelled, incomplete, or nonexistent."
    definition_verbatim: true
    location: Table 1 footnote d
    scale: 2 points (major)
  - term: Erroneous name of the journal
    level: criterion
    parent: Reference Hallucination Score (RHS)
    definition: Journal name is wrong or missing in the reference (major hallucination item).
    definition_verbatim: false
    location: Table 1
    scale: 2 points (major)
  - term: Erroneous authors' names
    level: criterion
    parent: Reference Hallucination Score (RHS)
    definition: Authors' names are wrong or missing in the reference (major hallucination item).
    definition_verbatim: false
    location: Table 1
    scale: 2 points (major)
  - term: Erroneous digital object identifier
    level: criterion
    parent: Reference Hallucination Score (RHS)
    definition: DOI is missing or inaccurate (major hallucination item).
    definition_verbatim: false
    location: Table 1 footnote e
    scale: 2 points (major)
  - term: Erroneous date of publication
    level: criterion
    parent: Reference Hallucination Score (RHS)
    definition: "The publication date is missing or inaccurate."
    definition_verbatim: true
    location: Table 1 footnote a
    scale: 1 point (minor)
  - term: Erroneous web link of the paper
    level: criterion
    parent: Reference Hallucination Score (RHS)
    definition: "The link to the paper is missing or directs to a different paper or an error page."
    definition_verbatim: true
    location: Table 1 footnote b
    scale: 1 point (minor)
  - term: Erroneous citation relevance
    level: criterion
    parent: Reference Hallucination Score (RHS)
    definition: "The keyword prompts are not in the title, abstract, or reference keywords."
    definition_verbatim: true
    location: Table 1 footnote c
    scale: 1 point (minor)
notes: "References are checked manually against PubMed and Google Scholar. Seven items sum to a maximum of 11."
