notes: A scoping review (285 outcome measures) organized into 7 main categories and 40 subcategories (Table 2), mapped to four evaluation stages. Only the main categories are recorded here; subcategories were not all enumerated. Definitions are paraphrased since the paper reports categories rather than defined constructs. This framework covers outcomes of health chatbot trials, not LLM output rubrics.
