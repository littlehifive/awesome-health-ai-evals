entry: lingxidiagbench
sources: [https://arxiv.org/abs/2602.09379]
extracted: 2026-10-26
terms:
  - term: Diagnostic accuracy (Acc, Top-1, Top-3)
    level: metric
    definition: "Accuracy of psychiatric diagnosis at 2-class (depression vs anxiety), 4-class and 12-class levels; Top-1 and Top-3 accuracy for the 12-class task."
    definition_verbatim: false
    location: Section 4 (static and dynamic evaluation), Tables 4 and 6
    scale: proportion
  - term: Macro F1 and weighted F1
    level: metric
    definition: "F1 scores for the 2, 4 and 12-class diagnosis tasks."
    definition_verbatim: false
    location: Tables 4 and 6
    scale: F1
  - term: Information completeness
    level: dimension
    parent: Doctor Agent consultation quality
    definition: "Consultation-quality dimension judged by GPT-4o on how complete the information gathered by the doctor agent is."
    definition_verbatim: false
    location: Section 4, Doctor Agent Evaluation; Appendix C.2
    scale: 1-6 Likert
  - term: Symptom exploration depth
    level: dimension
    parent: Doctor Agent consultation quality
    definition: "Consultation-quality dimension judged by GPT-4o on how deeply the doctor agent explores symptoms."
    definition_verbatim: false
    location: Section 4, Doctor Agent Evaluation
    scale: 1-6 Likert
  - term: Differential diagnosis awareness
    level: dimension
    parent: Doctor Agent consultation quality
    definition: "Consultation-quality dimension judged by GPT-4o on whether the doctor agent considers alternative diagnoses."
    definition_verbatim: false
