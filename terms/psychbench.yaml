entry: psychbench
sources: [https://arxiv.org/abs/2503.01903]
extracted: 2026-10-26
terms:
  - term: BLEU
    level: metric
    definition: N-gram overlap between generated text and reference, used for chief complaint and structured summary, differential analysis and long-record reading comprehension.
    definition_verbatim: false
    location: Methods, evaluation metrics (Tasks 1, 3, 5)
    scale: automatic, 0-1
  - term: ROUGE-L
    level: metric
    definition: Longest-common-subsequence overlap between generated text and reference.
    definition_verbatim: false
    location: Methods, evaluation metrics (Tasks 1, 3, 5)
    scale: automatic
  - term: BERTScore
    level: metric
    definition: Embedding-based semantic similarity between generated text and reference.
    definition_verbatim: false
    location: Methods, evaluation metrics (Tasks 1, 3, 5)
    scale: automatic
  - term: MNER-F1
    level: metric
    definition: "Medical NER F1 Score: F1 of medical entities extracted by a trained medical NER model from the LLM output versus the reference, assessing key information by strict keyword matching."
    definition_verbatim: false
    location: Methods, evaluation metrics
    scale: automatic F1
  - term: MNER-BERTScore
    level: metric
    definition: "Medical NER BERTScore: semantic similarity (MedicalBERT cosine) between sets of medical entities in the LLM output and the reference."
    definition_verbatim: false
    location: Methods, evaluation metrics
    scale: automatic
  - term: Diagnostic Criteria Completeness Index (DCCI)
    level: metric
    definition: "the percentage of answers generated by the LLM that cover all four diagnostic criteria - symptom criteria, disease course criteria, severity criteria, and exclusion criteria"
    definition_verbatim: true
    location: Methods, Task 1 metrics
    scale: percent of answers
  - term: ICD10-PDA
    level: metric
    definition: "ICD-10 guided Primary Diagnosis Accuracy: 1 if the predicted ICD-10 code exactly matches the reference, 0.5 if the first three digits match (category right, subtype wrong), 0 otherwise."
    definition_verbatim: false
    location: Methods, Task 2 (principal diagnosis)
    scale: 0 / 0.5 / 1 per case
  - term: Acc_main
    level: metric
    definition: Score of 1 if the LLM's identified primary diagnosis matches the reference diagnosis, otherwise 0.
    definition_verbatim: false
    location: Methods, Task 3 (differential analysis)
    scale: binary
  - term: Acc_diff
    level: metric
    definition: Increment of 0.5 for each of two proposed differential diagnoses that matches the reference list, up to a maximum of 1.
    definition_verbatim: false
    location: Methods, Task 3 (differential analysis)
    scale: 0 / 0.5 / 1
  - term: Recommendation Coverage Rate (RCR)
    level: metric
    definition: "ratio of the number of medications recommended by the LLM that are also present in the benchmark response's recommended medications list (formula |D_LLM intersect D_ref| / |D_ref|); quantifies exhaustiveness"
    definition_verbatim: true
    location: Methods, Task 4 (medication recommendation)
    scale: ratio 0-1
  - term: Medication Match Score (MMS)
    level: metric
    definition: "dividing the number of medications from the benchmark response that are correctly identified by the LLM by the total number of medications suggested by the LLM; gauges exactness or appropriateness"
    definition_verbatim: true
    location: Methods, Task 4
    scale: ratio 0-1
  - term: Top Choice Alignment Score (TCAS)
    level: metric
    definition: Whether the LLM's highest-ranked medication matches the top medication in the benchmark response.
    definition_verbatim: false
    location: Methods, Task 4
    scale: binary
  - term: Accuracy
    level: metric
    definition: Average accuracy on the multiple-choice subtask of long-record understanding.
    definition_verbatim: false
    location: Methods, Task 5
    scale: accuracy
notes: "Reader study with 60 psychiatrists uses 5-point scoring of work quality with 10 guidelines (Extended Data Tab. 5), which were not read in detail here; the guideline items are not listed. Task 0 domain knowledge MCQ is scored by accuracy."
