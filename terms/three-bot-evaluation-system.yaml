notes: The paper gives criterion names only, no longer definitions. The two criteria sets are specific to the two example bots (cancer patient education, pretherapy screening); the method is meant to be re-instantiated with other criteria. Six ENACT factors were dropped as unsuitable for chatbots (Table 1).
