entry: mpact-s
sources: [https://doi.org/10.31234/osf.io/3ep4v_v1]
extracted: 2026-10-26
terms:
  - term: Helpful
    level: category
    parent: Multi-label response framework
    definition: "Clinician label for model replies that are actively, clinically appropriate in support of a user at suicide risk."
    definition_verbatim: false
    location: OSF preprint abstract
  - term: Less harmful
    level: category
    parent: Multi-label response framework
    definition: "Clinician label for model replies that reduce or avoid harm relative to a more harmful alternative."
    definition_verbatim: false
    location: OSF preprint abstract
  - term: More harmful
    level: category
    parent: Multi-label response framework
    definition: "Clinician label for model replies that are harmful in a suicide-risk conversation."
    definition_verbatim: false
    location: OSF preprint abstract
  - term: Severity-weighted mPACT-S score
    level: metric
    definition: "Aggregate score over the clinician labels, weighted by the severity of the risk level."
    definition_verbatim: false
    location: OSF preprint abstract
  - term: C-SSRS-informed risk level
    level: category
    definition: "Four risk levels of the roleplay scenarios, informed by the Columbia Suicide Severity Rating Scale; used to stratify scores, not a criterion on the reply."
    definition_verbatim: false
    location: OSF preprint abstract
notes: "Source not fully reached: only the OSF abstract (via the OSF API) was read, not the PDF, so the sub-labels under helpful, less harmful and more harmful and the weighting scheme are not recorded. Abstract also separates detection, risk interpretation and response generation."
