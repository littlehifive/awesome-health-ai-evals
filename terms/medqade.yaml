entry: medqade
sources: [https://arxiv.org/abs/2607.01103]
extracted: 2026-10-26
terms:
  - term: Correct
    level: category
    parent: Categorical Correctness
    definition: "The answer was medically accurate, complete, and contained no false statements. Minor variations in phrasing or depth of detail were acceptable, given the core medical statement was entirely correct."
    definition_verbatim: true
    location: Annotation protocol (Categorical Correctness)
    scale: 3-way label (Correct / Incorrect / Abstain)
  - term: Incorrect
    level: category
    parent: Categorical Correctness
    definition: "The answer was partially or completely false, incomplete, or highly vague. Raters were instructed to penalise answers that provided only partial aspects without delivering the full solution, sounded plausible but lacked technical accuracy, or contained potentially dangerous medical errors."
    definition_verbatim: true
    location: Annotation protocol (Categorical Correctness)
    scale: 3-way label
  - term: Abstain
    level: category
    parent: Categorical Correctness
    definition: "Raters were strictly instructed to select this option if they lacked the specific medical expertise required to confidently judge the answer."
    definition_verbatim: true
    location: Annotation protocol (Categorical Correctness)
    scale: 3-way label
  - term: Subjective Difficulty
    level: other
    definition: "Raters assigned to each question a difficulty rating of Easy, Medium, or Hard based on their own clinical perception."
    definition_verbatim: true
    location: Annotation protocol
    scale: Easy/Medium/Hard (ordinal; used for stratification only, not for judging answers)
  - term: Raw Percent Agreement (PA)
    level: metric
    definition: Absolute consensus between raters, or between an LLM judge and physician majority label.
    definition_verbatim: false
    location: Statistical analysis
    scale: proportion
  - term: Cohen's kappa
    level: metric
    definition: Chance-adjusted pairwise agreement between raters and between LLM judges and physicians.
    definition_verbatim: false
    location: Statistical analysis
    scale: kappa
  - term: PABAK
    level: metric
    definition: Prevalence-Adjusted Bias-Adjusted Kappa, agreement corrected for label prevalence and bias.
    definition_verbatim: false
    location: Statistical analysis
    scale: kappa-like
  - term: Krippendorff's alpha
    level: metric
    definition: Ordinal reliability of difficulty ratings (and correctness) among physicians.
    definition_verbatim: false
    location: Statistical analysis
    scale: alpha
  - term: Abstention rate
    level: metric
    definition: Share of items on which an annotator (human or LLM) declined to give a judgement; physicians abstained on items beyond their expertise while LLM judges never did.
    definition_verbatim: false
    location: Results, LLM abstention analysis
    scale: proportion
  - term: Self-Enhancement Bias (Delta_self)
    level: metric
    definition: "The mean paired difference between the target model's assigned score and this independent consensus across all self-generated texts."
    definition_verbatim: true
    location: Methods, LLM Annotator Bias
    scale: mean paired score difference, bootstrap CI
  - term: Intra-family bias (Delta_family)
    level: metric
    definition: Same difference measured on answers generated by the judge's architectural siblings.
    definition_verbatim: false
    location: Methods, LLM Annotator Bias
    scale: mean paired score difference
notes: "The benchmark scores LLM-as-judge behaviour (agreement, caution, bias) against physician correctness labels, so judge-quality metrics are recorded as terms. Student answers themselves are rated on the three-way correctness label."
