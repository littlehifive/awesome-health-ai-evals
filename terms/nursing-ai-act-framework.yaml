- term: 4. Automated Assessment of Temporal Variability of Responses (Consistency)
  level: axis
  definition: Percentage of semantic correlations of new responses versus T0 by MPNet V2 metric. A low variability is ensured with a similarity greater than 85%.
  definition_verbatim: true
  location: Methods, Table 1
  scale: similarity percent mapped to 7-point score; >95% scores >=6
