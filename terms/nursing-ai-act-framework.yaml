- term: Average Likert Scale Score (ALiSS)
  level: metric
  definition: Mean Likert score across items of a domain; classifies a model as Recommended, Usable with High Caution, or Unusable using domain-specific cutoffs.
  definition_verbatim: false
  location: Methods, Table 1
  scale: 7-point Likert mean
notes: Read the PMC full text (Table 1). Item descriptions in the table are mostly names only, so definitions are paraphrases except domain 4. Domain 1 uses stricter cutoffs (item mean >=6, no item <5). Domain 7 and part of 6 follow the domain 5 thresholds (>=4). Reference classification categories and ethical-resilience criteria (Table 2) are described in Results.
