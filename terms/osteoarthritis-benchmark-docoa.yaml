notes: Detailed descriptions of each human-evaluation metric are in Multimedia Appendix 1, which was not
  read, so definitions are paraphrased from the Methods. A panel of 5 physicians rated sampled outputs
  (n=1200 per model) with models anonymized. Some definitions and scales are unconfirmed.
