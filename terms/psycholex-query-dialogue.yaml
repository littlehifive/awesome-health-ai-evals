notes: "Terms with the same name appear in both the single-turn (PsychoLexQuery) and multi-turn (PsychoLexDialogue) lists with different definitions; both are recorded. Scored by GPT-5 as judge and by human annotators (three psychology graduate students; single-turn human study is a mean-rank preference). Overall Preference is multi-turn only per the paper's list. PsychoLexEval (a separate Persian psychology MCQ set, scored by accuracy) is part of the same paper but not part of this entry."
