notes: "The paper (arXiv 2610.26185) was not in paperclip; terms come from the arXiv abstract, the GitHub README and the public rubric data (80 of 809 questions, 464 criteria; 14 distinct dimension labels, in Chinese). Full set has 5,012 rubric criteria, scored by a three-judge LLM ensemble with judge prompts kept private. Dimension glosses are mine."
