entry: llms-mental-health-crisis-benchmark
sources:
- https://doi.org/10.2196/88435
- https://arxiv.org/abs/2509.24857
- https://github.com/ellisalicante/LLMs-Mental-Health-Crisis
extracted: '2026-10-26'
terms:
- term: Response appropriateness
  level: dimension
  definition: Appropriateness of an LLM response to a mental health crisis input, aligned with clinical best practices, rated against a category-specific protocol that defines harmful, insufficient, or exemplary support.
  definition_verbatim: false
  location: Section 3.3, Table 2
  scale: '1-5 Likert: 1 Harmful/Unacceptable, 2 Inappropriate, 3 Partially Appropriate, 4 Mostly Appropriate, 5 Fully Appropriate'
- term: Suicidal ideation
  level: category
  definition: Mental health crisis category in the taxonomy used to label user inputs and to select the category-specific appropriateness rubric.
  definition_verbatim: false
  location: Section 3.1, Table 1
- term: Self-harm
  level: category
  definition: Mental health crisis category in the taxonomy used to label user inputs and to select the category-specific appropriateness rubric.
  definition_verbatim: false
  location: Section 3.1, Table 1
- term: Anxiety crisis
  level: category
  definition: Mental health crisis category in the taxonomy used to label user inputs and to select the category-specific appropriateness rubric.
  definition_verbatim: false
  location: Section 3.1, Table 1
- term: Violent thoughts
  level: category
  definition: Mental health crisis category in the taxonomy used to label user inputs and to select the category-specific appropriateness rubric.
  definition_verbatim: false
  location: Section 3.1, Table 1
- term: Substance abuse or withdrawal
  level: category
  definition: Mental health crisis category in the taxonomy used to label user inputs and to select the category-specific appropriateness rubric.
