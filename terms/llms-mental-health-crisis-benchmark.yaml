- term: No crisis
  level: category
  definition: Label for inputs not suggestive of a mental health crisis.
  definition_verbatim: false
  location: Section 3.1, Table 1
- term: Evaluator self-agreement
  level: metric
  definition: Standard deviation of the evaluator LLM's three scores for the same response.
  definition_verbatim: false
  location: Section 4.4 (evaluation results)
  scale: standard deviation
- term: Cohen's kappa / Fleiss' kappa
  level: metric
  definition: Agreement metrics between LLM and human annotators (and across runs) for crisis category labels.
  definition_verbatim: true
  location: Section 3.1
  scale: kappa
notes: Single 1-5 appropriateness scale judged by gpt-4o-mini, with separate per-category criteria (Table 2) for what counts as harmful through fully appropriate; those per-category rubric cells are not listed individually. The crisis categories classify the inputs and select the rubric; they are not scored axes themselves. Definitions are paraphrased except the kappa description.
