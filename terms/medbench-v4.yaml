notes: "Capability dimensions are task groupings whose scores are averaged; the judge rubric dimensions are the output-quality criteria. Rule-based and lexical metrics are used for closed tasks (task-specific metrics rescaled to 0-100). Agent track (six capability dimensions such as goal decomposition, tool use, intent recognition, long-context) and multimodal track (three axes) are described in Section 3.4.1 but not listed here. Judge prompts are in an appendix not read. Judge-human agreement uses raw agreement and Cohen's kappa."
