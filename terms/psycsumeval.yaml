terms:
  - {term: Population, level: dimension, parent: PICO elements, definition: "Dimensions 1-4 (Population, Intervention, Comparator, Outcome) of the psychiatrist guidelines: 0 = missing; 1 = partially correct or inaccurate; 2 = accurate and complete.", definition_verbatim: false, location: "README table, Dimension 1", scale: "0-2"}
  - {term: Intervention, level: dimension, parent: PICO elements, definition: "PICO element: 0 = missing; 1 = partially correct or inaccurate; 2 = accurate and complete.", definition_verbatim: false, location: "README table, Dimension 2", scale: "0-2"}
  - {term: Comparator, level: dimension, parent: PICO elements, definition: "PICO element: 0 = missing; 1 = partially correct or inaccurate; 2 = accurate and complete.", definition_verbatim: false, location: "README table, Dimension 3", scale: "0-2"}
  - {term: Outcome, level: dimension, parent: PICO elements, definition: "PICO element: 0 = missing; 1 = partially correct or inaccurate; 2 = accurate and complete.", definition_verbatim: false, location: "README table, Dimension 4", scale: "0-2"}
  - {term: Quality of Evidence, level: dimension, definition: "1 = consistent with abstract (both present or both absent); 0 = inconsistent/partial information.", definition_verbatim: false, location: "README table, Dimension 5", scale: "binary"}
