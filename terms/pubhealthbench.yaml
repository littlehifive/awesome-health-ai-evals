notes: The follow-up paper (arXiv 2607.06641) adds a four-criterion rubric LLM judge (faithfulness, completeness, factual consistency, clarity) for the free-form subset; those terms are not recorded here
  because that paper's text was not read. Only abstract and results framing of the main paper were consulted.
