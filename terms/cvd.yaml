notes: 'Seven performance domains (efficiency, semantic quality, safety, relevance, consistency, high-value response rate, conciseness) combine into a composite CVD score (Table 2). Responses are also classed
  into four quadrants: optimal, verbose accurate, concise inaccurate, poor overall. Formula-level definitions for consistency and high-value response rate not read in detail.'
