- term: High-value response rate
  level: metric
  definition: share of responses judged high value, one of seven domains in the composite score
  definition_verbatim: false
  location: Results, composite ranking
- term: BLEU
  level: metric
  definition: traditional n-gram overlap metric compared against CVD
  definition_verbatim: false
