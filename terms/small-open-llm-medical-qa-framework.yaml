  - term: BLEU (smoothed sentence-level n-gram overlap)
    level: metric
    definition: "smoothed sentence-level n-gram overlap"
    definition_verbatim: true
    location: Section 3 (metrics)
  - term: ROUGE-L
    level: metric
    definition: "longest common subsequence F1"
