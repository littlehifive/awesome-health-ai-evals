notes: "Eight quality metrics are stated; the seen list is exact match, token F1, BLEU, ROUGE-L, BERTScore F1 and the judge score, and the other two (probably other lexical or BLEU variants) were not identified. The two reproducibility metrics are self-agreement and output uniqueness per the abstract."
