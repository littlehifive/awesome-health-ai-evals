notes: Full text not reachable (Thieme, not in PMC); only the Europe PMC abstract was read. The 26 candidate metrics (24 high consensus, 3 moderate across rounds) come from the Abd-Alrazaq et al. scoping review of technical chatbot metrics (PMC7305563), but the individual list is not recorded here. The metrics are evaluation criteria rated by experts for inclusion, not outputs-scoring rubrics with a defined scale.
