notes: 5 metrics and 17 submetrics, each assessed with standardized Likert-scale survey instruments (scale points not stated in the text read). The review text elsewhere also mentions Key Points and Retrieval as frequently used submetrics (Coverage) and Comprehensiveness (Relevance), which differ slightly from Table 2 names (Topics, Content). Table 2 listing is followed here.
