entry: qamai
sources: [https://doi.org/10.1007/s00405-024-08710-0, https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11512889/]
extracted: 2026-10-26
terms:
  - {term: Accuracy, level: criterion, definition: "The information provided is accurate and up-to-date", definition_verbatim: true, location: Table 1, scale: 1-5 Likert}
  - {term: Clarity, level: criterion, definition: "The answer is clear and comprehensible in terms of language and scientific terminology", definition_verbatim: true, location: Table 1, scale: 1-5 Likert}
  - {term: Relevance, level: criterion, definition: "The information provided is relevant and directly answer to the question posed", definition_verbatim: true, location: Table 1, scale: 1-5 Likert}
  - {term: Completeness, level: criterion, definition: "The response adequately covers all aspects of the question and provides sufficient information including areas of uncertainty", definition_verbatim: true, location: Table 1, scale: 1-5 Likert}
  - {term: Provision of sources and references, level: criterion, definition: "The response provides reliable sources and references to support the health information presented", definition_verbatim: true, location: Table 1, scale: 1-5 Likert}
  - {term: Usefulness, level: criterion, definition: "The response provides to meet the user's health information needs", definition_verbatim: true, location: Table 1, scale: 1-5 Likert}
  - {term: QAMAI score, level: metric, definition: "Sum of the six items (range 6 to 30), mapped to five quality grades.", definition_verbatim: false, location: "Table 2", scale: 6-30}
notes: "Unidimensional construct derived from modified DISCERN; six items rated by head and neck surgeons."
