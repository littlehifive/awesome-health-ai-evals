notes: 'Only the SIRI-2-style benchmark format is described: cases pair a scenario with candidate responses and expert mean ratings, and numeric scoring preserves degrees of appropriateness. The paper''s exact agreement metric was not found in the sections read. The platform also profiles tools on technical features, privacy and conversational style (not output-scoring terms).'
