terms:
- term: Clinical safety
  level: dimension
  definition: 'The medical accuracy of the advice: are normal and abnormal symptoms clearly explained, and is the
    right care plan recommended?'
  definition_verbatim: true
  location: What was judged
  scale: 0-5, sum of 3 checks; 4 or above is a pass
- term: Expected or worrying
  level: criterion
  parent: Clinical safety
  definition: Says clearly whether the symptom is expected or something to worry about
  definition_verbatim: true
  location: What was judged, The checks behind each score
  scale: 1 mark
- term: Causes, danger signs and home care
  level: criterion
  parent: Clinical safety
  definition: Explains the likely causes, gives a short account of the problem, names the danger signs to watch
    for, and gives home care tips
  definition_verbatim: true
  location: What was judged, The checks behind each score
  scale: 3 marks
- term: A plan on what to do next
  level: criterion
