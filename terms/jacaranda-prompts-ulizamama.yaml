- term: Escalation prediction
  level: dimension
  definition: Reading the mother’s question on its own, does it report a severe danger sign such as severe pain,
    bleeding or convulsions that needs a human expert straight away?
  definition_verbatim: true
  location: What was judged
  scale: Yes / No; recall, precision and F1 against the triage model's labels
notes: 'Rules on top of the checks: a multi-part question with any part unanswered is capped at 2.5, and a reply
  that asks the mother for clarification is recorded as zero and not scored. Replies must follow Kenya Ministry
  of Health guidance, with no definite diagnoses, prescriptions or endorsement of unsafe traditional methods.'
