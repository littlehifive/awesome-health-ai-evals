    scale: Elo
notes: "Global dimensions (Empathy, Engagement, Diversity) are judged over full sessions; local dimensions are judged at scripted trigger turns. Diversity is computed via Distinct-N. Agreement with human experts reported as Cohen's kappa (Table 3)."
