notes: "Human evaluation covers HuaTuo, ChatMed, ChatGPT, GPT-4 by one post-graduate scholar; the paper gives no definitions or scale for the four criteria. The paper also proposes an item response theory difficulty analysis and a reasoning-type taxonomy, which are analysis tools rather than scored terms. Journal version (300,901 questions) not re-read."
