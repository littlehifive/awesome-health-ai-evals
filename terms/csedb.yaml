notes: '30 criteria in total (S01-S17, E01-E13). Only the 17 named in the main text are listed; the full list with definitions is in Supplementary Table S1 (a .rar in the GitHub repo, not opened). Final
  scores are weighted and normalized; three reported scores: total, safety, effectiveness. Judge is DeepSeek-R1 against per-question physician-written criteria.'
