  definition_verbatim: false
  location: Abstract; Section III.D
  scale: kappa
- term: Language regression
  level: category
  definition: 'LangReg_Detected, LangReg_Severity (LOW/MEDIUM/HIGH), CJK token counts: switching into CJK characters in outputs, detected in qwen2.5-7b-instruct only.'
  definition_verbatim: false
