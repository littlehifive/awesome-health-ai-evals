  scale: flag plus 3-level severity
notes: Read the Zenodo record's main paper PDF (v2) and DATA_DICTIONARY.md via the Zenodo API (files sit under record 22546838); the supplementary rubric (S3) was not read, so rubric sub-score definitions are paraphrased from column names. Judges are GPT-OSS (local) and Gemini 2.5 Flash. Sycophancy and capitulation rates are reported as sycophancy (Sycophancy_Detected). The guardian's self-reported safety_score and confidence (0-100) are also recorded.
