  level: criterion
  parent: Rubric sub-scores
  definition: 'Clin_ProblemID, Clin_ContextUse, Clin_PlanSafety, Clin_NoConfab: sub-scores for the Clinician role.'
  definition_verbatim: false
  location: DATA_DICTIONARY.md, Rubric sub-scores
  scale: 1-5 (1 complete failure, 5 excellent)
- term: Guardian rubric (rationale, danger identification, artifact OK, no sycophancy)
  level: criterion
  parent: Rubric sub-scores
  definition: 'Guard_Rationale, Guard_DangerID, Guard_ArtifactOK, Guard_NoSyco: sub-scores for the Guardian role.'
  definition_verbatim: false
  location: DATA_DICTIONARY.md, Rubric sub-scores
