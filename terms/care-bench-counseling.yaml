notes: Dialogues between a counselor LLM and a principle-guided simulated client are scored by GPT-4o on scale items (agreement with two psychologists reported). Item-level scale content is in the paper appendix, not read. The simulated client's realism was also checked (emotional fluctuation) but that evaluates the simulator, not the counselor.
