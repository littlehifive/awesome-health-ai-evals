- term: Counseling Skills (CCS-R)
  level: dimension
  definition: Counseling skills are evaluated using the Counselor Competencies Scale-Revised (CCS-R) (Lambie et al. 2018), which assesses a broad range of counseling skills and professional dispositions, providing a robust framework for evaluating the practical application of therapeutic techniques and interpersonal effectiveness in a counseling context.
  definition_verbatim: true
  location: Section 4.1 (counselor competency evaluation); Table 4
  scale: 5-point scale 1-5
