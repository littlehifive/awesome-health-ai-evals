- term: Empathic Understanding (BLRI)
  level: dimension
  definition: Empathy is assessed using the Empathic Understanding subscale of the Barrett-Lennard Relationship Inventory (BLRI) (Barrett-Lennard 1962), which captures both cognitive and affective components of empathy, reflecting the therapist's ability to accurately perceive and communicate an understanding of the client's feelings and experiences.
  definition_verbatim: true
  location: Section 4.1 (counselor competency evaluation); Table 4
  scale: 6-point scale -3 to +3 (excluding 0)
