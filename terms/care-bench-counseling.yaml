- term: Therapeutic Relationship (WAI)
  level: dimension
  definition: The Working Alliance Inventory (WAI) (Horvath and Greenberg 1989) is utilized to evaluate the quality of the therapeutic relationship between therapists and clients.
  definition_verbatim: true
  location: Section 4.1 (counselor competency evaluation); Table 4
  scale: 5-point scale 1-5; GPT-4o scorer
