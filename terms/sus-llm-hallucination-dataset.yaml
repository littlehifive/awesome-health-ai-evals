notes: "Each of 90 Portuguese questions carries hallucination_type labels (T1-T6, which are the types of hallucination the question is prone to elicit), a risk level and normative sources; expected answers are 'to be defined based on expert validation'. The release has no model-scoring protocol, so the taxonomy is an item annotation and also the implied scoring lens. Guideline: if uncertain, classify as potential hallucination. Axes E1-E4 are topic areas (for example coverage_financing) and are not recorded."
