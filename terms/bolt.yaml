- term: Behavior frequency
  level: metric
  definition: How frequently LLM therapists exhibit specific conversational behaviors relative to human therapists.
  definition_verbatim: true
  location: Results
  scale: frequency difference vs. average-, low-, high-quality human therapy
- term: Temporal ordering of behaviors
  level: metric
  definition: Turn number in which each behavior is first exhibited in a conversation, relative to human therapists.
  definition_verbatim: false
  location: Results, Figure 3
  scale: turn number difference
- term: Adaptability to client behaviors
  level: metric
  definition: In what ways LLM therapists adapt their behavior to different client behaviors compared to human therapists.
  definition_verbatim: true
  location: Results, Figure 4
  scale: difference in behavior frequency conditional on client behavior
notes: Parent categories (REFLECTIONS, QUESTIONS, SOLUTIONS) are the paper's five category groupings (the last two behaviors, NORMALIZING and PSYCHOEDUCATION, are single-behavior categories). Behaviors are judged as desirable or undesirable by resemblance to high- versus low-quality human therapy. LIWC word use is a secondary check (Supplementary Table S9).
