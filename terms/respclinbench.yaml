entry: respclinbench
sources:
- https://arxiv.org/abs/2608.04514
extracted: '2026-10-26'
terms:
- term: Atomic-action recall
  level: metric
  definition: The item-level atomic-action recall was calculated as the number of recalled points divided by the total number of reference points for that item and was converted to a 0-to-100 scale.
  definition_verbatim: true
  location: Section 2.7
  scale: binary per action point, recall 0-100
- term: LLM-as-a-Judge rubric score
  level: metric
  definition: a structured LLM-as-a-Judge agent to assess responses against dataset-specific clinical rubrics covering medical accuracy, completeness, longitudinal consistency, guideline concordance, safety, communication, and direct clinical usability
  definition_verbatim: true
  location: Section 2.7
  scale: 1-5 per dimension, normalized to 0-100
- term: Final score
  level: metric
  definition: Arithmetic mean of atomic-action recall (50%) and LLM-as-a-Judge score (50%).
  definition_verbatim: false
  location: Section 2.7
  scale: 0-100
