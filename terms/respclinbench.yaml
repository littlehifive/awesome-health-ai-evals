- term: Imaging hallucination
  level: category
  definition: PNBIM outputs were flagged for imaging hallucination when the response asserted an image feature or interval change that was not supported by the supplied input.
  definition_verbatim: true
  location: Section 2.8
  scale: binary flag
- term: Overdiagnosis
  level: category
  definition: Overdiagnosis indicated excessive diagnostic certainty or disproportionate escalation beyond the available evidence.
  definition_verbatim: true
  location: Section 2.8
  scale: binary flag
- term: Serious medical risk
  level: category
  definition: A serious medical-risk flag identified recommendations with plausible potential for major harm.
  definition_verbatim: true
  location: Section 2.8
  scale: binary flag
- term: Medication-safety risk
  level: category
  definition: AECOPD-PIM flag for medication-safety risk in the response (no further definition given).
  definition_verbatim: false
  location: Section 2.8
  scale: binary flag
notes: Rubric dimensions are defined per dataset (PNBIM, AECOPD-PIM); the Clarity and clinical usability dimension appears in both. Dimension-level scores reported on a 1-5 scale in Figure 3. Reference answers decompose into atomic clinical actions (risk assessment, additional evaluation, treatment or surveillance, longitudinal monitoring, safety communication, health management) which are scored as binary points.
