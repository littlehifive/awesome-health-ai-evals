entry: agentclinic
sources:
- https://arxiv.org/abs/2405.07960
- https://doi.org/10.1038/s41746-026-02674-7
extracted: '2026-10-26'
terms:
- term: Diagnostic accuracy
  level: metric
  definition: The moderator agent compares the doctor agent's final diagnosis to the ground-truth diagnosis at the end of the simulation.
  definition_verbatim: false
  location: Section 2, Figure 1; Tables 1-3
  scale: accuracy (%)
- term: Confidence
  level: criterion
  parent: Patient agent perception
  definition: Please provide a confidence between 1-10 in your doctor's assessment.
  definition_verbatim: true
  location: Section 3.3
  scale: 1-10
- term: Compliance
  level: criterion
  parent: Patient agent perception
  definition: Please provide a rating between 1-10 indicating how likely you are to follow up with therapy for your diagnosis.
  definition_verbatim: true
  location: Section 3.3
  scale: 1-10
- term: Consultation
  level: criterion
  parent: Patient agent perception
  definition: Please provide a rating between 1-10 indicating how likely you are to consult again with this doctor.
  definition_verbatim: true
  location: Section 3.3
  scale: 1-10
- term: Bias-induced accuracy change
  level: metric
  definition: Drop in diagnostic accuracy when cognitive or implicit biases (e.g. recency, racial, gender, sexual orientation) are injected into doctor or patient agents.
  definition_verbatim: false
  location: Sections 3.2-3.3
  scale: absolute accuracy change
notes: Core score is diagnostic accuracy of the doctor agent, checked by a moderator LLM. Patient-agent follow-up ratings (confidence, compliance, consultation) are asked after dialogue in the bias analysis. Biases studied are inputs, not scored terms. Also reports accuracy by specialty and language (AgentClinic-Spec, -Lang).
