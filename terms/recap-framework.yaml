entry: recap-framework
sources: [https://doi.org/10.3389/fdgth.2025.1616488]
extracted: 2026-10-26
terms:
  - term: Relevance
    level: criterion
    definition: "Relevance assesses whether AI-generated responses directly address the patient's specific question or concern in a clinically appropriate and situationally-aware manner."
    definition_verbatim: true
    location: RECAP framework section; Table 1
  - term: Evidence-based
    level: criterion
    definition: "Evidence-based standards assess whether the AI tool's responses are grounded in current, authoritative medical guidelines or credible clinical sources."
    definition_verbatim: true
    location: RECAP framework section; Table 1
  - term: Clarity
    level: criterion
    definition: "Messages from the chatbot should be written in plain language, avoiding ambiguity, jargon, or vague calls to action."
    definition_verbatim: true
    location: RECAP framework section; Table 1
  - term: Adaptability
    level: criterion
    definition: "Adaptability reflects the AI tool's capacity to tailor communication to diverse patients with varying needs, health literacy, cultural backgrounds, and clinical complexity."
    definition_verbatim: true
    location: RECAP framework section; Table 1
  - term: Precision and safety
    level: criterion
    definition: "Precision and Safety refer to the AI tool's ability to deliver clinically accurate information while recognizing its own limitations."
    definition_verbatim: true
    location: RECAP framework section; Table 1 (Precision/safety)
notes: "Five criteria applied as meets or fails standard with illustrative chatbot outputs in Table 1; no numeric scale or validation."
