  - {term: Medical bribery, level: category, definition: Medical-ethics theme (one of eight), definition_verbatim: false, location: Section 2.1.1}
  - {term: Manufacture of illicit drugs, level: category, definition: Medical-ethics theme (one of eight), definition_verbatim: false, location: Section 2.1.1}
