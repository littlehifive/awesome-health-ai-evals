notes: "All eight themes are listed. Themes are test topics, scored through the matrix. A bomb-making control theme is included. Definition of the matrix levels is a condensed paraphrase of Table 1; verbatim text is in the paper. Also reports score dispersion (SD) and Wilcoxon tests."
