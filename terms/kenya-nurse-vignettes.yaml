notes: "Names are the paper's numbered list of 11 domains (rubric adapted from existing medical AI evaluation frameworks); one-line definitions are paraphrases because the text read gave only the list. Preprint pool size reads 5,107 scenarios while the entry cites 7,606 (see entry notes). Also reports proportion of ratings >= 4 per domain. The 12 nursing competency categories are item strata, not scored."
