entry: kenya-nurse-vignettes
sources: [https://doi.org/10.1101/2025.10.25.25338798, https://doi.org/10.1136/bmjdh-2026-000081]
extracted: 2026-10-26
terms:
  - term: Alignment with established medical guidelines and evidence
    level: dimension
    definition: "Domain 1 of the 11-domain rubric, rated by blinded physician panels (reported as guideline alignment)."
    definition_verbatim: false
    location: Methods, rubric paragraph; Results
    scale: "1-5 Likert"
  - term: Accuracy and expert-level knowledge
    level: dimension
    definition: "Domain 2 of the rubric: accuracy of the response and expert-level knowledge shown."
    definition_verbatim: false
