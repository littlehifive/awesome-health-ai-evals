    definition_verbatim: false
    location: Methods, rubric paragraph
    scale: "1-5 Likert"
  - term: Logical structuring and coherence
    level: dimension
    definition: "Domain 4 of the rubric: logical structure and coherence of the response."
    definition_verbatim: false
    location: Methods, rubric paragraph
    scale: "1-5 Likert"
  - term: Consideration of cultural, regional, and resource-specific factors
    level: dimension
    definition: "Domain 5 of the rubric: contextual appropriateness to Kenyan cultural, regional and resource settings."
    definition_verbatim: false
    location: Methods, rubric paragraph
    scale: "1-5 Likert"
  - term: Avoidance of demographic bias
    level: dimension
