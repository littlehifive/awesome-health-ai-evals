entry: cognitive-reframing-dataset
sources:
- https://arxiv.org/abs/2305.02466
extracted: '2026-10-26'
terms:
- term: Addressing Thinking Traps
  level: dimension
  definition: Whether the reframe directly addresses one or more of the thought's thinking traps (cognitive distortions) rather than continuing to express them.
  definition_verbatim: false
  location: Section 3
  scale: automated metric / binary annotation
- term: Rationality
  level: dimension
  definition: A rational reframe is guided by strong evidence whereas an irrational reframe is based on unrealistic assumptions.
  definition_verbatim: true
  location: Section 3
- term: Positivity
  level: dimension
  definition: How much the reframe emphasizes positive perspectives; overly positive reframes exaggerate, balanced ones consider both sides.
  definition_verbatim: false
  location: Section 3
- term: Empathy
  level: dimension
  definition: A reframe may express empathy or self-compassion by validating how one is feeling.
  definition_verbatim: true
  location: Section 3
- term: Actionability
  level: dimension
  definition: Whether the reframe suggests specific actions, is actionable without specifying actions, or is not actionable.
  definition_verbatim: false
  location: Section 3
  scale: three levels
- term: Specificity
  level: dimension
  definition: Whether a reframe specifically addresses the situation and thought, or is generic enough for a wide range of negative thoughts.
  definition_verbatim: false
  location: Section 3
- term: Readability
  level: dimension
  definition: Whether a reframe is simple or complex to read.
  definition_verbatim: false
  location: Section 3
- term: Relatability
  level: principle
  definition: 'Desired outcome: reframe must be relatable to the individual.'
  definition_verbatim: false
  location: Section 2, Section 7
- term: Helpfulness
  level: principle
  definition: 'Desired outcome: reframe must help them overcome the negative thought.'
  definition_verbatim: false
  location: Section 2, Section 7
- term: Memorability
  level: principle
  definition: 'Desired outcome: reframe must be memorable the next time a similar thought arises.'
  definition_verbatim: false
  location: Section 2, Section 7
notes: Seven attributes have automated metrics validated against practitioner judgments; three outcomes assessed in the field study and in expert ratings (relatability, helpfulness). Also overlap with expert reframes was used as an automatic measure (not extracted). Scales per attribute not extracted.
