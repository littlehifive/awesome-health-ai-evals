notes: 26 secondary items under 4 primary items (Table 2). The paper gives item wording only, no separate definitions, so each item's 'definition' is its own wording (marked verbatim). Overall Clinical Competence items 4.1-4.3 are the three grade options (Unsatisfactory, Satisfactory, Excellent) rather than separate criteria. The 5-point Likert scale was used by experts during scale construction; the exact scoring of dialogues on items is by expert annotation of 2,680 MedEval dialogues and ChatGPT judging (accuracy per item).
