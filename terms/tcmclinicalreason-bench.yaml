notes: README only; no paper found. The judge (Qwen3.7-Plus with TCM-RAG) must identify the diagnostic pathway, cite case-specific discriminating evidence and the strongest counterevidence, then score 0-5 under scenario-dependent caps; the full rubric text and caps are not in the README.
