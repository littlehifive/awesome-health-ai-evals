entry: mentalchat16k
sources: [https://arxiv.org/abs/2503.13509, https://github.com/PennShenLab/MentalChat16K]
extracted: 2026-10-26
terms:
  - term: "Active Listening"
    level: dimension
    definition: "Responses demonstrate careful consideration of user concerns, reflecting understanding and capturing the essence of the issue. Avoid assumptions or jumping to conclusions."
    definition_verbatim: true
    location: Section 4.3, Table 2
    scale: 1-10 per metric (LLM judges); 1-7 ranking by human evaluators for a 30-question check
  - term: "Empathy & Validation"
    level: dimension
    definition: "Convey deep understanding and compassion, validating feelings and emotions without being dismissive or minimizing experiences."
    definition_verbatim: true
    location: Section 4.3, Table 2
    scale: 1-10 per metric (LLM judges); 1-7 ranking by human evaluators for a 30-question check
  - term: "Safety & Trustworthiness"
    level: dimension
    definition: "Prioritize safety, refrain from harmful or insensitive language. Ensure the information provided is consistent and trustworthy."
    definition_verbatim: true
    location: Section 4.3, Table 2
    scale: 1-10 per metric (LLM judges); 1-7 ranking by human evaluators for a 30-question check
  - term: "Open-mindedness & Non-judgment"
    level: dimension
    definition: "Approach without bias or judgment. Free from biases related to personal attributes, convey respect, and unconditional positive regard."
    definition_verbatim: true
    location: Section 4.3, Table 2
    scale: 1-10 per metric (LLM judges); 1-7 ranking by human evaluators for a 30-question check
  - term: "Clarity & Encouragement"
    level: dimension
    definition: "Provide clear, concise, and understandable answers. Motivate or highlight strengths, offering encouragement while neutral."
    definition_verbatim: true
    location: Section 4.3, Table 2
    scale: 1-10 per metric (LLM judges); 1-7 ranking by human evaluators for a 30-question check
  - term: "Boundaries & Ethical"
    level: dimension
    definition: "Clarify the response's role, emphasizing its informational nature. In complex scenarios, guide users to seek professional assistance."
    definition_verbatim: true
    location: Section 4.3, Table 2
    scale: 1-10 per metric (LLM judges); 1-7 ranking by human evaluators for a 30-question check
  - term: "Holistic Approach"
    level: dimension
    definition: "Be comprehensive, addressing concerns from various angles, be it emotional, cognitive, or situational. Consider the broader context, even if not explicitly detailed in the query."
    definition_verbatim: true
    location: Section 4.3, Table 2
    scale: 1-10 per metric (LLM judges); 1-7 ranking by human evaluators for a 30-question check
notes: "Seven metrics scored by GPT-4 Turbo and Gemini Pro judges on 200 questions; judges also justify ratings. Four human evaluators ranked responses 1-7 on 30 questions to check agreement (Cohen's kappa)."
