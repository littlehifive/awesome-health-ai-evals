notes: 'Only four of the ten criteria are named in the main text (Q1, Q2, Q6, Q8); Q3, Q4, Q5, Q7, Q9, Q10 are described only in the Supplementary Methods, not opened. Q2, Q3, Q5, Q7, Q8 are the five highest-weighted. Also defined (about evaluators rather than model output): overacceptance rate, underrecognition rate, and net trust calibration gap between the two rating rounds. Scenarios were also rated post hoc on five complexity dimensions (Supplementary Table S5).'
