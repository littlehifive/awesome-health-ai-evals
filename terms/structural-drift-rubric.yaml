    scale: anomaly scores in non-target domains
notes: "Scoring anchors per domain: 0 No disturbance, 1 Common, 2 Unusual, 3 Rare disturbance (closer to psychosis-spectrum). Rubric prompt is 1,842 words, in Supplement S1. Scorer reliability is also reported (binary detection via MUC-6 correct/missing/spurious, exact and within-1 ordinal accuracy, ordinal-weighted Cohen's kappa), but those evaluate the LLM scorer, not chatbot outputs."
