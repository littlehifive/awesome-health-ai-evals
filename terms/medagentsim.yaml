terms:
  - term: Diagnostic accuracy
    level: metric
    definition: "Percentage of simulated cases for which the doctor agent's final diagnosis matches the reference diagnosis (reported per dataset, e.g. MedQA, MedQA Extended, NEJM, NEJM Extended, MIMIC-IV)."
