entry: medrealmm
sources: [https://arxiv.org/abs/2607.09142]
extracted: 2026-10-26
terms:
  - term: Positive rubric criteria
    level: criterion
    parent: Case-specific rubric
    definition: "Rewards the inclusion of clinically desirable behaviors (e.g., correct differential, examination ordering, and safety advice)."
    definition_verbatim: true
    location: Section 3.3 Phase 3, rubric construction
    scale: signed weight w in [-20, 20] excluding 0; binary met/not met per criterion
  - term: Negative rubric criteria
    level: criterion
    parent: Case-specific rubric
    definition: "Penalizes hallucinations, contradictions, or unsafe behaviors."
    definition_verbatim: true
    location: Section 3.3 Phase 3, rubric construction
    scale: negative weight; binary per criterion
  - term: Length constraint
    level: criterion
    parent: Case-specific rubric
    definition: Rule-based criterion enforcing the per-turn length limit of the JD Health consultation setting, added to each case rubric.
    definition_verbatim: false
    location: Section 3.3 Phase 3
    scale: rule-based
  - term: Rubric score S
    level: metric
    definition: Criterion-level binary judgments aggregated by signed weights, normalized by total positive weight and clipped to [0, 1]; benchmark score is the case-level mean.
    definition_verbatim: false
    location: Section 3.4 Phase 4, Eq. 13
    scale: 0-1 per case (reported as percent)
notes: "Rubrics are case-specific (generated by an LLM, refined by physicians, size varies per case); criteria are not grouped under named axes in the sections read, so only the criterion types and score are recorded. Department breakdown (Internal Med., Surgery, etc.) is reporting stratification, not a scored term."
