terms:
- term: Correctness
  level: criterion
  definition: given a question, whether the answer is factually correct and relevant.
  definition_verbatim: true
  location: Section 4.1 (Evaluation metrics)
  scale: human rating by three medical experts; fine-tuned judgment model also predicts it
- term: Interpretability
  level: criterion
  definition: given a question, whether the answer contains a detailed and concise explanation that demonstrates how the conclusion was reached.
  definition_verbatim: true
  location: Section 4.1 (Evaluation metrics)
  scale: human rating by three medical experts; fine-tuned judgment model also predicts it
notes: Rating scale values were not extracted. Benchmark items are true/false and open-ended long-form questions; misinformation is assessed through these two aspects.
