notes: 'Read PMC full text; rubric descriptors are in Multimedia Appendix 2 (not opened), so definitions are paraphrase/placeholder and the dimension names are as listed in the Table 2 footnote. Three raters: end users (N=15), blinded clinical psychologist (4 scenarios), and three LLMs with structured rubric prompts. Diagnostic review used think-aloud consensus, not numeric scoring. Enhancement targets were active listening, personalization, and complex thinking. Conversation analytics (response length, sentence count, question rate, emoji use) are automated process features.'
