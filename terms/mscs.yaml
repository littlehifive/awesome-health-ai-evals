terms:
  - term: mSCS item 1
    level: criterion
    parent: modified System Causability Scale (mSCS)
    definition: "I found that the recommendation included all relevant patient-specific factors (individual patient data such as individual tumor stages, previous treatments, and specific health conditions) with sufficient precision and granularity."
    definition_verbatim: true
    location: Table 2 (mSCS column)
    scale: 1-5 Likert (1 = strongly disagree to 5 = strongly agree)
  - term: mSCS item 2
    level: criterion
    parent: modified System Causability Scale (mSCS)
    definition: "I found the quality and representativeness of the recommendations, particularly in relation to oncological scenarios, sufficient."
    definition_verbatim: true
    location: Table 2 (mSCS column)
    scale: 1-5 Likert (1 = strongly disagree to 5 = strongly agree)
  - term: mSCS item 3
    level: criterion
    parent: modified System Causability Scale (mSCS)
    definition: "I found that all reasonable treatment alternatives were specified."
    definition_verbatim: true
    location: Table 2 (mSCS column)
    scale: 1-5 Likert (1 = strongly disagree to 5 = strongly agree)
  - term: mSCS item 4
    level: criterion
    parent: modified System Causability Scale (mSCS)
    definition: "I did not need support to understand the explanations."
