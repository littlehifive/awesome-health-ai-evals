  - term: mSCS total
    level: metric
    definition: "Score of 1 to 5 on a Likert scale assigned to each of the 10 items; ratings compare LLM treatment recommendations with tumor-board recommendations."
    definition_verbatim: false
    location: Section 2.4
    scale: 10 items x 1-5 Likert
notes: "Items are short statements rather than named constructs, so each is recorded as mSCS item N; all items but item 4 were modified from the original System Causability Scale (Holzinger et al. 2020). Likely themes (my reading): completeness of patient factors, alternatives, transparency, guideline consistency, currency, usability."
