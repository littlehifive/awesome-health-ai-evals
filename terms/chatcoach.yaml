notes: Detection and correction of medical terminology misuse are scored separately with BLEU-2, ROUGE-L
  and BERTScore after GPT-4 extracts errors from coach feedback. Human evaluation used 126 instances (10%
  of the test set) and two raters. Error analysis categories (for example excessive coaching) are not
  scored terms.
