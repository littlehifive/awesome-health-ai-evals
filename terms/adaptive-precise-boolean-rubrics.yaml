notes: 'The same 10 criteria appear in the baseline Likert rubric (S4, adapted from Cosentino et al. 2024) and the Precise Boolean rubric (S6, granularized into many yes/no checkbox questions per user-data element; full Boolean rubric ''available upon request''). Adaptive version filters questions per query-response pair with an LLM relevance classifier. Reliability metrics: intraclass correlation (ICC) and a discrepancy score. Abstract also names accuracy, personalization, relevance and safety as quality dimensions.'
