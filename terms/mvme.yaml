entry: mvme
sources: [http://arxiv.org/abs/2402.09742, https://github.com/LibertFan/AI_Hospital]
extracted: 2026-10-26
terms:
  - {term: Symptoms, level: criterion, definition: "The evaluation of the symptoms part reflects the comprehensiveness of the symptoms collected by the Doctor during the interaction process.", definition_verbatim: true, location: "Section 3.1", scale: "GPT-4 Chief Physician score 1-4, normalized to 0-100"}
  - {term: Medical Examinations, level: criterion, definition: "The evaluation of the medical examinations results part reflects the appropriateness of the medical examinations suggested by the Doctor.", definition_verbatim: true, location: "Section 3.1", scale: "1-4, normalized to 0-100"}
  - {term: Diagnostic Results, level: criterion, definition: "Report part scored for the Doctor's diagnostic capability against the full medical record.", definition_verbatim: false, location: "Section 3.1, Table 3", scale: "1-4, normalized to 0-100"}
  - {term: Diagnostic Rationales, level: criterion, definition: "Report part scored for the Doctor's diagnostic reasoning against the full medical record.", definition_verbatim: false, location: "Section 3.1, Table 3", scale: "1-4, normalized to 0-100"}
  - {term: Treatment Plan, level: criterion, definition: "Report part scored for the Doctor's treatment capability against the full medical record.", definition_verbatim: false, location: "Section 3.1, Table 3", scale: "1-4, normalized to 0-100"}
  - {term: Disease-entity precision, level: metric, definition: "Set-level precision of disease entities in the diagnostic results, linked to standardized ICD-10 entities, against the record.", definition_verbatim: false, location: "Section 3.1, Table 4", scale: proportion}
  - {term: Disease-entity recall, level: metric, definition: "Set-level recall of disease entities in the diagnostic results against the record.", definition_verbatim: false, location: "Section 3.1, Table 4", scale: proportion}
  - {term: Disease-entity F1, level: metric, definition: "F1 of the entity-overlap between diagnosed and recorded disease entities.", definition_verbatim: false, location: "Section 3.1, Table 4", scale: proportion}
  - {term: Relevance of patient responses, level: dimension, definition: "The relevance of the Patient agent's responses to the doctor's questions (simulator validation, not doctor scoring).", definition_verbatim: false, location: "Section 4, Appendix F", scale: human/GPT rating}
  - {term: Honesty of patient responses, level: dimension, definition: "The honesty of the Patient agent's responses with the subjective information in the medical record (simulator validation).", definition_verbatim: false, location: "Section 4, Appendix F"}
  - {term: Consistency of doctor's report with dialogue, level: dimension, definition: "Consistency of the doctor's final diagnostic report with the information in the dialogue flow: significantly inconsistent, slightly inconsistent, mostly consistent (simulator validation).", definition_verbatim: true, location: "Section 4", scale: "3 levels scored 1-3, mapped to 0-100"}
notes: "The first five terms are the multi-view evaluation of the Doctor's five-part report. The last three validate the simulated Patient and Examiner agents (Examiner is rated on accuracy of understanding exam requests and returning results) rather than scoring LLM doctors. Entity metrics cover diseases only."
