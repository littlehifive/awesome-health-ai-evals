- term: Positive sentinel actions
  level: criterion
  definition: High-impact actions expected of competent crisis management; scored present or absent.
  definition_verbatim: true
  location: Methods, Sentinel framework
  scale: binary
- term: Unsafe sentinel actions
  level: criterion
  definition: Contraindicated maneuvers likely to worsen the patient's trajectory; scored triggered or not triggered.
  definition_verbatim: true
  location: Methods, Sentinel framework
  scale: binary
- term: Completion (proportion of required safety actions)
  level: metric
  definition: Proportion of required positive safety actions a model completed per scenario run.
  definition_verbatim: false
  location: Abstract; Results
  scale: percent
- term: Run-to-run stability
  level: metric
  definition: Variation in completion between repeated runs of the same scenario (mean difference between two runs in percentage points); analysis-only dimension, not a sentinel category.
  definition_verbatim: false
  location: Methods; Results
  scale: percentage-point difference
notes: 150 binary sentinel actions across ten scenarios, each mapped to one of the six study-developed axes. Sentinels are scenario-specific and not enumerated here (Supplementary Table S1). Diagnostic recognition treated as latent, not scored. Scored by two blinded clinicians.
