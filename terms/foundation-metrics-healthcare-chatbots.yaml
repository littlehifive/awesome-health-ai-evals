entry: foundation-metrics-healthcare-chatbots
sources:
- https://arxiv.org/abs/2309.12444
extracted: '2026-10-26'
terms:
- term: Accuracy
  level: category
  definition: Accuracy metrics encompass both automatic and human-based assessments that evaluate the grammar, syntax, semantics, and overall structure of responses generated by healthcare chatbots.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots, Accuracy; Figure 3, Table 2'
- term: Trustworthiness
  level: category
  definition: Trustworthiness, an essential aspect of Responsible AI, plays a critical role in ensuring the reliability and conscientiousness of healthcare chatbot responses.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots, Trustworthiness'
- term: Empathy
  level: category
  definition: Empathy is the ability to understand and share the feelings of another person.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots, Empathy'
- term: Performance
  level: category
  definition: Performance metrics are essential in assessing the runtime performance of healthcare conversational models, as they significantly impact the user experience during interactions.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots, Performance'
- term: Sensibility, Specificity, Interestingness (SSI)
  level: metric
  parent: Accuracy
  definition: 'SSI metric measures how well the model''s answers align with human behavior. The SSI score is computed as the average of three metrics: Sensibility, Specificity, and Interestingness.'
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
  scale: average of three sub-scores
- term: Robustness
  level: metric
  parent: Accuracy
  definition: Robustness, as an extrinsic metric, explores the resilience of healthcare chatbots against perturbations and adversarial attacks.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Generalization
  level: metric
  parent: Accuracy
  definition: Generalization, as an extrinsic metric, pertains to a model's capacity to effectively apply acquired knowledge in accurately performing novel tasks.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Conciseness
  level: metric
  parent: Accuracy
  definition: Conciseness, as an extrinsic metric, reflects the effectiveness and clarity of communication by conveying information in a brief and straightforward manner, free from unnecessary or excessive details.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Up-to-dateness
  level: metric
  parent: Accuracy
  definition: Up-to-dateness serves as a critical metric to evaluate the capability of chatbots in providing information and recommendations based on the most current and recently published knowledge, guidelines, and research.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Groundedness
  level: metric
  parent: Accuracy
  definition: Groundedness, the final metric in this category, focuses on determining whether the statements generated by the model align with factual and existing knowledge.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Safety and Security
  level: metric
  parent: Trustworthiness
  definition: The Safety and Security metric evaluates a model's adherence to ethical and responsible guidelines in its generated responses.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Privacy
  level: metric
  parent: Trustworthiness
  definition: The Privacy metric is devised to assess whether the model utilizes users' sensitive information for either model fine-tuning or general usage.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Bias
  level: metric
  parent: Trustworthiness
  definition: Bias in healthcare chatbots refers to the presence of discriminatory treatment in their responses.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
  scale: agreement index over stereotype statements (suggested)
- term: Demographic bias
  level: criterion
  parent: Bias
  definition: Demographic bias, where the model's responses exhibit disparities or favoritism based on attributes like race, gender, age, or socioeconomic status.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Medical condition bias
  level: criterion
  parent: Bias
  definition: Medical condition bias, which can arise when the LLM provides inconsistent or unequal recommendations or information (e.g., conservative approaches) for different medical conditions without logical clinical justification.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Representation bias
  level: criterion
  parent: Bias
  definition: Representation bias, occurring when certain groups or medical conditions are underrepresented or overlooked in the training data of the language model, leading to incomplete or inaccurate information.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Interpretability
  level: metric
  parent: Trustworthiness
  definition: The Interpretability metric assesses the chatbot's responses in terms of user-centered aspects, measuring the transparency, clarity, and comprehensibility of its decision-making process.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Emotional Support
  level: metric
  parent: Empathy
  definition: The Emotional Support metric evaluates how chatbots incorporate user emotions and feelings.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Health Literacy
  level: metric
  parent: Empathy
  definition: The Health Literacy metric assesses the model's capability to communicate health-related information in a manner understandable to individuals with varying levels of health knowledge.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Fairness
  level: metric
  parent: Empathy
  definition: The Fairness metric evaluates the impartiality and equitable performance of healthcare chatbots.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Personalization
  level: metric
  parent: Empathy
  definition: The Personalization metric gauges the degree of customization and individualization in the chatbot's conversations.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Usability
  level: metric
  parent: Performance
  definition: Usability refers to the overall quality of a user's experience when engaging with chatbots across various devices, such as mobile phones, desktops, and embedded systems.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Latency
  level: metric
  parent: Performance
  definition: Latency measures the round-trip response time for a chatbot to receive a user's request, generate a response, and deliver it back to the user.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Memory Efficiency
  level: metric
  parent: Performance
  definition: The Memory Efficiency metric quantifies the amount of memory utilized by a healthcare chatbot.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Floating point Operations (FLOP)
  level: metric
  parent: Performance
  definition: The Floating point Operations (FLOP) metric quantifies the number of floating point operations required to execute a single instance of healthcare conversational models.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Token Limit
  level: metric
  parent: Performance
  definition: The Token Limit metric evaluates the performance of chatbots, focusing on the number of tokens used in multi-turn interactions.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
- term: Number of Parameters
  level: metric
  parent: Performance
  definition: The Number of Parameters of the LLM model is a widely used metric that signifies the model's size and complexity.
  definition_verbatim: true
  location: 'Section: Essential Metrics for Evaluating Healthcare Chatbots'
notes: Proposed metric taxonomy (four groups, 4 accuracy-related plus others), not an applied benchmark; no scales given beyond suggestions. Table 1 intrinsic metrics (BLEU, ROUGE, METEOR, perplexity and similar) are reviewed as existing metrics and not listed individually. Metrics are defined per user type, domain type and task type (confounding variables). Scoring can be per answer or per session.
