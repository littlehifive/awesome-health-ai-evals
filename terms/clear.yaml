  definition_verbatim: true
  location: Methods (tool development); Figure 1
  scale: 5-point Likert (excellent to poor)
- term: Relevance
  level: criterion
  parent: CLEAR
  definition: Is the content focused without any irrelevant information?
  definition_verbatim: true
  location: Methods (tool development); Figure 1
  scale: 5-point Likert (excellent to poor)
