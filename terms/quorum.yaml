entry: quorum
sources: [https://arxiv.org/abs/2603.08392]
extracted: 2026-10-26
terms:
  - {term: Relevance, level: axis, parent: User perspective, definition: "Counselling is relevant to users if the advice aligns with their situation, increases the likelihood of action, and if they are satisfied with the tone and length.", definition_verbatim: false, location: "Section 3.1, Table 1", scale: mean of user variables}
  - {term: Alignment, level: criterion, parent: Relevance, definition: "User rates 'The response aligns with my situation'; average score indicating alignment with the user's situation (mood, energy, etc.).", definition_verbatim: true, location: Table 1, scale: 5-point Likert}
  - {term: Follow-up, level: criterion, parent: Relevance, definition: "User rates 'I will follow the tips in the response'; average score indicating whether the user is likely to act on the response.", definition_verbatim: true, location: Table 1, scale: 5-point Likert}
  - {term: Tone (user), level: criterion, parent: Relevance, definition: "User rates 'The response has the right tone'; average score of response tone quality.", definition_verbatim: true, location: Table 1, scale: 5-point Likert}
  - {term: Length (user), level: criterion, parent: Relevance, definition: "User rates 'The response has the right length'; average score of response length.", definition_verbatim: true, location: Table 1, scale: 5-point Likert}
  - {term: Quality, level: axis, parent: Expert perspective, definition: "Experts focus on the quality of the counselling with respect to its correctness, and the appropriate tone and length for the population and disease.", definition_verbatim: false, location: "Section 3.1, Table 1", scale: mean of expert variables}
  - {term: Correctness, level: criterion, parent: Quality, definition: "Expert rates 'The contextualisation is correct'; average score of contextualisation quality.", definition_verbatim: true, location: Table 1, scale: 5-point Likert}
  - {term: Tone (expert), level: criterion, parent: Quality, definition: "Expert rates 'The response has the right tone'; average score of response tone quality.", definition_verbatim: true, location: Table 1, scale: 5-point Likert}
  - {term: Length (expert), level: criterion, parent: Quality, definition: "Expert rates 'The response has the right length'; average score of response length.", definition_verbatim: true, location: Table 1, scale: 5-point Likert}
  - {term: Reliability, level: axis, parent: Developer perspective, definition: "Developers' vantage point: baseline performance on key metrics such as faithfulness and completeness of the counselling, and hallucination rates.", definition_verbatim: false, location: "Section 1, Table 1", scale: rescaled ratios of binary judgments}
  - {term: Faithfulness, level: metric, parent: Reliability, definition: "Faithfulness concerns the extent to which generated claims about the user data are consistent with that user's data.", definition_verbatim: true, location: Section 3.1, scale: "binary per claim, % supported"}
  - {term: Completeness, level: metric, parent: Reliability, definition: "Completeness concerns the extent to which all relevant information in the user data for some query was retrieved.", definition_verbatim: true, location: Section 3.1, scale: "binary per claim, % retrieved"}
  - {term: Hallucination, level: metric, parent: Reliability, definition: "Hallucination concerns the existence of contextualisation statements in the counselling that cannot be traced to the knowledge database.", definition_verbatim: true, location: Section 3.1, scale: "binary per statement, % grounded"}
notes: "Framework name expands to QUality, Outcome Reliability, and User-relevance from Multiple stakeholders. Three perspectives (users 19, experts 6, developers 2). Tone and length appear under both user and expert perspectives."
