notes: Evaluation axes adapted from Singhal et al. 2023 (Med-PaLM). Non-clinicians rated consumer-query answers; clinicians rated MCQ, SAQ and CQ answers. 379 raters, 37,435 ratings. Paper itself calls the non-clinician axes relevance, helpfulness, and bias (localization). 'Clinician axes' and 'Non-clinician axes' are rater-group labels, not source terms.
