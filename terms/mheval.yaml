notes: Harness wrapping nine existing benchmarks; terms are each wrapped benchmark's headline metric as listed in the README. Per-dimension breakdowns (MindEval 5 criteria, VERA-MH 5 dimensions, EQ-Bench 18 criteria, Spiral-Bench 17 behaviors, SIM-VAIL 39 dimensions, CounselBench 6 metrics and 6 failure modes) belong to the original benchmarks and are not enumerated here. MentalHealthBench's headline metric was not named in the README excerpt read.
