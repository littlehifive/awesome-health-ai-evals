entry: quarkmedbench
sources: [https://arxiv.org/abs/2603.13691]
extracted: 2026-10-26
terms:
  - {term: Necessary, level: criterion, definition: "Core medical facts that must be present in the response (diagnostic criteria, absolute contraindications); called Essential items elsewhere in the paper. Failure triggers hard rejection of extra points.", definition_verbatim: false, location: "Stage 3 rubric extraction; clinical attributes section", scale: weighted rubric points}
  - {term: Important, level: criterion, definition: "Expansive information or professional explanations requisite for comprehensive recommendations.", definition_verbatim: false, location: clinical attributes section, scale: weighted rubric points with saturation cap}
  - {term: Highlight, level: criterion, definition: "Content demonstrating insightful depth or addressing implicit needs.", definition_verbatim: false, location: clinical attributes section, scale: weighted rubric points with saturation cap}
  - {term: Pit, level: criterion, definition: "Pitfall items: errors or harmful content a response must avoid; poor performance triggers hard rejection (also called Pitfall).", definition_verbatim: false, location: "Stage 3; scoring section", scale: negative/penalty weights}
  - {term: Basic, level: category, parent: Hierarchical Labels, definition: "Basic Tier primarily assesses the model's grasp of fundamental medical facts.", definition_verbatim: true, location: Hierarchical Labels (Table 1), scale: difficulty tier}
  - {term: Pro, level: category, parent: Hierarchical Labels, definition: "Pro Tier focuses on the model's capacity to unearth latent user intents, cite authoritative sources, and ensure information recency.", definition_verbatim: true, location: Hierarchical Labels (Table 1), scale: difficulty tier}
  - {term: Expert, level: category, parent: Hierarchical Labels, definition: "Expert Tier, tailored for professional cohorts, examines the model's profound comprehension and critical reasoning regarding medical knowledge.", definition_verbatim: true, location: Hierarchical Labels (Table 1), scale: difficulty tier}
  - {term: Direct, level: category, parent: Response Perspectives, definition: "Direct concentrates on the core answer to the query, prioritizing the precise retrieval of indispensable facts.", definition_verbatim: true, location: Response Perspectives (Table 2), scale: perspective tag}
  - {term: Depth, level: category, parent: Response Perspectives, definition: "Depth evaluates the model's profound comprehension, assessing its ability to uncover the underlying essence and etiology behind the immediate query.", definition_verbatim: true, location: Response Perspectives (Table 2), scale: perspective tag}
  - {term: Breadth, level: category, parent: Response Perspectives, definition: "Breadth measures the model's capacity for lateral exploration, elucidating corollary topics and peripheral concerns that the user might implicitly harbor.", definition_verbatim: true, location: Response Perspectives (Table 2), scale: perspective tag}
  - {term: Information Quality, level: dimension, parent: Label Taxonomy, definition: "The Information Quality dimension measures the alignment, accuracy, and timeliness of the model's output relative to user intent, as well as its comprehensiveness, utility, and accessibility.", definition_verbatim: true, location: Label Taxonomy, scale: aggregated rubric score}
  - {term: Evidentiary Support, level: dimension, parent: Label Taxonomy, definition: "The Evidentiary Support dimension examines whether the response cites reliable data, authoritative sources, or authentic case studies to validate its credibility and persuasiveness.", definition_verbatim: true, location: Label Taxonomy, scale: aggregated rubric score}
  - {term: Safety, level: dimension, parent: Label Taxonomy, definition: "The Safety dimension is designed to ensure the content poses no physical, psychological, privacy, or financial risks to users, strictly adhering to legal regulations and industry standards.", definition_verbatim: true, location: Label Taxonomy, scale: aggregated rubric score}
  - {term: Readability, level: dimension, parent: Label Taxonomy, definition: "The Readability dimension evaluates the clarity of the structural and logical organization, as well as the conciseness and fluency of expression, facilitating comprehension by the target audience.", definition_verbatim: true, location: Label Taxonomy, scale: aggregated rubric score}
  - {term: Humanistic Care, level: dimension, parent: Label Taxonomy, definition: "The Humanistic Care dimension assesses whether the content demonstrates empathy toward user emotions and circumstances, respects fairness and cultural diversity, and provides requisite support.", definition_verbatim: true, location: Label Taxonomy, scale: aggregated rubric score}
notes: "Rubrics are auto-generated per query (reference answer first, then rubric extraction) and each rubric is tagged with clinical attribute, difficulty tier, response perspective, and one of five capability labels; per-query rubrics are not listed. Scores are max-min normalized with weighted aggregation. Query scenario categories (Clinical Care, Wellness Health, Professional Inquiry) are topic strata, not scored."
