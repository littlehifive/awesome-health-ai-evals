notes: The Research Square preprint was not reached; terms are taken from the published Nature Communications version of the same work (ClinDiag-Benchmark, 10.1038/s41467-026-70274-w), which lists six reader-rated metrics, whereas the entry file's notes say the preprint used five 1-5 metrics, so the exact preprint set may differ. The GitHub README describes the framework and data layout but no metric definitions. Supplementary metric descriptions not read.
