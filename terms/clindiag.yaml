terms:
- term: Diagnostic accuracy
  level: metric
  definition: Whether the final diagnosis the model reaches in the simulated diagnostic encounter (or static QA) matches the reference diagnosis, judged by an LLM.
  definition_verbatim: false
  location: Results, Diagnostic accuracy
  scale: percentage
- term: gather completeness
  level: criterion
  parent: Procedure performance
  definition: Reader-rated qualitative metric of procedure performance, scored per stage (medical history, physical examination, diagnostic testing); the main text gives no further definition (descriptions are in Supplementary Table 8).
  definition_verbatim: false
  location: Results, Procedure Performance
  scale: 5-point Likert (5 = full compliance, 1 = complete non-compliance)
