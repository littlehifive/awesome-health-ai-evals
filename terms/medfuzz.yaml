entry: medfuzz
sources:
- https://arxiv.org/abs/2406.06573
extracted: '2026-10-26'
terms:
- term: Accuracy after MedFuzz attack
  level: metric
  definition: Accuracy of the target LLM on MedQA items after up to N attacker-LLM modification attempts that add patient characteristics intended to induce a distractor choice; compared with unattacked accuracy and with human USMLE performance (76.6%).
  definition_verbatim: false
  location: Section 5, Figure 2
  scale: percent correct by number of attack attempts
- term: Permutation test p-value
  level: metric
  definition: Significance of an individual successful attack, computed against 30 'control fuzzes' generated by an attacker prompt that tries to make the test taker wrong without targeting the distractor.
  definition_verbatim: false
  location: Section 5, Appendix A.3
  scale: p-value
- term: CoT faithfulness
  level: other
  definition: Analysis of whether the target LLM's chain-of-thought responses faithfully reflect the reasoning when an attack changes its answer.
  definition_verbatim: false
  location: Section 5, Figure 3
  scale: qualitative
notes: 'MedFuzz scores only MedQA answer correctness (multiple choice) plus the permutation test and a qualitative CoT-faithfulness analysis. Attacker constraint: modified question keeps same options and correct answer and may not add objective evidence favoring a distractor.'
