notes: 19-question rubric (11 management reasoning, 2 summarization, 4 safety, 1 personalization, 1 diagnostic accuracy) rated by breast oncologists; each question has 2-5 options with defined favorable options. A Gemini 1.5 Pro auto-rater reuses the same rubric. NEJM AI page not reached; arXiv version read.
