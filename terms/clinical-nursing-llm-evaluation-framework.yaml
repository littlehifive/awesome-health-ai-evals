notes: 37 metrics in six domains per the abstract; the metric list here is taken from the Section 3.3 narrative and the count is approximate (about 35 named), since the Figure 3 and appendix lists were not read. Domain descriptions are condensed paraphrases of the Results text. The paper also gives five scenario categories and a minimum technical reporting checklist, which are not scored terms. No scoring scale; the framework lists what to measure.
