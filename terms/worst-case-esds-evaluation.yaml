notes: "Rated by an LLM evaluator on five-point Likert scales for conversations with an average-case and a worst-case seeker simulator; correlation with expert ratings reported. Table 1 abbreviations list Personalization and Helpfulness in place of Response Appropriateness and Problem Resolution, so the generic metric names vary slightly between text and table. Expert simulation study used existing emotional support scales (Appendix C), not recorded as terms."
