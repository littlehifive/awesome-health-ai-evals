entry: worst-case-esds-evaluation
sources: [https://arxiv.org/abs/2605.28228]
extracted: 2026-10-26
terms:
  - term: Deep Emotional Understanding
    level: metric
    definition: "Evaluates whether the supporter can go beyond the seeker's surface expression and literal content to identify core feelings, latent needs, relational meanings, and emotional signals embedded in ambiguous, metaphorical, ironic, low-engagement, or avoidant expressions."
    definition_verbatim: true
    location: Appendix D; Section 3.2
    scale: 1-5 Likert
  - term: Guided Exploration
    level: metric
    definition: "Evaluates whether the supporter can actively collect necessary information and help the seeker further express, understand, and organise the problem through open-ended questions, clarification, concretisation, summarisation, and contextual focusing, while avoiding premature conclusions or advice before sufficiently understanding the seeker's emotions and situation."
    definition_verbatim: true
    location: Appendix D; Section 3.2
    scale: 1-5 Likert
  - term: Balanced Emotional Support
    level: metric
    definition: "Evaluates whether the supporter can fully accept the seeker's emotions while avoiding blind agreement, excessive validation, absolute judgments, or reinforcement of one-sided interpretations, and can gently guide the seeker toward a more balanced understanding."
    definition_verbatim: true
    location: Appendix D; Section 3.2
    scale: 1-5 Likert
  - term: Authentic and Grounded Support
    level: metric
    definition: "Evaluates whether the supporter can provide sincere, credible, and warm support grounded in the seeker's specific expressions, experiences, and emotions, while avoiding empty comfort, template-like wording, mechanical repetition, or unsupported claims of understanding."
    definition_verbatim: true
    location: Appendix D; Section 3.2
    scale: 1-5 Likert
