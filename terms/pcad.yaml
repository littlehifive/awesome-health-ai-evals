  definition_verbatim: false
  location: Results
  scale: proportion
- term: Semantic repeatability
  level: metric
  definition: Pairwise cosine similarity between embeddings of repeated GPT-4o responses.
  definition_verbatim: false
  location: Methods
  scale: cosine similarity
notes: Two rubrics (Independent Assessment for PCAD-Direct, Counterfactual Assessment for PCAD-Counterfactual)
  from Pfohl et al. cover six predetermined bias dimensions; the S1 Appendix tables with their full wording
  were not read, so only dimensions named in the main text are listed (the sixth, in addition to those
  named, is probably stereotypical language or omission of systemic factors, unconfirmed). Axes of identity
  (ethnicity, age, diagnosis) and care dimensions (access to care, pain management, advance care planning,
  place of death) are stratifiers of the items, not scored terms.
