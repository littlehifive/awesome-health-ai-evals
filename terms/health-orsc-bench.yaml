notes: Difficulty tiers Easy-5K (refused by fewer than 4 models), Medium-5K (5-9) and Hard-1K (10 or more of 30 models) stratify prompts rather than score outputs. Refusal detection uses keyword/LLM check; safety and helpfulness annotation by Grok-4 (prompts in Appendix D.3, not read).
