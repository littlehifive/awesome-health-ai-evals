entry: medmistake-bench
sources:
- https://arxiv.org/abs/2512.20983
extracted: '2026-10-26'
terms:
- term: Per-item dimension (pass/fail)
  level: criterion
  definition: Each MedMistake-Bench question is a single-shot version of a low-scoring MedPI dimension (score <=3 of 5); a response passes if it avoids the mistake, as judged against the item.
  definition_verbatim: false
  location: Sections 2-3, Appendix Tables 3-4
  scale: pass/fail per item
- term: adaptive dialogue
  level: category
  parent: MedPI dimensions
  definition: MedPI dimension category from which mistakes were extracted (MedPI scores doctors on 105 dimensions grouped into 29 categories; this benchmark uses 40 of the dimensions).
  definition_verbatim: false
  location: Section 2, "Conversation generation and evaluation with MedPI"
