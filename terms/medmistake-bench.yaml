notes: The 29 category names come from the MedPI framework that generates the conversations; which of them appear among the 40 benchmark dimensions was not itemised in the text read (the paper mentions e.g. suicide risk assessment duplicates, cardiology and neurology). Definitions of the individual dimensions are not given in the paper text; each is a short descriptive mistake title.
