terms:
  - term: Exact match accuracy
    level: metric
    definition: "Accuracy on objective numerical queries, based on an exact match to within two digits of precision."
    definition_verbatim: true
    location: Figure 3A caption; Results
    scale: proportion correct
  - term: Relevance of data utilized
    level: criterion
    parent: Open-ended reasoning quality
    definition: "Rater attribute on whether the response used data relevant to the query."
    definition_verbatim: false
    location: Section on human evaluation of open-ended insights; Table E.2
    scale: yes/no (proportion of annotators answering yes, scaled 0-100)
  - term: Accuracy in interpreting the question
    level: criterion
    parent: Open-ended reasoning quality
    definition: "Rater attribute on whether the response correctly interpreted what the question asked."
    definition_verbatim: false
    location: Human evaluation; Table E.2
    scale: yes/no
  - term: Personalization
    level: criterion
    parent: Open-ended reasoning quality
    definition: "Rater attribute on whether the response is tailored to the user's own data."
    definition_verbatim: false
    location: Human evaluation; Table E.2
    scale: yes/no
  - term: Incorporation of domain knowledge
    level: criterion
    parent: Open-ended reasoning quality
    definition: "Rater attribute on whether the response shows understanding of relevant domain knowledge."
    definition_verbatim: false
    location: Human evaluation; Table E.2
    scale: yes/no
  - term: Correctness of the logic
    level: criterion
    parent: Open-ended reasoning quality
