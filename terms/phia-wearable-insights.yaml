    scale: proportion
  - term: Error categories (Hallucination, General Code Errors, Misinterpretation)
    level: category
    definition: "Semantic categories from open coding of errors in responses, including hallucinations, Python code errors, and misinterpretation of the user's query; the source lists further categories not fully captured here."
    definition_verbatim: false
    location: Understanding the Source of Errors; Figure 6
    scale: counts
notes: "Personalization and Code quality attributes appear in two rater tasks (12 annotators for reasoning, 7 data scientists for code). Rubric text is in Table E.2 and Section E.3, which I did not open, so criteria definitions are paraphrased from the main text. Objective queries are numeric exact-match."
