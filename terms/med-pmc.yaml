entry: med-pmc
sources:
- https://arxiv.org/abs/2408.08693
- https://github.com/LiuHC0428/Med-PMC
extracted: '2026-10-26'
terms:
- term: Inquiry
  level: metric
  parent: Information gathering
  definition: Recall (ROUGE-1) of the ground-truth patient information (chief complaint, present illness, past history) in the final report generated by the doctor agent.
  definition_verbatim: false
  location: Appendix, Eq. 6
- term: Examination
  level: metric
  parent: Information gathering
  definition: Share of ground-truth examination entities (extracted with spaCy NER) that appear in the final report.
  definition_verbatim: false
  location: Appendix, Eq. 7-8
- term: Multi-modal Analysis (MMA)
  level: metric
  parent: Information gathering
  definition: How much the doctor's response after obtaining the image correlates with the image report (recall).
  definition_verbatim: true
  location: Appendix, Eq. 9
- term: Diagnosis
  level: metric
  parent: Decision-making
  definition: Degree of diagnosis of the disease, such as the location and type of disease; recall with ROUGE-L against ground truth.
  definition_verbatim: true
  location: Appendix, Eq. 10
- term: Treatment
  level: metric
  parent: Decision-making
  definition: How much the treatment plan coincides with the ground truth.
  definition_verbatim: true
  location: Appendix, Eq. 11
- term: Information gathering
  level: axis
  definition: Whether MLLMs can collect sufficient patient information during the consultation.
  definition_verbatim: false
  location: Section on evaluation
- term: Decision-making
  level: axis
  definition: Whether MLLMs can ultimately provide accurate diagnoses and recommendations.
  definition_verbatim: false
  location: Section on evaluation
- term: LLM-judged inquiry, examination, multi-modal analysis, diagnosis, treatment
  level: criterion
  definition: GPT-4o rates each aspect with a separate prompt inspired by assessment plans from Peking University and the National Health Commission of China.
  definition_verbatim: false
  location: Section on LLM-based evaluation
  scale: 1-5
- term: 'Patient simulator quality: description clarity, information completeness, cooperation, understanding, communication ability'
  level: criterion
  definition: LLM-judged quality of the patient simulator, not of the doctor model.
  definition_verbatim: false
  location: Tables 4-5
  scale: 2 points per aspect (standard patient), 5 (actor)
notes: Automatic metrics use ROUGE-based recall; the entry notes also mention GPT-4o rating of communication. Detailed LLM prompt text (Tables 8-9) not read, so per-criterion definitions for LLM scores are paraphrases.
