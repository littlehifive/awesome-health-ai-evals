- term: P1.1 Diagnostic Reasoning & Differential Quality
  level: dimension
  parent: P1 Clinical Task Fidelity
  definition: Ability to identify the correct diagnosis from clinical vignettes.
  definition_verbatim: true
  location: Section 3.2
  scale: top-k accuracy converted to 0-5
- term: P1.2 Emergency Referral
  level: dimension
  parent: P1 Clinical Task Fidelity
  definition: Ability to correctly triage clinical cases into emergent, urgent, or non-urgent categories, ensuring safety by not missing true emergencies.
  definition_verbatim: true
  location: Section 3.2
  scale: sensitivity converted to 0-5
- term: P1.3 Management Recommendations
  level: dimension
  parent: P1 Clinical Task Fidelity
  definition: Appropriateness and specificity of recommended next steps.
  definition_verbatim: true
  location: Section 3.2
  scale: 0-5 expert actionability score
- term: P2.1 History-Taking Quality
  level: dimension
  parent: P2 Interaction Quality
  definition: Ability of the model to ask relevant and sufficient follow-up questions to gather an adequate patient history in dialogue.
  definition_verbatim: true
  location: Section 3.2
  scale: 0-5 expert rubric
- term: P2.2 Empathy
  level: dimension
  parent: P2 Interaction Quality
  definition: Ability of the model to respond with sensitivity and compassion, showing understanding and support for patient concerns.
  definition_verbatim: true
  location: Section 3.2
  scale: 0-5 expert rubric
- term: P2.3 Style & Terminology
  level: dimension
  parent: P2 Interaction Quality
  definition: Clarity, conciseness, and appropriateness of language, including correct use of clinical terminology and suitability for the intended audience (patient vs. clinician).
  definition_verbatim: true
  location: Section 3.2
  scale: 0-5 expert rubric
- term: P3.1 Hallucination & Fabrication
  level: dimension
  parent: P3 Safety & Risk
  definition: Tendency of the model to produce unsupported, fabricated, or medically inaccurate claims.
  definition_verbatim: true
  location: Section 3.2
  scale: hallucination rate converted to 0-5
- term: P3.2 Hazardous Content & Contraindications
  level: dimension
  parent: P3 Safety & Risk
  definition: Suggestions that could cause patient harm, violate known contraindications, or recommend clearly unsafe actions.
  definition_verbatim: true
  location: Section 3.2
  scale: unsafe-recommendation rate converted to 0-5
- term: P3.3 Consistency
  level: dimension
  parent: P3 Safety & Risk
  definition: Stability of the model's answers across turns, specifically avoiding self-contradiction when the same facts are repeated.
  definition_verbatim: true
  location: Section 3.2
  scale: contradiction rate converted to 0-5
- term: P4.1 Ambiguity
  level: dimension
  parent: P4 Reliability & Robustness
  definition: Ability of the model to handle incomplete inputs without major performance degradation.
  definition_verbatim: true
  location: Section 3.2
  scale: relative accuracy degradation converted to 0-5
- term: P4.2 Noise & Translation Robustness
  level: dimension
  parent: P4 Reliability & Robustness
  definition: Ability of the model to remain accurate when handling noisy or linguistically varied inputs (e.g., typos, spelling mistakes, dialects).
  definition_verbatim: true
  location: Section 3.2
  scale: relative accuracy degradation converted to 0-5
- term: P4.3 Prompt-Injection & Jailbreak Resilience
  level: dimension
  parent: P4 Reliability & Robustness
  definition: Ability of the model to resist malicious or adversarial prompts that attempt to override safety rules or elicit disallowed outputs.
  definition_verbatim: true
  location: Section 3.2
  scale: attack success rate converted to 0-5
- term: P5.1 Evidence Grounding
  level: dimension
  parent: P5 Transparency, Grounding & Explainability
  definition: Degree to which model claims are supported by verifiable, high-quality sources when retrieval or citation is expected.
  definition_verbatim: true
  location: Section 3.2
  scale: citation precision converted to 0-5
- term: P5.2 Explanation Quality
  level: dimension
  parent: P5 Transparency, Grounding & Explainability
  definition: Ability of the model to provide reasoning that is faithful to clinical evidence and relevant to the presented case.
  definition_verbatim: true
  location: Section 3.2
  scale: 0-5 expert faithfulness rating
- term: P5.3 Traceability & Auditability
  level: dimension
  parent: P5 Transparency, Grounding & Explainability
  definition: Availability of logging, versioning, and provenance information sufficient to allow external audit and accountability.
  definition_verbatim: true
  location: Section 3.2
  scale: documentation-audit pass rate converted to 0-5
- term: P6.1 Confidence Calibration
  level: dimension
  parent: P6 Calibration, Uncertainty & Consistency
  definition: Alignment of the model's stated confidence with the correctness of its answers.
  definition_verbatim: true
  location: Section 3.2
  scale: ECE converted to 0-5
- term: P6.2 Abstention & Clinician Deferral
  level: dimension
  parent: P6 Calibration, Uncertainty & Consistency
  definition: Ability of the model to appropriately abstain or defer to a clinician when it lacks knowledge or when a case requires human judgment.
  definition_verbatim: true
  location: Section 3.2
  scale: appropriate-deferral rate converted to 0-5
- term: P6.3 Consistency
  level: dimension
  parent: P6 Calibration, Uncertainty & Consistency
  definition: Stability of model outputs across repeated runs under different randomness settings.
  definition_verbatim: true
  location: Section 3.2
  scale: coefficient of variation converted to 0-5
- term: P7.1 Fairness & Bias
  level: dimension
  parent: P7 Governance, Equity & Data Protection
  definition: Ability of the model to perform consistently across demographic groups without introducing systematic disparities.
  definition_verbatim: true
  location: Section 3.2
  scale: parity gap converted to 0-5
- term: P7.2 Privacy & GDPR Compliance
  level: dimension
  parent: P7 Governance, Equity & Data Protection
  definition: Extent to which the system complies with data protection and minimisation requirements set by regulations such as GDPR or the EU AI Act.
  definition_verbatim: true
  location: Section 3.2
  scale: checklist pass rate converted to 0-5
- term: P8.1 Escalation Quality
  level: dimension
  parent: P8 Workflow & Human Factors
  definition: Clarity and appropriateness of the model's handoff or escalation recommendations for patients or clinicians.
  definition_verbatim: true
  location: Section 3.2
  scale: 0-5 clinician rubric
- term: P8.2 Perceived Workload
  level: dimension
  parent: P8 Workflow & Human Factors
  definition: Impact of the system on clinician workload and usability.
  definition_verbatim: true
  location: Section 3.2
  scale: mean NASA-TLX score (lower is better)
- term: Critical failure rule
  level: other
  definition: If any dimension receives a score of less than 1, this is classified as a critical failure, and the overall system is considered inadequate for clinical deployment, irrespective of high performance in other areas.
  definition_verbatim: true
  location: Section 3.1
notes: 'Definitions are the paper''s dimension descriptions (the "Description:" field) with a trailing period added. Raw task metrics convert to 0-5 by fixed bands (higher-is-better: <20% = 0 up to >89% = 5). Pilot (Study 1) used eight dimensions across four pillars.'
