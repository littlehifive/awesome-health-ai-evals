- term: Completeness
  level: axis
  definition: whether the model comprehensively addressed all facets of the user's complex query without omitting critical medical details, caveats, or necessary follow-up steps.
  definition_verbatim: true
  location: Appendix I.3 (HealthBench-Hard axis used in downstream optimization)
- term: Context Awareness
  level: axis
  definition: how effectively the model integrated and adapted its advice to the user's specific personal context, implicit needs, or provided demographic/health data.
  definition_verbatim: true
  location: Appendix I.3 (HealthBench-Hard axis)
notes: Hierarchical taxonomy (macro capabilities to sub-aspects to 100+ Boolean leaves); a context-aware router activates a subset per query. The paper does not give a full list of leaf rubrics in the sections read. Knowledge..Numerical accuracy are the capability columns of the Table 1 comparison, used to position the framework, and I could not confirm they are the tree's own top-level nodes. Completeness and Context Awareness are HealthBench-Hard axes used in downstream evaluation. Meta-evaluation metrics (ICC3, Cohen's kappa, mean penalty, detection rate) assess the evaluator, not model outputs.
