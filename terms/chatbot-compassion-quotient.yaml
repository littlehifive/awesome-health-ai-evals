entry: chatbot-compassion-quotient
sources:
- https://doi.org/10.3389/fpsyg.2025.1680552
- https://pmc.ncbi.nlm.nih.gov/articles/PMC12753942/
extracted: '2026-10-26'
terms:
- term: Compassion
  level: dimension
  definition: Rating of how compassionate each response is across nine healthcare scenarios (for example
    delivering difficult news and alleviating frustration); 1 is 'not at all compassionate' and 5 is 'very
    compassionate'.
  definition_verbatim: false
  location: Methods (main study); Figure 4
  scale: 1-5 Likert
- term: AI-vs-human attribution
  level: other
  definition: Participants identify which of the three responses was AI-generated (a Turing-test-style
    check).
  definition_verbatim: false
  location: Methods; Figure 4
  scale: multiple choice (identify AI response)
notes: Single construct (compassion/empathy) rated per response by 30 laypeople; the tool is modeled on
  the Empathy Quotient but has no sub-dimensions. Response length was noted as a confound.
