terms:
  - term: Accuracy
    level: dimension
    definition: "Accuracy encompasses three domains: substantive accuracy (responses are factually correct and contextually appropriate within the medical field), linguistic accuracy, and local accuracy."
    definition_verbatim: false
    location: Section (6) Evaluate using a structured approach; Table 2
    scale: checklist yes/no questions
  - term: Substantive accuracy
    level: criterion
    parent: Accuracy
    definition: "Are responses factually correct and complete?"
    definition_verbatim: true
    location: Table 2
  - term: Linguistic accuracy
    level: criterion
    parent: Accuracy
    definition: "Are responses grammatically correct and clear, even in non-English languages?"
    definition_verbatim: true
    location: Table 2
  - term: Local accuracy
    level: criterion
    parent: Accuracy
    definition: "Do responses align with hospital policies and preferences?"
    definition_verbatim: true
    location: Table 2
  - term: Consistency
    level: dimension
    definition: "Responses need to be reproducible and stable over time, ensuring reliability in their outputs."
    definition_verbatim: false
    location: Section (6); Table 2
    scale: checklist yes/no questions
  - term: Reproducibility
    level: criterion
    parent: Consistency
    definition: "Are responses consistent across repeated prompts?"
    definition_verbatim: true
    location: Table 2
  - term: Stability over time
    level: criterion
    parent: Consistency
    definition: "Are responses stable across different sessions and model versions?"
    definition_verbatim: true
    location: Table 2
  - term: Mitigation of inconsistencies
    level: criterion
    parent: Consistency
    definition: "Are inconsistencies addressed effectively through prompt refinements?"
    definition_verbatim: true
    location: Table 2
  - term: Unaltered
    level: dimension
    definition: "The response of LLM should accurately reflect the information presented in the patient chart without introducing extraneous content (hallucinations)."
    definition_verbatim: true
    location: Section (6); Table 2
    scale: checklist yes/no questions
  - term: Hallucinations
    level: criterion
    parent: Unaltered
    definition: "Do responses avoid adding erroneous or fabricated information?"
    definition_verbatim: true
    location: Table 2
  - term: Reflection of source data
    level: criterion
    parent: Unaltered
    definition: "Do responses accurately reflect the input data, such as patient charts?"
    definition_verbatim: true
    location: Table 2
  - term: Traceability
    level: dimension
    definition: "The responses should be Traceable, making it clear where the LLM obtained its information, ideally by providing a reference to the source."
    definition_verbatim: true
    location: Section (6); Table 2
    scale: checklist yes/no questions
  - term: Source attribution
    level: criterion
