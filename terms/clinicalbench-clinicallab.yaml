entry: clinicalbench-clinicallab
sources: [https://arxiv.org/abs/2406.13890, https://github.com/WeixiangYAN/ClinicalLab]
extracted: 2026-10-26
terms:
  - term: Department Win Rate (DWR)
    level: metric
    definition: "DWR measures the relative performance of LLMs in clinical diagnosis across different medical departments (average rank-based score of a model across departments)."
    definition_verbatim: true
    location: Section 4.2, Eq. 1
  - term: Department Instruction Following Rate (DIFR)
    level: metric
    definition: "DIFR measures the degree to which LLMs follow task instructions when generating the quantity and names of ranked departments. It is the average of two sub-metrics: DIFR-Q and DIFR-N."
    definition_verbatim: true
    location: Section 4.2
  - term: Department Quantity Following Rate (DIFR-Q)
    level: metric
    parent: Department Instruction Following Rate (DIFR)
    definition: "DIFR-Q measures the consistency between the quantity of top K' departments generated by the model and the quantity of K departments specified in the task instructions."
    definition_verbatim: true
    location: Section 4.2, Eq. 2
  - term: Department Name Following Rate (DIFR-N)
    level: metric
    parent: Department Instruction Following Rate (DIFR)
    definition: "DIFR-N measures the consistency of the department names generated by the model with the names in a predefined list of 24 departments."
    definition_verbatim: true
    location: Section 4.2, Eq. 3
  - term: Comprehensive Diagnostic Rate (CDR)
    level: metric
    definition: "CDR measures the accuracy of LLMs in simultaneously predicting correct department guide and disease diagnosis."
    definition_verbatim: true
    location: Section 4.2, Eq. 4
    scale: per-sample binary product of department-guide and diagnosis correctness
  - term: Acceptability
    level: metric
    definition: "Acceptability measures the comprehensive performance of LLMs in terms of prediction accuracy in department guide and disease diagnosis tasks, as well as the language quality of other generated diagnostic content, reflecting the overall effectiveness of the model in handling complex clinical situations."
    definition_verbatim: true
    location: Section 4.2, Eq. 5
  - term: Accuracy
    level: metric
    definition: "Accuracy on department guide, preliminary diagnosis (PD), and final diagnosis (FD) tasks."
    definition_verbatim: false
    location: Section 4.2, Table 2
  - term: BLEU
    level: metric
    definition: "Text-overlap metric used for generative diagnostic tasks (diagnostic basis, differential diagnosis, treatment principles, treatment plan, imaging diagnosis)."
    definition_verbatim: false
    location: Section 4.2, Table 2
  - term: ROUGE
    level: metric
    definition: "Text-overlap metric used for generative diagnostic tasks, averaged with BLEU and BERTScore."
    definition_verbatim: false
    location: Section 4.2, Table 2
  - term: BERTScore
    level: metric
    definition: "Embedding-similarity metric used for generative diagnostic tasks."
    definition_verbatim: false
    location: Section 4.2, Table 2
  - term: Fluency
    level: dimension
    definition: "Human-evaluation dimension of diagnostic output quality; anchors range from 'completely broken and unreadable sentence pieces' (1) to 'human-level fluency' (5)."
    definition_verbatim: false
    location: Appendix A (human evaluation), Figure 7
    scale: 1-5 rubric
  - term: Relevance
    level: dimension
    definition: "Human-evaluation dimension; from 'completely unrelated to the question' (1) to 'directly relevant and precisely targeted to the question' (5)."
    definition_verbatim: false
    location: Appendix A, Figure 7
    scale: 1-5 rubric
  - term: Completeness
    level: dimension
    definition: "Human-evaluation dimension; from 'extremely incomplete' (1) to 'fully complete with all information presented' (5)."
    definition_verbatim: false
    location: Appendix A, Figure 7
    scale: 1-5 rubric
  - term: Proficiency in medicine
    level: dimension
    definition: "Human-evaluation dimension of medical-knowledge proficiency; from plain language with no medical terminology (1) upward to expert-level medical language."
    definition_verbatim: false
    location: Appendix A, Figure 7
    scale: 1-5 rubric
notes: "Eight tasks (department guide, preliminary diagnosis, diagnostic basis, differential diagnosis, final diagnosis, principles of treatment, treatment plan, imaging diagnosis) are the task structure, not terms. Overall score is the average over 9 scores under the 8 tasks. Human evaluation (20 sampled cases, 7 experts, double-blind) and GPT-4o scoring on 150 cases use the four 1-5 dimensions above and apply to ClinicalAgent comparisons."
