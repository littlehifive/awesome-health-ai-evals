notes: Open-ended questions use a rule-calibrated multi-dimensional point-wise LLM-as-judge (CompassJudger-1-7B).
  The paper names the seven dimensions but gives no per-dimension definitions in the text read. Task scores
  are normalised (best of 39 LLMs set to 90) and aggregated by harmonic mean.
