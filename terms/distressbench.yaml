notes: 'Each task has 6-20 atomic binary criteria (about 6,901 total), each tagged with one dimension and an integer weight 1-20; score is the weighted fraction satisfied. Task metadata axes (subcategory, age group, progression, explicit type, turn structure) describe items, not scoring. Source: arXiv PDF.'
