entry: er-reason
sources: [https://arxiv.org/abs/2505.22919, https://physionet.org/content/er-reason/1.0.0/]
extracted: 2026-10-26
terms:
  - term: ESI accuracy
    level: metric
    parent: Task 1 ER acuity assessment
    definition: "Performance on this task is evaluated by measuring the accuracy of ESI scores predicted by LLMs against the scores assigned by ER physicians during actual patient admissions."
    definition_verbatim: true
    location: Section 3.3.1
    scale: accuracy
  - term: ROUGE-1/2/L F1
    level: metric
    parent: Task 2 one-liner patient summary
    definition: "We use ROUGE and F1 metrics to assess LLM-based one-liner patient summaries compared to those generated by ER physicians."
    definition_verbatim: true
    location: Section 3.3.2, Table 3
    scale: F1 (ROUGE-1, ROUGE-2, ROUGE-L)
  - term: Clinical Concept Recall
    level: metric
    parent: Task 3 treatment planning
    definition: "The proportion of clinical concepts from the 72 gold-standard physician-authored rationales that are also present in the model output (UMLS CUIs extracted with cTAKES)."
    definition_verbatim: true
    location: Section 3.3.3
    scale: proportion
  - term: Rule-out Reasoning
    level: dimension
    parent: Clinical reasoning (Task 3)
    definition: "Does the model correctly enumerate plausible diagnoses based on the patient history and current presentation?"
    definition_verbatim: true
    location: Section 3.3.3
    scale: Clinical Concept Recall against physician rationale; also physician ratings
  - term: Medical Factors
    level: dimension
    parent: Clinical reasoning (Task 3)
    definition: "Does the model identify appropriate labs, imaging, or diagnostic steps to confirm or rule out differential diagnoses?"
    definition_verbatim: true
    location: Section 3.3.3
    scale: Clinical Concept Recall against physician rationale; also physician ratings
  - term: Treatment Planning
    level: dimension
    parent: Clinical reasoning (Task 3)
    definition: "Does the model propose a clinically sound management plan, including immediate interventions in the ER and a preliminary treatment plan?"
    definition_verbatim: true
    location: Section 3.3.3
    scale: Clinical Concept Recall against physician rationale; also physician ratings
  - term: ICD-10 Exact Match accuracy
    level: metric
    parent: Task 4 final diagnosis
    definition: "The model-predicted diagnosis must match the true ICD-10 code assigned to the patient."
    definition_verbatim: true
    location: Section 3.3.4
    scale: accuracy
  - term: HCC Category Match accuracy
    level: metric
    parent: Task 4 final diagnosis
    definition: "Grouping diagnoses into broader, clinically meaningful categories as defined by CMS."
    definition_verbatim: true
    location: Section 3.3.4
    scale: accuracy
  - term: Disposition accuracy
    level: metric
    parent: Task 5 disposition
    definition: "Model-generated dispositions (discharge, admit, observe, transfer) are compared against physician-documented dispositions."
    definition_verbatim: false
    location: Section 3.3.4
    scale: accuracy
  - term: Hallucination Severity
    level: criterion
    definition: "Physician rating of how severe fabricated or factually incorrect content is in GPT-4o rationales, by reasoning category."
    definition_verbatim: false
    location: Table 5, Task 3 results
    scale: "rating (means 1.1 to 1.9; scale endpoints not read)"
  - term: Clinical Utility
    level: criterion
    definition: "Physician rating of the clinical usefulness of GPT-4o rationales, by reasoning category."
    definition_verbatim: false
    location: Table 5, Task 3 results
    scale: "rating (means about 4; scale endpoints not read)"
notes: A separate 194-case script-concordance component with physician annotations exists; its scoring was not read. Physician ratings in Table 5 come from a single board-certified ER physician on 20 rationales.
