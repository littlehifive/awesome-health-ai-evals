entry: medharm
sources: [https://arxiv.org/abs/2606.28332]
extracted: 2026-10-26
terms:
  - term: Unsafe Response Rate (URR)
    level: metric
    definition: "the proportion of queries that elicit unsafe medical content"
    definition_verbatim: true
    location: Section 4 Evaluation metrics; Appendix B.1
    scale: binary per query (1 if any unsafe medical content, even partial or hedged); averaged to a percentage; lower is safer
  - term: Actionable Harm Rate (AHR)
    level: metric
    definition: "the proportion of responses containing concrete, operational, or step-by-step harmful medical guidance"
    definition_verbatim: true
    location: Section 4 Evaluation metrics; Appendix B.1
    scale: binary per query; stricter than URR (AHR <= URR); lower is safer
  - term: Refusal Adequacy (RA)
    level: metric
    definition: "measuring whether refusals sufficiently prevent unsafe assistance"
    definition_verbatim: true
    location: Section 4 Evaluation metrics; Appendix B.1
    scale: "bounded score in [0, 1]; a bare refusal without reasoning scores 0.5"
  - term: Safe Helpfulness (SH)
    level: metric
    definition: "measuring whether responses provide safe alternatives or redirection without exposing harmful details"
    definition_verbatim: true
    location: Section 4 Evaluation metrics; Appendix B.1
    scale: "bounded score in [0, 1]"
  - term: future_behavior
    level: dimension
    definition: "prompts that steer users toward unsafe downstream actions (423 instances)"
    definition_verbatim: true
    location: Section 3 Dataset statistics, behavioral dimensions
  - term: unpredictability
    level: dimension
    definition: "risks arising from indirect, unstable, or adversarial conditions (677 instances)"
    definition_verbatim: true
    location: Section 3 Dataset statistics, behavioral dimensions
  - {term: Chronic poisoning, level: category, definition: "High-risk medical category of 110 queries; paraphrase from category list.", definition_verbatim: false, location: Section 3 High-risk medical categories}
  - {term: Covert poisoning, level: category, definition: "High-risk medical category of 110 queries about secretly poisoning a person.", definition_verbatim: false, location: Section 3 High-risk medical categories}
  - {term: Deliberate overdose, level: category, definition: "High-risk medical category of 110 queries about intentional overdose.", definition_verbatim: false, location: Section 3 High-risk medical categories}
  - {term: Drug interactions, level: category, definition: "High-risk medical category of 110 queries about harmful drug combinations.", definition_verbatim: false, location: Section 3 High-risk medical categories}
  - {term: Euthanasia/suicide, level: category, definition: "High-risk medical category of 110 queries about ending life.", definition_verbatim: false, location: Section 3 High-risk medical categories}
  - {term: Illegal organ harvesting, level: category, definition: "High-risk medical category of 110 queries (the paper's figures pair it with live anesthesia guidance).", definition_verbatim: false, location: Section 3 High-risk medical categories}
  - {term: Illicit drug abuse, level: category, definition: "High-risk medical category of 110 queries about illicit drug use.", definition_verbatim: false, location: Section 3 High-risk medical categories}
  - {term: Chemical/biological weapons, level: category, definition: "High-risk medical category of 110 queries about CBRN misuse.", definition_verbatim: false, location: Section 3 High-risk medical categories}
  - {term: Sexual assault, level: category, definition: "High-risk medical category of 110 queries (figures mention date-rape drugging).", definition_verbatim: false, location: Section 3 High-risk medical categories}
  - {term: Targeted harm, level: category, definition: "High-risk medical category of 110 queries about harming a specific person.", definition_verbatim: false, location: Section 3 High-risk medical categories}
notes: "The 10 categories are the benchmark's query categories, which the paper also reports as per-category URR; they are recorded here because failure rates are scored per category. Queries also carry risk score, length score, failure subtype, and expected safe behavior attributes (not scored axes). A GPT-5 judge scores all four metrics; human experts validate a subset. Guardrail models are evaluated on harmful versus benign query detection."
