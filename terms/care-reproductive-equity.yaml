entry: care-reproductive-equity
sources: [https://arxiv.org/abs/2603.20511]
extracted: 2026-10-26
terms:
  - term: Credibility
    level: dimension
    definition: "Credibility captures whether users can verify information, mapping onto Practical Reason and Control over One's Environment, as exercising reproductive autonomy requires traceable, trustworthy sources."
    definition_verbatim: true
    location: Section 3.2.2
    scale: "reputable-domain share of citations (.org, .gov, .edu, .int) plus response to the trust question"
  - term: Reasoning
    level: dimension
    definition: "Reasoning captures whether users can comprehend and act on information, mapping onto Practical Reason; Bodily Health; and Bodily Integrity; as exercising reproductive control requires understanding the information provided."
    definition_verbatim: true
    location: Section 3.2.2
    scale: "coded high (comprehensive and appropriate), moderate (relevant but with gaps), or low (off-topic or contradictory); kappa 0.78"
  - term: Practical Reason
    level: principle
    definition: "Nussbaum capability in CARE's capability set that the two evaluation dimensions map onto (credibility and reasoning); the paper's own definition is in Table 1."
    definition_verbatim: false
    location: Table 1, Section 3.2.2
  - term: Bodily Health
    level: principle
    definition: "Capability from CARE's reproductive capability subset, mapped to the Reasoning dimension."
    definition_verbatim: false
    location: Table 1, Section 3.2.2
  - term: Bodily Integrity
    level: principle
    definition: "Capability from CARE's reproductive capability subset, mapped to the Reasoning dimension."
    definition_verbatim: false
    location: Table 1, Section 3.2.2
  - term: Control over One's Environment
    level: principle
    definition: "Capability from CARE's reproductive capability subset, mapped to the Credibility dimension."
    definition_verbatim: false
    location: Table 1, Section 3.2.2
notes: "Capabilities are normative design targets; only Credibility and Reasoning are scored in the demonstration. Capability definitions are in Table 1, which was not read. Epistemic harms named: lack of source transparency, rigid verbose responses."
