entry: therapygym
sources:
- http://arxiv.org/abs/2603.18008
extracted: '2026-10-26'
terms:
- term: Cognitive Therapy Rating Scale (CTRS)
  level: axis
  definition: Official Beck Institute scale used to measure clinical fidelity (skillfulness of CBT delivery); 11 skill dimensions rated per dialogue.
  definition_verbatim: false
  location: Section 2.1.1; Appendix A Table 5
  scale: 0-6 per skill
- term: Agenda
  level: dimension
  parent: Cognitive Therapy Rating Scale (CTRS)
  definition: Set an appropriate agenda with target problems
  definition_verbatim: true
  location: Appendix A, Table 5 (verbatim from Beck Institute)
  scale: 0-6 CTRS scale (0 absence, 6 skillful and consistent application)
- term: Feedback
  level: dimension
  parent: Cognitive Therapy Rating Scale (CTRS)
  definition: Eliciting and responding to verbal and non-verbal feedback
  definition_verbatim: true
  location: Appendix A, Table 5 (verbatim from Beck Institute)
  scale: 0-6 CTRS scale (0 absence, 6 skillful and consistent application)
- term: Understanding
  level: dimension
  parent: Cognitive Therapy Rating Scale (CTRS)
  definition: Listening and empathic skills
  definition_verbatim: true
  location: Appendix A, Table 5 (verbatim from Beck Institute)
  scale: 0-6 CTRS scale (0 absence, 6 skillful and consistent application)
