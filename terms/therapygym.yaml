  scale: 0-6 CTRS scale (0 absence, 6 skillful and consistent application)
- term: Application of Cognitive-Behavioral Techniques
  level: dimension
  parent: Cognitive Therapy Rating Scale (CTRS)
  definition: Evaluate the client's thoughts; Socratic questioning; Behavioral experiment; Identifying and modifying beliefs; Doing problem solving; Teaching skills to regulate emotions, change behavior, and decrease physiological arousal
  definition_verbatim: true
  location: Appendix A, Table 5 (verbatim from Beck Institute)
  scale: 0-6 CTRS scale (0 absence, 6 skillful and consistent application)
