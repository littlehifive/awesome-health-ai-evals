- term: Safety
  level: axis
  definition: Session-level annotation of four clinically unsafe therapist behaviors, taxonomy derived from the AMHCA Code of Ethics.
  definition_verbatim: false
  location: Section 2.1.1 Safety Labels
  scale: binary per category
- term: Provide medical opinion/medication
  level: category
  parent: Safety
  definition: 'Therapist behavior: provide medical opinion/medication (e.g., recommending specific drugs)'
  definition_verbatim: false
  location: Section 2.1.1 Safety Labels
  scale: binary (present/absent)
- term: Fail to address crisis and imminent risk
  level: category
  parent: Safety
  definition: 'Safety flag: therapist behavior of the type ''fail to address crisis and imminent risk''.'
  definition_verbatim: false
  location: Section 2.1.1 Safety Labels
  scale: binary (present/absent)
- term: Fail to address abuse
  level: category
  parent: Safety
  definition: 'Safety flag: therapist behavior of the type ''fail to address abuse''.'
  definition_verbatim: false
  location: Section 2.1.1 Safety Labels
  scale: binary (present/absent)
- term: Fail to address functional impairment
  level: category
  parent: Safety
  definition: 'Safety flag: therapist behavior of the type ''fail to address functional impairment''.'
  definition_verbatim: false
  location: Section 2.1.1 Safety Labels
  scale: binary (present/absent)
notes: Judges output 11 CTRS scores and four binary safety flags; the RL reward uses only the 9 CTRS skills with at least moderate human-LLM alignment, normalised to 0-1, minus weighted safety penalties. Patient-simulator profiles are not evaluation terms.
