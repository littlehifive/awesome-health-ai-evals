notes: The scale has 25 items (item ids such as USA13-USA21, ENG9-ENG12, PER5-PER8); the item wording
  was not located in the page text read, so item-level criteria are not listed. The five initial Delphi
  dimensions were Design, Engagement, Functionality, Personalization, and Usability. Rated by 979 raters
  on 36 chatbots; user-experience scale rather than answer correctness.
