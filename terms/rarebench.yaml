entry: rarebench
sources: [https://arxiv.org/abs/2402.06341, https://github.com/chenxz1111/RareBench]
extracted: 2026-10-26
terms:
  - term: Precision
    level: metric
    parent: Task 1 phenotype extraction
    definition: Precision of extracted phenotypes and entities; accuracy requires exact matches with the reference for phenotype extraction, and same-meaning matches for general entity extraction.
    definition_verbatim: false
    location: Section 4.1.1
  - term: Recall
    level: metric
    parent: Task 1 phenotype extraction
    definition: Recall of extracted phenotypes and entities against the reference.
    definition_verbatim: false
    location: Section 4.1.1
  - term: F1-score
    level: metric
    parent: Task 1 phenotype extraction
    definition: F1 of extracted phenotypes and entities.
    definition_verbatim: false
    location: Section 4.1.1
  - term: Recall (screening)
    level: metric
    parent: Task 2 screening
    definition: "Screening for three specific rare diseases (ALS, PNH, MSA) is measured using recall."
    definition_verbatim: true
    location: Section 4.2.1
  - term: Top-k recall
    level: metric
    parent: Tasks 3 and 4 differential diagnosis
    definition: "Top-k recall evaluates the diagnostic accuracy, deeming a diagnosis correct if the actual disease appears within the top-k predictions."
    definition_verbatim: true
    location: Section 4.3.1 (same metric in 4.4.1)
    scale: k = 1, 3, 10
  - term: Median rank (MR)
    level: metric
    parent: Tasks 3 and 4 differential diagnosis
    definition: Median position of accurate diagnoses within predictions.
    definition_verbatim: false
    location: Section 4.3.1
    scale: lower is better
notes: "Parent labels are the four task names. Section 5 compares GPT-4 with specialist physicians using the same top-k recall."
