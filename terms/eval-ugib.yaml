notes: Read the PMC full text via text extraction (abstract, results, table 1). Grading rubric wording is in supplementary files not opened; the paper frames human grading as accuracy against golden-label answers and does not give a named multi-axis rubric. Spearman correlation of similarity metrics with human grading is used to validate the metrics.
