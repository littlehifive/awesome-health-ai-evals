- term: Fine-Tuned ColBERT score
  level: metric
  definition: Fine-tuned Contextualized Late Interaction over BERT similarity between an LLM answer and the golden-label answer; achieved the highest alignment with human grading (rho = 0.81-0.91 across three datasets).
