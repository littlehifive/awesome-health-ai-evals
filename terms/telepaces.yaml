notes: Two rubrics. The universal TelePACES rubric (adapted from PACES, Table 3) has 16 items grouped under five headings (Clinical Communication Skills, Differential Diagnosis, Clinical Judgement, Managing Patient Concerns, Maintaining Patient Welfare); the text reports results on 14 domains, so the item split here may differ slightly. Case-specific rubrics for 20 scenarios have scenario-written items under the seven domains; these are not listed. Scored by physician role-players after each encounter.
