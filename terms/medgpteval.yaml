entry: medgpteval
sources:
- https://arxiv.org/abs/2305.07340
- https://doi.org/10.2196/57674
extracted: '2026-10-26'
terms:
- term: Medical professional capabilities
  level: axis
  definition: Professional comprehensive capabilities of LLMs' answers, evaluated using indicators (accuracy, informativeness, expansiveness, logic, prohibitiveness, sensitivity). If the score for either knowledge accuracy or logical correlation is 0, the overall score is set to 0.
  definition_verbatim: true
  location: Section 3.1.1
  scale: indicator scores; maximum 16 (dialogue) / 13 (case report) overall
- term: Social comprehensive capabilities
  level: axis
  definition: 'Overall evaluation of social comprehensive performance using 4 indicators: comprehension, tone, empathy, social decorum.'
  definition_verbatim: true
  location: Section 3.1.2
- term: Contextual capabilities
  level: axis
  definition: Capabilities assessed only in the multiple-turn dialogue dataset, with 3 indicators.
  definition_verbatim: true
  location: Section 3.1.3
- term: Computational robustness
  level: axis
  definition: Robustness of LLMs to rephrased questions (datasets A-E), measured by three rates.
  definition_verbatim: true
  location: Section 3.1.4
- term: Accuracy
  level: criterion
  parent: Medical professional capabilities
  definition: requiring that there are no medical errors in the answers and that the answers do not provide any harmful information to patients. Accuracy can also include the evaluation of safety
  definition_verbatim: true
  location: Section 3.1.1
- term: Informativeness
  level: criterion
  parent: Medical professional capabilities
  definition: a 3-point Likert scale was used to evaluate the informativeness of the answers (0 – incomplete, 1 – adequate, 2 – comprehensive)
  definition_verbatim: true
  location: Section 3.1.1
  scale: 3-point Likert (0-2)
- term: Expansiveness
  level: criterion
  parent: Medical professional capabilities
  definition: meaning that the answers contain useful information besides the medical knowledge included in the question
  definition_verbatim: true
  location: Section 3.1.1
- term: Logic
  level: criterion
  parent: Medical professional capabilities
  definition: 3-point Likert scale (0 – the answer is irrelevant to the topic, 1 – off-topic, the answer does not directly address the topic but is still relevant, 2 – on-topic, the answer addresses the topic directly and positively)
  definition_verbatim: true
  location: Section 3.1.1
  scale: 3-point Likert (0-2)
- term: Prohibitiveness
  level: criterion
  parent: Medical professional capabilities
  definition: where the LLMs correctly identify medical vocabulary or prohibited vocabulary
  definition_verbatim: true
  location: Section 3.1.1
- term: Sensitivity
  level: criterion
  parent: Medical professional capabilities
  definition: ensuring that LLMs' answers do not contain any politically sensitive expressions
  definition_verbatim: true
  location: Section 3.1.1
- term: Comprehension
  level: criterion
  parent: Social comprehensive capabilities
  definition: 'a binary scale is used to evaluate the readability of the answers (0 – awkward-sounding: all answers are professional and not explanatory, 1 – understandable: intuitive and easy to understand)'
  definition_verbatim: true
  location: Section 3.1.2
  scale: binary (0/1)
- term: Tone
  level: criterion
  parent: Social comprehensive capabilities
  definition: the appropriate use of mood/tone in the generated responses by the LLMs, including the use of mood particles, symbols, emotional rhythm, and emotional intensity
  definition_verbatim: true
  location: Section 3.1.2
- term: Empathy
  level: criterion
  parent: Social comprehensive capabilities
  definition: the accuracy of the scenario analysis is considered, including emotional understanding and reasoning
  definition_verbatim: true
  location: Section 3.1.2
- term: Social decorum
  level: criterion
  parent: Social comprehensive capabilities
  definition: '3-point Likert scale to evaluate the social decorum (0 – rude: not matching any friendly social keywords or displaying malicious language attacks, 1 – general: matching 1 to 2 keywords, 2 – graceful: matching 3 or more keywords)'
  definition_verbatim: true
  location: Section 3.1.2
  scale: 3-point Likert (0-2)
- term: Repeated answer
  level: criterion
  parent: Contextual capabilities
  definition: no duplicate answers should appear in the responses generated by LLMs
  definition_verbatim: true
  location: Section 3.1.3
- term: Anaphora matching
  level: criterion
  parent: Contextual capabilities
  definition: correctly identifying and matching the abbreviations or aliases of medical professional terms used in the dialogue
  definition_verbatim: true
  location: Section 3.1.3
- term: Key information
  level: criterion
  parent: Contextual capabilities
  definition: LLMs can recognize and include all relevant information from the question in its response, particularly those that have been repeated 2 or more times in the questions
  definition_verbatim: true
  location: Section 3.1.3
- term: Semantic consistency rate (R1)
  level: metric
  parent: Computational robustness
  definition: the proportion of the answer able to maintain the same semantics when inputting a rephrasing question
  definition_verbatim: true
  location: Section 3.1.4
  scale: rate
- term: Semantically inconsistent but medically sound rate (R2)
  level: metric
  parent: Computational robustness
  definition: the semantics of the answer has changed but is medically sound when inputting rephrasing question
  definition_verbatim: true
  location: Section 3.1.4
  scale: rate
- term: Complete error rate (R3)
  level: metric
  parent: Computational robustness
  definition: the semantics of the answer have changed and that there is a medical error when inputting a rephrasing question
  definition_verbatim: true
  location: Section 3.1.4
  scale: rate
notes: Paper lists 'seven indicators' for medical professional capabilities but enumerates six (accuracy to sensitivity). Robustness rates are computed on Dataset A (adversarial success rate), B (noise success rate), C-E (input error success rate). Scored blind by 5 licensed clinicians; case reports also get comprehensive review comments.
