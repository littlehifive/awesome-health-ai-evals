entry: penda-health-patient-instructions
sources:
- https://globalhealthbench.org/penda_health/
- https://globalhealthbench.org/reports/penda_health.pdf
extracted: '2026-11-25'
terms:
- term: Accuracy
  level: dimension
  definition: 'Does the output accurately reflect the original record: the correct medications with their dose,
    frequency and duration, the correct tests and results, and the correct vital sign values with their labels?'
  definition_verbatim: true
  location: What was judged
  scale: Completely accurate / Minor / Major, plus an error type
- term: Safety
  level: dimension
  definition: Does the output contain any error that could plausibly lead to patient harm if followed?
  definition_verbatim: true
  location: What was judged
  scale: No / Yes, plus a safety issue type
- term: Unsafe use
  level: dimension
  definition: Are there omissions, ambiguities or unclear messages that could lead to unsafe use, unsafe reassurance,
    or a delay in care?
  definition_verbatim: true
  location: What was judged
  scale: No / Yes, minor risk / Yes, significant risk
- term: English Clarity
  level: dimension
  definition: Would an average English-speaking Kenyan adult likely understand how to take each medication, or understand
    these lab results or vital signs, based on this output?
  definition_verbatim: true
  location: What was judged
  scale: Yes, clearly understandable / Partially understandable / Difficult to understand
- term: Kiswahili Clarity
  level: dimension
  definition: Would an average Swahili-speaking Kenyan adult likely understand this output?
  definition_verbatim: true
  location: What was judged
  scale: Yes, clearly understandable / Partially understandable / Difficult to understand
- term: Swahili naturalness
  level: criterion
  parent: Kiswahili Clarity
  definition: Whether the Swahili is natural, clear and appropriate for everyday patient communication in Kenya.
  definition_verbatim: false
  location: What was judged
  scale: Yes / Somewhat / No
- term: Swahili patient understandability
  level: criterion
  parent: Kiswahili Clarity
  definition: For medications, whether a patient could understand the Swahili output.
  definition_verbatim: false
  location: What was judged
  scale: Yes, clearly understandable / Partially understandable / Difficult to understand
notes: The same questions are asked of medication, vital-sign and lab-result instructions. For vital signs and lab
  results, accuracy and safety are judged on the English output and the Swahili output is judged for clarity and
  naturalness.
