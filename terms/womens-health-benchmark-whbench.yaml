notes: "Table 2 of WHBench v3.0 lists 23 criteria in 8 categories; criterion definitions here are short paraphrases from the table row names, and the points are +pass/-fail. Judged by Claude Sonnet 4.6 (primary) under a default-to-fail philosophy with per-question clinical checklists; scores recalculated server-side. Category letters E and U labels are as printed in the table."
