sources:
- https://doi.org/10.1101/2025.03.17.25324157
extracted: '2026-10-26'
terms:
- term: Error severity
  level: category
  definition: Each interaction was subject to potential error flagging across multiple severity categories, from minor clinical inaccuracies to significant safety concerns; clinicians rate the flagged error and physicians validate its severity.
  definition_verbatim: true
  location: Abstract; Methods, error reporting
  scale: severity categories (minor harm, severe harm, life-threatening named in results)
- term: Accuracy of medical advice
  level: metric
  definition: Rate of correct medical advice by the AI agent across evaluated calls (99.38% for Polaris 3.0).
  definition_verbatim: false
  location: Results, Exhibit 8
  scale: percentage
- term: Minor harm rate
  level: metric
  definition: Incidence of incorrect medical advice leading to potential minor patient harm (0.13% Polaris 2.0, 0.07% Polaris 3.0).
  definition_verbatim: false
  location: Results
  scale: percentage
- term: Severe harm rate
  level: metric
  definition: Incidence of incorrect medical advice leading to severe harm or life-threatening errors (0.00% reported).
  definition_verbatim: false
  location: Results
  scale: percentage
notes: Framework is a four-stage process (pre-implementation, three-tier review, resolution, monitoring); error flags are rated by clinician testers, validated by nurses (Tier 2) and adjudicated by physicians (Tier 3). The paper's exact severity scale labels and a list of error types (Exhibit 8) were not available in the extracted text, so only the named severity categories and result metrics are recorded. Tier 1 reviews by audio, later tiers by transcript.
