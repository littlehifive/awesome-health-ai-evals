notes: "3 priority domains, 18 second-level, 60 third-level constructs (79 terms recorded: 3 + 16 + 60; Table 3 lists 16 second-level constructs, the abstract says 18); descriptions copied from Table 3, some third-level descriptions include sub-points (e.g. Empathy, Humor, Response relevance) not listed separately. Same third-level name 'Data usage' appears under Privacy and Transparency. 271 questions are mapped to constructs but not scored (per the paper); full question list is in multimedia appendices (not read)."
