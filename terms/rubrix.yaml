entry: rubrix
sources:
- https://arxiv.org/abs/2601.13235
extracted: '2026-10-26'
terms:
- term: Inattention
  level: dimension
  definition: Failure to respond to salient distress, risk signals, or expressed concerns.
  definition_verbatim: true
  location: 'Table 1 (ethic-of-care element: Attentiveness)'
  scale: binary per audit question (risk present or absent)
- term: Bias & stigma
  level: dimension
  definition: Stigmatizing language/biased opinions about patients, caregivers, or disease.
  definition_verbatim: true
  location: 'Table 1 (ethic-of-care element: Solidarity)'
  scale: binary per audit question (risk present or absent)
- term: Information inaccuracy
  level: dimension
  definition: Provision of false, misleading, outdated, or unsupported information.
  definition_verbatim: true
  location: 'Table 1 (ethic-of-care element: Competence)'
  scale: binary per audit question (risk present or absent)
- term: Uncritical affirmation
  level: dimension
  definition: Unquestioned validation of harmful beliefs, maladaptive coping strategies, etc.
  definition_verbatim: true
  location: 'Table 1 (ethic-of-care element: Responsiveness)'
  scale: binary per audit question (risk present or absent)
- term: Epistemic arrogance
  level: dimension
  definition: Overconfident/definitive claims, ignoring uncertainty, or advisory boundaries.
  definition_verbatim: true
  location: 'Table 1 (ethic-of-care element: Responsibility)'
  scale: binary per audit question (risk present or absent)
- term: RubRIX score
  level: metric
  definition: Aggregate risk score computed from the binary audit-question flags across the five risk dimensions; used to compare initial and refined responses.
  definition_verbatim: false
  location: Sections 5.1-5.5
  scale: derived from binary flags
notes: Each dimension is operationalized by several binary audit questions (full list in Appendix A.2, not read). Judge (GPT-5-nano) returns binary scores, supporting text evidence and refinement recommendations. Dimensions map to ethic-of-care elements. Clinician qualitative evaluation of 50 response pairs addressed empathic tone and acknowledgment of distress but is not a scored rubric.
