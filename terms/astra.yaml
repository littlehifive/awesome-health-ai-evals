notes: 'Eight predefined risk-behavior categories (four for the AI therapist, four for the user), listed in Methods; Tables 1-3 label them with short names (for example ''User: other harm'', ''Therapist:
  rude''). Harm to minors was added to the prompt in iteration 2. Definitions are the Methods list items; the therapist flirting item has no gloss. ASTRA itself is the monitor; the terms are what it flags.'
