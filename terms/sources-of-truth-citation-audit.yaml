entry: sources-of-truth-citation-audit
sources: [https://arxiv.org/abs/2609.00319]
extracted: 2026-10-26
terms:
  - term: Government / public health
    level: category
    parent: Source-type typology
    definition: ".gov and country-government domains, plus intergovernmental (WHO) and national health-service (NHS) sites"
    definition_verbatim: true
    location: Section 2.7
  - term: Academic / journal
    level: category
    parent: Source-type typology
    definition: "clinical literature (PubMed, PMC, NCBI), universities (.edu), and scholarly publishers or DOIs"
    definition_verbatim: true
    location: Section 2.7
  - term: Nonprofit health system
    level: category
    parent: Source-type typology
    definition: "patient-education content from nonprofit and university-affiliated hospitals and health systems (e.g., Mayo Clinic, Cleveland Clinic, Johns Hopkins)"
    definition_verbatim: true
    location: Section 2.7
  - term: Commercial health
    level: category
    parent: Source-type typology
    definition: "for-profit health-information publishers and telehealth services, pharmaceutical and branded-drug sites, private hospital groups, and private clinical practices (e.g., WebMD, Healthline, GoodRx, BetterHelp)"
    definition_verbatim: true
    location: Section 2.7
  - term: Nonprofit / advocacy
    level: category
    parent: Source-type typology
    definition: "non-governmental organizations and advocacy groups (e.g., NAMI, the American Psychiatric Association)"
    definition_verbatim: true
    location: Section 2.7
  - term: Encyclopedia (wiki)
    level: category
    parent: Source-type typology
    definition: "Wikipedia and comparable reference wikis"
    definition_verbatim: true
    location: Section 2.7
  - term: News / media
    level: category
    parent: Source-type typology
    definition: "News and media sources."
    definition_verbatim: false
    location: Section 2.7
  - term: Social / video
    level: category
    parent: Source-type typology
    definition: "social platforms, forums, and video (e.g., YouTube, Reddit, Facebook)"
    definition_verbatim: true
    location: Section 2.7
  - term: Other
    level: category
    parent: Source-type typology
    definition: "Residual category for domains not matching the other eight types."
    definition_verbatim: false
    location: Section 2.7
  - term: Citation volume and concentration
    level: metric
    definition: "Number of citations per response and share of citations from the most-cited domains (top ten domains account for 43.6% of English citations)."
    definition_verbatim: false
    location: Sections 3.2-3.3
  - term: Language-appropriate routing
    level: metric
    definition: "Rate at which non-English queries are routed to language-appropriate resources."
    definition_verbatim: false
    location: Section 3.5
notes: "The instrument is a nine-category source-type classification of cited domains, not answer-quality scoring. Classification is by a deterministic rule-based classifier validated against human coding."
