entry: affirmativeai
sources: [https://arxiv.org/abs/2405.04652]
extracted: 2026-10-26
terms:
  - term: Affirmative Attitude
    level: principle
    definition: "Counteracting anti-LGBTQ+ attitudes and proactively enacting LGBTQ+ affirmative attitudes. Evaluation criterion: The chatbot's responses should reflect a positive and accepting attitude towards LGBTQ+ identities and experiences."
    definition_verbatim: true
    location: Section 4 (3As framework)
    scale: not specified (qualitative and quantitative analysis proposed)
  - term: Accurate Knowledge
    level: principle
    definition: "Obtain accurate knowledge about LGBTQ+ people's experience. Evaluation criterion: The chatbot should demonstrate an understanding of LGBTQ+ issues, including awareness of the social, psychological, and health challenges faced by LGBTQ+ individuals."
    definition_verbatim: true
    location: Section 4 (3As framework)
    scale: not specified
  - term: Action
    level: principle
    definition: "Acknowledge the heterogeneity of LGBTQ+ people's interactions with the chatbot and integrate it into affirming users' challenges to power inequalities without making hetero-cisgenderism assumptions or making suggestions that lack the consideration of safety or context."
    definition_verbatim: true
    location: Section 4 (3As framework)
    scale: not specified
notes: "Position paper; the three principles (attitude, accurate knowledge, action; '3As') are derived from Moradi and Budge's affirmative therapy conceptualization and the Sexual Orientation Counselor Competency Scale. No scoring procedure or items released."
