entry: tianyi-tcmeval
sources:
- https://doi.org/10.1016/j.inffus.2025.103663
- https://arxiv.org/abs/2505.13156
extracted: '2026-10-26'
terms:
- term: Correctness
  level: criterion
  definition: The degree of conformity between the answers of the LLM to the questions and the labeled answers.
  definition_verbatim: true
  location: Table 3, Section 3 (TCM real-world evaluation)
  scale: 1-5 rating
- term: Comprehensiveness
  level: criterion
  definition: Whether the LLM-generated answers to questions are detailed and comprehensive, and whether they address all the requirements in the questions, such as whether the analysis of sovereign, minister, assistant and messenger is thorough.
  definition_verbatim: true
  location: Table 3, Section 3 (TCM real-world evaluation)
  scale: 1-5 rating
- term: Safety
  level: criterion
  definition: Whether there are potential medical risks in the LLM-generated prescriptions, such as overdosage, herbs in the knowledge of eighteen incompatible medicaments and nineteen medicaments of mutual antagonism.
  definition_verbatim: true
  location: Table 3, Section 3 (TCM real-world evaluation)
  scale: 1-5 rating
- term: Legibility
  level: criterion
  definition: The rationality of the logical structure of the content generated by the LLM, the fluency of language use, and the ease of understanding for medical staff.
  definition_verbatim: true
  location: Table 3, Section 3 (TCM real-world evaluation)
  scale: 1-10 rating
- term: Accuracy (TCM-MCE)
  level: metric
  definition: Accuracy on multiple-choice TCM exam questions.
  definition_verbatim: false
  location: Section 3, Regular TCM Benchmark Tasks
  scale: percent correct
- term: Accuracy (TCM-CRT syndrome prediction and treatment principle)
  level: metric
  definition: Accuracy for TCM syndrome prediction and treatment principle decision on clinical records.
  definition_verbatim: false
  location: Section 3, TCM-CRT
  scale: percent correct
- term: F1-score (TCM prescription generation)
  level: metric
  definition: F1 between generated and reference herb prescriptions in TCM-CRT.
  definition_verbatim: false
  location: Section 3, TCM-CRT
  scale: F1 %
- term: Correct proportion of label tokens (TCM-DQA)
  level: metric
  definition: Correctness of generated answers computed as the correct proportion that model generated tokens in the label tokens, as OpenCompass does; Table 1 reports it as ROUGE-L.
  definition_verbatim: false
  location: Section 3, TCM-DQA; Table 1
  scale: percent
notes: Four human-rating criteria are applied by ten TCM doctors to syndrome and prescription answers, with the rating ranges differing by task (Table 3 pairs Correctness and Safety with syndrome differentiation and prescription generation, Comprehensiveness with etiology analysis and prescription analysis, Legibility with readability). TCM-CTP clinical-trial outcome prediction is an outcome task, not scored on named criteria. Table 3 is extracted from PDF text and the task-to-criterion pairing is approximate.
