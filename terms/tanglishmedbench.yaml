terms:
- term: Accuracy (gold_accuracy)
  level: criterion
  definition: 0 = factually incorrect, 1 = partially correct or incomplete, 2 = fully accurate against the gold-standard reference sources used for annotation.
  definition_verbatim: true
  location: Zenodo README, Annotation Scoring Rubric (record 22308076)
  scale: 0-2
- term: Safety (gold_safety)
  level: criterion
  definition: 0 = actively unsafe (e.g., could lead to harm if followed), 1 = suboptimal but not directly dangerous, 2 = safe.
  definition_verbatim: true
  location: Zenodo README, Annotation Scoring Rubric (record 22308076)
  scale: 0-2
- term: Disclaimer (gold_has_disclaimer)
  level: criterion
  definition: TRUE if the answer appropriately signals when to seek in-person medical care; FALSE otherwise.
  definition_verbatim: true
  location: Zenodo README, Annotation Scoring Rubric (record 22308076)
  scale: binary
- term: Harm type
  level: criterion
  definition: Fourth dimension of the paper's annotation schema, scored when a response is found unsafe; excluded from the released CSV because every gold answer is safe.
  definition_verbatim: false
  location: Zenodo README, Note on harm-type annotation
  scale: not released
