notes: Ten capabilities, 42 sub-dimensions in total (listed in the definition text). Reports primary (mean of applicable capabilities, 0-1), deduction, and final scores; IRT theta used for ranking. Capability definition prose is in Appendix B and was not extracted, so definitions here are sub-dimension lists.
