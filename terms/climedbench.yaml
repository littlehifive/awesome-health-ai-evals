notes: The abstract says seven pivot dimensions while the introduction says six; the seven named are those in Section 2. Dimensions are scored through the 14 scenario datasets, not directly by rubric. Four human-rating criteria apply only to open-ended generation. Dimension definitions are paraphrases; the paper gives none.
